<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sentai · Play online</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/dev-table.css">
<link rel="stylesheet" href="cards.css">
<style>
  body{--t-bg:#F3E7CF;--t-card:#FFF6E4;--t-ink:#1F1A2B;--t-muted:#6A5F57;--t-line:#E2CFAB;--t-accent:#E2482F;--t-accent-ink:#fff;--t-mast:#1F1A2B;--t-mast-ink:#F3E7CF;
    --felt:#24483F;--felt-d:#1A3730;--felt-ink:#EFE3C8;--felt-mute:#A9BFA9;--wood:#6B4329;--gold:#F0B429}
  .dt-mast h1{font-family:Archivo,Jost,sans-serif;font-weight:900;letter-spacing:.01em;color:#F0B429;transform:skewX(-9deg);transform-origin:left}
  .dt-board{padding:clamp(6px,1.6vw,18px)}

  /* ---------- the table ---------- */
  .tbl{max-width:1180px;margin:0 auto;border-radius:28px;padding:clamp(12px,2vw,22px);color:var(--felt-ink);position:relative;
    background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.035) 1px,transparent 1.6px) 0 0/6px 6px,radial-gradient(ellipse at 50% 40%,#2C574C,var(--felt) 55%,var(--felt-d));
    border:clamp(7px,1.2vw,12px) solid var(--wood);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),inset 0 10px 40px rgba(0,0,0,.35),0 3px 0 #4E2F1C,0 14px 30px rgba(31,26,43,.25);
    display:flex;flex-direction:column;gap:clamp(12px,1.8vw,18px)}
  .lbl{font:700 10.5px/1.1 Jost;letter-spacing:.16em;text-transform:uppercase;color:var(--felt-mute)}

  /* other Heroes, around the far side */
  .opp{display:flex;justify-content:center;gap:clamp(8px,2vw,26px);flex-wrap:wrap}
  .seat{display:grid;grid-template-columns:auto auto;gap:6px 10px;align-items:center;padding:8px 12px 8px 8px;border-radius:16px;background:rgba(0,0,0,.18);border:2px solid transparent;min-width:0;position:relative}
  .seat.turn{border-color:var(--gold);box-shadow:0 0 0 4px rgba(240,180,41,.18)}
  .seat .hd{width:44px;height:44px;border-radius:50%;background:#FFF6E4;border:3px solid var(--c);display:grid;place-items:center;overflow:hidden}
  .seat .hd svg{width:84%;height:84%}
  .seat .who{font:600 14.5px/1.15 Jost;min-width:0}
  .seat .who small{display:block;font:500 12.5px/1.2 Jost;color:var(--felt-mute);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
  .seat .row2{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stk{--w:34px;width:var(--w);height:calc(var(--w)*1.4);border-radius:5px;position:relative;flex:none;border:2px solid #FFF6E4;
    background:repeating-linear-gradient(45deg,#2B2440 0 5px,#3A3058 5px 10px);box-shadow:2px 2px 0 #FFF6E4,3px 3px 0 #1A1530,5px 5px 0 #FFF6E4,6px 6px 0 #1A1530}
  .stk b{position:absolute;inset:0;display:grid;place-items:center;font:900 15px/1 Archivo;color:#FFF6E4;text-shadow:0 1px 0 #000}
  .seat.low .stk b{color:#FF9D8A}
  .kc{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;border-radius:4px;background:var(--c);color:#fff;font:800 12px/1 Archivo,Jost}
  .kc.c2,.kc.c4{color:var(--t-ink)}
  .known{display:flex;gap:3px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--felt-mute)}
  .pw{display:inline-block;font:700 11px/1.2 Jost;letter-spacing:.04em;padding:3px 6px;border-radius:5px;background:#FFF6E4;color:#1F1A2B}
  .pw.used{opacity:.45;text-decoration:line-through}
  .lead{position:absolute;top:-10px;right:10px;height:20px;padding:0 7px;border-radius:10px;background:var(--gold);color:#1F1A2B;display:grid;place-items:center;font:900 10px/1 Archivo;letter-spacing:.02em;box-shadow:0 2px 0 #9A6A10;z-index:2}

  /* the middle of the table */
  .mid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(10px,1.6vw,20px);align-items:start}
  .side{display:flex;flex-direction:column;gap:14px;align-items:center;min-width:86px}
  .pile{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .pile .lbl{max-width:96px}
  .spot{width:64px;height:90px;border-radius:9px;border:2px dashed rgba(239,227,200,.28);display:grid;place-items:center}
  .side .mcard{--mw:64px}
  .arena{min-width:0;display:flex;flex-direction:column;gap:12px}

  .mcard.sm{--mw:92px}
  .mcard.next{box-shadow:0 0 0 3px var(--gold),0 4px 0 rgba(0,0,0,.3)}
  .fight>.mcard{--mw:168px}

  /* Gorvax: the fight */
  .fight{display:flex;gap:clamp(12px,2vw,22px);align-items:flex-start;flex-wrap:wrap}
  .combo{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
  .combo .lbl b{color:var(--felt-ink)}
  .slots{display:flex;flex-wrap:wrap;gap:8px;min-height:72px;align-items:center}
  .slot{width:50px;height:70px;border-radius:7px;border:2px dashed rgba(239,227,200,.35);flex:none}
  .slots .sc{--w:50px}
  .rule{font-size:13.5px;line-height:1.4;color:var(--felt-mute);margin:0}
  .upnext{display:flex;flex-direction:column;gap:6px}
  .line{display:flex;gap:10px;flex-wrap:wrap}

  /* the Hydra */
  .heads{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:clamp(8px,1.4vw,16px)}
  .head{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 8px 12px;border-radius:16px;border:2px solid transparent;min-width:0;position:relative;transition:border-color .15s,background .15s}
  button.head{cursor:pointer}
  button.head:hover,button.head:focus-visible{border-color:rgba(240,180,41,.6);background:rgba(0,0,0,.1)}
  .head.tgt{border-color:var(--gold);background:rgba(240,180,41,.08)}
  .head .mcard{--mw:184px}
  .head.enr .mcard{rotate:-4deg}
  .head.enr .mcard::after{content:"ENRAGED";position:absolute;left:50%;top:-11px;translate:-50% 0;font:900 10.5px/1 Archivo,Jost;letter-spacing:.12em;background:#E2482F;color:#fff;padding:5px 7px;border-radius:5px;white-space:nowrap}
  .head .slots{justify-content:center;min-height:62px}
  .head .slots .sc{--w:42px}.head .slot{width:42px;height:59px}
  .head.empty{border:2px dashed rgba(239,227,200,.25);color:var(--felt-mute);display:grid;place-items:center;min-height:200px;font-size:13.5px;text-align:center;padding:16px}
  .head .rule{text-align:center}
  .hx2{display:none}

  .cw{display:inline-block;flex:none;line-height:0;vertical-align:top}
  .wild{position:relative;display:inline-block}.wild::after{content:"⚡";position:absolute;right:-5px;top:-7px;font-size:14px}

  /* the result of a fight or a round, said across the table */
  .call{border-radius:14px;padding:11px 16px;background:rgba(15,12,24,.55);border:1px solid rgba(240,180,41,.35);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
  .call b{font:900 20px/1.1 Archivo;color:var(--gold);transform:skewX(-6deg);display:inline-block}
  .call.bad b{color:#F59AAE}
  .call p{margin:0;font-size:14.5px;flex:1;min-width:220px}

  /* my side of the table */
  .mine{border-radius:18px;background:rgba(0,0,0,.2);padding:12px clamp(10px,1.6vw,16px) 14px;border:2px solid transparent;position:relative}
  .mine.turn{border-color:var(--gold)}
  .mehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .mehead .hd{width:38px;height:38px;border-radius:50%;background:#FFF6E4;border:3px solid var(--c);display:grid;place-items:center;overflow:hidden}
  .mehead .hd svg{width:84%;height:84%}
  .mehead .nm{font:700 15px/1.1 Jost}
  .mehead .nm small{display:block;font:500 12.5px/1.2 Jost;color:var(--felt-mute)}
  .mypw{font-size:13px;background:#FFF6E4;color:#1F1A2B;border-radius:9px;padding:6px 9px;max-width:420px;line-height:1.35}
  .mypw b{font-family:Archivo,Jost}
  .prompt{font-size:15px;margin:0 0 10px;line-height:1.45}
  .prompt b{color:var(--gold)}
  .hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:10px}
  .hand.many{gap:6px}.hand.many .sc{--w:56px}
  button.cardb{all:unset;cursor:pointer;border-radius:9px;position:relative;transition:translate .14s}
  button.cardb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .hand.live .cardb.no{opacity:.4;cursor:default}
  .hand.live .cardb.ok .sc{box-shadow:0 0 0 2px #FFF6E4,0 4px 0 rgba(0,0,0,.3)}
  .cardb.sel{translate:0 -12px}
  .cardb.sel .sc{box-shadow:0 0 0 3px var(--gold),0 8px 0 rgba(0,0,0,.3)!important}
  .hb{position:absolute;left:50%;bottom:-17px;translate:-50% 0;font:700 10px/1 Jost;white-space:nowrap;background:var(--gold);color:#1F1A2B;padding:2px 5px;border-radius:4px;font-style:normal}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:center}
  .mine .dt-btn{border-color:#FFF6E4;color:#FFF6E4}
  .mine .dt-btn.go{background:var(--t-accent);border-color:var(--t-accent);color:#fff}
  .mine .dt-btn.on{background:var(--gold);color:#1F1A2B;border-color:var(--gold)}

  /* under the table: progress and the log */
  .under{max-width:1180px;margin:12px auto 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
  .under .box{background:var(--t-card);border:1px solid var(--t-line);border-radius:12px;padding:10px 14px}
  .under h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--t-muted)}
  .track{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .track .grp{display:flex;gap:4px;align-items:center}
  .track .grp i{font:700 11px/1 Jost;letter-spacing:.14em;text-transform:uppercase;color:var(--t-muted);margin-right:3px;font-style:normal}
  .pip{width:14px;height:20px;border-radius:4px;background:var(--a);opacity:.3;position:relative}
  .pip.done{opacity:1}
  .pip.done::after{content:"";position:absolute;left:4px;top:4px;width:4px;height:8px;border:solid #FFF6E4;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .pip.miss::after{border:0;width:auto;height:auto;content:"×";left:0;right:0;top:0;text-align:center;font:800 14px/20px Jost;transform:none;color:#FFF6E4}
  .track .tl{font-size:13px;color:var(--t-muted)}
  .log{font-size:13.5px;color:var(--t-muted);max-height:150px;overflow:auto}
  .log p{margin:0 0 3px}

  .coach{max-width:1180px;margin:0 auto 10px;background:#1F1A2B;color:#F3E7CF;border-radius:14px;padding:12px 16px;border:2px solid var(--gold)}
  .coach span{font:700 11px/1 Jost;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .coach p{margin:5px 0 0;font-size:15.5px;line-height:1.45}.coach b{color:var(--gold)}
  .fly{position:fixed;margin:0;z-index:60;pointer-events:none;transform-origin:0 0}

  @media (max-width:760px){
    .mid{grid-template-columns:minmax(0,1fr)}
    .side{flex-direction:row;justify-content:center;min-width:0;order:2;gap:18px}
    .side.r{order:3}
    .arena{order:1}
    .heads{grid-template-columns:1fr}
    .head{display:grid;grid-template-columns:auto 1fr;align-items:start;justify-items:start;text-align:left}
    .head .mcard{--mw:128px;grid-row:span 3}
    .hx2{display:block;font:500 12.5px/1.35 Jost;color:var(--felt-ink);background:rgba(0,0,0,.22);border-radius:8px;padding:6px 8px}
    .hx2 b{color:var(--gold)}
    .head .slots{justify-content:flex-start}
    .head .rule{text-align:left}
    .under{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    .sc{--w:50px}.slots .sc{--w:44px}.slot{width:44px;height:62px}
    .fight>.mcard{--mw:136px}.mcard.sm{--mw:78px}
    .seat{grid-template-columns:auto auto;padding:6px 9px 6px 6px}
    .seat .hd{width:36px;height:36px}
    .seat .who small{max-width:96px}
    .hand{gap:6px}.hand.many{gap:5px}.hand.many .sc{--w:47px}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/js/dev-table.js"></script>
<script src="art.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  const S = window.Sentai, A = window.SentaiArt, esc = DevTable.esc;
  const ACT = ['Episode 1', 'Episode 2', 'Finale'], IN = ['Episode 1', 'Episode 2', 'the Finale'], TYPE = S.TYPE, COL = S.COLORS;
  const TUT = new URLSearchParams(location.search).has('tutorial');   // a coached first two monsters
  let tutDone = false;
  let sel = [], selHead = {}, key = '', tgt = null, wildOn = false, wildId = null, beaconOn = false;   // selHead: card id → head it's going to

  const tilt = (id) => ((id * 37) % 7) - 3;                       // played cards sit a little crooked, the way hands put them down
  const card = (c, attrs) => '<span class="cw" data-k="k' + c.id + '"' + (attrs || '') + '>' + (c.wild ? '<span class="wild">' + A.cardHTML(c.real) + '</span>' : A.cardHTML(c)) + '</span>';
  const avatar = (h) => A.beastSVG(h);
  const chip = (c) => '<span class="kc c' + c.c + '" title="' + esc(S.cardName(c)) + '">' + c.r + '</span>';
  const actOf = (k) => Math.floor((k % 18) / 6);
  function addTo(st, c) {
    const t = Object.assign({}, st, { cards: st.cards.slice() });
    if (!t.cards.length) { t.rank = c.r; t.color = c.c; t.lo = t.hi = c.r; t.mask = 0; } else { t.lo = Math.min(t.lo, c.r); t.hi = Math.max(t.hi, c.r); }
    t.mask = (t.mask || 0) | (1 << c.c); t.rmask = (t.rmask || 0) | (1 << c.r);
    t.cards.push(c); return t;
  }
  function wildAs(t, c) {
    if (!t.cards.length) return null;
    if (t.type === 'set') return { r: t.rank, c: c.c };
    if (t.type === 'color') return { r: c.r, c: t.color };
    if (t.type === 'combine') { for (const k of [c.c, 0, 1, 2, 3, 4]) if (!(t.mask & (1 << k))) return { r: c.r, c: k }; return null; }
    for (let r = t.lo + 1; r < t.hi; r++) if (!(t.rmask & (1 << r))) return { r, c: c.c };
    if (t.hi - t.lo + 1 < t.total && t.hi < 12) return { r: t.hi + 1, c: c.c };
    if (t.hi - t.lo + 1 < t.total && t.lo > 1) return { r: t.lo - 1, c: c.c };
    return null;
  }
  function describe(e) {
    const warn = e.enraged ? 'Enraged: finish it this round or it strikes. ' : '';
    return warn + describeCombo(e);
  }
  function describeCombo(e) {
    if (!e.cards.length) return 'Any card starts it.';
    if (e.type === 'combine') { const used = COL.filter((_, i) => e.mask & (1 << i)); return 'Every card must be a different color. Used so far: ' + used.join(', ') + '.'; }
    if (e.type === 'set') return 'Every card must be a ' + e.rank + '.';
    if (e.type === 'color') return 'Every card must be ' + COL[e.color] + '.';
    const have = new Set(e.cards.map((c) => c.r)), from = Math.max(1, e.hi - e.total + 1), to = Math.min(12, e.lo + e.total - 1), ok = [];
    for (let r = from; r <= to; r++) if (!have.has(r)) ok.push(r);
    return ok.length ? 'A Run can have gaps, as long as it all fits in ' + e.total + ' in a row. Fits now: ' + ok.join(', ') + ', any color.' : 'The run can’t grow any further.';
  }
  function mine(l, nm) {
    if (l.endsWith(' ' + nm + ' leads.')) return l.slice(0, -(nm.length + 7)) + 'You lead.';
    if (!l.startsWith(nm + ' ')) return l;
    return 'You ' + l.slice(nm.length + 1).replace(/^adds /, 'add ').replace(/^passes/, 'pass').replace(/^discards /, 'discard ').replace(/^uses /, 'use ').replace(/^has /, 'have ').replace(/their last/, 'your last');
  }

  // a Boss card as printed; `attrs` carries where it came from when it first lands on the table
  let SQUAD = 3;
  const mcard = (b, cls, attrs) => A.bossCardHTML(b, SQUAD, { cls, attrs: ' data-k="m' + b.key + '"' + (attrs || ''), hexText: b.hex ? S.HEX[b.hex] : null });
  // a combo laid out on the felt: placed cards (each remembers whose hand it came from), then empty spots
  const slots = (x) => '<div class="slots">' + x.cards.map((c) => card(c, ' style="rotate:' + tilt(c.id) + 'deg" data-from="seat' + (x.who ? x.who[c.id] : '') + '"')).join('') +
    Array.from({ length: Math.max(0, x.need) }, () => '<span class="slot"></span>').join('') + '</div>';

  /* ---------- motion: every card and monster keeps its identity, so it travels between hands, the combo and the piles ---------- */
  let busyUntil = 0;
  const origBusy = window.__ddBusy || (() => false);
  window.__ddBusy = () => Date.now() < busyUntil || origBusy();       // bots wait for cards to land
  const rectsOf = (root, sel, attr) => { const m = new Map(); root.querySelectorAll(sel).forEach((n) => { const r = n.getBoundingClientRect(); if (r.width) m.set(n.getAttribute(attr), r); }); return m; };
  function stage(el, draw, leaveTo) {
    const before = new Map();
    el.querySelectorAll('[data-k]').forEach((n) => { const r = n.getBoundingClientRect(); if (r.width) before.set(n.dataset.k, { r, html: n.outerHTML, w: getComputedStyle(n.firstElementChild || n).getPropertyValue('--w') }); });
    const anchorsBefore = rectsOf(el, '[data-anchor]', 'data-anchor');
    const firstDeal = !el.querySelector('.tbl');
    draw();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const anchorsAfter = rectsOf(el, '[data-anchor]', 'data-anchor');
    const at = (a) => a && (anchorsBefore.get(a) || anchorsAfter.get(a));
    const ease = 'cubic-bezier(.25,.8,.25,1)', seen = new Set();
    let end = 0, deal = 0;
    el.querySelectorAll('[data-k]').forEach((n) => {
      const k = n.dataset.k; seen.add(k);
      const b = n.getBoundingClientRect(); if (!b.width) return;
      const prev = before.get(k);
      let from = prev && prev.r, fade = false, delay = 0;
      if (!from) {
        if (firstDeal && n.dataset.deal != null) { from = at('center'); delay = 40 * deal++; }
        else from = at(n.dataset.from);
        fade = true;
        if (!from) return;
      }
      const dx = from.left - b.left, dy = from.top - b.top, s = Math.max(.3, Math.min(3, from.width / b.width));
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(s - 1) < .02) return;
      const dur = 520;
      n.style.transformOrigin = '0 0';
      n.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')', opacity: fade ? .15 : 1 }, { transform: 'none', opacity: 1 }], { duration: dur, delay, easing: ease, fill: 'backwards' });
      end = Math.max(end, dur + delay);
    });
    // things that left the table area: fly them to where they went (a pile, or back into another Hero's hand), then they vanish
    before.forEach((p, k) => {
      if (seen.has(k)) return;
      const to = at(leaveTo(k));
      const g = document.createElement('div'); g.innerHTML = p.html;
      const n = g.firstElementChild; if (!n) return;
      n.classList.add('fly'); n.removeAttribute('data-k');
      Object.assign(n.style, { left: p.r.left + 'px', top: p.r.top + 'px', width: p.r.width + 'px', height: p.r.height + 'px' });
      const inner = n.querySelector('.sc'); if (inner && p.w) inner.style.setProperty('--w', p.w);
      if (n.classList.contains('mcard')) n.style.setProperty('--mw', p.r.width + 'px');   // (a tilted card's box is a touch wide; close enough for a card in flight)
      document.body.appendChild(n);
      const kf = to ? [{ transform: 'none', opacity: 1 }, { transform: 'translate(' + (to.left - p.r.left) + 'px,' + (to.top - p.r.top) + 'px) scale(' + Math.max(.25, Math.min(2, to.width / p.r.width)) + ')', opacity: .25 }]
        : [{ transform: 'none', opacity: 1 }, { transform: 'translateY(-10px)', opacity: 0 }];
      const an = n.animate(kf, { duration: 560, easing: ease, fill: 'forwards' });
      an.onfinish = () => n.remove(); setTimeout(() => n.remove(), 900);
      end = Math.max(end, 560);
    });
    if (end) busyUntil = Date.now() + end;
  }

  function render(el, v, api) {
    const me = v.seat, P = v.players, vael = v.boss === 'vael';
    SQUAD = P.length;
    const k = v.phase + ':' + v.fights + ':' + (v.round ? v.round.at : v.enc ? v.enc.at : 0);
    if (k !== key) { sel = []; selHead = {}; key = k; wildOn = false; wildId = null; beaconOn = false; }
    const myTurn = v.phase === 'build' && v.turn === me;
    const iDiscard = v.phase === 'discard' && P[me].needsDiscard;
    const iRiptide = v.phase === 'riptide' && v.riptide.seat === me;
    const dn = P[me].discardCount;
    const nm = (i) => i === me ? 'You' : esc(P[i].name);
    const targets = vael ? v.heads : [v.enc];
    if (myTurn) {
      const ok = (h) => v.legal[h] && (v.legal[h].length || (v.canWild && targets[h] && targets[h].cards.length));
      if (tgt == null || !ok(tgt)) tgt = vael ? targets.map((_, i) => i).find(ok) : 0;
      if (tgt === undefined) tgt = null;
    } else tgt = null;
    const T = tgt != null ? targets[tgt] : null;

    const status = v.phase === 'over' ? (v.outcome.win ? 'The squad wins!' : 'The Boss wins.')
      : v.phase === 'riptide' ? (iRiptide ? 'Use Riptide?' : 'Waiting on Riptide…')
      : v.phase === 'discard' ? (iDiscard ? 'Discard ' + dn : 'Waiting for discards…')
      : v.phase === 'result' ? (vael ? 'End of the round' : v.result.met ? 'Combo complete!' : 'Everyone discarded')
      : myTurn ? 'Your turn: add cards or pass' : P[v.turn].name + '’s turn';
    api.status(v.bossName + ' · ' + ACT[Math.min(v.act, 2)] + ' · ' + status);

    // what each Hero is doing this fight or round
    const noteOf = (i) => {
      const p = P[i];
      if (v.phase === 'discard') return p.needsDiscard ? 'discarding…' : 'done';
      if (vael && v.round) { const pl = v.round.plays.find((x) => x.seat === i); return pl ? (pl.pass ? 'passed' : 'fed ' + pl.parts.map((x) => (v.heads[x.head] ? esc(v.heads[x.head].boss.name) : 'a head') + ' ' + x.n).join(', ')) : v.phase === 'build' && i === v.turn ? 'thinking…' : COL[p.hero] + ' Hero'; }
      const pl = v.enc && v.enc.plays.find((x) => x.seat === i); return pl ? (pl.pass ? 'passed' : 'added ' + pl.n) : v.phase === 'build' && i === v.turn ? 'thinking…' : COL[p.hero] + ' Hero';
    };
    const leadTok = (i) => i === v.lead && v.phase !== 'over' ? '<span class="lead" data-k="lead" title="Leads this ' + (vael ? 'round' : 'fight') + '">LEAD</span>' : '';

    // the other Heroes, seated around the far side, in turn order after me
    const order = P.map((_, j) => (me + 1 + j) % P.length).filter((i) => i !== me);
    const opp = '<div class="opp">' + order.map((i) => {
      const p = P[i];
      const known = p.known.length ? '<span class="known">holds ' + p.known.map(chip).join('') + '</span>' : '';
      const pw = p.power ? '<span class="pw' + (p.power.used ? ' used' : '') + '" title="' + esc(p.power.text) + '">' + esc(p.power.name) + '</span>' : '';
      return '<div class="seat c' + p.hero + (i === v.turn && v.phase === 'build' ? ' turn' : '') + (p.count <= 3 ? ' low' : '') + '">' + leadTok(i) +
        '<span class="hd">' + avatar(p.hero) + '</span><span class="who">' + esc(p.name) + '<small>' + noteOf(i) + '</small></span>' +
        '<span class="row2"><span class="stk" data-anchor="seat' + i + '" title="' + p.count + ' cards in hand"><b>' + p.count + '</b></span>' + pw + known + '</span></div>';
    }).join('') + '</div>';

    // left side: what's still face down
    const later = v.acts.map((a, i) => ({ i, n: a.n })).filter((a) => a.i > v.act);
    const decks = (vael && v.pile ? [{ i: v.act, n: v.pile, now: true }] : []).concat(later);
    const left = '<div class="side l">' + (decks.length ? decks.map((d) => '<div class="pile">' + A.bossBackHTML(d.i, d.n, { attrs: ' data-anchor="deck' + d.i + '"' }) + '<span class="lbl">' + (d.now ? 'This episode’s pile' : 'Face down') + '</span></div>').join('')
      : '<div class="pile"><div class="spot"></div><span class="lbl">No monsters left face down</span></div>') + '</div>';

    // right side: the discard pile and the beaten monsters
    const top = v.trash.length ? v.trash[v.trash.length - 1] : null;
    const beat = v.hist.filter((h) => h.met), lastBeat = beat.length ? beat[beat.length - 1].key : null;
    const right = '<div class="side r"><div class="pile"><div data-anchor="trash">' + (top ? card(top.c, ' data-from="seat' + top.seat + '"') : '<div class="spot"></div>') + '</div><span class="lbl">Discards · ' + v.trashN + '</span></div>' +
      '<div class="pile"><div class="spot" data-anchor="beaten">' + (lastBeat != null ? '<b style="font:900 22px/1 Archivo;color:var(--gold)">' + v.done + '</b>' : '') + '</div><span class="lbl">' + (vael ? 'Cut ' + v.done + ' · struck ' + v.misses : 'Beaten ' + v.done + (v.misses ? ' · missed ' + v.misses + '×' : '')) + '</span></div></div>';

    // the middle: the fight, or the Hydra's heads
    let arena = '';
    if (vael) {
      arena = '<div class="heads" style="--n:' + v.heads.length + '">' + v.heads.map((x, h) => {
        if (!x) return '<div class="head empty">' + (v.pile ? 'A head will grow here' : 'No head here: the pile is empty') + '</div>';
        const pick = myTurn && (v.legal[h].length || (v.canWild && x.cards.length));
        const tag = pick ? 'button' : 'div';
        const hx = '<div class="hx2"><b>' + esc(S.HEX[x.boss.hex].name) + ':</b> ' + esc(S.HEX[x.boss.hex].text) + '</div>';
        return '<' + tag + (pick ? ' type="button" data-head="' + h + '"' : '') + ' class="head' + (x.enraged ? ' enr' : '') + (tgt === h ? ' tgt' : '') + '">' +
          mcard(x.boss, '', ' data-from="deck' + x.boss.act + '"') + slots(x) + hx +
          (myTurn && tgt === h ? '<p class="rule">' + esc(describe(x)) + '</p>' : '') + '</' + tag + '>';
      }).join('') + '</div>';
    } else if (v.enc) {
      const e = v.enc;
      arena = '<div class="fight">' + mcard(e.boss, '', ' data-from="deck' + e.boss.act + '"') +
        '<div class="combo"><span class="lbl">The combo · <b>' + (e.need > 0 ? e.need + ' to go' : 'complete') + '</b></span>' + slots(e) +
        (v.phase === 'build' ? '<p class="rule">' + esc(describe(e)) + '</p>' : '') + '</div></div>' +
        (v.upcoming.length ? '<div class="upnext"><span class="lbl">Up next in ' + IN[v.act] + ', in order</span><div class="line">' + v.upcoming.map((b, i) => mcard(b, 'sm' + (i ? '' : ' next'), ' data-from="deck' + b.act + '"')).join('') + '</div></div>' : '');
    } else arena = '<div class="spot" style="width:auto;height:160px">The table is clear.</div>';

    // what just happened, said across the table
    let call = '';
    const discLine = (r) => r.discards.length ? ' Discarded: ' + r.discards.map((x) => nm(x.seat) + ' ' + x.cards.map((c) => esc(S.cardName(c))).join(', ')).join(' · ') + '.' : '';
    if (v.phase === 'over') {
      const o = v.outcome;
      call = '<div class="call' + (o.win ? '' : ' bad') + '"><b>' + (o.win ? 'The squad holds the line!' : o.seat === me ? 'You are down' : esc(P[o.seat].name) + ' is down') + '</b><p>' +
        (o.win ? (vael ? 'Every head is cut' : 'You beat ' + v.done + ' of ' + v.total + ' monsters') + (v.misses ? '.' : ', a flawless run.') : (o.seat === me ? 'You ' + esc(o.how.replace('their', 'your')) : 'They ' + esc(o.how)) + ', so the Boss wins. Leave the table to try again.') + '</p></div>';
    } else if (v.result && (v.phase === 'result' || v.phase === 'discard' || v.phase === 'riptide')) {
      const r = v.result;
      if (vael) {
        const bits = [];
        if (r.cut.length) bits.push(r.cut.map((b) => esc(b.name)).join(' and ') + (r.cut.length > 1 ? ' are' : ' is') + ' cut off.');
        if (r.struck.length) bits.push(r.struck.map((b) => esc(b.name)).join(' and ') + ' struck: its cards are lost and every Hero discards 2.');
        if (r.enraged.length) bits.push(r.enraged.map(esc).join(' and ') + (r.enraged.length > 1 ? ' are' : ' is') + ' enraged.');
        if (r.hunger.length) bits.push('Hunger takes a card from ' + r.hunger.map(nm).join(' and ') + '.');
        if (r.spite.length) bits.push('Spite takes a card from ' + r.spite.map(nm).join(' and ') + '.');
        const bad = r.struck.length > 0;
        call = '<div class="call' + (bad ? ' bad' : '') + '"><b>' + (r.cut.length && !bad ? 'Heads off!' : bad ? 'The Hydra strikes' : 'The heads hold') + '</b><p>' + (bits.join(' ') || 'Nothing was finished this round.') + discLine(r) + '</p></div>';
      } else {
        const back = r.bounced.map((x) => nm(x.seat) + ' took back ' + x.cards.map((c) => esc(S.cardName(c))).join(' and ')).join('; ');
        const e = v.enc;
        call = '<div class="call' + (r.met ? '' : ' bad') + '"><b>' + (r.met ? esc(e.boss.name) + ' is defeated!' : esc(e.boss.name) + ' holds on') + '</b><p>' +
          (r.met ? 'Next monster coming up…' : (back ? back + '. ' : 'Nobody added a card. ') + 'Every Hero discards 1, and you fight it again.' + discLine(r)) + '</p></div>';
      }
    }

    // my hand
    let tstate = T ? { type: T.type, total: T.total, cards: T.cards.slice(), rank: T.rank, color: T.color, lo: T.lo, hi: T.hi, mask: T.mask || 0, rmask: T.cards.reduce((m, c) => m | (1 << c.r), 0) } : null;
    const onTgt = sel.filter((id) => (selHead[id] || 0) === tgt), others = sel.filter((id) => (selHead[id] || 0) !== tgt);
    const tmax = vael && tgt != null ? (others.length === 1 ? 1 : v.maxAddHead[tgt]) : v.maxAdd, anyFits = false;
    if (T) for (const id of onTgt) { const c = v.hand.find((x) => x.id === id); const w = id === wildId ? wildAs(tstate, c) : null; tstate = addTo(tstate, w ? { id, r: w.r, c: w.c } : c); }
    const canPick = (c) => {
      if (beaconOn) return true;
      if (myTurn && T) {
        if (sel.includes(c.id)) return true;
        if (others.length > 1 || onTgt.length >= Math.min(tmax, T.need) || sel.length >= v.hand.length - 1) return false;
        if (anyFits) return true;
        if (wildOn && wildId == null && wildAs(tstate, c)) return true;
        return S.fits(tstate, c);
      }
      return iDiscard;
    };
    const live = (myTurn && T) || iDiscard || beaconOn;
    const hand = '<div class="hand' + (live ? ' live' : '') + (v.hand.length > 14 ? ' many' : '') + '" data-anchor="seat' + me + '">' + v.hand.map((c) => {
      const ok = live && canPick(c);
      return '<button type="button" class="cardb ' + (ok ? 'ok' : 'no') + (sel.includes(c.id) ? ' sel' : '') + '" data-id="' + c.id + '" aria-label="' + esc(S.cardName(c)) + '"' + (ok ? '' : ' aria-disabled="true"') + '>' + card(c, ' data-deal') +
        (vael && sel.includes(c.id) && v.heads[selHead[c.id]] ? '<i class="hb">' + esc(v.heads[selHead[c.id]].boss.name) + '</i>' : '') + '</button>';
    }).join('') + '</div>';
    const myPw = P[me].power;
    let main = '';
    if (myTurn) {
      const tname = vael && T ? esc(T.boss.name) : 'the combo';
      const prompt = beaconOn ? 'Tap the card you want everyone to see.'
        : !T ? 'Nothing in your hand fits ' + (vael ? 'any head' : 'this combo') + '. You have to pass.'
        : (vael ? 'Feeding <b>' + tname + '</b>' + (v.heads.filter(Boolean).length > 1 ? ' (tap another head to switch)' : '') + '. Add 1 or 2 cards to one head, or 1 card each to two heads. Cards stay on a head until it’s cut or it strikes.'
          : 'Tap 1 or 2 cards that fit, then add them. If the combo falls short, everything added comes back, everyone discards 1, and you fight it again.');
      main = '<p class="prompt">' + prompt + (v.hand.length <= 3 ? ' <b>Careful: if your hand runs out, the squad loses.</b>' : '') + '</p>' + hand +
        '<div class="acts">' + (beaconOn ? '<button class="dt-btn" data-do="beacon-off">Cancel</button>'
          : '<button class="dt-btn go" data-do="add"' + (sel.length ? '' : ' disabled') + '>Add ' + (sel.length || '') + ' card' + (sel.length === 1 ? '' : 's') + '</button><button class="dt-btn" data-do="pass"' + (v.canPass ? '' : ' disabled') + '>Pass</button>' +
            (v.canWild && T && !anyFits ? '<button class="dt-btn' + (wildOn ? ' on' : '') + '" data-do="wild">Overcharge' + (wildOn ? ': on' : '') + '</button>' : '') +
            (v.canBeacon ? '<button class="dt-btn" data-do="beacon">Beacon: show a card</button>' : '')) + '</div>';
    } else if (iRiptide) {
      main = '<p class="prompt">The squad is about to discard (' + v.riptide.counts.map((n, i) => nm(i) + ' ' + n).join(', ') + '). <b>Use Riptide so nobody discards?</b> You can only use it once.</p>' + hand +
        '<div class="acts"><button class="dt-btn go" data-do="rip-yes">Use Riptide</button><button class="dt-btn" data-do="rip-no">Save it</button></div>';
    } else if (iDiscard) {
      main = '<p class="prompt"><b>Discard ' + dn + ' card' + (dn === 1 ? '' : 's') + '</b> of your choice, face up.' + (v.hand.length <= dn ? ' That empties your hand, so the squad will fall.' : '') + '</p>' + hand +
        '<div class="acts"><button class="dt-btn go" data-do="discard"' + (sel.length === dn ? '' : ' disabled') + '>Discard ' + dn + '</button></div>';
    } else main = hand;
    const p0 = P[me];
    const mineHTML = '<div class="mine c' + p0.hero + (myTurn ? ' turn' : '') + '">' + leadTok(me) +
      '<div class="mehead"><span class="hd">' + avatar(p0.hero) + '</span><span class="nm">' + esc(p0.name) + (/^you$/i.test(p0.name) ? '' : ' (you)') + '<small>' + v.hand.length + ' cards · ' + noteOf(me) + '</small></span>' +
      (myPw ? '<span class="mypw"><b>' + esc(myPw.name) + '</b> · ' + esc(myPw.kind) + (myPw.used ? ' · used' : '') + ' — ' + esc(myPw.text) + '</span>' : '') + '</div>' + main + '</div>';

    // under the table
    const per = v.acts.map(() => []);
    v.hist.forEach((h) => { if (vael || h.met) per[actOf(h.key)].push(h.met); });   // Gorvax: a miss is fought again, so only wins fill a pip
    const track = '<div class="track" aria-label="Progress">' + v.acts.map((a, i) => '<span class="grp"><i>' + ACT[i] + '</i>' +
      Array.from({ length: a.n }, (_, j) => '<span class="pip a' + i + (j < per[i].length ? ' done' + (per[i][j] ? '' : ' miss') : '') + '"></span>').join('') + '</span>').join('') + '</div>';
    const under = '<div class="under"><div class="box"><h3>Progress</h3>' + track + '</div><div class="box"><h3>What happened</h3><div class="log">' + v.log.slice().reverse().map((l) => '<p>' + esc(mine(l, P[me].name)) + '</p>').join('') + '</div></div></div>';

    // the tutorial coach: one short note for wherever the first two monsters have got to
    let coach = '';
    if (TUT && !vael && v.done < 2 && v.phase !== 'over') {
      const e = v.enc, t = e ? TYPE[e.boss.type] : '';
      const what = { run: 'ranks that fit in a row, in any colors (gaps are fine while you build)', set: 'cards of one rank', color: 'cards of one color', combine: 'one card of each color, all different' }[e ? e.boss.type : 'run'];
      const note = v.phase === 'build' && myTurn ? (e.cards.length ? 'Your turn. The squad is building a <b>' + t + ' of ' + e.total + '</b>: ' + what + '. Tap 1 or 2 cards that fit and add them, or pass and keep your cards for later.'
          : 'You lead. ' + esc(e.boss.name) + ' wants a <b>' + t + ' of ' + e.total + '</b>: ' + what + '. The gold number on its card is the one for your squad of ' + P.length + '. Your first card tells your teammates what to add, so pick one you think they can follow.')
        : v.phase === 'build' ? 'Your teammates are adding to the same combo. Nobody may talk about their hand, so what they play is all you learn about what they hold.'
        : v.phase === 'discard' ? 'The combo fell short. Every card went back to whoever played it, so now everyone knows who holds those. Each Hero discards 1 card, face up, and the squad fights the same monster again.'
        : v.result && v.result.met ? 'Combo complete! The monster is beaten and those cards are spent. Nobody ever draws: your hand is your health, and if any Hero runs out, the Boss wins.'
        : 'It held on. The lead passes to the next Hero and you fight it again.';
      coach = '<div class="coach"><span>Tutorial · monster ' + (v.done + 1) + ' of 2</span><p>' + note + '</p></div>';
    } else if (TUT && !vael && v.done >= 2 && !tutDone) { tutDone = true; api.toast('That’s the whole game: beat every monster through the Finale.'); }

    // where a card or monster went when it left the table area
    const trashIds = new Set(v.trash.map((t) => 'k' + t.c.id));
    const leaveTo = (k) => {
      if (k[0] === 'm') return 'beaten';
      if (trashIds.has(k)) return 'trash';
      const id = +k.slice(1);
      for (let i = 0; i < P.length; i++) if (i !== me && P[i].known.some((c) => c.id === id)) return 'seat' + i;
      return null;
    };
    stage(el, () => {
      el.innerHTML = coach + '<div class="tbl">' + opp + '<div class="mid" data-anchor="center">' + left + '<div class="arena">' + arena + '</div>' + right + '</div>' + call + mineHTML + '</div>' + under;
    }, leaveTo);

    el.querySelectorAll('button.cardb.ok').forEach((b) => b.addEventListener('click', () => {
      const id = +b.dataset.id;
      if (beaconOn) { beaconOn = false; api.act({ type: 'beacon', card: id }); return; }
      if (iDiscard) { if (sel.includes(id)) sel = sel.filter((x) => x !== id); else if (sel.length < dn) sel.push(id); else sel = sel.slice(1).concat(id); }
      else if (sel.includes(id)) { const h = selHead[id], drop = sel.filter((x) => selHead[x] === h).slice(sel.filter((x) => selHead[x] === h).indexOf(id)); if (drop.includes(wildId)) wildId = null; sel = sel.filter((x) => !drop.includes(x)); }
      else {
        const c = v.hand.find((x) => x.id === id);
        if (wildOn && wildId == null && !S.fits(tstate, c)) wildId = id;
        sel.push(id); selHead[id] = tgt || 0;
      }
      render(el, v, api);
    }));
    el.querySelectorAll('[data-head]').forEach((b) => b.addEventListener('click', () => {
      const h = +b.dataset.head;
      if (h !== tgt) { const kept = sel.filter((x) => selHead[x] === tgt); if (kept.length > 1 || sel.some((x) => selHead[x] === h)) { sel = []; wildId = null; } tgt = h; }   // one card on the old head stays: that's a split
      render(el, v, api);
    }));
    el.querySelectorAll('[data-do]').forEach((b) => b.addEventListener('click', () => {
      const d = b.dataset.do;
      if (d === 'wild') { wildOn = !wildOn; if (!wildOn && wildId != null) { sel = sel.filter((x) => x !== wildId); wildId = null; } render(el, v, api); return; }
      if (d === 'beacon') { beaconOn = true; sel = []; render(el, v, api); return; }
      if (d === 'beacon-off') { beaconOn = false; render(el, v, api); return; }
      if (d === 'add') { const heads = [...new Set(sel.map((x) => selHead[x] || 0))]; api.act({ type: 'add', parts: heads.map((h) => ({ head: h, cards: sel.filter((x) => (selHead[x] || 0) === h) })), head: heads[0], cards: sel, wild: wildId }); }
      if (d === 'pass') api.act({ type: 'pass' });
      if (d === 'discard') api.act({ type: 'discard', cards: sel });
      if (d === 'rip-yes') api.act({ type: 'riptide', use: true });
      if (d === 'rip-no') api.act({ type: 'riptide', use: false });
      sel = []; selHead = {}; wildId = null; wildOn = false;
    }));
  }

  DevTable.mount(document.getElementById('app'), {
    id: 'sentai', title: 'Sentai', blurb: '2–4 players · 20–30 minutes · cooperative',
    minPlayers: 2, maxPlayers: 4, defaultPlayers: 3, botNames: S.BOT_NAMES,
    options: [
      { key: 'boss', label: 'Boss', values: [['gorvax', 'Emperor Gorvax'], ['vael', 'Vael, the Hydra']], def: 'gorvax' },
      { key: 'big', label: 'Gorvax deck', values: [[0, 'Standard'], [1, 'Fewer, bigger monsters']], def: 0 },
      { key: 'powers', label: 'Hero powers', values: [[0, 'Off'], [1, 'On']], def: 0 },
    ],
    botNote: 'Bot teammates think ahead: before each move they imagine the cards they can’t see, play the rest of the game out many times, and pick what wins most. They only know their own hand, the face-up Boss cards and cards they’ve seen.',
    create: (players, opts) => new S.Game(players, TUT ? { boss: 'gorvax', powers: 0, big: 0, firstLead: 0 } : opts),   // in the tutorial you lead the first fight
    render,
    rules:
      '<p><b>No table talk.</b> Everything the squad learns comes from the cards. Nobody draws, and if any Hero’s hand runs out, the Boss wins. One more color than there are Heroes, each ranked 1–12, and 15 cards each (14 against the Hydra).</p>' +
      '<p><b>Combos.</b> A Run is ranks in a row, any color; it can have gaps while it’s being built, as long as it all fits in its number. A Set is one rank. A Flush is one color, any ranks. A Roll Call is all different colors, any ranks. On your turn, add 1 or 2 cards that fit, or pass.</p>' +
      '<p><b>Emperor Gorvax.</b> Each episode’s monsters line up face up; fight them in order. Starting with the lead, everyone adds to one combo. Beat it and those cards are spent. Miss it and the cards go back to whoever added them, every Hero discards 1 face up, and you fight it again with the lead passed on. Beat every monster in the Finale to win.</p>' +
      '<p><b>Gorvax: fewer, bigger monsters (prototype).</b> Only 7 monsters a game (2, 2 and 3 per episode), and each asks for most of what the whole table can add in one go, so most fights come down to the last Hero. Deal 16 cards each (15 with 4 Heroes). Everything else is the same.</p>' +
      '<p><b>Vael, the Hydra.</b> Two heads are out at once (three with 3 or 4 Heroes), each with a combo and a hex that’s in force while it’s out. Cards stay on a head. At the end of the round, a finished head is cut off and a new one grows. An unfinished head is enraged; if it’s still unfinished after another round, it strikes: its cards are lost and every Hero discards 2. On your turn, add 1 or 2 cards to one head, or 1 card each to two heads. Get through every head to win.</p>' +
      '<p><b>Hero powers (optional).</b> Command: when you lead, add up to 3. Riptide (once): nobody discards. Overcharge (once): one card fits any combo. Steady: you discard 1 fewer. Beacon (once an episode): show a card.</p>',
  });
  if (TUT) { const n = document.getElementById('dt-l-n'); if (n) n.value = '3'; const b = document.getElementById('dt-l-start'); if (b) b.click(); }
})();
</script>
</body>
</html>
