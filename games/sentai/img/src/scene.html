<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="/assets/vendor/three.r128.min.js"></script>
</head><body>
<script>
/* Sentai — still renders. Units are inches. ?scene=hero|scene|table|kit|home  &w=1600&h=1000
   Cards lie flat on dark green felt and the two-piece box stands upright. Nothing touches or overlaps anything else, on the table or on screen. */
(async function () {
  const q = new URLSearchParams(location.search);
  const SCENE = q.get('scene') || 'hero', W = +q.get('w') || 1600, H = +q.get('h') || 1000;
  const TEX = '/games/sentai/img/src/tex/';
  const C = (h) => new THREE.Color(h).convertSRGBToLinear();
  const loader = new THREE.TextureLoader(), cache = {};
  const tex = (n) => cache[n] || (cache[n] = new Promise((res, rej) => loader.load(TEX + n, (t) => { t.anisotropy = 16; t.encoding = THREE.sRGBEncoding; res(t); }, undefined, rej)));

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const SHADE = '#14261F';
  const scene = new THREE.Scene(); scene.background = C(SHADE); scene.fog = new THREE.Fog(C(SHADE), 55, 110);
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 300);
  scene.add(new THREE.HemisphereLight(0xfff6e6, 0x3d5a4c, 0.72));
  const key = new THREE.DirectionalLight(0xfff4e6, 0.95); key.position.set(6, 13, 12); key.castShadow = true;
  key.shadow.mapSize.set(4096, 4096); Object.assign(key.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 70 });
  key.shadow.radius = 6; key.shadow.bias = -0.0004; scene.add(key);
  const rim = new THREE.DirectionalLight(0xffe2a8, 0.22); rim.position.set(-10, 8, -9); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xdfe4ff, 0.34); fill.position.set(-7, 6, 14); scene.add(fill);

  // the table: dark green felt with a soft pool of light
  function felt() {
    const S = 2048, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
    g.fillStyle = '#28503F'; g.fillRect(0, 0, S, S);
    let s = 9; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const id = g.getImageData(0, 0, S, S), d = id.data;
    for (let k = 0; k < d.length; k += 4) { const n = (r() - 0.5) * 14; d[k] += n; d[k + 1] += n; d[k + 2] += n * 1.2; }
    g.putImageData(id, 0, 0);
    const vg = g.createRadialGradient(S / 2, S / 2, S * 0.08, S / 2, S / 2, S * 0.55);
    vg.addColorStop(0, 'rgba(20,38,31,0)'); vg.addColorStop(1, 'rgba(20,38,31,.7)'); g.fillStyle = vg; g.fillRect(0, 0, S, S);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
  }
  const table = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshStandardMaterial({ map: felt(), roughness: 0.97 }));
  table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);
  const outer = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({ color: C(SHADE) })); outer.position.z = -0.01; table.add(outer);
  const items = []; const add = (o) => { items.push(o); scene.add(o); return o; };

  // ---- cards: poker size, rounded corners
  const CW = 2.5, CH = 3.5, CT = 0.014, CR = 0.13;
  function rr(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }
  function capGeo(w, h, r) { const g = new THREE.ShapeGeometry(rr(w, h, r), 8); const p = g.attributes.position, uv = g.attributes.uv; for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + w / 2) / w, (p.getY(i) + h / 2) / h); return g; }
  const cardCap = capGeo(CW, CH, CR);
  const cardEdge = new THREE.ExtrudeGeometry(rr(CW, CH, CR), { depth: CT, bevelEnabled: false, curveSegments: 8 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: C('#EDE6D6'), roughness: 0.8 });
  const matCache = {};
  async function faceMat(n) { if (!matCache[n]) matCache[n] = new THREE.MeshStandardMaterial({ map: await tex(n), roughness: 0.7, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }); return matCache[n]; }
  // a card as a group in its own plane (XY, face towards +z), so it can lie flat or stand
  async function cardBody(face, backFace) {
    const g = new THREE.Group();
    const e = new THREE.Mesh(cardEdge, edgeMat); e.position.z = -CT; e.castShadow = true; e.receiveShadow = true; g.add(e);
    const f = new THREE.Mesh(cardCap, await faceMat(face)); f.position.z = 0.002; f.receiveShadow = true; g.add(f);
    const b = new THREE.Mesh(cardCap, await faceMat(backFace || (face.startsWith('boss-') && !face.startsWith('boss-back') ? 'boss-back-' + Math.floor((+face.slice(5, -4) % 18) / 6) + '.jpg' : 'hero-back.jpg'))); b.position.z = -CT - 0.002; b.rotation.y = Math.PI; b.receiveShadow = true; g.add(b);
    return g;
  }
  async function flat(face, x, z, yaw = 0, name) { const g = new THREE.Group(), b = await cardBody(face); b.rotation.x = -Math.PI / 2; b.position.y = CT + 0.001; g.add(b); g.position.set(x, 0, z); g.rotation.y = yaw; g.name = name || face; return add(g); }
  async function deck(x, z, n, yaw = 0, top = 'hero-back.jpg') {
    const g = new THREE.Group(), h = n * CT;
    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(CW, CH, CR), { depth: h, bevelEnabled: false, curveSegments: 8 }), new THREE.MeshStandardMaterial({ color: C('#E2DACA'), roughness: 0.85 }));
    body.rotation.x = -Math.PI / 2; body.castShadow = true; body.receiveShadow = true; g.add(body);
    const f = new THREE.Mesh(cardCap, await faceMat(top)); f.rotation.x = -Math.PI / 2; f.position.y = h + 0.002; g.add(f);
    g.position.set(x, 0, z); g.rotation.y = yaw; g.name = 'deck'; return add(g);
  }
  // ---- the box: a two-piece box 4 x 5.5 x 1.25 in, lid on, standing upright with the cover to the camera
  const BW = 4, BD = 1.25, BHt = 5.5;
  async function box(x, z, yaw = 0) {
    const tF = await tex('box-front.jpg'), tS = await tex('box-side.jpg'), tE = await tex('box-end.jpg');
    const M = (t) => new THREE.MeshStandardMaterial({ map: t, roughness: 0.5 });
    const back = new THREE.MeshStandardMaterial({ color: C('#1F1A2B'), roughness: 0.6 });
    // BoxGeometry faces: +x, -x, +y (top), -y, +z (front), -z (back)
    const body = new THREE.Mesh(new THREE.BoxGeometry(BW, BHt, BD), [M(tS), M(tS), M(tE), back, M(tF), back]);
    body.position.y = BHt / 2; body.castShadow = true; body.receiveShadow = true;
    // where the lid ends and the tray shows, near the back
    const seam = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.012, BHt + 0.012, 0.02), new THREE.MeshStandardMaterial({ color: C('#0E0B16'), roughness: 0.9 })); seam.position.set(0, BHt / 2, -BD / 2 + 0.16);
    const g = new THREE.Group(); g.add(body); g.add(seam); g.position.set(x, 0, z); g.rotation.y = yaw; g.name = 'box'; return add(g);
  }

  function frame(min, max, elevDeg, azimDeg, margin) {
    const c = new THREE.Vector3((min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2);
    const el = elevDeg * Math.PI / 180, az = azimDeg * Math.PI / 180;
    const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    const corners = []; for (const x of [min[0], max[0]]) for (const y of [min[1], max[1]]) for (const z of [min[2], max[2]]) corners.push(new THREE.Vector3(x, y, z));
    let dist = 5;
    for (let it = 0; it < 90; it++) { camera.position.copy(c).addScaledVector(dir, dist); camera.lookAt(c); camera.updateMatrixWorld(); camera.updateProjectionMatrix(); let ok = true; for (const p of corners) { const v = p.clone().project(camera); if (Math.abs(v.x) > margin || Math.abs(v.y) > margin) { ok = false; break; } } if (ok) break; dist *= 1.05; }
  }

  // ================================================================ scenes
  if (SCENE === 'hero' || SCENE === 'scene' || SCENE === 'home') {
    // the box, a monster, and the Run the squad built against it
    await box(-6.2, -0.9, 0.16);
    await flat('boss-13.jpg', -1.9, 0.2, 0.05, 'monster');
    await flat('hero-1-4.jpg', 1.2, 0.3, -0.03, 'run-4'); await flat('hero-2-5.jpg', 4.1, 0.2, 0.03, 'run-5'); await flat('hero-3-6.jpg', 7.0, 0.3, -0.04, 'run-6');
    if (SCENE !== 'home') {   // in front: a red and a pink Hero card, a Hydra head and a Hero power
      await flat('hero-0-7.jpg', -5.6, 4.9, 0.06, 'red-7'); await flat('hero-4-9.jpg', -2.5, 5.0, -0.03, 'pink-9');
      await flat('boss-26.jpg', 0.9, 5.0, 0.03, 'head'); await flat('power-1.jpg', 4.0, 4.9, -0.04, 'power'); await deck(7.1, 4.9, 14, 0.06, 'hero-back.jpg');
    }
    if (SCENE === 'home') frame([-8.3, 0, -1.7], [8.4, 5.5, 2.1], 20, 0, 0.9);
    else frame([-8.3, 0, -1.7], [8.5, 5.5, 6.8], 32, 0, 0.94);
  }

  if (SCENE === 'table') {
    // from your seat in a three-Hero game against Gorvax: the monster with the combo beside it, the next two monsters,
    // the face-down acts, the discards, your teammates' hands across the table and your own hand in front of you
    await deck(-6.0, -7.2, 12, 0.12, 'hero-back.jpg'); items[items.length - 1].name = 'teammate-a';
    await deck(6.0, -7.2, 11, -0.1, 'hero-back.jpg'); items[items.length - 1].name = 'teammate-b';
    await deck(-10.4, -2.4, 4, 0.05, 'boss-back-1.jpg'); items[items.length - 1].name = 'act-2';
    await deck(-7.4, -2.4, 5, -0.04, 'boss-back-2.jpg'); items[items.length - 1].name = 'act-3';
    await flat('boss-4.jpg', -3.4, -2.4, 0.02, 'monster');
    await flat('hero-0-7.jpg', -0.4, -2.3, -0.05, 'combo-1'); await flat('hero-1-7.jpg', 2.5, -2.4, 0.04, 'combo-2');
    await deck(8.9, -2.4, 6, -0.06, 'hero-4-1.jpg'); items[items.length - 1].name = 'discards';
    await flat('boss-0.jpg', -3.4, 1.9, -0.03, 'next-1'); await flat('boss-2.jpg', -0.4, 1.9, 0.03, 'next-2');
    const hand = ['hero-0-2', 'hero-1-11', 'hero-2-12', 'hero-3-3', 'hero-3-7', 'hero-4-9'];
    for (const [i, n] of hand.entries()) await flat(n + '.jpg', -7.25 + i * 2.9, 6.9, (i - 2.5) * -0.012, 'hand-' + i);
    frame([-12.2, 0, -9.2], [12.2, 0.4, 8.9], 50, 0, 0.97);
  }

  if (SCENE === 'kit') {
    // everything in the box, flat: one Hero card of each color and their back; Gorvax's monsters and Vael's heads with the three act backs;
    // three of the five Hero powers; the box
    const GX = 2.85, GZ = 3.85, X0 = -5.2, Z0 = -5.6;
    const rows = [['hero-0-7', 'hero-1-4', 'hero-2-5', 'hero-3-6', 'hero-4-9', 'hero-back'], ['boss-0', 'boss-8', 'boss-17', 'boss-18', 'boss-26', 'boss-35'], ['boss-back-0', 'boss-back-1', 'boss-back-2', 'power-0', 'power-2', 'power-4']];
    for (const [r, row] of rows.entries()) for (const [c, n] of row.entries()) await flat(n + '.jpg', X0 + c * GX, Z0 + r * GZ, 0, n);
    await box(-10.6, -4.6, 0);
    frame([-12.8, 0, -7.6], [10.6, 5.5, 4.0], 62, 0, 0.97);
  }

  renderer.render(scene, camera);
  await new Promise((r) => setTimeout(r, 60)); renderer.render(scene, camera);
  window.__sen = { renderer, scene, camera, table, items };
  window.__done = true;
})();
</script>
</body></html>
