<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Too Many Crooks! — Crew sheets</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
:root{
  --paper:#55646E;
  --ink:#F2ECDA;
  --soft:#BFC8CD;
  --red:#FF8A6B;
  --gold:#F5D27A;
  --hot:#F0603F;
  --slot:#6F7E87;
  --line:rgba(242,236,218,.16);
  --line2:rgba(242,236,218,.07);
  --d:0.66in;
}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0}
body{background:#000;padding:0;font-family:Oswald,system-ui,sans-serif}
.sheet{zoom:4;display:block;width:3.5in}
body.all{background:#fff}
body.all .sheet{zoom:1;width:7.0in;margin:0 auto;display:grid;grid-template-columns:repeat(2,3.5in);grid-auto-rows:2.5in;justify-content:center}

/* ───────────── card: a planning sheet ───────────── */
.board{
  position:relative;width:3.5in;height:2.5in;overflow:hidden;color:var(--ink);border-radius:0;
  background:
    radial-gradient(90% 80% at 40% 35%, rgba(255,255,255,.07), rgba(255,255,255,0) 70%),
    radial-gradient(140% 120% at 50% 50%, rgba(0,0,0,0) 55%, rgba(14,16,20,.28) 100%),
    var(--paper);
  border:1.5px solid #252E34;
  padding:.07in .10in .05in;
  display:flex;flex-direction:column;
}
.tick{position:absolute;width:7px;height:7px;pointer-events:none}
.tick.tl{top:4px;left:4px;border-top:1px solid var(--soft);border-left:1px solid var(--soft)}
.tick.tr{top:4px;right:4px;border-top:1px solid var(--soft);border-right:1px solid var(--soft)}
.tick.bl{bottom:4px;left:4px;border-bottom:1px solid var(--soft);border-left:1px solid var(--soft)}
.tick.br{bottom:4px;right:4px;border-bottom:1px solid var(--soft);border-right:1px solid var(--soft)}

/* ───────────── header ───────────── */
.head{display:flex;align-items:baseline;gap:7px;padding:0 1px 2.5px;border-bottom:1.5px solid var(--ink)}
.wordmark{font-size:12px;font-weight:700;letter-spacing:1.2px;line-height:1;white-space:nowrap;text-shadow:0 1px 0 #0A0C10}
.wordmark em{font-style:normal;color:#E8573A}
.rule-dot{flex:1;height:1px;transform:translateY(-3px);
  background:repeating-linear-gradient(90deg,var(--soft) 0 2px,transparent 2px 5px)}
.target{display:flex;align-items:center;gap:3.5px;
  font-family:'Courier Prime',monospace;font-size:7px;font-weight:700;
  letter-spacing:1.1px;color:var(--gold);line-height:1;white-space:nowrap}
.tico svg{height:11px;width:11px;display:block;fill:var(--gold);stroke:var(--gold)}

/* heist loot scattered faintly across the sheet: cash, diamonds, masks, shades, sirens */
.loot{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.13}
.loot use,.loot g{fill:var(--ink);stroke:var(--ink)}
.board > *:not(.loot):not(.tick){position:relative}
.siren{display:flex;gap:1.5px;align-self:center;transform:translateY(1px)}
.siren svg{width:10px;height:10px;display:block}

/* ───────────── grid ───────────── */
.grid{
  flex:1;display:grid;
  grid-template-columns:.19in var(--d) var(--d) var(--d) .03in var(--d);
  grid-template-rows:auto var(--d) var(--d) auto;
  column-gap:.045in;row-gap:.022in;
  align-items:center;justify-items:center;padding-top:.025in;
}
.c2{grid-column:2}.c3{grid-column:3}.c4{grid-column:4}
.r2{grid-row:2}.r3{grid-row:3}

.role{grid-row:1;display:flex;flex-direction:column;align-items:center;line-height:1}
.role svg{height:16px;width:16px;display:block;fill:var(--ink);stroke:var(--ink);margin-bottom:2.5px}
.rname{font-size:7px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  text-align:center;line-height:1.18;white-space:nowrap}
.band{font-family:'Courier Prime',monospace;font-size:8px;font-weight:700;color:var(--gold);
  letter-spacing:.8px;line-height:1.45;margin-top:.5px}
.band.jobs{font-size:6.5px;letter-spacing:.4px;text-transform:uppercase}

.rowlab{font-size:7px;font-weight:700;letter-spacing:.8px;
  writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;
  width:.17in;height:var(--d);border-radius:3px;display:flex;align-items:center;justify-content:center;line-height:1}
/* gold = yours (scores for you), red = paid out to someone else */
.rowlab.score{background:var(--gold);color:#1B2228}
.rowlab.payout{background:var(--hot);color:#FFF6E8}

.slot{width:var(--d);height:var(--d);border-radius:4px;background:var(--slot);
  border:1.5px solid var(--gold);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center}
.slot svg{width:.3in;height:.3in;fill:var(--ink);stroke:var(--ink);opacity:.22}
.slot.pay{background:#867475;border:1.5px dashed var(--hot);box-shadow:none;flex-direction:column;gap:1px}
.slot.pay .to{font-family:'Courier Prime',monospace;font-weight:700;font-size:6.2px;letter-spacing:.4px;color:#FFD6C8;line-height:1}
.slot.pay .to b{font-size:9px;display:block;text-align:center;line-height:.9}
.slot.own{border:1.5px solid var(--gold);background:#6F7670;
  grid-column:6;grid-row:2 / 4;align-self:center;flex-direction:column}
.slot.own .to{font-family:'Courier Prime',monospace;font-weight:700;font-size:6.2px;letter-spacing:.4px;color:var(--gold);line-height:1.2;text-align:center}

.div{grid-column:5;grid-row:1 / 5;width:1px;height:100%;
  background:repeating-linear-gradient(180deg,var(--soft) 0 2px,transparent 2px 5px)}
.mine{grid-column:6;grid-row:1;display:flex;flex-direction:column;align-items:center;line-height:1}
.mine svg{height:16px;width:16px;display:block;fill:var(--gold);stroke:none;margin-bottom:2.5px}
.mine .rname{color:var(--gold)}
.mine .band.jobs{color:var(--ink)}

/* brace under the three cut slots — it applies to the group, not to one column */
.cutnote{grid-column:2 / 5;grid-row:4;position:relative;align-self:start;
  font-family:'Courier Prime',monospace;font-size:6.3px;font-weight:700;
  letter-spacing:.35px;color:var(--hot);text-align:center;
  padding-top:6px;line-height:1;white-space:nowrap;width:100%}
.cutnote::before{content:"";position:absolute;left:5px;right:5px;top:0;height:4px;
  border:1px solid var(--hot);border-top:0;border-radius:0 0 2px 2px}
.cutnote b{color:var(--ink)}

/* the whole schedule, folded onto the sheet */
.sched{display:flex;align-items:center;justify-content:center;gap:.07in;
  margin-top:.035in;padding-top:.032in;border-top:1px solid var(--soft);
  font-family:'Courier Prime',monospace;font-size:6.4px;font-weight:700;
  letter-spacing:.3px;color:var(--soft);line-height:1;white-space:nowrap}
.sched b{color:var(--ink);letter-spacing:.7px}
.sched .hot{color:var(--red)}

@media print{
  @page{size:letter;margin:.5in}
  body{background:#fff;padding:0}
  .note{display:none}
}
.note{max-width:7.0in;margin:0 auto 16px;font-family:system-ui,sans-serif;font-size:12px;color:#17202a}
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const BADGE = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M9.9 1.4h4.2a.9.9 0 0 1 .9.9v1.5H9V2.3a.9.9 0 0 1 .9-.9z" stroke="none"/>
  <path d="M4.6 4.5h14.8c.9 0 1.6.7 1.6 1.6v14.5c0 .9-.7 1.6-1.6 1.6H4.6c-.9 0-1.6-.7-1.6-1.6V6.1c0-.9.7-1.6 1.6-1.6zm7.4 3.3a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4zM6.6 18.6h10.8c-.5-2.6-2.7-4-5.4-4s-4.9 1.4-5.4 4z" stroke="none"/>
</svg>`;
const WHEEL = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M12 1.5C6.2 1.5 1.5 6.2 1.5 12S6.2 22.5 12 22.5 22.5 17.8 22.5 12 17.8 1.5 12 1.5zm0 2.4c4.1 0 7.5 3 8.2 6.9H3.8c.7-3.9 4.1-6.9 8.2-6.9zM4.1 13.2h6.7v6.8c-3.4-.5-6.1-3.3-6.7-6.8zm9.1 6.8v-6.8h6.7c-.6 3.5-3.3 6.3-6.7 6.8z" stroke="none"/>
  <circle cx="12" cy="12" r="2.5" stroke="none"/>
</svg>`;
const ARM = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M3.0 19.2 H13.2 L16.4 9.6" fill="none" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8.4" cy="13.8" r="5.0" stroke="none"/>
  <rect x="12.0" y="2.0" width="9.4" height="7.4" rx="3.1" stroke="none" transform="rotate(16 16.7 5.7)"/>
</svg>`;
const COIN = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M12 1.6C6.3 1.6 1.7 6.3 1.7 12S6.3 22.4 12 22.4 22.3 17.7 22.3 12 17.7 1.6 12 1.6zm0 2.4c4.4 0 8 3.6 8 8s-3.6 8-8 8-8-3.6-8-8 3.6-8 8-8z"/>
  <path d="M12.9 5.9v1.3c1.2.2 2.1.8 2.6 1.7l-1.9 1.1c-.3-.6-.9-.9-1.7-.9-.8 0-1.2.3-1.2.8 0 .5.5.8 1.8 1.2 1.9.5 3.1 1.2 3.1 2.9 0 1.5-1.1 2.4-2.7 2.7v1.4h-1.8v-1.4c-1.4-.3-2.4-1-2.9-2.1l1.9-1.1c.3.8 1 1.2 2 1.2.9 0 1.4-.3 1.4-.8 0-.5-.5-.8-1.9-1.2-1.8-.5-3-1.3-3-2.9 0-1.4 1.1-2.4 2.5-2.6V5.9z"/>
</svg>`;

const ROLES = [
  {ico:BADGE, name:"Inside Man",     band:"1 · 2"},
  {ico:WHEEL, name:"Getaway Driver", band:"3 · 4"},
  {ico:ARM,   name:"The Muscle",     band:"5 · 6"},
];
/* each sheet is a different score — flavour only, every board plays identically */
const ANCHOR = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="12" cy="3.9" r="2.3" fill="none" stroke-width="1.9"/>
  <rect x="10.9" y="5.8" width="2.2" height="15.4" rx="1.1" stroke="none"/>
  <rect x="7.2" y="7.6" width="9.6" height="2.1" rx="1.05" stroke="none"/>
  <path d="M3.3 13.0a1.3 1.3 0 0 1 2.6 0 6.1 6.1 0 0 0 12.2 0 1.3 1.3 0 0 1 2.6 0 8.7 8.7 0 0 1-17.4 0z" stroke="none"/>
</svg>`;
const CHIPS = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <ellipse cx="12" cy="17.6" rx="8.6" ry="3.2" stroke="none"/>
  <ellipse cx="12" cy="13.3" rx="8.6" ry="3.2" stroke="none"/>
  <ellipse cx="12" cy="9.0"  rx="8.6" ry="3.2" stroke="none"/>
</svg>`;
const SAFE = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M2.6 3.2h18.8a1.5 1.5 0 0 1 1.5 1.5v14.6a1.5 1.5 0 0 1-1.5 1.5H2.6a1.5 1.5 0 0 1-1.5-1.5V4.7a1.5 1.5 0 0 1 1.5-1.5zm9.4 3.4a5.4 5.4 0 1 0 0 10.8 5.4 5.4 0 0 0 0-10.8z" stroke="none"/>
  <circle cx="12" cy="12" r="2.1" stroke="none"/>
  <rect x="11.2" y="5.4" width="1.6" height="3.2" stroke="none"/>
  <rect x="11.2" y="15.4" width="1.6" height="3.2" stroke="none"/>
  <rect x="5.4" y="11.2" width="3.2" height="1.6" stroke="none"/>
  <rect x="15.4" y="11.2" width="3.2" height="1.6" stroke="none"/>
</svg>`;
const TOWER = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <rect x="2.2" y="10.2" width="7.2" height="11.8" rx=".7" stroke="none"/>
  <rect x="10.6" y="4.4" width="8.4" height="17.6" rx=".7" stroke="none"/>
  <rect x="13.7" y="1.2" width="2.2" height="3.4" stroke="none"/>
</svg>`;
const MUSEUM = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M12 1.7 22.6 7.1v2.1H1.4V7.1z" stroke="none"/>
  <rect x="3.3" y="10.3" width="2.7" height="8.6" stroke="none"/>
  <rect x="8.1" y="10.3" width="2.7" height="8.6" stroke="none"/>
  <rect x="13.2" y="10.3" width="2.7" height="8.6" stroke="none"/>
  <rect x="18.0" y="10.3" width="2.7" height="8.6" stroke="none"/>
  <rect x="1.4" y="19.8" width="21.2" height="2.5" rx=".6" stroke="none"/>
</svg>`;
const TRUCK = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <rect x="1.2" y="6.2" width="12.6" height="9.4" rx=".8" stroke="none"/>
  <path d="M14.2 8.8h4.3l3.3 3.5v3.3h-7.6z" stroke="none"/>
  <circle cx="6.0" cy="18.0" r="2.6" stroke="none"/>
  <circle cx="18.0" cy="18.0" r="2.6" stroke="none"/>
</svg>`;

const SIREN = (c) => `<svg viewBox="0 0 24 24" aria-hidden="true">
  <g stroke="${c}" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="1.2" x2="12" y2="3.6"/><line x1="3.6" y1="4.4" x2="5.4" y2="6.2"/><line x1="20.4" y1="4.4" x2="18.6" y2="6.2"/></g>
  <path d="M6 17.5V12.5a6 6 0 0 1 12 0v5z" fill="${c}"/><path d="M8.6 12.6a3.4 3.4 0 0 1 2.6-3.3" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
  <rect x="3.5" y="17.5" width="17" height="4" rx="1" fill="#F2ECDA"/>
</svg>`;
// loot for the wallpaper (single colour, drawn faintly)
const LOOT_DEFS = `
  <symbol id="l-cash" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 8h18v11H4zM13 10.3a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4z"/><path d="M2 5h18v1.8H3.8V16H2z"/></symbol>
  <symbol id="l-gem" viewBox="0 0 24 24"><path d="M7 3h10l5 6.5L12 21 2 9.5z"/></symbol>
  <symbol id="l-mask" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M1 10c0-3.4 4.3-4.4 7.3-3.4 1.8.6 2.7 1.4 3.7 1.4s1.9-.8 3.7-1.4c3-1 7.3 0 7.3 3.4 0 3.8-3.2 6.6-7 5.6-1.9-.5-2.8-2-4-2s-2.1 1.5-4 2c-3.8 1-7-1.8-7-5.6zM4.6 10.6a2.8 1.9 0 1 0 5.6 0 2.8 1.9 0 0 0-5.6 0zm9.2 0a2.8 1.9 0 1 0 5.6 0 2.8 1.9 0 0 0-5.6 0z"/></symbol>
  <symbol id="l-shades" viewBox="0 0 24 24"><path d="M1.5 9h8.5q0 6.5-4.3 6.5T1.5 9zM14 9h8.5q0 6.5-4.3 6.5T14 9zM9.5 9h5v1.6h-5zM.6 6.4l1.8 2.8-1.2.8z"/><path d="M23.4 6.4l-1.8 2.8 1.2.8z"/></symbol>
  <symbol id="l-bag" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M8.5 2.5h7l-2 4.2c4.2 1.6 7.2 5.1 7.2 9.2 0 4.1-3.9 6.1-8.7 6.1s-8.7-2-8.7-6.1c0-4.1 3-7.6 7.2-9.2zM11.2 11v1.2c-1.3.3-2.1 1.1-2.1 2.2 0 1.3 1 1.9 2.4 2.2 1 .2 1.4.5 1.4.9s-.4.7-1.1.7c-.8 0-1.3-.3-1.5-.9l-1.4.5c.3 1 1.1 1.6 2.3 1.8V21h1.4v-1.2c1.4-.3 2.2-1.1 2.2-2.3 0-1.3-.9-1.9-2.4-2.2-1-.2-1.4-.4-1.4-.8 0-.4.4-.6 1-.6.7 0 1.1.3 1.3.8l1.4-.5c-.3-.9-1-1.4-2-1.6V11z"/></symbol>
  <symbol id="l-ring" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 8.5a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm0 2.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4z"/><path d="M9 5.2 12 1.5l3 3.7-3 3.2z"/></symbol>
  <symbol id="l-siren" viewBox="0 0 24 24"><path d="M6 17.5V12.5a6 6 0 0 1 12 0v5zM3.5 17.5h17v4h-17zM11 1h2v3h-2zM3 4.9l1.4-1.4 2 2-1.4 1.4zM21 4.9l-1.4-1.4-2 2 1.4 1.4z"/></symbol>`;
// tucked into the empty margins, clear of every slot and label: [symbol, x, y, size, rotation] in css px on a 336 x 240 card
const LOOT_AT = [
  ['mask',   24, 40,20,-10],['shades', 24, 63,18, 12],
  ['ring',  258, 90,15, -8],['gem',   306, 92,14, 14],
  ['cash',  262,198,22,-12],['siren', 312,188,18, 10],['bag', 296,214,15,-6],
  ['bag',    22,216,15,  8],['gem',    44,224,10,-10],
];
const LOOT = `<svg class="loot" viewBox="0 0 336 240" preserveAspectRatio="none" aria-hidden="true"><defs>${LOOT_DEFS}</defs>${
  LOOT_AT.map(([n,x,y,sz,r])=>`<use href="#l-${n}" x="${x-sz/2}" y="${y-sz/2}" width="${sz}" height="${sz}" transform="rotate(${r} ${x} ${y})"/>`).join("")}</svg>`;

const TARGETS = [
  {name:"THE DOCKS",       ico:ANCHOR},
  {name:"THE CASINO",      ico:CHIPS},
  {name:"THE NIGHT BANK",  ico:SAFE},
  {name:"THE PENTHOUSE",   ico:TOWER},
  {name:"THE MUSEUM",      ico:MUSEUM},
  {name:"THE ARMORED CAR", ico:TRUCK},
];

const board = (t) => `
<div class="board">
  <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>
  ${LOOT}

  <div class="head">
    <span class="siren">${SIREN("#F0603F")}${SIREN("#5AA2F0")}</span>
    <span class="wordmark">TOO MANY <em>CROOKS!</em></span>
    <span class="rule-dot"></span>
    <span class="target"><span class="tico">${t.ico}</span>${t.name}</span>
  </div>

  <div class="grid">
    ${ROLES.map((r,i)=>`
    <div class="role c${i+2}">
      ${r.ico}
      <span class="rname">${r.name}</span>
      <span class="band">${r.band}</span>
    </div>`).join("")}

    <span class="div"></span>
    <div class="mine">
      ${COIN}
      <span class="rname">Your<br>Cut</span>
      <span class="band jobs">Jobs 1&ndash;2</span>
    </div>

    <span class="rowlab score c1 r2">YOU SCORE</span>
    ${ROLES.map((r,i)=>`<span class="slot c${i+2} r2">${r.ico}</span>`).join("")}

    <span class="rowlab payout c1 r3">YOU PAY</span>
    ${[2,3,4].map(c=>`<span class="slot pay c${c} r3"><span class="to"><b>&uarr;</b>THEIRS</span></span>`).join("")}

    <span class="slot own"><span class="to">YOU<br>KEEP</span></span>

    <div class="cutnote">JOB 1 <b>PAY ALL 3</b> &nbsp;&middot;&nbsp; JOBS 2&amp;3 <b>PAY ANY 2</b></div>
  </div>

  <div class="sched">
    <span>SEND <b>4</b> EVERY JOB</span>
    <span>ROLL <b>8 / 7 / 6</b></span>
    <span>KEEP <b>4 / 3 / 2</b></span>
    <span class="hot">JOB 3 DOUBLES</span>
  </div>
</div>`;
const qs=new URLSearchParams(location.search), sheetEl=document.getElementById('sheet');
if(qs.get('all')){ document.body.classList.add('all'); sheetEl.innerHTML=TARGETS.map(board).join(''); }
else sheetEl.innerHTML = board(TARGETS[+(qs.get('t')||0)]);
</script>
</body>
</html>
