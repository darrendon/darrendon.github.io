<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
html,body{margin:0;background:#000}
#box{width:1400px;height:1000px;position:relative;overflow:hidden;background:#E04B2E;font-family:Oswald,sans-serif}
#box svg{position:absolute;inset:0;width:100%;height:100%}
.title{position:absolute;left:0;right:0;top:44px;text-align:center}
.title h1{margin:0;font-size:132px;line-height:.86;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#13161C}
.title h1 em{font-style:normal;color:#F2ECDA}
.tag{position:absolute;left:0;right:0;top:196px;text-align:center;font-family:'Courier Prime',monospace;font-weight:700;font-size:26px;letter-spacing:8px;color:#13161C;text-transform:uppercase}
.foot{position:absolute;left:70px;right:70px;bottom:44px;display:flex;justify-content:space-between;align-items:flex-end}
.foot .spec{font-family:'Courier Prime',monospace;font-weight:700;font-size:20px;letter-spacing:4px;color:#13161C;line-height:1.5}
.foot .by{text-align:right}
.foot .by small{display:block;font-family:'Courier Prime',monospace;font-weight:700;font-size:18px;letter-spacing:6px;color:#13161C;opacity:.75}
.foot .by b{display:block;font-size:40px;font-weight:700;letter-spacing:3px;text-transform:uppercase;line-height:1.05;color:#13161C}
</style>
</head>
<body>
<div id="box">
  <svg viewBox="0 0 1400 1000" id="art"></svg>
  <div class="title"><h1>Too Many <em>Crooks!</em></h1></div>
  <div class="tag">Everyone gets a cut. Almost.</div>
  <div class="foot">
    <div class="spec">3–6 CROOKS<br>25 MIN</div>
    <div class="by"><small>A GAME BY</small><b>Darren Don</b></div>
  </div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('art');
const el=(n,a,parent)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(parent||svg).appendChild(e);return e};
// the loot: a sack dead centre
const cx=700, cy=600;
el('ellipse',{cx:cx+12,cy:cy+168,rx:250,ry:36,fill:'#13161C',opacity:.25});
el('path',{d:`M${cx-180} ${cy+130} Q${cx-214} ${cy-40} ${cx-64} ${cy-116} L${cx-32} ${cy-180} L${cx+42} ${cy-180} L${cx+74} ${cy-116} Q${cx+224} ${cy-40} ${cx+180} ${cy+130} Q${cx} ${cy+188} ${cx-180} ${cy+130} Z`,fill:'#F2ECDA',stroke:'#13161C','stroke-width':10,'stroke-linejoin':'round'});
el('path',{d:`M${cx-46} ${cy-160} Q${cx+5} ${cy-136} ${cx+56} ${cy-160}`,fill:'none',stroke:'#13161C','stroke-width':10,'stroke-linecap':'round'});
el('text',{x:cx+4,y:cy+66,'text-anchor':'middle','font-family':'Oswald','font-weight':'700','font-size':180,fill:'#13161C'}).textContent='$';
// six arms on a ring around the sack, pointing outward, so none cross. Hands grip the sack's edge.
const COL=['#2B2B2B','#2F6DB5','#E0B21F','#C8372D','#3E8E4F','#F2ECDA'];
const R=236;
const angs=[205,160,108,72,20,-25];            // degrees, 0 = right, positive = clockwise (y down); none point into the title band
angs.forEach((deg,i)=>{
  const a=deg*Math.PI/180, hx=cx+Math.cos(a)*R, hy=cy+Math.sin(a)*R;
  const g=el('g',{transform:`translate(${hx},${hy}) rotate(${deg})`});
  const c=COL[i], len=900;
  el('rect',{x:40,y:-48,width:len,height:96,rx:48,fill:c,stroke:'#13161C','stroke-width':9},g);   // sleeve, running outward
  el('rect',{x:120,y:-54,width:26,height:108,rx:8,fill:'#13161C'},g);                               // cuff
  el('circle',{cx:30,cy:0,r:60,fill:c,stroke:'#13161C','stroke-width':9},g);                       // palm
  for(let f=0;f<3;f++) el('rect',{x:-58,y:-36+f*30,width:70,height:24,rx:12,fill:c,stroke:'#13161C','stroke-width':8},g); // fingers, gripping inward
  el('ellipse',{cx:-10,cy:-62,rx:22,ry:36,fill:c,stroke:'#13161C','stroke-width':9,transform:'rotate(28 -10 -62)'},g);     // thumb
});
</script>
</body>
</html>
