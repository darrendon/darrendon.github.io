<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="/assets/vendor/three.r128.min.js"></script>
</head><body>
<script>
/* Too Many Crooks! — still renders. Units are inches. ?scene=hero|table|kit|themed  &w=1600&h=1000
   themed = quiet card table (green felt, soft overhead pool, vignette). The box always stands upright, cover to camera; no props.
   &check=1 runs the per-object overlap check (every scene) -> window.__check */
(async function () {
  const q = new URLSearchParams(location.search);
  const SCENE = q.get('scene') || 'hero', W = +q.get('w') || 1600, H = +q.get('h') || 1000;
  const TEX = '/games/too-many-crooks/img/src/tex/';
  const C = (h) => new THREE.Color(h).convertSRGBToLinear();
  const loader = new THREE.TextureLoader();
  const tex = (n) => new Promise((res, rej) => loader.load(TEX + n, (t) => { t.anisotropy = 16; t.encoding = THREE.sRGBEncoding; res(t); }, undefined, rej));

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = C('#1E252A');
  scene.fog = new THREE.Fog(C('#1E252A'), 26, 48);
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);

  // ---- lights (same rig as the Dim Sum Rush mockup, warmed a touch)
  const hemi = new THREE.HemisphereLight(0xfff3e2, 0x8a7458, 0.62); scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfff1dc, 1.05); key.position.set(7, 12, 7); key.castShadow = true;
  key.shadow.mapSize.set(4096, 4096); Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
  key.shadow.radius = 5; key.shadow.bias = -0.0005; scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd9a8, 0.38); rim.position.set(-9, 6, -8); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xdfe8ff, 0.18); fill.position.set(-5, 4, 9); scene.add(fill);

  // ---- table: dark walnut with a little grain
  function woodTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
    g.fillStyle = '#2B231C'; g.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 520; i++) { g.strokeStyle = 'rgba(' + (i % 2 ? '66,50,38' : '22,16,12') + ',' + (0.04 + Math.random() * 0.08) + ')'; g.lineWidth = 1 + Math.random() * 3; g.beginPath(); const y = Math.random() * 1024; g.moveTo(0, y); g.bezierCurveTo(300, y + (Math.random() - .5) * 30, 700, y + (Math.random() - .5) * 30, 1024, y + (Math.random() - .5) * 14); g.stroke(); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(12, 12); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
  }
  const table = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.82, metalness: 0.02 }));
  table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);

  // ---- dice: a real rounded cube (3 boxes + 12 edge cylinders + 8 corner spheres) with pip decals
  const DIE = 0.63, R = 0.075;
  const DCOL = ['#C8372D', '#2F6DB5', '#E0B21F', '#3E8E4F', '#F2ECDA', '#2B2B2B'];
  const PIP = ['#FFFFFF', '#FFFFFF', '#1B1915', '#FFFFFF', '#1B1915', '#FFFFFF'];
  const pipCache = {};
  function pipTex(v, col) {
    const k = v + col; if (pipCache[k]) return pipCache[k];
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
    g.clearRect(0, 0, 256, 256); g.fillStyle = col;
    const P = { 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]], 5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] }[v];
    for (const [x, y] of P) { g.beginPath(); g.arc(58 + x * 70, 58 + y * 70, 22, 0, Math.PI * 2); g.fill(); }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; pipCache[k] = t; return t;
  }
  const bodyMats = DCOL.map((c) => new THREE.MeshStandardMaterial({ color: C(c), roughness: 0.32, metalness: 0.0 }));
  const edgeGeo = new THREE.CylinderGeometry(R, R, DIE - 2 * R, 14); const cornerGeo = new THREE.SphereGeometry(R, 14, 10);
  const boxA = new THREE.BoxGeometry(DIE, DIE - 2 * R, DIE - 2 * R), boxB = new THREE.BoxGeometry(DIE - 2 * R, DIE, DIE - 2 * R), boxC = new THREE.BoxGeometry(DIE - 2 * R, DIE - 2 * R, DIE);
  const pipGeo = new THREE.PlaneGeometry(DIE - 2 * R - 0.02, DIE - 2 * R - 0.02);
  function makeDie(colour, top, yaw) {
    const g = new THREE.Group(); const m = bodyMats[colour];
    for (const geo of [boxA, boxB, boxC]) { const b = new THREE.Mesh(geo, m); b.castShadow = true; b.receiveShadow = true; g.add(b); }
    const h = DIE / 2 - R;
    for (const [ax, sx, sy] of [['y', 1, 1], ['y', -1, 1], ['y', 1, -1], ['y', -1, -1], ['x', 1, 1], ['x', -1, 1], ['x', 1, -1], ['x', -1, -1], ['z', 1, 1], ['z', -1, 1], ['z', 1, -1], ['z', -1, -1]]) {
      const e = new THREE.Mesh(edgeGeo, m); e.castShadow = true;
      if (ax === 'y') e.position.set(sx * h, 0, sy * h);
      else if (ax === 'x') { e.rotation.z = Math.PI / 2; e.position.set(0, sx * h, sy * h); }
      else { e.rotation.x = Math.PI / 2; e.position.set(sx * h, sy * h, 0); }
      g.add(e);
    }
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) { const s = new THREE.Mesh(cornerGeo, m); s.position.set(sx * h, sy * h, sz * h); s.castShadow = true; g.add(s); }
    // faces: top = `top`, bottom = 7-top, sides from the rest with opposite pairs summing to 7
    const rest = [1, 2, 3, 4, 5, 6].filter((v) => v !== top && v !== 7 - top);
    const faces = { py: top, ny: 7 - top, pz: rest[0], nz: 7 - rest[0], px: rest[1], nx: 7 - rest[1] };
    const d = DIE / 2 + 0.002;
    const put = (v, pos, rot) => { const p = new THREE.Mesh(pipGeo, new THREE.MeshStandardMaterial({ map: pipTex(v, PIP[colour]), transparent: true, roughness: 0.5, depthWrite: false })); p.position.copy(pos); p.rotation.set(rot[0], rot[1], rot[2]); g.add(p); };
    put(faces.py, new THREE.Vector3(0, d, 0), [-Math.PI / 2, 0, 0]);
    put(faces.ny, new THREE.Vector3(0, -d, 0), [Math.PI / 2, 0, 0]);
    put(faces.pz, new THREE.Vector3(0, 0, d), [0, 0, 0]);
    put(faces.nz, new THREE.Vector3(0, 0, -d), [0, Math.PI, 0]);
    put(faces.px, new THREE.Vector3(d, 0, 0), [0, Math.PI / 2, 0]);
    put(faces.nx, new THREE.Vector3(-d, 0, 0), [0, -Math.PI / 2, 0]);
    g.rotation.y = yaw || 0;
    return g;
  }

  // ---- crew sheet: 3.5 x 2.5 card, 0.03 thick
  const SW = 3.5, SD = 2.5, ST = 0.03;
  const sheetTex = []; for (let i = 0; i < 6; i++) sheetTex.push(await tex('sheet-' + i + '.jpg'));
  const cream = new THREE.MeshStandardMaterial({ color: C('#E9E3D1'), roughness: 0.75 });
  function makeSheet(i) {
    const mats = [cream, cream, new THREE.MeshStandardMaterial({ map: sheetTex[i], roughness: 0.68 }), cream, cream, cream];
    const m = new THREE.Mesh(new THREE.BoxGeometry(SW, ST, SD), mats); m.castShadow = true; m.receiveShadow = true; m.position.y = ST / 2; return m;
  }
  // slot centres in sheet-local x/z (measured off the texture; texture is 384 px/in)
  const CREW_X = [0.68 - 1.75, 1.385 - 1.75, 2.09 - 1.75], CREW_Z = 1.125 - 1.25, PAY_Z = 1.79 - 1.25, OWN = [2.855 - 1.75, 1.46 - 1.25];
  // place a die on a sheet at local (x,z); returns a world-positioned group added to the sheet's parent
  function dieOnSheet(sheet, colour, v, lx, lz, yaw) {
    const d = makeDie(colour, v, yaw); d.position.set(lx, ST + DIE / 2, lz); sheet.add(d); return d;
  }

  // ---- the box: 7 x 1.6 x 5, lid on
  const BW = 7, BH = 1.6, BD = 5;
  const tTop = await tex('box-top.jpg'), tSide = await tex('box-side.jpg'), tEnd = await tex('box-end.jpg');
  function makeBox() {
    const mats = [
      new THREE.MeshStandardMaterial({ map: tEnd, roughness: 0.55 }), new THREE.MeshStandardMaterial({ map: tEnd, roughness: 0.55 }),
      new THREE.MeshStandardMaterial({ map: tTop, roughness: 0.5 }), new THREE.MeshStandardMaterial({ color: C('#1B1915'), roughness: 0.8 }),
      new THREE.MeshStandardMaterial({ map: tSide, roughness: 0.55 }), new THREE.MeshStandardMaterial({ map: tSide, roughness: 0.55 }),
    ];
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BD), mats); body.castShadow = true; body.receiveShadow = true; body.position.y = BH / 2; g.add(body);
    // a lid seam
    const seam = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.012, 0.02, BD + 0.012), new THREE.MeshStandardMaterial({ color: C('#0E0C0A'), roughness: 0.9 })); seam.position.y = BH * 0.72; g.add(seam);
    return g;
  }

  // the box standing on its long bottom edge, cover facing +z; footprint x in [-BW/2, BW/2], z in [-BH/2, BH/2], height BD
  function makeStandingBox() {
    const outer = new THREE.Group(), g = makeBox();
    // the long side that ends up on top would read upside down from the front: turn its print round
    const up = tSide.clone(); up.center.set(0.5, 0.5); up.rotation = Math.PI; up.needsUpdate = true;
    g.children[0].material[5] = new THREE.MeshStandardMaterial({ map: up, roughness: 0.55 });
    g.rotation.x = Math.PI / 2; g.position.set(0, BD / 2, -BH / 2); outer.add(g); return outer;
  }
  // a point in front of a standing box: t along its width from its left edge, off = distance out from its cover
  const frontOf = (box, t, off) => { const c = Math.cos(box.rotation.y), sn = Math.sin(box.rotation.y), lx = -BW / 2 + t, lz = BH / 2 + off;
    return [box.position.x + lx * c + lz * sn, box.position.z - lx * sn + lz * c]; };
  // every object that sits on the table, for the overlap check
  const objs = [];
  const add = (o, name) => { o.name = name; scene.add(o); objs.push(o); return o; };

  const rnd = (seed) => { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; };


  // frame a world-space box: pick a view direction, then back the camera off until every corner fits
  function frame(min, max, elevDeg, azimDeg, margin) {
    const c = new THREE.Vector3((min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2);
    const el = elevDeg * Math.PI / 180, az = azimDeg * Math.PI / 180;
    const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    const corners = [];
    for (const x of [min[0], max[0]]) for (const y of [min[1], max[1]]) for (const z of [min[2], max[2]]) corners.push(new THREE.Vector3(x, y, z));
    let dist = 5;
    for (let it = 0; it < 60; it++) {
      camera.position.copy(c).addScaledVector(dir, dist); camera.lookAt(c); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
      let ok = true;
      for (const p of corners) { const v = p.clone().project(camera); if (Math.abs(v.x) > margin || Math.abs(v.y) > margin) { ok = false; break; } }
      if (ok) break; dist *= 1.06;
    }
  }

  // ================================================================ scenes
  if (SCENE === 'hero') {
    // the box standing at the back left, a crew sheet mid-job front right, five loose dice in a row before the box
    const box = add(makeStandingBox(), 'box'); box.position.set(-2.6, 0, -2.2); box.rotation.y = 0.3;
    const s = add(makeSheet(2), 'crew sheet'); s.position.set(3.4, 0, 1.6); s.rotation.y = -0.16;
    dieOnSheet(s, 1, 2, CREW_X[0], CREW_Z, 0); dieOnSheet(s, 2, 4, CREW_X[1], CREW_Z, 0); dieOnSheet(s, 3, 6, CREW_X[2], CREW_Z, 0);
    // cut slots stay empty: dice in back-to-back slots read as touching from any table-height camera
    dieOnSheet(s, 0, 2, OWN[0], OWN[1], 0);
    const r = rnd(7);
    [[0.9, 4, 6], [2.2, 5, 2], [3.5, 3, 5], [4.8, 1, 1], [6.1, 0, 4]].forEach(([t, c, v], k) => {
      const [x, z] = frontOf(box, t, 1.7); const d = add(makeDie(c, v, 0.3 + (r() - 0.5) * 0.5), 'die ' + (k + 1)); d.position.set(x, DIE / 2, z); });
    frame([-6.4, 0, -3.4], [5.4, 5.0, 3.2], 30, 9, 0.95);
  }

  if (SCENE === 'table') {
    // four crews around the table, sheets facing inward; the box stands at the far end, cover to camera
    const box = add(makeStandingBox(), 'box'); box.position.set(0, 0, -9.4); box.rotation.y = 0;
    const seats = [
      { pos: [0, 0, 3.4], rot: 0, me: 0 },
      { pos: [4.7, 0, -0.2], rot: Math.PI / 2, me: 1 },
      { pos: [0, 0, -3.8], rot: Math.PI, me: 2 },
      { pos: [-4.7, 0, -0.2], rot: -Math.PI / 2, me: 3 },
    ];
    const r = rnd(3);
    const crewsFor = [[[1, 1], [3, 4], [2, 5]], [[0, 2], [2, 3], [3, 6]], [[3, 2], [1, 4], [0, 6]], [[2, 1], [0, 3], [1, 5]]];
    seats.forEach((st, k) => {
      const s = add(makeSheet([0, 1, 4, 5][k]), 'crew ' + (k + 1)); s.position.set(st.pos[0], 0, st.pos[2]); s.rotation.y = st.rot;
      crewsFor[k].forEach(([c, v], i) => dieOnSheet(s, c, v, CREW_X[i], CREW_Z, 0));
      dieOnSheet(s, st.me, 2, OWN[0], OWN[1], 0);
      // the rest of this player's hand in a row beside the sheet (local coords, clear of the card edge)
      [[2.35, -1.0], [2.35, -0.05], [2.35, 0.9]].forEach(([lx, lz], j) => dieOnSheet(s, st.me, [6, 5, 1][j], lx, lz, (r() - .5) * .24));
    });
    frame([-6.4, 0, -10.2], [6.4, 5.0, 5.4], 56, 0, 0.95);
  }

  if (SCENE === 'kit') {
    // what's in the box: the box standing at the left, six sheets in a 3x2 grid, six rows of eight dice
    const box = add(makeStandingBox(), 'box'); box.position.set(-5.4, 0, -3.6); box.rotation.y = 0.12;
    for (let i = 0; i < 6; i++) { const s = add(makeSheet(i), 'sheet ' + (i + 1)); s.position.set(1.9 + (i % 3) * 3.8, 0, -5.6 + Math.floor(i / 3) * 2.85); }
    for (let c = 0; c < 6; c++) for (let k = 0; k < 8; k++) { const d = add(makeDie(c, ((c * 3 + k) % 6) + 1, 0), 'die ' + c + '-' + k); d.position.set(-1.3 + k * 1.0, DIE / 2, -0.2 + c * 1.25); }
    frame([-9.0, 0, -7.0], [9.6, 5.0, 6.4], 46, 0, 0.97);
  }

  let checkObjs = null, checkHide = [];
  let vignette = null;
  if (SCENE === 'themed') {
    // ---- a quiet card table: deep green felt, one soft overhead pool of light, a gentle vignette
    scene.remove(table); scene.fog = null; scene.background = C('#0B1611');
    hemi.color = C('#FFF1DC'); hemi.groundColor = C('#2A3A30'); hemi.intensity = 0.1;
    key.intensity = 0.22; key.position.set(4, 10, 12); rim.intensity = 0.1; fill.intensity = 0.2; fill.position.set(-3, 5, 12);
    key.castShadow = false;
    const pool = new THREE.SpotLight(0xfff0dc, 2.6, 0, 0.62, 1.0, 0); pool.position.set(-6.5, 21, -5.5); pool.target.position.set(-0.2, 0, 0.6);
    pool.castShadow = true; pool.shadow.mapSize.set(4096, 4096); pool.shadow.radius = 9; pool.shadow.bias = -0.0004;
    Object.assign(pool.shadow.camera, { near: 8, far: 40 }); scene.add(pool); scene.add(pool.target);

    function feltTexture() {
      const N = 2048, c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
      g.fillStyle = '#2C6A48'; g.fillRect(0, 0, N, N);
      const r = rnd(17);
      // soft mottling
      for (let i = 0; i < 200; i++) { const x0 = r() * N, y0 = r() * N, rad = 60 + r() * 200, a = 0.012 + r() * 0.016, col = r() < 0.5 ? '255,255,240' : '0,12,6';
        for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) { const x = x0 + ox, y = y0 + oy; if (x + rad < 0 || x - rad > N || y + rad < 0 || y - rad > N) continue;
          const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, 'rgba(' + col + ',' + a + ')'); gr.addColorStop(1, 'rgba(' + col + ',0)'); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); } }
      // fine fibres
      for (let i = 0; i < 140000; i++) { g.fillStyle = 'rgba(' + (r() < 0.4 ? '120,190,150' : '0,14,8') + ',' + (0.02 + r() * 0.035) + ')'; const x = r() * N, y = r() * N, a = r() * Math.PI; g.save(); g.translate(x, y); g.rotate(a); g.fillRect(0, 0, 2 + r() * 5, 1); g.restore(); }
      const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(12, 12); t.encoding = THREE.sRGBEncoding; t.anisotropy = 16; return t;
    }
    const felt = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshLambertMaterial({ map: feltTexture() }));
    felt.rotation.x = -Math.PI / 2; felt.receiveShadow = true; scene.add(felt); checkHide.push(felt);

    const box = add(makeStandingBox(), 'box'); box.position.set(-2.4, 0, -1.6); box.rotation.y = 0.2;
    const s = add(makeSheet(2), 'crew sheet'); s.position.set(4.6, 0, 1.2); s.rotation.y = -0.14;
    // six crooks' dice in an even row in front of the box
    const r = rnd(5);
    [[0.6, 4, 6], [1.75, 5, 2], [2.9, 3, 5], [4.05, 1, 1], [5.2, 0, 4], [6.35, 2, 3]].forEach(([t, c, v], i) => {
      const [x, z] = frontOf(box, t, 1.8); const d = add(makeDie(c, v, 0.2 + (r() - 0.5) * 0.4), 'die ' + (i + 1)); d.position.set(x, DIE / 2, z);
    });
    frame([-6.2, 0, -2.6], [6.6, 5.0, 2.8], 28, 4, 0.95);

    // gentle screen-space vignette (drawn over the final frame only; not part of the overlap check)
    const vc = document.createElement('canvas'); vc.width = 512; vc.height = 320; const vg = vc.getContext('2d');
    const gr = vg.createRadialGradient(256, 150, 60, 256, 160, 330); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.08)'); gr.addColorStop(1, 'rgba(0,0,0,0.58)');
    vg.fillStyle = gr; vg.fillRect(0, 0, 512, 320);
    const vt = new THREE.CanvasTexture(vc);
    vignette = { scene: new THREE.Scene(), cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1) };
    vignette.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: vt, transparent: true, depthTest: false, depthWrite: false })));
  }
  const draw = () => { renderer.autoClear = true; renderer.render(scene, camera); if (vignette) { renderer.autoClear = false; renderer.render(vignette.scene, vignette.cam); renderer.autoClear = true; } };

  checkObjs = objs; if (SCENE !== 'themed') checkHide.push(table);
  draw();
  if (checkObjs.length && q.get('check')) {
    // per-object silhouettes: render each object alone in flat white, then compare masks pairwise
    const gl = renderer.getContext(), PW = gl.drawingBufferWidth, PH = gl.drawingBufferHeight;
    const bg = scene.background; scene.background = new THREE.Color(0x000000);
    checkHide.forEach((o) => (o.visible = false)); scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const buf = new Uint8Array(PW * PH * 4), masks = [];
    for (let i = 0; i < checkObjs.length; i++) {
      checkObjs.forEach((o, j) => (o.visible = j === i)); renderer.render(scene, camera);
      gl.readPixels(0, 0, PW, PH, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      const m = new Uint8Array(PW * PH); let n = 0, x0 = PW, x1 = -1, y0 = PH, y1 = -1;
      for (let k = 0; k < PW * PH; k++) if (buf[k * 4] > 20) { m[k] = 1; n++; const x = k % PW, y = (k / PW) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      masks.push({ name: checkObjs[i].name, m, n, bb: [x0, x1, y0, y1] });
    }
    checkObjs.forEach((o) => (o.visible = true)); checkHide.forEach((o) => (o.visible = true)); scene.overrideMaterial = null; scene.background = bg;
    const RD = 3;
    // masks and their 3 px dilations are only ever read inside bounding boxes, so this stays quick with many objects
    const dilate = (o) => { const [bx0, bx1, by0, by1] = o.bb, m = o.m, a = new Uint8Array(PW * PH), b = new Uint8Array(PW * PH);
      const X0 = Math.max(0, bx0 - RD), X1 = Math.min(PW - 1, bx1 + RD), Y0 = Math.max(0, by0 - RD), Y1 = Math.min(PH - 1, by1 + RD);
      for (let y = Y0; y <= Y1; y++) for (let x = X0; x <= X1; x++) { let v = 0; for (let dx = -RD; dx <= RD && !v; dx++) { const xx = x + dx; if (xx >= 0 && xx < PW && m[y * PW + xx]) v = 1; } a[y * PW + x] = v; }
      for (let y = Y0; y <= Y1; y++) for (let x = X0; x <= X1; x++) { let v = 0; for (let dy = -RD; dy <= RD && !v; dy++) { const yy = y + dy; if (yy >= 0 && yy < PH && a[yy * PW + x]) v = 1; } b[y * PW + x] = v; }
      return b; };
    const res = { objects: masks.length, names: masks.map((o) => o.name), overlap: [], near: [], cut: [], empty: [], gaps: {} };
    masks.forEach((o) => { if (!o.n) res.empty.push(o.name); });
    const dil = masks.map((o) => (o.n ? dilate(o) : null));
    for (let i = 0; i < masks.length; i++) for (let j = i + 1; j < masks.length; j++) {
      const A = masks[i], B = masks[j]; if (!A.n || !B.n) continue;
      const X0 = Math.max(A.bb[0] - RD, B.bb[0]), X1 = Math.min(A.bb[1] + RD, B.bb[1]), Y0 = Math.max(A.bb[2] - RD, B.bb[2]), Y1 = Math.min(A.bb[3] + RD, B.bb[3]);
      if (X0 > X1 || Y0 > Y1) continue;
      let ov = 0, nr = 0; const DA = dil[i];
      for (let y = Y0; y <= Y1; y++) for (let x = X0; x <= X1; x++) { const k = y * PW + x; if (B.m[k]) { if (A.m[k]) ov++; else if (DA[k]) nr++; } }
      if (ov) res.overlap.push([A.name, B.name, ov]); else if (nr) res.near.push([A.name, B.name, nr]);
    }
    masks.forEach((o) => { const m = o.m; let c = 0;
      for (let x = 0; x < PW; x++) { if (m[x]) c++; if (m[(PH - 1) * PW + x]) c++; }
      for (let y = 0; y < PH; y++) { if (m[y * PW]) c++; if (m[y * PW + PW - 1]) c++; }
      if (c) res.cut.push(o.name + ' (' + c + ' px)'); });
    window.__check = res;
  }
  // a second pass so shadow maps settle
  await new Promise((r) => setTimeout(r, 50)); draw();
  window.__done = true;
})();
