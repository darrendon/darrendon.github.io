<!DOCTYPE html>

<script>
/* Too Many Crooks! — still renders. Units are inches. ?scene=hero|table|kit|themed  &w=1600&h=1000
   themed = noir heist-planning desk (blueprint under a hanging lamp). &check=1 runs the per-object overlap check -> window.__check */
(async function () {
  const q = new URLSearchParams(location.search);
  const SCENE = q.get('scene') || 'hero', W = +q.get('w') || 1600, H = +q.get('h') || 1000;
  const TEX = '/games/too-many-crooks/img/src/tex/';
  const C = (h) => new THREE.Color(h).convertSRGBToLinear();
  const loader = new THREE.TextureLoader();
  const tex = (n) => new Promise((res, rej) => loader.load(TEX + n, (t) => { t.anisotropy = 16; t.encoding = THREE.sRGBEncoding; res(t); }, undefined, rej));

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = C('#1E252A');
  scene.fog = new THREE.Fog(C('#1E252A'), 26, 48);
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);

  // ---- lights (same rig as the Dim Sum Rush mockup, warmed a touch)
  const hemi = new THREE.HemisphereLight(0xfff3e2, 0x8a7458, 0.62); scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfff1dc, 1.05); key.position.set(7, 12, 7); key.castShadow = true;
  key.shadow.mapSize.set(4096, 4096); Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
  key.shadow.radius = 5; key.shadow.bias = -0.0005; scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd9a8, 0.38); rim.position.set(-9, 6, -8); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xdfe8ff, 0.18); fill.position.set(-5, 4, 9); scene.add(fill);

  // ---- table: dark walnut with a little grain
  function woodTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
    g.fillStyle = '#2B231C'; g.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 520; i++) { g.strokeStyle = 'rgba(' + (i % 2 ? '66,50,38' : '22,16,12') + ',' + (0.04 + Math.random() * 0.08) + ')'; g.lineWidth = 1 + Math.random() * 3; g.beginPath(); const y = Math.random() * 1024; g.moveTo(0, y); g.bezierCurveTo(300, y + (Math.random() - .5) * 30, 700, y + (Math.random() - .5) * 30, 1024, y + (Math.random() - .5) * 14); g.stroke(); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
  }
  const table = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.82, metalness: 0.02 }));
  table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);

  // ---- dice: a real rounded cube (3 boxes + 12 edge cylinders + 8 corner spheres) with pip decals
  const DIE = 0.63, R = 0.075;
  const DCOL = ['#C8372D', '#2F6DB5', '#E0B21F', '#3E8E4F', '#F2ECDA', '#2B2B2B'];
  const PIP = ['#FFFFFF', '#FFFFFF', '#1B1915', '#FFFFFF', '#1B1915', '#FFFFFF'];
  const pipCache = {};
  function pipTex(v, col) {
    const k = v + col; if (pipCache[k]) return pipCache[k];
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
    g.clearRect(0, 0, 256, 256); g.fillStyle = col;
    const P = { 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]], 5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] }[v];
    for (const [x, y] of P) { g.beginPath(); g.arc(58 + x * 70, 58 + y * 70, 22, 0, Math.PI * 2); g.fill(); }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; pipCache[k] = t; return t;
  }
  const bodyMats = DCOL.map((c) => new THREE.MeshStandardMaterial({ color: C(c), roughness: 0.32, metalness: 0.0 }));
  const edgeGeo = new THREE.CylinderGeometry(R, R, DIE - 2 * R, 14); const cornerGeo = new THREE.SphereGeometry(R, 14, 10);
  const boxA = new THREE.BoxGeometry(DIE, DIE - 2 * R, DIE - 2 * R), boxB = new THREE.BoxGeometry(DIE - 2 * R, DIE, DIE - 2 * R), boxC = new THREE.BoxGeometry(DIE - 2 * R, DIE - 2 * R, DIE);
  const pipGeo = new THREE.PlaneGeometry(DIE - 2 * R - 0.02, DIE - 2 * R - 0.02);
  function makeDie(colour, top, yaw) {
    const g = new THREE.Group(); const m = bodyMats[colour];
    for (const geo of [boxA, boxB, boxC]) { const b = new THREE.Mesh(geo, m); b.castShadow = true; b.receiveShadow = true; g.add(b); }
    const h = DIE / 2 - R;
    for (const [ax, sx, sy] of [['y', 1, 1], ['y', -1, 1], ['y', 1, -1], ['y', -1, -1], ['x', 1, 1], ['x', -1, 1], ['x', 1, -1], ['x', -1, -1], ['z', 1, 1], ['z', -1, 1], ['z', 1, -1], ['z', -1, -1]]) {
      const e = new THREE.Mesh(edgeGeo, m); e.castShadow = true;
      if (ax === 'y') e.position.set(sx * h, 0, sy * h);
      else if (ax === 'x') { e.rotation.z = Math.PI / 2; e.position.set(0, sx * h, sy * h); }
      else { e.rotation.x = Math.PI / 2; e.position.set(sx * h, sy * h, 0); }
      g.add(e);
    }
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) { const s = new THREE.Mesh(cornerGeo, m); s.position.set(sx * h, sy * h, sz * h); s.castShadow = true; g.add(s); }
    // faces: top = `top`, bottom = 7-top, sides from the rest with opposite pairs summing to 7
    const rest = [1, 2, 3, 4, 5, 6].filter((v) => v !== top && v !== 7 - top);
    const faces = { py: top, ny: 7 - top, pz: rest[0], nz: 7 - rest[0], px: rest[1], nx: 7 - rest[1] };
    const d = DIE / 2 + 0.002;
    const put = (v, pos, rot) => { const p = new THREE.Mesh(pipGeo, new THREE.MeshStandardMaterial({ map: pipTex(v, PIP[colour]), transparent: true, roughness: 0.5, depthWrite: false })); p.position.copy(pos); p.rotation.set(rot[0], rot[1], rot[2]); g.add(p); };
    put(faces.py, new THREE.Vector3(0, d, 0), [-Math.PI / 2, 0, 0]);
    put(faces.ny, new THREE.Vector3(0, -d, 0), [Math.PI / 2, 0, 0]);
    put(faces.pz, new THREE.Vector3(0, 0, d), [0, 0, 0]);
    put(faces.nz, new THREE.Vector3(0, 0, -d), [0, Math.PI, 0]);
    put(faces.px, new THREE.Vector3(d, 0, 0), [0, Math.PI / 2, 0]);
    put(faces.nx, new THREE.Vector3(-d, 0, 0), [0, -Math.PI / 2, 0]);
    g.rotation.y = yaw || 0;
    return g;
  }

  // ---- crew sheet: 3.5 x 2.5 card, 0.03 thick
  const SW = 3.5, SD = 2.5, ST = 0.03;
  const sheetTex = []; for (let i = 0; i < 6; i++) sheetTex.push(await tex('sheet-' + i + '.jpg'));
  const cream = new THREE.MeshStandardMaterial({ color: C('#E9E3D1'), roughness: 0.75 });
  function makeSheet(i) {
    const mats = [cream, cream, new THREE.MeshStandardMaterial({ map: sheetTex[i], roughness: 0.68 }), cream, cream, cream];
    const m = new THREE.Mesh(new THREE.BoxGeometry(SW, ST, SD), mats); m.castShadow = true; m.receiveShadow = true; m.position.y = ST / 2; return m;
  }
  // slot centres in sheet-local x/z (measured off the texture; texture is 384 px/in)
  const CREW_X = [0.68 - 1.75, 1.385 - 1.75, 2.09 - 1.75], CREW_Z = 1.125 - 1.25, PAY_Z = 1.79 - 1.25, OWN = [2.855 - 1.75, 1.46 - 1.25];
  // place a die on a sheet at local (x,z); returns a world-positioned group added to the sheet's parent
  function dieOnSheet(sheet, colour, v, lx, lz, yaw) {
    const d = makeDie(colour, v, yaw); d.position.set(lx, ST + DIE / 2, lz); sheet.add(d); return d;
  }

  // ---- the box: 7 x 1.6 x 5, lid on
  const BW = 7, BH = 1.6, BD = 5;
  const tTop = await tex('box-top.jpg'), tSide = await tex('box-side.jpg'), tEnd = await tex('box-end.jpg');
  function makeBox() {
    const mats = [
      new THREE.MeshStandardMaterial({ map: tEnd, roughness: 0.55 }), new THREE.MeshStandardMaterial({ map: tEnd, roughness: 0.55 }),
      new THREE.MeshStandardMaterial({ map: tTop, roughness: 0.5 }), new THREE.MeshStandardMaterial({ color: C('#1B1915'), roughness: 0.8 }),
      new THREE.MeshStandardMaterial({ map: tSide, roughness: 0.55 }), new THREE.MeshStandardMaterial({ map: tSide, roughness: 0.55 }),
    ];
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BD), mats); body.castShadow = true; body.receiveShadow = true; body.position.y = BH / 2; g.add(body);
    // a lid seam
    const seam = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.012, 0.02, BD + 0.012), new THREE.MeshStandardMaterial({ color: C('#0E0C0A'), roughness: 0.9 })); seam.position.y = BH * 0.72; g.add(seam);
    return g;
  }

  const rnd = (seed) => { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; };


  // frame a world-space box: pick a view direction, then back the camera off until every corner fits
  function frame(min, max, elevDeg, azimDeg, margin) {
    const c = new THREE.Vector3((min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2);
    const el = elevDeg * Math.PI / 180, az = azimDeg * Math.PI / 180;
    const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    const corners = [];
    for (const x of [min[0], max[0]]) for (const y of [min[1], max[1]]) for (const z of [min[2], max[2]]) corners.push(new THREE.Vector3(x, y, z));
    let dist = 5;
    for (let it = 0; it < 60; it++) {
      camera.position.copy(c).addScaledVector(dir, dist); camera.lookAt(c); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
      let ok = true;
      for (const p of corners) { const v = p.clone().project(camera); if (Math.abs(v.x) > margin || Math.abs(v.y) > margin) { ok = false; break; } }
      if (ok) break; dist *= 1.06;
    }
  }

  // ================================================================ scenes
  if (SCENE === 'hero') {
    const box = makeBox(); box.position.set(-2.2, 0, -1.6); box.rotation.y = 0.36; scene.add(box);
    // one crew sheet mid-job, front right
    const s = makeSheet(2); s.position.set(2.7, 0, 1.3); s.rotation.y = -0.16; scene.add(s);
    dieOnSheet(s, 1, 2, CREW_X[0], CREW_Z, 0); dieOnSheet(s, 2, 4, CREW_X[1], CREW_Z, 0); dieOnSheet(s, 3, 6, CREW_X[2], CREW_Z, 0);
    // cut slots stay empty: dice in back-to-back slots read as touching from any table-height camera
    dieOnSheet(s, 0, 2, OWN[0], OWN[1], 0);
    // a few loose dice on the table in front of the box, spaced so nothing touches
    const r = rnd(7);
    // five dice in a loose row parallel to the box's front edge, well clear of it so nothing reads as touching from the camera
    const ca = Math.cos(0.36), sa = Math.sin(0.36);
    const edge = (t, off) => [-2.2 - 3.5 * ca + 2.5 * sa + t * ca + off * sa, -1.6 + 3.5 * sa + 2.5 * ca - t * sa + off * ca];
    const loose = [[0.4, 2.0, 4, 6], [1.3, 1.85, 5, 2], [2.2, 2.0, 3, 5], [3.1, 1.85, 1, 1], [4.0, 2.0, 0, 4]];
    for (const [t, off, c, v] of loose) { const [x, z] = edge(t, off); const d = makeDie(c, v, 0.36 + (r() - 0.5) * 0.5); d.position.set(x, DIE / 2, z); scene.add(d); }
    frame([-6.4, 0, -4.2], [4.7, 1.6, 3.6], 46, 9, 0.96);
  }

  if (SCENE === 'table') {
    // four crews around the table, sheets facing inward; box parked at the back
    const box = makeBox(); box.position.set(-0.6, 0, -8.6); box.rotation.y = 0.12; scene.add(box);
    const seats = [
      { pos: [0, 0, 3.4], rot: 0, me: 0 },
      { pos: [4.7, 0, -0.2], rot: Math.PI / 2, me: 1 },
      { pos: [0, 0, -3.8], rot: Math.PI, me: 2 },
      { pos: [-4.7, 0, -0.2], rot: -Math.PI / 2, me: 3 },
    ];
    const r = rnd(3);
    const crewsFor = [[[1, 1], [3, 4], [2, 5]], [[0, 2], [2, 3], [3, 6]], [[3, 2], [1, 4], [0, 6]], [[2, 1], [0, 3], [1, 5]]];
    seats.forEach((st, k) => {
      const s = makeSheet([0, 1, 4, 5][k]); s.position.set(st.pos[0], 0, st.pos[2]); s.rotation.y = st.rot; scene.add(s);
      crewsFor[k].forEach(([c, v], i) => dieOnSheet(s, c, v, CREW_X[i], CREW_Z, 0));
      dieOnSheet(s, st.me, 2, OWN[0], OWN[1], 0);
      // the rest of this player's hand in a row beside the sheet (local coords, clear of the card edge)
      [[2.35, -1.0], [2.35, -0.05], [2.35, 0.9]].forEach(([lx, lz], j) => dieOnSheet(s, st.me, [6, 5, 1][j], lx, lz, (r() - .5) * .24));
    });
    frame([-6.2, 0, -11.3], [6.2, 1.6, 5.2], 84, 0, 0.95);
  }

  if (SCENE === 'kit') {
    // what's in the box: lid top-left, six sheets in a 3x2 grid, six rows of eight dice
    const box = makeBox(); box.position.set(-4.6, 0, -4.4); scene.add(box);
    for (let i = 0; i < 6; i++) { const s = makeSheet(i); s.position.set(1.3 + (i % 3) * 3.8, 0, -5.6 + Math.floor(i / 3) * 2.85); scene.add(s); }
    for (let c = 0; c < 6; c++) for (let k = 0; k < 8; k++) { const d = makeDie(c, ((c * 3 + k) % 6) + 1, 0); d.position.set(-1.6 + k * 0.86, DIE / 2, -0.6 + c * 0.9); scene.add(d); }
    frame([-8.2, 0, -7.0], [9.0, 1.6, 4.4], 56, 0, 0.97);
  }

  let checkObjs = null, checkHide = [];
  if (SCENE === 'themed') {
    // ---- a heist-planning desk: The Night Bank's blueprint spread out under one hanging lamp
    scene.remove(table); scene.fog = null; scene.background = C('#070B11');
    hemi.intensity = 0.11; key.intensity = 0; key.castShadow = false; rim.intensity = 0.14; fill.intensity = 0.0;
    const front = new THREE.SpotLight(0xffe8c8, 0.42, 0, 0.3, 1.0); front.position.set(-1.2, 9, 22); front.target.position.set(-2.4, 0.8, -1.2); scene.add(front); scene.add(front.target);
    const lamp = new THREE.SpotLight(0xffdcaa, 2.5, 0, 0.385, 1.0); lamp.position.set(-0.6, 24, 0.4); lamp.target.position.set(-0.6, 0, 0.6);
    lamp.castShadow = true; lamp.shadow.mapSize.set(4096, 4096); lamp.shadow.radius = 6; lamp.shadow.bias = -0.0004;
    Object.assign(lamp.shadow.camera, { near: 10, far: 40 }); scene.add(lamp); scene.add(lamp.target);

    // the blueprint (a 40 x 40 in sheet that fills the whole frame — it is the table surface here)
    function blueprint() {
      const N = 4096, S = N / 40, c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
      const X = (x) => (x + 20) * S, Z = (z) => (z + 20) * S, L = (v) => v * S;
      g.fillStyle = '#1A4270'; g.fillRect(0, 0, N, N);
      const r = rnd(11);
      for (let i = 0; i < 26000; i++) { g.fillStyle = 'rgba(' + (r() < 0.5 ? '255,255,255' : '0,10,30') + ',' + (0.02 + r() * 0.05) + ')'; g.fillRect(r() * N, r() * N, 2 + r() * 5, 2 + r() * 5); }
      // grid
      g.strokeStyle = 'rgba(205,228,255,0.055)'; g.lineWidth = 2;
      for (let v = -20; v <= 20; v += 0.5) { g.beginPath(); g.moveTo(X(v), 0); g.lineTo(X(v), N); g.stroke(); g.beginPath(); g.moveTo(0, Z(v)); g.lineTo(N, Z(v)); g.stroke(); }
      g.strokeStyle = 'rgba(205,228,255,0.1)'; g.lineWidth = 3;
      for (let v = -20; v <= 20; v += 2) { g.beginPath(); g.moveTo(X(v), 0); g.lineTo(X(v), N); g.stroke(); g.beginPath(); g.moveTo(0, Z(v)); g.lineTo(N, Z(v)); g.stroke(); }
      const ink = 'rgba(226,238,255,0.6)', soft = 'rgba(226,238,255,0.36)';
      const wall = (pts, w) => { g.strokeStyle = ink; g.lineWidth = L(w || 0.11); g.lineJoin = 'miter'; g.beginPath(); pts.forEach(([x, z], i) => (i ? g.lineTo(X(x), Z(z)) : g.moveTo(X(x), Z(z)))); g.stroke(); };
      const thin = (pts, a, dash) => { g.strokeStyle = a || soft; g.lineWidth = L(0.035); g.setLineDash(dash || []); g.beginPath(); pts.forEach(([x, z], i) => (i ? g.lineTo(X(x), Z(z)) : g.moveTo(X(x), Z(z)))); g.stroke(); g.setLineDash([]); };
      const door = (x, z, rad, a0, a1) => { g.strokeStyle = soft; g.lineWidth = L(0.03); g.beginPath(); g.moveTo(X(x), Z(z)); g.arc(X(x), Z(z), L(rad), a0, a1); g.closePath(); g.stroke(); };
      const label = (t, x, z, size, a) => { g.fillStyle = a || 'rgba(226,238,255,0.5)'; g.font = '600 ' + L(size) + 'px "Courier New", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t.split('').join(String.fromCharCode(8202)), X(x), Z(z)); };
      // outer walls of the bank, with gaps for doors
      wall([[-12, -9], [12, -9], [12, 8.5], [2, 8.5]], 0.17); wall([[0, 8.5], [-12, 8.5], [-12, -9]], 0.17);
      // interior walls
      wall([[-12, -2.5], [-5, -2.5]]); wall([[-3.6, -2.5], [3, -2.5]]); wall([[4.4, -2.5], [12, -2.5]]);
      wall([[3.7, -9], [3.7, -5.6]]); wall([[3.7, -4.2], [3.7, -2.5]]);
      wall([[-4.2, -9], [-4.2, -2.5]]);
      wall([[6.5, -2.5], [6.5, 2.4]]); wall([[6.5, 3.8], [6.5, 8.5]]);
      // teller counter
      thin([[-9.5, 1.2], [3.6, 1.2]], ink); thin([[-9.5, 1.5], [3.6, 1.5]], ink);
      for (let x = -8.5; x < 3.6; x += 2.2) thin([[x, 1.2], [x, 0.4]]);
      // doors
      door(-5, -2.5, 1.4, Math.PI, Math.PI * 1.5); door(3, -2.5, 1.4, -Math.PI / 2, 0); door(3.7, -5.6, 1.4, Math.PI / 2, Math.PI);
      door(6.5, 2.4, 1.4, Math.PI / 2, Math.PI); door(2, 8.5, 2, Math.PI, Math.PI * 1.5);
      // the vault: a round door in a thick-walled room
      wall([[5.0, -8.2], [11.2, -8.2], [11.2, -3.2], [5.0, -3.2], [5.0, -8.2]], 0.24);
      g.strokeStyle = ink; g.lineWidth = L(0.1); g.beginPath(); g.arc(X(8.1), Z(-5.7), L(1.5), 0, Math.PI * 2); g.stroke();
      g.lineWidth = L(0.04); g.beginPath(); g.arc(X(8.1), Z(-5.7), L(1.05), 0, Math.PI * 2); g.stroke();
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; thin([[8.1 + Math.cos(a) * 0.3, -5.7 + Math.sin(a) * 0.3], [8.1 + Math.cos(a) * 1.0, -5.7 + Math.sin(a) * 1.0]]); }
      // dimension lines
      thin([[-12, -10.2], [12, -10.2]]); thin([[-12, -10.5], [-12, -9.9]]); thin([[12, -10.5], [12, -9.9]]); label('84\'-0"', 0, -10.55, 0.34);
      thin([[13.2, -9], [13.2, 8.5]]); thin([[12.9, -9], [13.5, -9]]); thin([[12.9, 8.5], [13.5, 8.5]]);
      // room names
      label('VAULT', 8.1, -3.75, 0.36); label('MANAGER', -8, -6, 0.36); label('COUNTING ROOM', 0, -7.6, 0.36);
      label('LOBBY', -3, 5.2, 0.42); label('TELLERS', -3, -0.6, 0.36); label('LOADING DOCK', 9.3, 6.6, 0.36); label('ALLEY', 9.3, 10.0, 0.36);
      // title block, front left
      g.strokeStyle = ink; g.lineWidth = L(0.05); g.strokeRect(X(-19.4), Z(5.6), L(5.6), L(2.4));
      label('THE NIGHT BANK  ·  GROUND FLOOR', 0, -11.4, 0.4, 'rgba(226,238,255,0.6)');
      // the plan, in red grease pencil: in through the alley, past the tellers, to the vault
      g.strokeStyle = 'rgba(214,62,46,0.72)'; g.lineWidth = L(0.07); g.lineCap = 'round'; g.setLineDash([L(0.32), L(0.22)]);
      g.beginPath(); g.moveTo(X(9.6), Z(11.5)); g.bezierCurveTo(X(9.4), Z(8), X(7.6), Z(5), X(5.6), Z(3.1)); g.bezierCurveTo(X(4.2), Z(1.6), X(4.6), Z(-1.2), X(5.8), Z(-2.0)); g.bezierCurveTo(X(7.2), Z(-2.8), X(7.8), Z(-3.6), X(8.0), Z(-4.4)); g.stroke(); g.setLineDash([]);
      g.lineWidth = L(0.08); g.beginPath(); g.ellipse(X(8.1), Z(-5.7), L(2.1), L(1.85), -0.2, 0.3, Math.PI * 2.15); g.stroke();
      const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 16; return t;
    }
    const paper = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: blueprint(), roughness: 0.92 }));
    paper.rotation.x = -Math.PI / 2; paper.receiveShadow = true; scene.add(paper); checkHide.push(paper);

    // ---- props: a stack of cash bundles and a flashlight
    function billTex() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 446; const g = c.getContext('2d');
      g.fillStyle = '#D8DCC2'; g.fillRect(0, 0, 1024, 446);
      g.strokeStyle = '#4E6A4C'; g.lineWidth = 10; g.strokeRect(24, 24, 976, 398); g.lineWidth = 3; g.strokeRect(44, 44, 936, 358);
      g.strokeStyle = 'rgba(78,106,76,0.35)'; g.lineWidth = 1.5;
      for (let k = 0; k < 40; k++) { g.beginPath(); g.ellipse(512, 223, 140 + k * 2.2, 150 - k * 1.2, k * 0.08, 0, Math.PI * 2); g.stroke(); }
      g.fillStyle = '#E4E6D2'; g.beginPath(); g.ellipse(512, 223, 118, 140, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#4E6A4C';
      // a fedora-and-collar silhouette in the oval
      g.beginPath(); g.ellipse(512, 210, 46, 54, 0, 0, Math.PI * 2); g.fill();
      g.fillRect(430, 152, 164, 14); g.beginPath(); g.moveTo(462, 154); g.lineTo(472, 104); g.lineTo(552, 104); g.lineTo(562, 154); g.fill();
      g.beginPath(); g.moveTo(420, 352); g.quadraticCurveTo(430, 268, 512, 262); g.quadraticCurveTo(594, 268, 604, 352); g.fill();
      g.font = 'bold 74px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      for (const [x, y] of [[130, 108], [894, 108], [130, 340], [894, 340]]) g.fillText('100', x, y);
      g.font = 'bold 30px Georgia, serif'; g.fillText('THE NIGHT BANK', 270, 223); g.fillText('ONE HUNDRED', 754, 223);
      const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
    }
    function edgeTex(rows) {
      const c = document.createElement('canvas'); c.width = 256; c.height = 64; const g = c.getContext('2d');
      g.fillStyle = '#C9CEB2'; g.fillRect(0, 0, 256, 64);
      for (let i = 0; i < rows; i++) { g.fillStyle = i % 2 ? 'rgba(70,90,66,0.35)' : 'rgba(255,255,240,0.3)'; g.fillRect(0, i * 64 / rows, 256, 64 / rows * 0.5); }
      const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
    }
    function bandTex() {
      const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d');
      g.fillStyle = '#C8A55A'; g.fillRect(0, 0, 256, 512); g.fillStyle = '#5B3F1C';
      g.font = 'bold 54px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.save(); g.translate(128, 256); g.rotate(-Math.PI / 2); g.fillText('$10,000', 0, 0); g.restore();
      g.fillRect(0, 10, 256, 6); g.fillRect(0, 496, 256, 6);
      const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
    }
    const BL = 3.1, BWD = 1.32, BT = 0.24;
    const billMat = new THREE.MeshStandardMaterial({ map: billTex(), roughness: 0.85 });
    const edgeMat = new THREE.MeshStandardMaterial({ map: edgeTex(18), roughness: 0.9 });
    const bandMat = new THREE.MeshStandardMaterial({ map: bandTex(), roughness: 0.7 });
    const bandPlain = new THREE.MeshStandardMaterial({ color: C('#C8A55A'), roughness: 0.7 });
    function makeCash() {
      const g = new THREE.Group();
      [[0, 0, 0.0], [0.08, -0.05, 0.07], [-0.05, 0.04, -0.05]].forEach(([dx, dz, yaw], i) => {
        const b = new THREE.Group();
        const m = new THREE.Mesh(new THREE.BoxGeometry(BL, BT, BWD), [edgeMat, edgeMat, billMat, billMat, edgeMat, edgeMat]); m.castShadow = true; m.receiveShadow = true; b.add(m);
        const band = new THREE.Mesh(new THREE.BoxGeometry(0.62, BT + 0.012, BWD + 0.012), [bandPlain, bandPlain, bandMat, bandPlain, bandPlain, bandPlain]); band.castShadow = true; b.add(band);
        b.position.set(dx, BT / 2 + i * (BT + 0.006), dz); b.rotation.y = yaw; g.add(b);
      });
      return g;
    }
    function makeFlashlight() {
      const g = new THREE.Group(), axis = new THREE.Group(); g.add(axis);
      const black = new THREE.MeshStandardMaterial({ color: C('#23262B'), roughness: 0.34, metalness: 0.3 });
      const grip = new THREE.MeshStandardMaterial({ color: C('#3A3E45'), roughness: 0.5, metalness: 0.3 });
      const chrome = new THREE.MeshStandardMaterial({ color: C('#E4E7EC'), roughness: 0.2, metalness: 0.45 });
      const lens = new THREE.MeshStandardMaterial({ color: C('#FFF4D6'), roughness: 0.1, metalness: 0.2, emissive: C('#FFE9B0'), emissiveIntensity: 0.9 });
      const rT = 0.4, rH = 0.6, LEN = 5.4; g.scale.setScalar(0.72);
      const cyl = (r0, r1, len, x, m, seg) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, len, seg || 40), m); c.rotation.z = -Math.PI / 2; c.position.x = x; c.castShadow = true; c.receiveShadow = true; axis.add(c); return c; };
      cyl(rT, rT, 0.25, -LEN / 2 + 0.125, chrome);        // tail cap
      cyl(rT, rT, 3.2, -LEN / 2 + 0.25 + 1.6, black);    // barrel
      for (let k = 0; k < 9; k++) cyl(rT + 0.025, rT + 0.025, 0.1, -LEN / 2 + 0.7 + k * 0.22, grip, 32); // knurled rings
      cyl(rT, rH, 1.3, -LEN / 2 + 3.45 + 0.65, black);  // flared head
      const xt = -LEN / 2, xh = -LEN / 2 + 4.97;
      cyl(rH + 0.02, rH + 0.02, 0.22, xh - 0.11, chrome); // bezel
      const lz = new THREE.Mesh(new THREE.CircleGeometry(rH - 0.04, 40), lens); lz.rotation.y = Math.PI / 2; lz.position.x = xh + 0.004; axis.add(lz);
      const tip = new THREE.Object3D(); tip.position.x = xh + 0.12; axis.add(tip); const aim = new THREE.Object3D(); aim.position.x = xh + 10; axis.add(aim); g.userData = { tip, aim };
      const sw = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.1, 0.2), chrome); sw.position.set(0.7, rT + 0.03, 0); axis.add(sw);
      // rest on the table: tail cap and bezel both touch, so the axis tips up toward the head
      const th = Math.atan2(rH + 0.02 - rT, xh - xt); axis.rotation.z = th;
      axis.position.y = -xt * Math.sin(th) + rT * Math.cos(th);
      return g;
    }

    const objs = [];
    const add = (o, name) => { o.name = name; scene.add(o); objs.push(o); return o; };
    const box = add(makeBox(), 'box'); box.position.set(-2.6, 0, -1.7); box.rotation.y = 0.3;
    const s = add(makeSheet(2), 'crew sheet'); s.position.set(3.8, 0, 2.2); s.rotation.y = -0.16;
    const cash = add(makeCash(), 'cash'); cash.position.set(4.9, 0, -2.5); cash.rotation.y = -0.42;
    const torch = add(makeFlashlight(), 'flashlight'); torch.position.set(-6.4, 0, 3.0); torch.rotation.y = -0.5;
    // it's switched on: a soft cone of light thrown across the floor plan (a ground glow, not an object)
    torch.updateMatrixWorld(true);
    function beamTex() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const g = c.getContext('2d');
      g.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 160; k++) { const t = k / 159, x = 20 + t * 900, ry = 30 + t * 200, rx = 18 + t * 70, a = 0.03 * Math.pow(1 - t, 1.1) + 0.012;
        const gr = g.createRadialGradient(x, 256, 0, x, 256, ry); gr.addColorStop(0, 'rgba(255,255,255,' + a + ')'); gr.addColorStop(0.7, 'rgba(255,255,255,' + a * 0.5 + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; g.save(); g.translate(x, 256); g.scale(rx / ry, 1); g.translate(-x, -256); g.beginPath(); g.arc(x, 256, ry, 0, Math.PI * 2); g.fill(); g.restore(); }
      const t = new THREE.CanvasTexture(c); return t;
    }
    const tipW = new THREE.Vector3(); torch.userData.tip.getWorldPosition(tipW);
    const glow = new THREE.Group(), BEAM = 6.4; glow.position.set(tipW.x, 0.004, tipW.z); glow.rotation.y = torch.rotation.y;
    const gm = new THREE.Mesh(new THREE.PlaneGeometry(BEAM, BEAM * 0.5), new THREE.MeshBasicMaterial({ map: beamTex(), color: C('#FFE6B5'), transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
    gm.rotation.x = -Math.PI / 2; gm.position.x = BEAM / 2 - 0.1; glow.add(gm); scene.add(glow); checkHide.push(glow);
    // six crooks' dice in a loose row in front of the box
    const r = rnd(5), ca = Math.cos(0.3), sa = Math.sin(0.3);
    const edge = (t, off) => [-2.6 - 3.5 * ca + 2.5 * sa + t * ca + off * sa, -1.7 + 3.5 * sa + 2.5 * ca - t * sa + off * ca];
    [[1.2, 2.2, 4, 6], [2.15, 2.05, 5, 2], [3.1, 2.2, 3, 5], [4.05, 2.05, 1, 1], [5.0, 2.2, 0, 4], [5.95, 2.05, 2, 3]].forEach(([t, off, c, v], i) => {
      const [x, z] = edge(t, off); const d = add(makeDie(c, v, 0.3 + (r() - 0.5) * 0.5), 'die ' + (i + 1)); d.position.set(x, DIE / 2, z);
    });
    frame([-7.9, 0, -4.6], [6.9, 1.6, 4.5], 44, 6, 0.95);
    checkObjs = objs;
  }

  renderer.render(scene, camera);
  if (checkObjs && q.get('check')) {
    // per-object silhouettes: render each object alone in flat white, then compare masks pairwise
    const gl = renderer.getContext(), PW = gl.drawingBufferWidth, PH = gl.drawingBufferHeight;
    const bg = scene.background; scene.background = new THREE.Color(0x000000);
    checkHide.forEach((o) => (o.visible = false)); scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const buf = new Uint8Array(PW * PH * 4), masks = [];
    for (let i = 0; i < checkObjs.length; i++) {
      checkObjs.forEach((o, j) => (o.visible = j === i)); renderer.render(scene, camera);
      gl.readPixels(0, 0, PW, PH, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      const m = new Uint8Array(PW * PH); let n = 0; for (let k = 0; k < PW * PH; k++) if (buf[k * 4] > 20) { m[k] = 1; n++; }
      masks.push({ name: checkObjs[i].name, m, n });
    }
    checkObjs.forEach((o) => (o.visible = true)); checkHide.forEach((o) => (o.visible = true)); scene.overrideMaterial = null; scene.background = bg;
    const RD = 3;
    const dilate = (m) => { const a = new Uint8Array(PW * PH), b = new Uint8Array(PW * PH);
      for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) { let v = 0; for (let dx = -RD; dx <= RD && !v; dx++) { const xx = x + dx; if (xx >= 0 && xx < PW && m[y * PW + xx]) v = 1; } a[y * PW + x] = v; }
      for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) { let v = 0; for (let dy = -RD; dy <= RD && !v; dy++) { const yy = y + dy; if (yy >= 0 && yy < PH && a[yy * PW + x]) v = 1; } b[y * PW + x] = v; }
      return b; };
    const res = { objects: masks.length, names: masks.map((o) => o.name), overlap: [], near: [], cut: [], empty: [] };
    masks.forEach((o) => { if (!o.n) res.empty.push(o.name); });
    const dil = masks.map((o) => dilate(o.m));
    for (let i = 0; i < masks.length; i++) for (let j = i + 1; j < masks.length; j++) {
      let ov = 0, nr = 0; const A = masks[i].m, B = masks[j].m, DA = dil[i];
      for (let k = 0; k < PW * PH; k++) if (B[k]) { if (A[k]) ov++; else if (DA[k]) nr++; }
      if (ov) res.overlap.push([masks[i].name, masks[j].name, ov]); else if (nr) res.near.push([masks[i].name, masks[j].name, nr]);
    }
    masks.forEach((o) => { const m = o.m; let c = 0;
      for (let x = 0; x < PW; x++) { if (m[x]) c++; if (m[(PH - 1) * PW + x]) c++; }
      for (let y = 0; y < PH; y++) { if (m[y * PW]) c++; if (m[y * PW + PW - 1]) c++; }
      if (c) res.cut.push(o.name + ' (' + c + ' px)'); });
    window.__check = res;
  }
  // a second pass so shadow maps settle
  await new Promise((r) => setTimeout(r, 50)); renderer.render(scene, camera);
  window.__done = true;
})();
