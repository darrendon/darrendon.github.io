<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diggers — play in your browser</title>
<meta name="description" content="Diggers, a shedding lane battler of rival paleontologists. Play 2 to 4 players against bots in your browser.">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
/* Layout: field sheets laid out on the floor of a quarry — camps sit on the edges, dig sites are staked between neighboring camps, the season ledger sits in the middle; your rock face runs along the bottom. */
:root {
  --paper: #e9e0cb;
  --sheet: #f2ebdb;
  --rule: rgba(45, 74, 107, .10);
  --ink: #2a231a;
  --muted: #6b5d48;
  --line: #bfae8c;
  --bone: #efe5cc;
  --bone-edge: #8c7a5b;
  --bone-ink: #3a2e1f;
  --accent: #2d4a6b;
  --accent-ink: #f2ebdb;
  --accent-soft: rgba(45, 74, 107, .14);
  --p0: #2d4a6b;
  --p1: #7b2d2a;
  --p2: #3f6b4f;
  --p3: #9a6a12;
  --shadow: 0 1px 2px rgba(42, 35, 26, .25);
  --font-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --font-caps: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Spectral", "Iowan Old Style", Georgia, serif;
  --font-num: "Rye", "IM Fell English", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17130e; --sheet: #221c15; --rule: rgba(180, 160, 120, .07); --ink: #eadfc6; --muted: #b0a07f; --line: #4a3f2e;
    --bone: #e6dbc0; --bone-edge: #7a6a4e; --bone-ink: #2f2518;
    --accent: #9bb6d6; --accent-ink: #17130e; --accent-soft: rgba(155, 182, 214, .16);
    --p0: #9bb6d6; --p1: #d98b80; --p2: #8fc0a0; --p3: #e0b45a; --shadow: 0 1px 2px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17130e; --sheet: #221c15; --rule: rgba(180, 160, 120, .07); --ink: #eadfc6; --muted: #b0a07f; --line: #4a3f2e;
  --bone: #e6dbc0; --bone-edge: #7a6a4e; --bone-ink: #2f2518;
  --accent: #9bb6d6; --accent-ink: #17130e; --accent-soft: rgba(155, 182, 214, .16);
  --p0: #9bb6d6; --p1: #d98b80; --p2: #8fc0a0; --p3: #e0b45a; --shadow: 0 1px 2px rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  /* the page lies on a quarried badlands floor, strung with an excavation grid (painted by paintDigSite below) */
  background-color: #a27d57; background-size: 640px 640px;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
}
.wrap { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: flex; flex-direction: column; gap: 14px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 40px; line-height: 1; letter-spacing: .01em; }
h2 { font-size: 26px; line-height: 1.1; }
.eyebrow { font-family: var(--font-caps); font-size: 14px; letter-spacing: .06em; color: var(--muted); }
.sub { font-family: var(--font-display); font-style: italic; font-size: 16px; color: var(--muted); margin: 4px 0 0; max-width: 60ch; }
button { font-family: var(--font-body); font-size: 14px; font-weight: 600; border-radius: 3px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); padding: 9px 14px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:focus-visible, [data-act]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.status { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 2px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-height: 66px; }
.status .who { font-family: var(--font-display); font-size: 19px; line-height: 1.2; }
.status .hint { color: var(--muted); font-size: 13.5px; }

.table { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.cell { min-width: 0; }
.seat { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; border-top: 4px solid var(--pc); }
.seat.turn { box-shadow: 0 0 0 2px var(--pc); }
.seat .name { font-family: var(--font-display); font-size: 17px; line-height: 1.15; display: block; }
.seat .name .dot { margin-right: 6px; vertical-align: 2px; }
.seat .meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }
.seat .score { font-family: var(--font-body); font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pc); display: inline-block; flex-shrink: 0; }
.turnflag { font-family: var(--font-caps); font-size: 13px; letter-spacing: .05em; color: var(--pc); float: right; margin-left: 6px; }

.meld { display: flex; gap: 2px; flex-wrap: nowrap; justify-content: center; min-height: 40px; align-items: center; }
.empty-note { font-size: 12.5px; color: var(--muted); font-style: italic; }

.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; padding: 6px; }
.center .big { font-family: var(--font-num); font-size: 46px; line-height: 1; color: var(--accent); }
.center .small { font-size: 12.5px; color: var(--muted); }
.seasons { display: flex; gap: 4px; margin-top: 4px; }
.seasons span { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }
.seasons span.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* fossil cards: each face is one cell of a species' 3x3 fossil slab */
.card { position: relative; width: 32px; height: 45px; border-radius: 4px; background: #6d5a45 center / cover no-repeat; border: 1px solid rgba(20, 12, 4, .6); box-shadow: var(--shadow); flex-shrink: 0; overflow: hidden; }
.card .ix { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 12px; color: #fbf5e6; text-shadow: 1px 0 0 #1d140b, -1px 0 0 #1d140b, 0 1px 0 #1d140b, 0 -1px 0 #1d140b, 1px 1px 0 #1d140b, -1px -1px 0 #1d140b, 1px -1px 0 #1d140b, -1px 1px 0 #1d140b, 0 1px 3px rgba(0, 0, 0, .6); }
.card .ix b { font-family: var(--font-num); font-weight: 400; font-size: 12px; line-height: 1.05; }
.card .ix b.u { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 1px; text-decoration-color: #fbf5e6; }
.card .ix svg { width: 9px; height: 9px; display: block; fill: var(--suit); stroke: #1d140b; stroke-width: 1.2px; fill-rule: evenodd; overflow: visible; filter: drop-shadow(0 0 .6px #fbf5e6) drop-shadow(0 0 .6px #fbf5e6); }
.card .ix.tl { left: 2px; top: 2px; } .card .ix.tr { right: 2px; top: 2px; }
.card .ix.bl { left: 2px; bottom: 2px; transform: rotate(180deg); } .card .ix.br { right: 2px; bottom: 2px; transform: rotate(180deg); }
.card .ix.tr, .card .ix.bl, .card .ix.br { display: none; }
.hand .card .ix, .slab-grid .card .ix { display: flex; }
.card.edge { cursor: pointer; outline: 2px solid var(--accent); outline-offset: 1px; }
.hand .card { width: 46px; height: 64px; border-radius: 5px; cursor: pointer; transition: transform .12s ease; }
.hand .card .ix { min-width: 14px; } .hand .card .ix b { font-size: 15px; } .hand .card .ix svg { width: 11px; height: 11px; }
.hand .card.sel { transform: translateY(-8px); outline: 3px solid var(--accent); outline-offset: 1px; }
.hand .card.fresh-in { outline: 2px dashed var(--accent); outline-offset: 2px; }
.hand-wrap { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px;
  background-image: repeating-linear-gradient(180deg, transparent 0 17px, var(--rule) 17px 18px); }
.hand-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.hand { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; padding-top: 10px; min-height: 80px; }
.slot { width: 14px; height: 64px; border-radius: 3px; border: 2px dashed var(--accent); cursor: pointer; flex-shrink: 0; }
.slot:hover { background: var(--accent-soft); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.log { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 10px 14px; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.log .row { color: var(--muted); font-style: italic; }
.log .row b { color: var(--ink); font-weight: 600; font-style: normal; }
details.rules { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 10px 14px; font-size: 14px; }
details.rules summary { cursor: pointer; font-family: var(--font-display); font-size: 17px; }
details.rules ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; max-width: 65ch; }

.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--paper) 72%, transparent); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal { background: var(--sheet); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 2px; padding: 18px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
.modal p { margin: 0; font-size: 14px; color: var(--muted); }
.scores { width: 100%; border-collapse: collapse; font-variant-numeric: lining-nums tabular-nums; font-size: 14.5px; }
.scores th, .scores td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
.scores th { font-family: var(--font-caps); font-weight: 400; font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.scores td.num, .scores th.num { text-align: right; }

.setup { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choice { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 12px; font-weight: 400; }
.choice .n { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.choice .d { font-size: 12.5px; color: var(--muted); }
.choice.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
@media (max-width: 460px) {
  h1 { font-size: 34px; }
  .choices { grid-template-columns: 1fr; }
  .card { width: 19px; height: 27px; border-radius: 3px; }
  .card .ix { min-width: 9px; } .card .ix.tl { left: 2px; top: 1px; } .card .ix b { font-size: 10px; } .card .ix svg { display: none; }
  .hand .card { width: 40px; height: 56px; }
  .hand .card .ix { min-width: 12px; } .hand .card .ix.tl { left: 2px; top: 2px; }
  .hand .card .ix b { font-size: 13px; } .hand .card .ix svg { display: block; width: 10px; height: 10px; }
  .slot { height: 56px; }
  .seat { padding: 6px 7px; }
  .seat .name { font-size: 15px; }
  .seat .score { font-size: 19px; }
  .center .big { font-size: 36px; }
}
@media (prefers-reduced-motion: reduce) { .hand .card { transition: none; } }
.catalogue .cat-note { margin: 8px 0 12px; color: var(--muted); max-width: 62ch; }
.slabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 16px; }
.slab { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.slab-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.slab-grid .card { width: 100%; height: auto; aspect-ratio: 5 / 7; }
.slab-grid .card .ix { min-width: 13px; } .slab-grid .card .ix b { font-size: 14px; } .slab-grid .card .ix svg { width: 10px; height: 10px; }
.slab figcaption .sym { width: 18px; height: 18px; fill: var(--suit); stroke: #2a1e12; stroke-width: 1px; fill-rule: evenodd; vertical-align: -3px; margin-right: 6px; }
.slab figcaption { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 13px; }
.slab figcaption b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.slab figcaption span { color: var(--muted); font-style: italic; }
.slab ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px 6px; font-size: 11.5px; color: var(--muted); }
.slab ol li b { color: var(--ink); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }

/* ---- on the quarry floor: panels are paper laid on rock, dig sites are pits cut into it ---- */
:root { --rock: #a27d57; --pit-ink: #f3e8cf; --pit-muted: rgba(243, 232, 207, .72); --lift: 0 7px 18px -9px rgba(24, 12, 2, .7), 0 1px 0 rgba(24, 12, 2, .25); --glow: #f5c75a; }
:root[data-theme="dark"] { --rock: #2c2117; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rock: #2c2117; } }
body { background-color: var(--rock); }
.top { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 12px 14px; }
.top, .status, .seat, .hand-wrap, .log, details.rules, .setup, .center, .coach { box-shadow: var(--lift); }
.seat.turn { box-shadow: 0 0 0 2px var(--pc), var(--lift); }
.center { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; }

/* ---- field lessons (the tutorial) ---- */
.coach { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid #b8572f; border-radius: 2px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.coach .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.coach .pips { display: flex; gap: 4px; }
.coach .pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #b8572f; display: block; }
.coach .pips i.on { background: #b8572f; }
.coach h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.15; }
.coach p { margin: 0; font-size: 14.5px; max-width: 70ch; }
.coach .actions { margin-top: 4px; }
.coach button.link { background: none; border: none; padding: 9px 4px; color: var(--muted); font-weight: 400; text-decoration: underline; }
@keyframes tutpulse { 0%, 100% { outline-color: var(--glow); outline-offset: 1px; } 50% { outline-color: rgba(245, 199, 90, .35); outline-offset: 4px; } }
.card.tut, .slot.tut { outline: 3px solid var(--glow); outline-offset: 1px; animation: tutpulse 1.3s ease-in-out infinite; }
.slot.tut { background: rgba(245, 199, 90, .25); }
@keyframes lanepulse { 50% { box-shadow: inset 0 4px 12px rgba(0, 0, 0, .55), 0 0 0 6px rgba(245, 199, 90, .35); } }
.hand-wrap.tut-focus, .table.tut-focus .site { outline: 3px solid var(--glow); outline-offset: 3px; }
.tut-note { border-left: 3px solid #b8572f; padding-left: 10px; }
.setup .actions .tutbtn { background: #b8572f; border-color: #b8572f; color: #fbf3e2; }
@media (prefers-reduced-motion: reduce) { .card.tut, .slot.tut, .site.tut { animation: none; } }

/* ---- dig sites: a board lying between two camps; each camp has its own side of it ---- */
.seat.wide { grid-column: 1 / -1; justify-self: center; width: min(100%, 320px); }
.site { position: relative; display: grid; border-radius: 3px; overflow: hidden; color: var(--pit-ink); min-height: 132px;
  background: radial-gradient(120% 90% at 50% 40%, rgba(30, 18, 8, .5), rgba(30, 18, 8, .74));
  box-shadow: inset 0 4px 12px rgba(0, 0, 0, .55), 0 1px 0 rgba(255, 240, 210, .18); }
.site.h { grid-template-rows: 1fr auto 1fr; }
.site.v { grid-template-columns: 1fr auto 1fr; }
.site .side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 5px; min-width: 0; min-height: 44px; }
.site.h .side.a { border-top: 4px solid var(--pc); justify-content: flex-start; }
.site.h .side.b { border-bottom: 4px solid var(--pc); justify-content: flex-end; }
.site.v .side.a { border-left: 4px solid var(--pc); }
.site.v .side.b { border-right: 4px solid var(--pc); }
.site .side.held { background: color-mix(in srgb, var(--pc) 26%, transparent); }
.site .who .short { display: none; }
.site .who { font-family: var(--font-caps); font-size: 12px; letter-spacing: .04em; color: var(--pit-muted); text-align: center; line-height: 1.15; }
.site .held .who { color: var(--pit-ink); }
.site .what { font-size: 11.5px; font-style: italic; color: var(--pit-ink); text-align: center; line-height: 1.2; }
.site .meld { min-height: 0; flex-wrap: wrap; }
.site.v .meld { max-width: 76px; }
.site .board { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 8px; color: #3b230f; padding: 5px 10px;
  background: repeating-linear-gradient(0deg, rgba(110, 68, 30, .16) 0 1px, transparent 1px 5px), linear-gradient(#d2ab72, #c49a60 55%, #b48955);
  box-shadow: 0 2px 4px rgba(0, 0, 0, .55), inset 0 0 0 1.5px rgba(40, 22, 8, .8); }
.site .board::before, .site .board::after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #6f675d; box-shadow: inset -1px -1px 0 #2c2620; top: 50%; margin-top: -2.5px; }
.site .board::before { left: 4px; } .site .board::after { right: 4px; }
.site .board b { font-family: var(--font-num); font-weight: 400; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.site .board .fxtag { font-family: var(--font-caps); font-size: 11.5px; letter-spacing: .04em; white-space: nowrap; background: #3b230f; color: #f3e3c0; padding: 1px 7px 0; border-radius: 2px; }
.fxlegend { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid #b8572f; border-radius: 2px; padding: 10px 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 18px; box-shadow: var(--lift); }
.fxlegend .eyebrow { grid-column: 1 / -1; }
.fxlegend div { font-size: 13.5px; line-height: 1.35; }
.fxlegend b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.fxlegend span { display: block; color: var(--muted); }
.advtoggle { display: flex; gap: 12px; align-items: flex-start; text-align: left; font-weight: 400; padding: 12px; }
.advtoggle .box { flex: none; width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 3px; margin-top: 2px; display: grid; place-items: center; font-weight: 700; line-height: 1; }
.advtoggle.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.advtoggle.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.advtoggle b { font-family: var(--font-display); font-weight: 400; font-size: 18px; display: block; }
.advtoggle .d { font-size: 13px; color: var(--muted); }
.site .board .untouched { font-size: 11px; font-style: italic; color: rgba(59, 35, 15, .75); white-space: nowrap; }
.site.v .board { writing-mode: vertical-rl; transform: rotate(180deg); flex-direction: column; flex-wrap: nowrap; gap: 2px; padding: 12px 5px; background: repeating-linear-gradient(90deg, rgba(110, 68, 30, .16) 0 1px, transparent 1px 5px), linear-gradient(90deg, #d2ab72, #c49a60 55%, #b48955); }
.site.v .board::before { left: 50%; top: 4px; margin: 0 0 0 -2.5px; } .site.v .board::after { left: 50%; top: auto; bottom: 4px; right: auto; margin: 0 0 0 -2.5px; }
.site.far { filter: saturate(.75) brightness(.92); }
.site.target { cursor: pointer; box-shadow: inset 0 4px 12px rgba(0, 0, 0, .55), 0 0 0 3px var(--glow); }
.site.tut { animation: lanepulse 1.3s ease-in-out infinite; }
.site .card.edge { outline-color: var(--glow); }
@media (max-width: 460px) {
  .site { min-height: 112px; }
  .site .board { padding: 4px 6px; } .site .board b { font-size: 11.5px; letter-spacing: .04em; }
  .site.v .board { padding: 8px 3px; }
  .site .board .untouched:not(.farnote) { display: none; }
  .site .board .farnote { font-size: 9.5px; }
  .site .board .fxtag { font-size: 10px; padding: 1px 5px 0; }
  .site .who { font-size: 10.5px; } .site .what { font-size: 10px; }
  .site .who .full { display: none; } .site .who .short { display: inline; }
  .site.v .what { display: none; }
  .site.v .who { font-size: 10px; letter-spacing: .03em; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
  .site.v .meld { max-width: 44px; }
}

/* ---- online tables: lobby, table code, seats ---- */
.note { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 64ch; }
.note.warn, .netmsg { color: var(--p1); }
.netmsg { margin: 0; font-size: 14px; font-weight: 600; }

<body>
<div class="wrap" id="root"></div>

<script>
// ===================== FOSSIL ART =====================
// Each species is one fossil slab, 3 cards wide by 3 tall. Card v (1-9) is the slab cell in
// reading order: 1 2 3 / 4 5 6 / 7 8 9. Lay a species' nine cards out that way and the skeleton is whole.
const SPECIES = [
  { key: "rex", name: "Tyrannosaurus", rock: "red sandstone", suit: "#d23a2a", base: "#b2523a", bands: ["#c0603f", "#a5482f", "#cc6c48", "#b85a3d", "#a9503a"], seed: 11, sym: "M6.5 2.2C13.5 3.2 18.6 8.6 18.4 15.2C18.3 18.4 17.2 20.6 15.6 22.2L14.2 20.2L12.6 21.6L11.6 19.4L9.8 20.4C10.6 14.6 10 8 6.5 2.2Z" },
  { key: "tri", name: "Triceratops", rock: "blue slate", suit: "#3a7fc4", base: "#5a84ad", bands: ["#6690b9", "#4f79a2", "#729cc4", "#5a86af", "#6189b2"], seed: 23, sym: "M2.5 16.5C2.5 9.5 6.8 5 12 5C17.2 5 21.5 9.5 21.5 16.5L17.6 16.5L15 22L9 22L6.4 16.5ZM7.2 12.6L4.2 2.6L10 11ZM16.8 12.6L19.8 2.6L14 11ZM10.6 17.4L12 13.6L13.4 17.4Z" },
  { key: "stego", name: "Stegosaurus", rock: "green mudstone", suit: "#3fa155", base: "#5f9460", bands: ["#6aa16a", "#558a56", "#77ad74", "#5c935d", "#669b64"], seed: 37, sym: "M2 20H22V22.5H2ZM3.2 20C2.6 15.4 4 11.2 6.6 8.2C9.2 11.2 10.4 15.4 9.8 20ZM9.4 20C8.8 13.8 10.2 7.6 12.6 3C15.2 7.6 16.6 13.8 15.8 20ZM15.4 20C14.9 16 16 12.4 18.4 10C20.6 12.4 21.6 16 21 20Z" },
  { key: "bronto", name: "Brontosaurus", rock: "purple shale", suit: "#8a55c4", base: "#8a6aa8", bands: ["#9677b4", "#7e5f9c", "#a283bf", "#8768a5", "#9172ae"], seed: 41, sym: "M1.5 21.5C2 15.5 6.2 12.4 10.8 12.6C12.4 12.7 13.2 11 13.4 8.6C13.6 5.2 15.2 2.8 18.4 2.6L21.4 3.2L22.4 4.6L20.8 5.6L18.6 5.4C16.6 5.8 16.4 8.4 16.6 11.6C16.8 14.6 17.6 17.2 17.4 21.5L14.6 21.5L14.4 18L9.6 18L9.4 21.5L6.6 21.5L6.4 18.2C4.6 18.6 3.6 19.8 3.4 21.5Z" },
  { key: "ptera", name: "Pteranodon", rock: "golden limestone", suit: "#e0b52d", base: "#c4a14a", bands: ["#d0ad55", "#b8953f", "#dab863", "#c6a24b", "#bd9b45"], seed: 67, sym: "M0.8 15.4L11.2 11.2L13.4 9.8L21.6 2.2C22.4 1.6 23.4 2.4 22.8 3.2L17.2 10.4C18.6 11.8 18.6 14.6 16.8 16C15.2 17.2 12.8 17.2 10.8 16.8L0.8 15.4ZM14.6 12.2A1.3 1.3 0 1 0 14.61 12.2Z" },

const BONE_NAMES = ["Jaws", "Skull", "Tail", "Shoulder", "Ribs", "Hips", "Forefoot", "Hind leg", "Hind foot"];
const BONE_OVERRIDES = {
  rex: { 4: "Arm", 7: "Far foot" },
  tri: { 1: "Horns & beak", 2: "Frill" },
  stego: { 1: "Skull", 2: "Neck & plates", 3: "Thagomizer" },
  bronto: { 1: "Skull", 2: "Long neck", 3: "Whip tail" },
  ptera: { 1: "Wing", 2: "Skull", 3: "Wing" },

function boneName(sp, v) { const o = BONE_OVERRIDES[SPECIES[sp].key]; return (o && o[v]) || BONE_NAMES[v - 1]; }

const FossilArt = (() => {
  const WW = 300, WH = 420; // world units: 3 x 3 cells of 100 x 140
  const BONE = "#ece2c6", BONE_LO = "#b9a476", BONE_HI = "#faf3e1", OUTL = "#24190f", HOLE = "#2a1d12";

  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

    const out = [];

      for (let k = 0; k < n; k++) {
        const t = k / n, t2 = t * t, t3 = t2 * t;
        const f = j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);

      }
    }

  }
  function resample(pts, step) {
    const out = [pts[0]]; let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      let [x0, y0] = pts[i - 1]; const [x1, y1] = pts[i];
      let d = Math.hypot(x1 - x0, y1 - y0);
      while (acc + d >= step) { const r = (step - acc) / d; x0 = x0 + (x1 - x0) * r; y0 = y0 + (y1 - y0) * r; out.push([x0, y0]); d = Math.hypot(x1 - x0, y1 - y0); acc = 0; }
      acc += d;
    }
    return out;
  }
  function yAt(path, x) { let best = path[0]; for (const p of path) if (Math.abs(p[0] - x) < Math.abs(best[0] - x)) best = p; return best[1]; }
  function closedSmooth(ctx, pts) {
    const n = pts.length;
    ctx.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
    for (let i = 1; i <= n; i++) { const p = pts[i % n], q = pts[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }

  }

  const NEAR = { b: "#f7f0dc", lo: "#cbb68b", hi: "#fffcf3" }, FAR = { b: "#c9b893", lo: "#a08b63", hi: "#ddcfae" };
  function pen(ctx, mode, far = false) {
    const OW = 1.8;
    const P = { ctx, mode };

    P.line = (pts, w) => {
      const build = (dx = 0, dy = 0) => { ctx.beginPath(); ctx.moveTo(pts[0][0] + dx, pts[0][1] + dy); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] + dx, pts[i][1] + dy); };

        build(-w * 0.14, -w * 0.18); ctx.strokeStyle = BONE_HI; ctx.lineWidth = w * 0.22; ctx.stroke();
      }
    };
    const shape = (build, opts = {}) => {
      if (mode === "out") { ctx.beginPath(); build(); ctx.fillStyle = OUTL; ctx.fill(); ctx.strokeStyle = OUTL; ctx.lineWidth = OW; ctx.lineJoin = "round"; ctx.stroke(); }
      else if (mode === "fill") { ctx.beginPath(); build(); ctx.fillStyle = BONE; ctx.fill(); }
      else if (mode === "shade") {
        ctx.save(); ctx.beginPath(); build(); ctx.clip();
        ctx.translate(-1.4, -1.8); ctx.beginPath(); build(); ctx.strokeStyle = BONE_LO; ctx.lineWidth = opts.shadeW || 3.4; ctx.stroke();
        ctx.restore();
        ctx.save(); ctx.beginPath(); build(); ctx.clip();

    P.xf = (tx, ty, k, fn) => { ctx.save(); ctx.translate(tx, ty); ctx.scale(k, k); fn(); ctx.restore(); };
    return P;
  }

  // ---------- shared anatomy ----------
  function vert(P, pts, o) {
    const path = resample(spline(pts, 12), o.step);
    const L = path.length;
    path.forEach((p, i) => {
      const t = L > 1 ? i / (L - 1) : 0, s = o.size(t);
      const q = path[Math.min(i + 1, L - 1)], r = path[Math.max(i - 1, 0)];
      const a = Math.atan2(q[1] - r[1], q[0] - r[0]);

      const ch = o.chevron ? o.chevron(t) : 0;
      if (ch > 0.5 && i >= 3) P.line([[p[0], p[1]], [p[0] - nx * ch - tx * ch * 0.45, p[1] - ny * ch - ty * ch * 0.45]], Math.max(1.2, s * 0.24));
      const cr = o.cervical ? o.cervical(t) : 0;
      if (cr > 0.5) P.line([[p[0] - nx * s * 0.3, p[1] - ny * s * 0.3], [p[0] - nx * s * 0.6 + tx * cr, p[1] - ny * s * 0.6 + ty * cr]], 1.3);

  }
  function ribs(P, path, x0, x1, n, len, lean = 0.3, w = 4.2) {
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1), x = x0 + (x1 - x0) * t, y = yAt(path, x), L = len(t);
      P.line(spline([[x, y + 2], [x + L * lean, y + L * 0.42], [x + L * lean * 0.78, y + L * 0.78], [x + L * lean * 0.4, y + L]], 6), w * (1 - 0.3 * Math.abs(t - 0.4)));
    }
  }

  function gastralia(P, x0, x1, y, n) {
    for (let i = 0; i < n; i++) { const x = x0 + (x1 - x0) * i / (n - 1); P.line([[x - 7, y - 3], [x, y + 3], [x + 7, y - 3]], 1.8); }
  }
  function limb(P, pts, ws) {
    for (let i = 0; i < pts.length - 1; i++) P.line([pts[i], pts[i + 1]], ws[i]);
    for (let i = 0; i < pts.length - 1; i++) if (ws[i] >= 4.5) { P.knob(pts[i][0], pts[i][1], ws[i] * 0.62); P.knob(pts[i + 1][0], pts[i + 1][1], ws[i] * 0.55); }
  }
  function toes(P, x, y, dirs, len, w) { for (const d of dirs) { const ex = x + Math.cos(d) * len, ey = y + Math.sin(d) * len; P.line([[x, y], [(x + ex) / 2 + Math.sin(d) * 1.2, (y + ey) / 2 - Math.cos(d) * 1.2], [ex, ey]], w); } }
  const DOWN = Math.PI / 2, LEFT = Math.PI;

  // ---------- skulls (drawn in their own local units, then placed with xf) ----------
  const SKULL = {
    rex(P) {
      P.poly([[16, 63], [50, 67], [86, 65], [98, 61], [96, 72], [80, 79], [48, 81], [22, 75]]);
      P.poly([[9, 51], [15, 40], [33, 33], [58, 29], [82, 30], [96, 37], [101, 48], [97, 58], [86, 63], [60, 65], [34, 65], [15, 61]]);
      P.detail(c => { c.beginPath(); c.moveTo(18, 62); c.quadraticCurveTo(55, 66, 92, 61); c.lineTo(92, 64); c.quadraticCurveTo(55, 69, 18, 65); c.closePath(); c.fillStyle = HOLE; c.fill();
        c.fillStyle = BONE; for (let x = 22; x < 86; x += 6.2) { c.beginPath(); c.moveTo(x, 62.5); c.lineTo(x + 3.4, 62.5); c.lineTo(x + 1.6, 67.6); c.closePath(); c.fill(); } });
      P.holeEll(75, 42, 5.2, 4.8); P.holePoly([[38, 41], [58, 37], [65, 47], [57, 56], [41, 54]]); P.holeEll(20, 46, 3.2, 2.4, -0.3); P.holeEll(89, 50, 3.6, 6, 0.2); P.holeEll(72, 73, 7, 2.2, 0.05);
    },
    tri(P) {
      P.poly([[60, 50], [62, 31], [70, 15], [82, 6], [94, 7], [100, 20], [99, 44], [93, 63], [80, 74], [68, 66]]);
      P.detail(c => { c.fillStyle = BONE; c.strokeStyle = OUTL; c.lineWidth = 0.8; for (const [x, y] of [[64, 24], [72, 13], [83, 6], [94, 9], [100, 22], [100, 37], [97, 52]]) { c.beginPath(); c.arc(x, y, 2.6, 0, Math.PI * 2); c.fill(); c.stroke(); } });
      P.poly([[10, 79], [30, 87], [60, 87], [74, 81], [72, 91], [50, 96], [26, 93], [12, 85]]);
      P.poly([[5, 74], [11, 64], [22, 58], [34, 56], [48, 50], [60, 45], [70, 44], [77, 50], [79, 62], [75, 73], [64, 82], [46, 86], [28, 86], [14, 81]]);
      P.poly([[49, 50], [58, 47], [32, 24], [21, 15]], true); P.poly([[57, 52], [64, 48], [44, 27], [34, 19]], true);
      P.poly([[13, 63], [22, 59], [13, 49]], false);
      P.holeEll(57, 59, 4.4, 4); P.holeEll(18, 67, 3, 4, 0.3); P.holeEll(68, 68, 3, 4.5, 0.2);

    },
    stego(P) {
      P.poly([[12, 110], [40, 114], [70, 112], [80, 108], [77, 118], [50, 121], [24, 118]]);
      P.poly([[7, 104], [15, 98], [34, 94], [54, 92], [70, 92], [82, 96], [85, 104], [75, 110], [50, 112], [26, 112], [11, 110]]);
      P.holeEll(66, 99, 3.6, 3.4); P.holeEll(16, 103, 2.6, 2); P.holeEll(44, 103, 8, 3, -0.05); P.holeEll(78, 104, 2.2, 3);
    },
    bronto(P) {
      P.poly([[8, 25], [26, 29], [38, 26], [35, 32], [18, 33]]);
      P.poly([[5, 20], [11, 13], [24, 8], [37, 9], [43, 16], [41, 24], [30, 28], [16, 28], [8, 25]]);
      P.detail(c => { c.fillStyle = BONE; for (let x = 10; x < 30; x += 3.2) c.fillRect(x, 26.5, 1.2, 3.2); });

    },
    ptera(P) {
      P.poly([[4, 47], [40, 49], [70, 49], [74, 52], [42, 55], [12, 51]]);
      P.poly([[60, 32], [72, 25], [110, 3], [114, 8], [82, 34]], true, { shadeW: 2.4 });
      P.poly([[0, 43], [26, 38], [52, 33], [66, 30], [76, 33], [80, 40], [74, 47], [44, 47], [16, 46]]);
      P.holeEll(68, 38, 3.2, 3); P.holeEll(48, 40, 9, 2.6, -0.08);
      P.detail(c => { c.strokeStyle = "rgba(110,90,60,.6)"; c.lineWidth = 0.7; c.beginPath(); c.moveTo(70, 31); c.quadraticCurveTo(90, 18, 108, 7); c.stroke(); });
    },
  };

  // ---------- poses: each returns layers, back to front ----------
  // Each animal is drawn at natural proportions in its own units (shoulder at 0,0; hips at about 150,0;
  // y down), then rotated and scaled to fill the 300 x 420 slab (see FIT below).
  function standard(P, k) {
    const bp = resample(spline(k.back, 12), 3);
    const L = [];
    if (k.behind) L.push(...k.behind(bp));
    for (const f of k.far || []) L.push(() => { limb(P.far, f.pts, f.w); if (f.toes) toes(P.far, ...f.toes); });
    L.push(() => ribs(P, bp, k.rib[0], k.rib[1], k.rib[2], k.ribLen, k.ribLean || 0.3, k.ribW || 4.2));
    if (k.gast) L.push(() => gastralia(P, ...k.gast));
    // the lower hip bones are kept short so they tuck in beside the thigh instead of jutting out behind

    L.push(() => { const p = k.pelvis; P.ell(...p.ilium); P.line(part(p.pubis, 0.5), p.pw); const q = part(p.ischium, 0.22)[1]; P.ell((p.ischium[0][0] + q[0]) / 2, (p.ischium[0][1] + q[1]) / 2, p.iw * 1.1, p.iw * 0.9, 0.9); });

    L.push(() => vert(P, k.neck, k.neckO));
    L.push(() => { limb(P, k.fore.pts, k.fore.w); if (k.fore.toes) toes(P, ...k.fore.toes); });

      g.fillStyle = dark ? "rgba(255,240,210,.05)" : "rgba(255,248,230,.18)"; g.beginPath(); g.ellipse(-r * .3, -rr * .35, r * .35, rr * .25, 0, 0, 6.29); g.fill();

}

      const T = tutStep(), ok = !T || ui.mode !== "placeScout" || T.place === k;
      if (ok) inner += `<div class="slot ${T ? "tut" : ""}" data-act="slot" data-pos="${k}" role="button" tabindex="0" aria-label="Place here"></div>`;
      if (k < me.hand.length) inner += cardHtml(me.hand[k]);
    }
  } else {
    const clickable = humanTurn() || ui.mode === "chooseOffer";
    inner = me.hand.map((v, k) => cardHtml(v, `${ui.sel.includes(k) ? "sel" : ""} ${ui.mode === "chooseOffer" && ui.scout && k === ui.scout.pos ? "fresh-in" : ""} ${tutWants(v) && !ui.sel.includes(k) ? "tut" : ""}`,
      clickable ? `data-act="${ui.mode === "chooseOffer" ? "offer" : "pick"}" data-i="${k}" role="button" tabindex="0" aria-label="${cardName(v)}"` : "")).join("");
  }
  let actions = "";
  if (G.phase === "offer" && G.offer && G.offer.to === 0 && !ui.mode && !ui.pending) {
    actions = `<button class="primary" data-act="accept">Keep the ${V(G.offer.card)}</button><button data-act="reject">Turn it away</button>`;
  } else if (ui.sel.length) {
    actions = `<button data-act="clear">Clear selection</button>`;
  }
  return `<div class="hand-wrap ${tutStep() && tutStep().focus === "hand" ? "tut-focus" : ""}">
    <div class="hand-head"><span class="eyebrow">Your rock face · locked strata · ${me.hand.length} fossils</span><div class="actions">${actions}</div></div>
    <div class="hand">${inner || `<span class="empty-note">The rock face is clear.</span>`}</div>
  </div>`;
}

function overlayHtml() {
  if (G.phase !== "roundEnd" && G.phase !== "matchEnd") return "";
  const r = G.roundResult;
  const rows = G.players.map((p, i) => `<tr><td><span class="dot" style="--pc:${pcol(i)}"></span> ${fullName(i)}${G.online && i === 0 ? " (you)" : ""}</td>
    <td class="num">${r.held[i]}</td><td class="num">+${r.held[i] * r.value}</td><td class="num"><b>${p.score}</b></td></tr>`).join("");
  const head = `<table class="scores"><thead><tr><th>Digger</th><th class="num">Sites</th><th class="num">Season</th><th class="num">Prestige</th></tr></thead><tbody>${rows}</tbody></table>`;
  const shed = r.shedder === null ? "The season was called off." : (r.shedder === 0 ? "You finished your dig first." : `${fullName(r.shedder)} finished the dig first.`);
  if (G.phase === "roundEnd") {
    return `<div class="overlay"><div class="modal" role="dialog" aria-label="Season results">
      <div class="eyebrow">Season ${r.round + 1} closed</div><h2>${shed}</h2>${head}${tut ? `<p class="tut-note"><b>Field lesson complete.</b> You hold all three sites, so you bank 3 prestige. From here the deal is random and Ashworth plays for real, with sites worth 2 and then 4. Watch the sites beside you, and think twice about what you send him.</p>` : ""}
      <p>Every site is cleared and each camp gets a fresh rock face of ${G.cfg.hand}. Next season, sites are worth ${ROUND_VALUES[r.round + 1]} prestige.</p>

  }

  const title = names.length > 1 ? `${names.join(" and ")} share the honours` : (st.winners[0] === 0 ? "Your finds win the day" : `${names[0]} wins the day`);
  const tb = st.tiedOnPoints ? `<p>Tied on prestige, so the tiebreaker applied: most seasons closed by finishing your dig, then most prestige in the final season.</p>` : "";
  return `<div class="overlay"><div class="modal" role="dialog" aria-label="Final results">
    <div class="eyebrow">Three seasons complete</div><h2>${title}</h2>${head}${tb}
    ${net ? netMatchButtons() : `<div class="actions"><button class="primary" data-act="again">Dig again</button><button data-act="setup">Change rivals</button></div>`}</div></div>`;
}

function logHtml() {
  return `<div class="log"><div class="eyebrow">Field notes</div>${G.log.slice(0, 7).map(l => `<div class="row">${logFor(l, 0)}</div>`).join("")}</div>`;
}

function rulesHtml() {
  const c = G ? G.cfg : CONFIG[ui.setupN];
  return `<details class="rules" data-key="rules" ${ui.open.rules ? "open" : ""}><summary>Rules reference</summary><ul>
    <li><b>Your rock face is locked.</b> Fossils sit in the order they were dealt, and you can't rearrange them. It only changes when fossils come out or are set in.</li>
    <li><b>Excavate:</b> take up to 4 adjacent fossils that form a <i>run</i> (consecutive numbers in order, like 3-4-5) or a <i>set</i> (all the same number). Place the find at a site beside your camp. An unclaimed site takes any find. A claimed site, yours or a rival's, needs a find that outshines it: more cards, then the better kind, then the higher total. A <i>suited run</i> (all one species) beats a set of the same size; a set beats a run. The old find is discarded and the site is yours.</li>
    <li><b>Poach:</b> take an end bone from a find at a site beside your camp and set it anywhere in your rock face. Then send any fossil from your rock face to the rival across that site. They keep it or turn it away, and a turned-away fossil is out of the dig this season.</li>
    <li><b>Closing a season:</b> the moment a digger's rock face is empty. Each site you hold earns prestige: 1 in the first season, 2 in the second, 4 in the third.</li>
    <li><b>Between seasons:</b> every site and rock face is cleared, the deck is reshuffled, and each camp gets ${c.hand} fresh fossils.</li>
    <li><b>Deck:</b> one more species than diggers: two diggers play with three species (27 cards), three with four (36), four with all five (45).</li>
    <li><b>Tiebreaker:</b> most seasons closed by finishing your dig, then most prestige in the final season.</li>
    <li><b>Advanced: site effects.</b> Each season, shuffle the six site cards and deal one effect side up to each site. ${Object.values(FX).map(f => `<i>${f.name}:</i> ${f.rule}`).join(" ")}</li>
  </ul></details>`;
}

function catalogueHtml() {
  if (!FACES) return "";
  const slabs = SPECIES.map((sp, s) => `<figure class="slab">
      <div class="slab-grid">${[1,2,3,4,5,6,7,8,9].map(v => cardHtml(s * 10 + v)).join("")}</div>
      <figcaption><b style="--suit:${sp.suit}">${symSvg(s, "sym")}${sp.name}</b><span>${sp.rock}</span></figcaption>

    <p class="cat-note">Every number is a bone, and the copies of each number come from different animals, each set in its own rock. Lay one species' 1 to 9 in three rows of three and the whole skeleton comes out of the slab. Species matters once: a suited run, every card from one animal, outranks a set of the same size. The deck uses one more species than there are diggers.</p>

  return `<div class="top"><div><div class="eyebrow">A new dig</div><h1>Diggers</h1>

function render() {
  if (!root) return;
  if (!G) { root.innerHTML = net ? lobbyHtml() : ui.invite ? inviteHtml() : setupHtml(); return; }
  root.innerHTML = `<div class="top"><div><div class="eyebrow">${tut ? "Field lesson" : net ? `Online table · ${G.n} diggers` : `${G.n} diggers`}${G.adv ? " · site effects" : ""}</div><h1>Diggers</h1></div>
    <button data-act="setup">${net ? "Leave the table" : "New expedition"}</button></div>
    ${net ? netBarHtml() : ""}${statusHtml()}${tableHtml()}${fxLegendHtml()}${handHtml()}${logHtml()}${rulesHtml()}${catalogueHtml()}${overlayHtml()}`;
  if (net && net.kind === "host") net.sync();
}

function onAct(t) {
  const act = t.dataset.act;
  if (netOnAct(act, t)) return;
  const guest = net && net.kind === "guest";
  if (act === "pickn") { ui.setupN = +t.dataset.n; return render(); }
  if (act === "advtoggle") { ui.adv = !ui.adv; return render(); }
  if (act === "start" || act === "again") { tut = null; G = newGame(act === "again" ? G.n : ui.setupN, [0], act === "again" ? G.adv : ui.adv); resetUi(); render(); return scheduleBot(); }
  if (act === "tutorial") { clearTimeout(botTimer); botTimer = null; startTutorial(); resetUi(); render(); return window.scrollTo(0, 0); }
  if (act === "tutnext") { tut.step++; return render(); }
  if (act === "tutskip") { tut = null; render(); return scheduleBot(); }
  if (act === "setup") { clearTimeout(botTimer); botTimer = null; tut = null; G = null; resetUi(); return render(); }
  if (act === "nextround") { tut = null; nextRound(G); resetUi(); render(); return scheduleBot(); }
  if (!G) return;
  const me = G.players[0];
  if (act === "pick" && humanTurn()) {
    const i = +t.dataset.i; let s = ui.sel;
    if (tutStep() && !tutWants(me.hand[i]) && !s.includes(i)) return;
    if (s.includes(i)) s = (i === s[0] || i === s[s.length - 1]) ? s.filter(x => x !== i) : [i];
    else if (s.length && s.length < CAP && (i === s[0] - 1 || i === s[s.length - 1] + 1)) s = [...s, i].sort((a, b) => a - b);
    else s = [i];
    ui.sel = s; return render();
  }
  if (act === "clear") { ui.sel = []; return render(); }
  if (act === "playlane" && humanTurn()) {
    const lane = +t.dataset.lane; const s = ui.sel[0], e = ui.sel[ui.sel.length - 1] + 1;
    ui.sel = [];
    if (guest) { netSend({ type: "play", lane, s, e }); return render(); }
    doPlay(G, 0, lane, s, e); if (tut) tut.step++; render(); return scheduleBot();
  }
  if (act === "scout" && humanTurn()) {
    const lane = +t.dataset.lane; const left = t.dataset.left === "1";
    const card = scoutTake(G, 0, lane, left);
    if (tut) tut.poached = card;
    ui.scout = { lane, left, card, to: neighbor(G, lane, 0) }; ui.mode = "placeScout"; return render();
  }
  if (act === "slot") {
    const pos = +t.dataset.pos;
    if (ui.mode === "placeScout") {
      me.hand.splice(pos, 0, ui.scout.card); ui.scout.pos = pos;
      ui.mode = "chooseOffer"; return render();
    }
    if (ui.mode === "placeReceived" && guest) { ui.mode = null; netSend({ type: "keep", pos }); return render(); }
    if (ui.mode === "placeReceived") { ui.mode = null; resolveOffer(G, true, pos); render(); return scheduleBot(); }
  }
  if (act === "offer" && ui.mode === "chooseOffer") {
    const i = +t.dataset.i;
    if (tutStep() && me.hand[i] !== tutStep().send) return;
    if (tut) tut.step++;
    if (guest) { const sc = ui.scout; resetUi(); netSend({ type: "poach", lane: sc.lane, left: sc.left, pos: sc.pos, oi: i }); return render(); }
    const offered = me.hand.splice(i, 1)[0];
    const sc = ui.scout; resetUi();
    if (G.lanes[sc.lane].fx === "open") pitPoach(G, 0, sc.lane, sc.card, offered); else makeOffer(G, 0, sc.lane, sc.card, offered);
    render(); return scheduleBot();
  }
  if (act === "accept" && G.phase === "offer") { ui.mode = "placeReceived"; return render(); }
  if (act === "reject" && G.phase === "offer" && guest) { netSend({ type: "reject" }); return render(); }
  if (act === "reject" && G.phase === "offer") { resolveOffer(G, false); render(); return scheduleBot(); }
}

// ===================== ONLINE TABLES =====================
// Same relay pattern as Too Many Crooks and Dim Sum Rush: MQTT over WebSockets through public brokers.
// The host's browser runs the dig and the bots; guests are thin clients that send moves and get back
// only their own view (viewFor above), so a rival's rock face never leaves the host's page.
// ?relay=local swaps the brokers for a BroadcastChannel relay so tabs in one browser can share a table (for testing).
const NETX = (() => {
  if (typeof window === "undefined") return null;
  const LOCAL = /[?&]relay=local(&|$)/.test(location.search);
  // ---------------- Relay transport (MQTT over WebSockets, public brokers) ----------------
  const BROKERS = LOCAL ? [{ key: "L", url: "local", name: "this browser (test relay)" }] : [
    { key: "E", url: "wss://broker.emqx.io:8084/mqtt", name: "EMQX" },
    { key: "H", url: "wss://broker.hivemq.com:8884/mqtt", name: "HiveMQ" },
    { key: "M", url: "wss://test.mosquitto.org:8081", name: "Mosquitto" },
  ];
  const TOPIC_ROOT = "whatsgood/diggers/v1/";
  const SANDBOXED = /claude/i.test(location.hostname) || /claudeusercontent|anthropic/i.test(location.hostname);
  const LIB_SOURCES = [
    "https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js",
    "https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js",
  ];
  // A BroadcastChannel stand-in with the slice of the mqtt.js client API used below.
  class LocalClient {
    constructor(opts) {
      this.subs = new Set(); this.h = {}; this.will = opts && opts.will;
      this.bc = new BroadcastChannel("whatsgood-local-relay");
      this.bc.onmessage = e => { const d = e.data || {}; if (this.subs.has(d.topic)) this.emit("message", d.topic, d.payload); };
      this.onHide = () => { if (this.will) this.publish(this.will.topic, this.will.payload); };
      window.addEventListener("pagehide", this.onHide);
      setTimeout(() => this.emit("connect"), 30);
    }
    on(ev, cb) { (this.h[ev] = this.h[ev] || []).push(cb); return this; }
    once(ev, cb) { const f = (...a) => { this.h[ev] = this.h[ev].filter(x => x !== f); cb(...a); }; return this.on(ev, f); }
    emit(ev, ...a) { (this.h[ev] || []).slice().forEach(f => f(...a)); }
    subscribe(t, o, cb) { this.subs.add(t); if (cb) setTimeout(() => cb(null), 0); }
    publish(t, p) { try { this.bc.postMessage({ topic: t, payload: String(p) }); } catch (e) {} }
    end() { window.removeEventListener("pagehide", this.onHide); try { this.bc.close(); } catch (e) {} }
  }
  let libLoad = null;
  function loadLib() {
    if (LOCAL) return typeof BroadcastChannel === "undefined" ? Promise.reject(new Error("This browser has no BroadcastChannel, so the local test relay can't run.")) : Promise.resolve({ connect: (url, opts) => new LocalClient(opts) });
    if (window.mqtt) return Promise.resolve(window.mqtt);
    if (libLoad) return libLoad;
    libLoad = new Promise((resolve, reject) => {
      let i = 0;
      const tryNext = () => {
        if (i >= LIB_SOURCES.length) { libLoad = null; reject(new Error("Could not load the networking library. Check your connection or ad blocker.")); return; }
        const s = document.createElement("script"); s.src = LIB_SOURCES[i++];
        let done = false;
        const t = setTimeout(() => { if (!done) { done = true; s.remove(); tryNext(); } }, 9000);
        s.onload = () => { if (done) return; done = true; clearTimeout(t); if (window.mqtt) resolve(window.mqtt); else { s.remove(); tryNext(); } };
        s.onerror = () => { if (done) return; done = true; clearTimeout(t); s.remove(); tryNext(); };
        document.head.appendChild(s);
      };
      tryNext();
    });
    return libLoad;
  }
  function makeCode() { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let c = ""; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)]; return c; }
  function cleanId(s) { return String(s).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40); }
  function connectBroker(mqtt, broker, opts) {
    return new Promise((resolve, reject) => {
      let done = false;
      const client = mqtt.connect(broker.url, Object.assign({ clean: true, connectTimeout: 7000, reconnectPeriod: 2000, keepalive: 30, clientId: "dig_" + Math.random().toString(16).slice(2, 12) }, opts || {}));
      const to = setTimeout(() => { if (!done) { done = true; try { client.end(true); } catch (e) {} reject(new Error("timeout")); } }, 8000);
      client.once("connect", () => { if (!done) { done = true; clearTimeout(to); resolve(client); } });
      const fail = (e) => { if (!done) { done = true; clearTimeout(to); try { client.end(true); } catch (e2) {} reject(e || new Error("connection closed")); } };
      client.on("error", fail);
      client.on("close", () => fail(new Error("connection refused")));
      client.on("offline", () => fail(new Error("offline")));
    });
  }
  async function connectAny(mqtt, list, optsFor) {
    let last = null;
    for (const b of list) {
      try { const c = await connectBroker(mqtt, b, optsFor ? optsFor(b) : null); return { client: c, broker: b }; }
      catch (e) { last = e; }
    }
    throw new Error("Could not reach any relay server" + (last ? " (" + (last.message || last) + ")" : "") + (SANDBOXED ? ". This page is running inside claude.ai, which blocks outside connections; use the copy on the website for online play." : ". Try again, or try a different network. Playing against bots still works."));
  }
  function parse(payload) { try { return JSON.parse(payload.toString()); } catch (e) { return null; } }
  const store = (kind, key, val) => { try { const S = kind === "s" ? sessionStorage : localStorage; if (val === undefined) { const v = S.getItem(key); return v ? JSON.parse(v) : null; } if (val === null) S.removeItem(key); else S.setItem(key, JSON.stringify(val)); } catch (e) { return null; } };
  const AWAY_AFTER = 70000;   // no word from a guest for this long: they've dropped off
  const AWAY_GRACE = 25000;   // then a bot makes any decision that is waiting on them after this long

  // ---------------- Host ----------------
  // Seats: kind "host" (seat 0, always), "guest", "open" (a friend may sit; a bot takes it at the start), "bot".
  class HostSession {
    constructor(n, name) {
      this.kind = "host"; this.n = n; this.name = name; this.started = false; this.lastSnap = ""; this.lastBeat = 0;
      this.seats = [{ kind: "host", name, token: "host", connected: true }];
      for (let i = 1; i < n; i++) this.seats.push({ kind: "open" });
    }
    async open(resume) {
      const mqtt = await loadLib();
      const same = resume ? BROKERS.filter(b => b.key === resume.code[0]) : [];
      const { client, broker } = await connectAny(mqtt, same.length ? same : BROKERS);
      this.client = client; this.broker = broker;
      this.code = same.length ? resume.code : broker.key + makeCode();
      this.topic = TOPIC_ROOT + this.code;
      await new Promise((res, rej) => client.subscribe(this.topic + "/h", { qos: 1 }, (e) => e ? rej(e) : res()));
      client.on("message", (t, payload) => { if (t === this.topic + "/h") this.onMessage(parse(payload)); });
      client.on("offline", () => { this.relayLost = true; if (net === this) render(); });
      client.on("connect", () => { this.relayLost = false; this.pushLobby(); if (this.started) this.broadcastViews(); });
      this.timer = setInterval(() => this.tick(), 2000);
      this.pushLobby(); if (this.started) this.broadcastViews();
      return this.code;
    }
    link() { return location.origin + location.pathname + "?table=" + this.code + (LOCAL ? "&relay=local" : ""); }
    sendTo(i, m) { const s = this.seats[i]; if (s && s.kind === "guest" && s.token) this.replyRaw(s.token, m); }
    replyRaw(tok, m) { try { this.client && this.client.publish(this.topic + "/g/" + tok, JSON.stringify(m), { qos: 1 }); } catch (e) {} }
    sendView(i, extra) { if (this.started && G) this.sendTo(i, Object.assign({ t: "view", view: viewFor(G, i) }, extra || {})); }
    broadcastViews() { this.seats.forEach((s, i) => { if (s.kind === "guest") this.sendView(i); }); }
    uniqueName(name, tok) {
      let out = name, k = 2;
      while (this.seats.some(s => s.name && s.token !== tok && s.name.toLowerCase() === out.toLowerCase())) out = name.slice(0, 14) + " " + k++;
      return out;
    }
    onMessage(m) {
      if (!m || typeof m !== "object" || !m.from) return;
      const tok = cleanId(m.from), now = Date.now();
      let seat = this.seats.findIndex(s => s.kind === "guest" && s.token === tok);
      if (m.t === "hello") {
        const name = cleanName(m.name) || "Guest";
        if (seat < 0) {
          if (this.started) {
            // a guest on a new device (or with a cleared tab) can reclaim their own seat by name while it stands empty
            seat = this.seats.findIndex(s => s.kind === "guest" && !s.connected && s.name.toLowerCase() === name.toLowerCase());
            if (seat < 0) { this.replyRaw(tok, { t: "rejected", reason: "This dig has already started. Ask the host to open a new table for the next one." }); return; }
            this.seats[seat].token = tok;
          } else {
            seat = this.seats.findIndex(s => s.kind === "open");
            if (seat < 0) { this.replyRaw(tok, { t: "rejected", reason: "That table is full." }); return; }
            this.seats[seat] = { kind: "guest", name: this.uniqueName(name, tok), token: tok };
          }
        } else if (!this.started) this.seats[seat].name = this.uniqueName(name, tok);
        Object.assign(this.seats[seat], { connected: true, last: now });
        this.sendTo(seat, { t: "welcome", seat, code: this.code });
        this.pushLobby();
        this.sendView(seat);
        return;
      }
      if (seat < 0) return;
      const s = this.seats[seat];
      s.last = now;
      if (m.t === "bye") { s.connected = false; s.awaySince = now; this.pushLobby(); return; }
      if (!s.connected) { s.connected = true; this.pushLobby(); }
      if (m.t === "ping") { if (m.needView) this.sendView(seat); return; }
      if (m.t === "sit") { const to = m.seat | 0; if (!this.started && this.seats[to] && this.seats[to].kind === "open") { this.seats[to] = s; this.seats[seat] = { kind: "open" }; this.pushLobby(); } return; }
      if (m.t === "act") {
        if (!this.started || !G) { this.sendTo(seat, { t: "err", msg: "The dig hasn't started yet." }); return; }
        if (ui.mode === "placeScout" || ui.mode === "chooseOffer") { this.sendTo(seat, { t: "err", msg: "Hold on: the host is mid-move." }); this.sendView(seat); return; }

function cleanName(s) { return String(s || "").replace(/[<>&"'`\\]/g, "").replace(/\s+/g, " ").trim().slice(0, 16); }
function normCode(s) { return String(s || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 5); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function toast(msg) {

  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600);
}
function copyText(txt, what) {
  const done = ok => toast(ok ? `${what} copied` : `Couldn't reach the clipboard; select the ${what.toLowerCase()} and copy it`);
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); done(ok); };

}
function setUrlTable(code) {

}
function getName() { const n = cleanName(ui.name); NETX.store("l", "diggers-name", n); return n; }
function netSend(a) { ui.pending = Date.now(); net.act(a); }
// seat i of the current view: is a person meant to sit there but not connected?
function seatAway(i) {

  const st = net.kind === "host" ? net.lobbyState() : net.lobby; if (!st || !st.seats) return false;

async function startHost() {
  const name = getName();

  if (ui.busy) return;
  ui.busy = true; ui.netMsg = "Connecting to a relay…"; render();
  const h = new NETX.HostSession(ui.setupN, name);

  catch (e) { ui.netMsg = e.message; }
  ui.busy = false; render();
}
async function startGuest(code) {

  if (code.length !== 5) { ui.netMsg = "Enter the 5-letter table code."; return render(); }
  if (!name) { ui.netMsg = "Add your name first, so the table knows who you are."; return render(); }
  if (ui.busy) return;
  ui.busy = true; ui.netMsg = `Looking for table ${code}…`; render();

async function resumeHost(saved) {

// returns true when it handled the action
function netOnAct(act, t) {
  if (act === "host") { startHost(); return true; }
  if (act === "join") { startGuest(ui.code); return true; }
  if (act === "joininvite") { startGuest(ui.invite); return true; }
  if (act === "noinvite") { ui.invite = null; ui.netMsg = ""; setUrlTable(null); render(); return true; }
  if (!net) return false;
  const host = net.kind === "host";
  if (act === "copycode") { copyText(net.code, "Code"); return true; }
  if (act === "copylink") { copyText(net.link(), "Link"); return true; }
  if (act === "leave" || act === "setup") {
    const live = G && G.phase !== "matchEnd";
    if (live && !confirm(host ? "Leave the table? The dig ends for everyone." : "Leave the table? A bot will dig in your place.")) return true;
    leaveNet(); return true;
  }
  if (act === "netn" && host) { net.setN(+t.dataset.n); return true; }
  if (act === "seatkind" && host) { net.toggleSeat(+t.dataset.i); return true; }
  if (act === "sit" && !host) { net.sit(+t.dataset.i); return true; }
  if (act === "netstart" && host) { net.startGame(); window.scrollTo(0, 0); return true; }
  if (act === "again") { if (host) net.startGame(); return true; }
  if (act === "nextround") {
    if (!G || G.phase !== "roundEnd") return true;
    if (host) { nextRound(G); G.ready = []; resetUi(); render(); scheduleBot(); }
    else netSend({ type: "ready" });
    return true;
  }
  return ["start", "tutorial", "tutnext", "tutskip", "pickn"].includes(act);
}
