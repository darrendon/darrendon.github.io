<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diggers — playtest build</title>
<meta name="description" content="Diggers — a contested-lane climbing card game of rival paleontologists. Play 2 to 4 players against bots in your browser.">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
/* Layout: a surveyor's field sheet — camps sit on the edges of a ruled grid, dig sites are staked between neighboring camps, the season ledger sits in the middle; your rock face runs along the bottom. */
:root {
  --paper: #e9e0cb;
  --sheet: #f2ebdb;
  --rule: rgba(45, 74, 107, .10);
  --ink: #2a231a;
  --muted: #6b5d48;
  --line: #bfae8c;
  --bone: #efe5cc;
  --bone-edge: #8c7a5b;
  --bone-ink: #3a2e1f;
  --accent: #2d4a6b;
  --accent-ink: #f2ebdb;
  --accent-soft: rgba(45, 74, 107, .14);
  --p0: #2d4a6b;
  --p1: #7b2d2a;
  --p2: #3f6b4f;
  --p3: #9a6a12;
  --shadow: 0 1px 2px rgba(42, 35, 26, .25);
  --font-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --font-caps: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Spectral", "Iowan Old Style", Georgia, serif;
  --font-num: "Rye", "IM Fell English", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17130e; --sheet: #221c15; --rule: rgba(180, 160, 120, .07); --ink: #eadfc6; --muted: #b0a07f; --line: #4a3f2e;
    --bone: #e6dbc0; --bone-edge: #7a6a4e; --bone-ink: #2f2518;
    --accent: #9bb6d6; --accent-ink: #17130e; --accent-soft: rgba(155, 182, 214, .16);
    --p0: #9bb6d6; --p1: #d98b80; --p2: #8fc0a0; --p3: #e0b45a; --shadow: 0 1px 2px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17130e; --sheet: #221c15; --rule: rgba(180, 160, 120, .07); --ink: #eadfc6; --muted: #b0a07f; --line: #4a3f2e;
  --bone: #e6dbc0; --bone-edge: #7a6a4e; --bone-ink: #2f2518;
  --accent: #9bb6d6; --accent-ink: #17130e; --accent-soft: rgba(155, 182, 214, .16);
  --p0: #9bb6d6; --p1: #d98b80; --p2: #8fc0a0; --p3: #e0b45a; --shadow: 0 1px 2px rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
}
.wrap { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: flex; flex-direction: column; gap: 14px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 40px; line-height: 1; letter-spacing: .01em; }
h2 { font-size: 26px; line-height: 1.1; }
.eyebrow { font-family: var(--font-caps); font-size: 14px; letter-spacing: .06em; color: var(--muted); }
.sub { font-family: var(--font-display); font-style: italic; font-size: 16px; color: var(--muted); margin: 4px 0 0; max-width: 60ch; }
button { font-family: var(--font-body); font-size: 14px; font-weight: 600; border-radius: 3px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); padding: 9px 14px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:focus-visible, [data-act]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.status { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 2px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-height: 66px; }
.status .who { font-family: var(--font-display); font-size: 19px; line-height: 1.2; }
.status .hint { color: var(--muted); font-size: 13.5px; }

.table { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.cell { min-width: 0; }
.seat { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; border-top: 4px solid var(--pc); }
.seat.turn { box-shadow: 0 0 0 2px var(--pc); }
.seat .name { font-family: var(--font-display); font-size: 17px; line-height: 1.15; display: block; }
.seat .name .dot { margin-right: 6px; vertical-align: 2px; }
.seat .meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }
.seat .score { font-family: var(--font-body); font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pc); display: inline-block; flex-shrink: 0; }
.turnflag { font-family: var(--font-caps); font-size: 13px; letter-spacing: .05em; color: var(--pc); float: right; margin-left: 6px; }

.lane { position: relative; border: 1.5px dashed var(--bone-edge); border-radius: 0; padding: 8px 6px 6px; display: flex; flex-direction: column; gap: 4px; min-height: 108px; justify-content: space-between; background: transparent; }
.lane::before, .lane::after { content: ""; position: absolute; top: -4px; width: 7px; height: 7px; background: var(--bone-edge); transform: rotate(45deg); }
.lane::before { left: -4px; } .lane::after { right: -4px; }
.lane.owned { border-style: solid; border-color: var(--oc); background: color-mix(in srgb, var(--oc) 9%, transparent); }
.lane.owned::before, .lane.owned::after { background: var(--oc); }
.lane.target { cursor: pointer; box-shadow: 0 0 0 3px var(--accent); }
.lane .lbl { font-family: var(--font-caps); font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.lane .owner { font-size: 12px; font-weight: 600; color: var(--oc); }
.lane .owner.none { color: var(--muted); font-weight: 400; font-style: italic; }
.meld { display: flex; gap: 2px; flex-wrap: nowrap; justify-content: center; min-height: 40px; align-items: center; }
.empty-note { font-size: 12.5px; color: var(--muted); font-style: italic; }

.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; padding: 6px; }
.center .big { font-family: var(--font-num); font-size: 46px; line-height: 1; color: var(--accent); }
.center .small { font-size: 12.5px; color: var(--muted); }
.seasons { display: flex; gap: 4px; margin-top: 4px; }
.seasons span { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }
.seasons span.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* fossil cards: each face is one cell of a species' 3x3 fossil slab */
.card { position: relative; width: 32px; height: 45px; border-radius: 4px; background: #6d5a45 center / cover no-repeat; border: 1px solid rgba(20, 12, 4, .6); box-shadow: var(--shadow); flex-shrink: 0; overflow: hidden; }
.card .ix { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 12px; color: #fbf5e6; text-shadow: 1px 0 0 #1d140b, -1px 0 0 #1d140b, 0 1px 0 #1d140b, 0 -1px 0 #1d140b, 1px 1px 0 #1d140b, -1px -1px 0 #1d140b, 1px -1px 0 #1d140b, -1px 1px 0 #1d140b, 0 1px 3px rgba(0, 0, 0, .6); }
.card .ix b { font-family: var(--font-num); font-weight: 400; font-size: 12px; line-height: 1.05; }
.card .ix b.u { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 1px; text-decoration-color: #fbf5e6; }
.card .ix svg { width: 9px; height: 9px; display: block; fill: var(--suit); stroke: #1d140b; stroke-width: 1.2px; fill-rule: evenodd; overflow: visible; filter: drop-shadow(0 0 .6px #fbf5e6) drop-shadow(0 0 .6px #fbf5e6); }
.card .ix.tl { left: 2px; top: 2px; } .card .ix.tr { right: 2px; top: 2px; }
.card .ix.bl { left: 2px; bottom: 2px; transform: rotate(180deg); } .card .ix.br { right: 2px; bottom: 2px; transform: rotate(180deg); }
.card .ix.tr, .card .ix.bl, .card .ix.br { display: none; }
.hand .card .ix, .slab-grid .card .ix { display: flex; }
.card.edge { cursor: pointer; outline: 2px solid var(--accent); outline-offset: 1px; }
.hand .card { width: 46px; height: 64px; border-radius: 5px; cursor: pointer; transition: transform .12s ease; }
.hand .card .ix { min-width: 14px; } .hand .card .ix b { font-size: 15px; } .hand .card .ix svg { width: 11px; height: 11px; }
.hand .card.sel { transform: translateY(-8px); outline: 3px solid var(--accent); outline-offset: 1px; }
.hand .card.fresh-in { outline: 2px dashed var(--accent); outline-offset: 2px; }
.hand-wrap { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px;
  background-image: repeating-linear-gradient(180deg, transparent 0 17px, var(--rule) 17px 18px); }
.hand-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.hand { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; padding-top: 10px; min-height: 80px; }
.slot { width: 14px; height: 64px; border-radius: 3px; border: 2px dashed var(--accent); cursor: pointer; flex-shrink: 0; }
.slot:hover { background: var(--accent-soft); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.log { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 10px 14px; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.log .row { color: var(--muted); font-style: italic; }
.log .row b { color: var(--ink); font-weight: 600; font-style: normal; }
details.rules { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 10px 14px; font-size: 14px; }
details.rules summary { cursor: pointer; font-family: var(--font-display); font-size: 17px; }
details.rules ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; max-width: 65ch; }

.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--paper) 72%, transparent); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal { background: var(--sheet); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 2px; padding: 18px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
.modal p { margin: 0; font-size: 14px; color: var(--muted); }
.scores { width: 100%; border-collapse: collapse; font-variant-numeric: lining-nums tabular-nums; font-size: 14.5px; }
.scores th, .scores td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
.scores th { font-family: var(--font-caps); font-weight: 400; font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.scores td.num, .scores th.num { text-align: right; }

.setup { background: var(--sheet); border: 1px solid var(--line); border-radius: 2px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choice { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 12px; font-weight: 400; }
.choice .n { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.choice .d { font-size: 12.5px; color: var(--muted); }
.choice.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
@media (max-width: 460px) {
  h1 { font-size: 34px; }
  .choices { grid-template-columns: 1fr; }
  .card { width: 19px; height: 27px; border-radius: 3px; }
  .card .ix { min-width: 9px; } .card .ix.tl { left: 2px; top: 1px; } .card .ix b { font-size: 10px; } .card .ix svg { display: none; }
  .hand .card { width: 40px; height: 56px; }
  .hand .card .ix { min-width: 12px; } .hand .card .ix.tl { left: 2px; top: 2px; }
  .hand .card .ix b { font-size: 13px; } .hand .card .ix svg { display: block; width: 10px; height: 10px; }
  .slot { height: 56px; }
  .lane { min-height: 98px; padding: 7px 5px 5px; }
  .seat { padding: 6px 7px; }
  .seat .name { font-size: 15px; }
  .seat .score { font-size: 19px; }
  .center .big { font-size: 36px; }
}
@media (prefers-reduced-motion: reduce) { .hand .card { transition: none; } }
.catalogue .cat-note { margin: 8px 0 12px; color: var(--muted); max-width: 62ch; }
.slabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 16px; }
.slab { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.slab-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.slab-grid .card { width: 100%; height: auto; aspect-ratio: 5 / 7; }
.slab-grid .card .ix { min-width: 13px; } .slab-grid .card .ix b { font-size: 14px; } .slab-grid .card .ix svg { width: 10px; height: 10px; }
.slab figcaption .sym { width: 18px; height: 18px; fill: var(--suit); stroke: #2a1e12; stroke-width: 1px; fill-rule: evenodd; vertical-align: -3px; margin-right: 6px; }
.slab figcaption { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 13px; }
.slab figcaption b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.slab figcaption span { color: var(--muted); font-style: italic; }
.slab ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px 6px; font-size: 11.5px; color: var(--muted); }
.slab ol li b { color: var(--ink); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
</style>

</head>
<body>
<div class="wrap" id="root"></div>

<script>
// ===================== FOSSIL ART =====================
// Each species is one fossil slab, 3 cards wide by 3 tall. Card v (1-9) is the slab cell in
// reading order: 1 2 3 / 4 5 6 / 7 8 9. Lay a species' nine cards out that way and the skeleton is whole.
const SPECIES = [
  { key: "rex", name: "Tyrannosaurus", rock: "red sandstone", suit: "#d23a2a", base: "#b2523a", bands: ["#c0603f", "#a5482f", "#cc6c48", "#b85a3d", "#a9503a"], seed: 11, sym: "M6.5 2.2C13.5 3.2 18.6 8.6 18.4 15.2C18.3 18.4 17.2 20.6 15.6 22.2L14.2 20.2L12.6 21.6L11.6 19.4L9.8 20.4C10.6 14.6 10 8 6.5 2.2Z" },
  { key: "tri", name: "Triceratops", rock: "orange ironstone", suit: "#e8862a", base: "#c27a35", bands: ["#cf8740", "#b56e2e", "#d9924a", "#c47d38", "#ba7332"], seed: 23, sym: "M2.5 16.5C2.5 9.5 6.8 5 12 5C17.2 5 21.5 9.5 21.5 16.5L17.6 16.5L15 22L9 22L6.4 16.5ZM7.2 12.6L4.2 2.6L10 11ZM16.8 12.6L19.8 2.6L14 11ZM10.6 17.4L12 13.6L13.4 17.4Z" },
  { key: "stego", name: "Stegosaurus", rock: "green mudstone", suit: "#3fa155", base: "#5f9460", bands: ["#6aa16a", "#558a56", "#77ad74", "#5c935d", "#669b64"], seed: 37, sym: "M2 20H22V22.5H2ZM3.2 20C2.6 15.4 4 11.2 6.6 8.2C9.2 11.2 10.4 15.4 9.8 20ZM9.4 20C8.8 13.8 10.2 7.6 12.6 3C15.2 7.6 16.6 13.8 15.8 20ZM15.4 20C14.9 16 16 12.4 18.4 10C20.6 12.4 21.6 16 21 20Z" },
  { key: "bronto", name: "Brontosaurus", rock: "purple shale", suit: "#8a55c4", base: "#8a6aa8", bands: ["#9677b4", "#7e5f9c", "#a283bf", "#8768a5", "#9172ae"], seed: 41, sym: "M1.5 21.5C2 15.5 6.2 12.4 10.8 12.6C12.4 12.7 13.2 11 13.4 8.6C13.6 5.2 15.2 2.8 18.4 2.6L21.4 3.2L22.4 4.6L20.8 5.6L18.6 5.4C16.6 5.8 16.4 8.4 16.6 11.6C16.8 14.6 17.6 17.2 17.4 21.5L14.6 21.5L14.4 18L9.6 18L9.4 21.5L6.6 21.5L6.4 18.2C4.6 18.6 3.6 19.8 3.4 21.5Z" },
  { key: "ankylo", name: "Ankylosaurus", rock: "blue slate", suit: "#3a7fc4", base: "#5a84ad", bands: ["#6690b9", "#4f79a2", "#729cc4", "#5a86af", "#6189b2"], seed: 53, sym: "M1.5 12.6L13 11.2L13 13.4L1.5 14.4ZM12 12.2C12 9 14 7 16.6 7.4C18.4 7.6 19.2 8.8 19.4 9.6C21.4 9.8 22.6 11 22.6 12.4C22.6 13.8 21.4 15 19.4 15.2C19.2 16 18.4 17.2 16.6 17.4C14 17.8 12 15.6 12 12.2Z" },
  { key: "para", name: "Parasaurolophus", rock: "golden limestone", suit: "#e0b52d", base: "#c4a14a", bands: ["#d0ad55", "#b8953f", "#dab863", "#c6a24b", "#bd9b45"], seed: 67, sym: "M2.4 15.6C2.6 12.6 5.4 11.2 8.6 11L12.6 10.4L19.6 2.6C20.4 1.8 21.8 2.6 21.4 3.6L15.8 11.4C17.2 12.6 17.2 15.6 15.2 17C13.8 18 12 18.2 10 18.2L5.4 18.4C3.6 18.4 2.4 17.2 2.4 15.6ZM12.4 13.2A1.3 1.3 0 1 0 12.41 13.2Z" },
];
const BONE_NAMES = ["Jaws", "Skull", "Tail", "Shoulder", "Ribs", "Hips", "Forefoot", "Hind leg", "Hind foot"];
const BONE_OVERRIDES = {
  rex: { 4: "Arm", 7: "Far foot" },
  tri: { 1: "Horns & beak", 2: "Frill" },
  stego: { 1: "Skull", 2: "Neck & plates", 3: "Thagomizer" },
  bronto: { 1: "Skull", 2: "Long neck", 3: "Whip tail" },
  ankylo: { 1: "Skull", 2: "Horns", 3: "Tail club" },
  para: { 1: "Bill", 2: "Crest" },
};
function boneName(sp, v) { const o = BONE_OVERRIDES[SPECIES[sp].key]; return (o && o[v]) || BONE_NAMES[v - 1]; }

const FossilArt = (() => {
  const WW = 300, WH = 420; // world units: 3 x 3 cells of 100 x 140
  const BONE = "#ece2c6", BONE_LO = "#b9a476", BONE_HI = "#faf3e1", OUTL = "#24190f", HOLE = "#2a1d12";

  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function spline(pts, n = 10) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      for (let k = 0; k < n; k++) {
        const t = k / n, t2 = t * t, t3 = t2 * t;
        const f = j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);
        out.push([f(0), f(1)]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }
  function resample(pts, step) {
    const out = [pts[0]]; let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      let [x0, y0] = pts[i - 1]; const [x1, y1] = pts[i];
      let d = Math.hypot(x1 - x0, y1 - y0);
      while (acc + d >= step) { const r = (step - acc) / d; x0 = x0 + (x1 - x0) * r; y0 = y0 + (y1 - y0) * r; out.push([x0, y0]); d = Math.hypot(x1 - x0, y1 - y0); acc = 0; }
      acc += d;
    }
    return out;
  }
  function yAt(path, x) { let best = path[0]; for (const p of path) if (Math.abs(p[0] - x) < Math.abs(best[0] - x)) best = p; return best[1]; }
  function closedSmooth(ctx, pts) {
    const n = pts.length;
    ctx.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
    for (let i = 1; i <= n; i++) { const p = pts[i % n], q = pts[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.closePath();
  }

  // A pen draws the same geometry in passes: outline, fill, shade, detail.
  const NEAR = { b: "#f7f0dc", lo: "#cbb68b", hi: "#fffcf3" }, FAR = { b: "#c9b893", lo: "#a08b63", hi: "#ddcfae" };
  function pen(ctx, mode, far = false) {
    const OW = 1.8;
    const P = { ctx, mode };

function botScoutOptions(G, p) {
  const h = G.players[p].hand; const out = []; const cur = bestMeld(h);
  for (const lane of myLanes(G, p)) {
    const L = G.lanes[lane]; if (!L.meld.length) continue;
    const old = meldInfo(L.meld);
    for (const left of (L.meld.length === 1 ? [true] : [true, false])) {
      const card = left ? L.meld[0] : L.meld[L.meld.length - 1];
      const rem = left ? L.meld.slice(1) : L.meld.slice(0, -1);
      const nw = rem.length ? meldInfo(rem) : [0,0,0];
      const pos = bestInsert(h, card); const nh = [...h.slice(0, pos), card, ...h.slice(pos)];
      let oi = 0, post = null;
      for (let j = 0; j < nh.length; j++) { const m = bestMeld([...nh.slice(0, j), ...nh.slice(j + 1)]); if (!post || cmp(m, post) > 0) { post = m; oi = j; } }
      const gain = cmp(post, cur) > 0 ? (post[0] - cur[0]) * 8 + (post[2] - cur[2]) * .3 : 0;
      const dmg = (old[0] - nw[0]) * 6 + (old[2] - nw[2]) * .2 + (rem.length ? 0 : 15);
      out.push({ sc: gain * .6 - 4 + (L.owner === p ? -dmg : dmg), size: post[0], lane, left, pos, oi });
    }
  }
  return out;
}
function botChoose(G, p) {
  const h = G.players[p].hand;
  const bp = botBestPlay(G, p); const bps = bp ? bp.inf[0] : 0;
  const sc = botScoutOptions(G, p);
  if (h.length > 4) {
    const better = sc.filter(s => s.size > bps);
    if (better.length) return { kind: "scout", ...better.sort((a, b) => (b.size - a.size) || (b.sc - a.sc))[0] };
  }
  if (bp) return { kind: "play", ...bp };
  if (sc.length) return { kind: "scout", ...sc.sort((a, b) => b.sc - a.sc)[0] };
  return null;
}
function botAccepts(h, card) {
  if (h.length <= 4) return false;
  const pos = bestInsert(h, card);
  return bestMeld([...h.slice(0, pos), card, ...h.slice(pos)])[0] > bestMeld(h)[0];
}
function botTurn(G) {
  const p = G.turn; const act = botChoose(G, p);
  if (!act) { addLog(G, `${G.players[p].name} could find nothing to dig.`); return nextTurn(G); }
  if (act.kind === "play") return doPlay(G, p, act.lane, act.s, act.e);
  const card = scoutTake(G, p, act.lane, act.left);
  const h = G.players[p].hand; h.splice(act.pos, 0, card);
  const offered = h.splice(act.oi, 1)[0];
  makeOffer(G, p, act.lane, card, offered);
}

// ===================== UI =====================
let G = null;
let ui = { sel: [], mode: null, scout: null, setupN: 3, open: {} };
let botTimer = null;
const root = typeof document !== "undefined" ? document.getElementById("root") : null;
const PCOL = ["var(--p0)", "var(--p1)", "var(--p2)", "var(--p3)"];

function resetUi() { ui.sel = []; ui.mode = null; ui.scout = null; }
function humanTurn() { return G && G.phase === "play" && G.players[G.turn].human && !ui.mode; }
function fullName(i) { const p = G.players[i]; return p.title ? `${p.title} ${p.name}` : p.name; }

function scheduleBot() {
  if (!G || botTimer) return;
  if (G.phase === "play" && !G.players[G.turn].human) {
    botTimer = setTimeout(() => { botTimer = null; botTurn(G); render(); scheduleBot(); }, 700);
  }
}

let FACES = null;
function symSvg(s, cls = "") { return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><use href="#sym-${SPECIES[s].key}"/></svg>`; }
function cardHtml(c, cls = "", attrs = "") {
  const s = SP(c), tip = SPECIES[s].name;
  const u = V(c) === 6 || V(c) === 9 ? ` class="u"` : "";
  const ix = ["tl", "tr", "bl", "br"].map(k => `<span class="ix ${k}"><b${u}>${V(c)}</b>${symSvg(s)}</span>`).join("");
  return `<div class="card f${c} ${cls}" style="--suit:${SPECIES[s].suit}" title="${tip}" ${attrs}>${ix}</div>`;
}
function buildFaces() {
  if (FACES || typeof document === "undefined") return;
  try {
    FACES = FossilArt.build(2);
    const css = Object.entries(FACES).map(([id, url]) => `.f${id}{background-image:url(${url})}`).join("\n");
    const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
    const sprite = document.createElement("div"); sprite.style.cssText = "position:absolute;width:0;height:0;overflow:hidden";
    sprite.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg">${SPECIES.map(sp => `<symbol id="sym-${sp.key}" viewBox="0 0 24 24"><path d="${sp.sym}"/></symbol>`).join("")}</svg>`;
    document.body.appendChild(sprite);
  } catch (e) { console.warn("fossil art failed", e); }
}

function seatHtml(i) {
  const p = G.players[i];
  const turn = (G.phase === "play" || G.phase === "offer") && G.turn === i;
  return `<div class="cell seat ${turn ? "turn" : ""}" style="--pc:${PCOL[i]}">
    <div class="name"><span class="dot"></span>${fullName(i)}${turn ? `<span class="turnflag">digging</span>` : ""}</div>
    <div class="score">${p.score}<span class="meta"> prestige</span></div>
    <div class="meta">${p.hand.length} fossil${p.hand.length === 1 ? "" : "s"} in the rock</div>
  </div>`;
}

function laneHtml(i) {
  const L = G.lanes[i];
  const mine = L.a === 0 || L.b === 0;
  const selCards = ui.sel.map(k => G.players[0].hand[k]);
  const selInf = selCards.length ? meldInfo(selCards) : null;
  const target = humanTurn() && mine && selInf && canPlayOn(G, i, selInf);
  const canScout = humanTurn() && mine && ui.sel.length === 0 && L.meld.length > 0;
  const oc = L.owner === null ? "var(--bone-edge)" : PCOL[L.owner];
  const cards = L.meld.map((v, k) => {
    const edge = canScout && (k === 0 || k === L.meld.length - 1);
    return cardHtml(v, edge ? "edge" : "", edge ? `data-act="scout" data-lane="${i}" data-left="${k === 0 ? 1 : 0}" role="button" tabindex="0" aria-label="Poach the ${cardName(v)}"` : "");
  }).join("");
  const label = G.n === 2 ? `Site ${["I", "II", "III"][i]}` : `${G.players[L.a].name} · ${G.players[L.b].name}`;
  const owner = L.owner === null ? `<span class="owner none">Unclaimed</span>` : `<span class="owner">${L.owner === 0 ? "Yours" : G.players[L.owner].name} · ${describe(L.meld)}</span>`;
  return `<div class="cell lane ${L.owner !== null ? "owned" : ""} ${target ? "target" : ""}" style="--oc:${oc}" ${target ? `data-act="playlane" data-lane="${i}" role="button" tabindex="0" aria-label="Excavate here"` : ""}>
    <div class="lbl">${label}</div>
    <div class="meld">${cards || `<span class="empty-note">untouched ground</span>`}</div>
    ${owner}
  </div>`;
}

function centerHtml() {
  const v = ROUND_VALUES[G.round];
  return `<div class="cell center">
    <div class="eyebrow">Season ${G.round + 1} of 3</div>
    <div class="big">${v}</div>
    <div class="small">prestige per site</div>
    <div class="small">finds up to ${ROUND_CAPS[G.round]} bones</div>
    <div class="seasons">${ROUND_VALUES.map((x, k) => `<span class="${k === G.round ? "on" : ""}">${x}</span>`).join("")}</div>
  </div>`;
}

function tableHtml() {
  const blank = `<div class="cell"></div>`;
  if (G.n === 2) return `<div class="table">${blank}${seatHtml(1)}${centerHtml()}${laneHtml(0)}${laneHtml(1)}${laneHtml(2)}${blank}${seatHtml(0)}${blank}</div>`;
  if (G.n === 3) return `<div class="table">${seatHtml(1)}${laneHtml(1)}${seatHtml(2)}${laneHtml(0)}${centerHtml()}${laneHtml(2)}${blank}${seatHtml(0)}${blank}</div>`;
  return `<div class="table">${laneHtml(1)}${seatHtml(2)}${laneHtml(2)}${seatHtml(1)}${centerHtml()}${seatHtml(3)}${laneHtml(0)}${seatHtml(0)}${laneHtml(3)}</div>`;
}

function statusHtml() {
  let who = "", hint = "";
  const me = G.players[0];
  if (G.phase === "offer" && G.offer && G.offer.to === 0) {
    who = `${fullName(G.offer.from)} sends you the ${cardName(G.offer.card)}`;
    hint = ui.mode === "placeReceived" ? "Tap a gap in your rock face to set it there." : "Keep it in your rock face, or turn it away and it is out of the dig this season.";
  } else if (G.phase !== "play") {
    who = "The season has closed";
  } else if (!G.players[G.turn].human) {
    who = `${fullName(G.turn)} is surveying…`;
    hint = "Keep an eye on the sites beside your camp.";
  } else if (ui.mode === "placeScout") {
    who = `Set the poached ${cardName(ui.scout.card)}`;
    hint = "Tap a gap in your rock face to place it.";
  } else if (ui.mode === "chooseOffer") {
    who = `Send a specimen to ${fullName(ui.scout.to)}`;
    hint = "Tap any fossil in your rock face, including the one you just poached. They can keep it or turn it away.";
  } else if (ui.sel.length) {
    const cards = ui.sel.map(k => me.hand[k]); const inf = meldInfo(cards);
    who = inf ? `Selected: ${describe(cards)}` : "Those bones don't belong together";
    const legal = inf ? myLanes(G, 0).filter(i => canPlayOn(G, i, inf)) : [];
    hint = !inf ? `A spine runs in order (3-4-5 or 5-4-3); a bone bed is all one number. Finds this season run up to ${CAP} bones.` :
      legal.length ? "Tap a highlighted site to excavate it there." : "It doesn't outshine any find beside your camp. Change the selection or poach instead.";
  } else {
    who = "Your turn to dig";
    hint = `Tap 1–${CAP} adjacent fossils to excavate a find, or tap an outlined end bone at a site beside you to poach it.`;
  }
  return `<div class="status" aria-live="polite"><div class="who">${who}</div><div class="hint">${hint}</div></div>`;
}

function handHtml() {
  const me = G.players[0];
  const placing = ui.mode === "placeScout" || ui.mode === "placeReceived";
  let inner = "";
  if (placing) {
    for (let k = 0; k <= me.hand.length; k++) {
      inner += `<div class="slot" data-act="slot" data-pos="${k}" role="button" tabindex="0" aria-label="Place here"></div>`;
      if (k < me.hand.length) inner += cardHtml(me.hand[k]);
    }
  } else {
    const clickable = humanTurn() || ui.mode === "chooseOffer";
    inner = me.hand.map((v, k) => cardHtml(v, `${ui.sel.includes(k) ? "sel" : ""} ${ui.mode === "chooseOffer" && ui.scout && k === ui.scout.pos ? "fresh-in" : ""}`,
      clickable ? `data-act="${ui.mode === "chooseOffer" ? "offer" : "pick"}" data-i="${k}" role="button" tabindex="0" aria-label="${cardName(v)}"` : "")).join("");
  }
  let actions = "";
  if (G.phase === "offer" && G.offer && G.offer.to === 0 && !ui.mode) {
    actions = `<button class="primary" data-act="accept">Keep the ${V(G.offer.card)}</button><button data-act="reject">Turn it away</button>`;
  } else if (ui.sel.length) {
    actions = `<button data-act="clear">Clear selection</button>`;
  }
  return `<div class="hand-wrap">
    <div class="hand-head"><span class="eyebrow">Your rock face · locked strata · ${me.hand.length} fossils</span><div class="actions">${actions}</div></div>
    <div class="hand">${inner || `<span class="empty-note">The rock face is clear.</span>`}</div>
  </div>`;
}

function overlayHtml() {
  if (G.phase !== "roundEnd" && G.phase !== "matchEnd") return "";
  const r = G.roundResult;
  const rows = G.players.map((p, i) => `<tr><td><span class="dot" style="--pc:${PCOL[i]}"></span> ${fullName(i)}</td>
    <td class="num">${r.held[i]}</td><td class="num">+${r.held[i] * r.value}</td><td class="num"><b>${p.score}</b></td></tr>`).join("");
  const head = `<table class="scores"><thead><tr><th>Digger</th><th class="num">Sites</th><th class="num">Season</th><th class="num">Prestige</th></tr></thead><tbody>${rows}</tbody></table>`;
  const shed = r.shedder === null ? "The season was called off." : (r.shedder === 0 ? "You finished your dig first." : `${fullName(r.shedder)} finished the dig first.`);
  if (G.phase === "roundEnd") {
    return `<div class="overlay"><div class="modal" role="dialog" aria-label="Season results">
      <div class="eyebrow">Season ${r.round + 1} closed</div><h2>${shed}</h2>${head}
      <p>Every site is cleared and each camp gets a fresh rock face of ${G.cfg.hand}. Next season, sites are worth ${ROUND_VALUES[r.round + 1]} prestige and finds may run up to ${ROUND_CAPS[r.round + 1]} bones.</p>
      <button class="primary" data-act="nextround">Open season ${r.round + 2}</button></div></div>`;
  }
  const st = standings(G);
  const names = st.winners.map(i => fullName(i));
  const title = names.length > 1 ? `${names.join(" and ")} share the honours` : (st.winners[0] === 0 ? "Your finds win the day" : `${names[0]} wins the day`);
  const tb = st.tiedOnPoints ? `<p>Tied on prestige, so the tiebreaker applied: most seasons closed by finishing your dig, then most prestige in the final season.</p>` : "";
  return `<div class="overlay"><div class="modal" role="dialog" aria-label="Final results">
    <div class="eyebrow">Three seasons complete</div><h2>${title}</h2>${head}${tb}
    <div class="actions"><button class="primary" data-act="again">Dig again</button><button data-act="setup">Change rivals</button></div></div></div>`;
}

function logHtml() {
  return `<div class="log"><div class="eyebrow">Field notes</div>${G.log.slice(0, 7).map(l => `<div class="row">${l}</div>`).join("")}</div>`;
}

function rulesHtml() {
  const c = G ? G.cfg : CONFIG[ui.setupN];
  return `<details class="rules" data-key="rules" ${ui.open.rules ? "open" : ""}><summary>Rules reference</summary><ul>
    <li><b>Your rock face is locked.</b> Fossils sit in the order they were dealt, and you can't rearrange them. It only changes when fossils come out or are set in.</li>
    <li><b>Excavate:</b> take adjacent fossils, up to the season's limit (3, then 4, then 5), that form a <i>spine</i> (consecutive numbers in order, like 3-4-5) or a <i>bone bed</i> (all the same number). Place the find at a site beside your camp. An unclaimed site takes any find. A claimed site, yours or a rival's, needs a find that outshines it: more bones, then a bone bed over a spine, then the higher total. The old find is discarded and the site is yours.</li>
    <li><b>Poach:</b> take an end bone from a find at a site beside your camp and set it anywhere in your rock face. Then send any fossil from your rock face to the rival across that site. They keep it or turn it away, and a turned-away fossil is out of the dig this season.</li>
    <li><b>Closing a season:</b> the moment a digger's rock face is empty. Each site you hold earns prestige: 1 in the first season, 2 in the second, 4 in the third.</li>
    <li><b>Between seasons:</b> every site and rock face is cleared, the deck is reshuffled, and each camp gets ${c.hand} fresh fossils.</li>
    <li><b>Deck:</b> remove the 8s and 9s for two diggers. Three and four diggers use all 54.</li>
    <li><b>Tiebreaker:</b> most seasons closed by finishing your dig, then most prestige in the final season.</li>
  </ul></details>`;
}

function catalogueHtml() {
  if (!FACES) return "";
  const slabs = SPECIES.map((sp, s) => `<figure class="slab">
      <div class="slab-grid">${[1,2,3,4,5,6,7,8,9].map(v => cardHtml(s * 10 + v)).join("")}</div>
      <figcaption><b style="--suit:${sp.suit}">${symSvg(s, "sym")}${sp.name}</b><span>${sp.rock}</span></figcaption>
    </figure>`).join("");
  return `<details class="rules catalogue" data-key="cat" ${ui.open.cat ? "open" : ""}><summary>The six skeletons</summary>
    <p class="cat-note">Every number is a bone, and the six copies of each number come from six different dinosaurs, each set in its own rock. Lay one species' 1 to 9 in three rows of three and the whole skeleton comes out of the slab. Species is only art; it never changes play. With two diggers the 8s and 9s stay in the box.</p>
    <div class="slabs">${slabs}</div></details>`;
}

function setupHtml() {
  const desc = { 2: "One rival · three sites between your camps · fossils 1–7 · 12 in your rock face", 3: "Two rivals · a site with each neighbor · fossils 1–9 · 11 in your rock face", 4: "Three rivals · a site with each neighbor · fossils 1–9 · 10 in your rock face" };
  return `<div class="top"><div><div class="eyebrow">Playtest table</div><h1>Diggers</h1>
    <p class="sub">Rival paleontologists, three field seasons, and dig sites that go to whoever brings up the finer skeleton.</p></div></div>
  <div class="setup">
    <div><div class="eyebrow">Diggers at the table</div><p style="margin:4px 0 0;color:var(--muted);font-size:14px">You take the bottom camp and bots run the rest. Sites earn 1, 2, then 4 prestige, and finds can run 3, then 4, then 5 bones.</p></div>
    <div class="choices">${[2,3,4].map(n => `<button class="choice ${ui.setupN === n ? "on" : ""}" data-act="pickn" data-n="${n}" aria-pressed="${ui.setupN === n}"><span class="n">${n}</span><span class="d">${desc[n]}</span></button>`).join("")}</div>
    <div class="actions"><button class="primary" data-act="start">Open the first season</button></div>
  </div>${rulesHtml()}${catalogueHtml()}`;
}

function render() {
  if (!root) return;
  if (!G) { root.innerHTML = setupHtml(); return; }
  root.innerHTML = `<div class="top"><div><div class="eyebrow">${G.n} diggers · playtest</div><h1>Diggers</h1></div>
    <button data-act="setup">New expedition</button></div>
    ${statusHtml()}${tableHtml()}${handHtml()}${logHtml()}${rulesHtml()}${catalogueHtml()}${overlayHtml()}`;
}

function onAct(t) {
  const act = t.dataset.act;
  if (act === "pickn") { ui.setupN = +t.dataset.n; return render(); }
  if (act === "start" || act === "again") { G = newGame(act === "again" ? G.n : ui.setupN, [0]); resetUi(); render(); return scheduleBot(); }
  if (act === "setup") { clearTimeout(botTimer); botTimer = null; G = null; resetUi(); return render(); }
  if (act === "nextround") { nextRound(G); resetUi(); render(); return scheduleBot(); }
  if (!G) return;
  const me = G.players[0];
  if (act === "pick" && humanTurn()) {
    const i = +t.dataset.i; let s = ui.sel;
    if (s.includes(i)) s = (i === s[0] || i === s[s.length - 1]) ? s.filter(x => x !== i) : [i];
    else if (s.length && s.length < CAP && (i === s[0] - 1 || i === s[s.length - 1] + 1)) s = [...s, i].sort((a, b) => a - b);
    else s = [i];
    ui.sel = s; return render();
  }
  if (act === "clear") { ui.sel = []; return render(); }
  if (act === "playlane" && humanTurn()) {
    const lane = +t.dataset.lane; const s = ui.sel[0], e = ui.sel[ui.sel.length - 1] + 1;
    ui.sel = []; doPlay(G, 0, lane, s, e); render(); return scheduleBot();
  }
  if (act === "scout" && humanTurn()) {
    const lane = +t.dataset.lane; const left = t.dataset.left === "1";
    const card = scoutTake(G, 0, lane, left);
    ui.scout = { lane, card, to: neighbor(G, lane, 0) }; ui.mode = "placeScout"; return render();
  }
  if (act === "slot") {
    const pos = +t.dataset.pos;
    if (ui.mode === "placeScout") { me.hand.splice(pos, 0, ui.scout.card); ui.scout.pos = pos; ui.mode = "chooseOffer"; return render(); }
    if (ui.mode === "placeReceived") { ui.mode = null; resolveOffer(G, true, pos); render(); return scheduleBot(); }
  }
  if (act === "offer" && ui.mode === "chooseOffer") {
    const i = +t.dataset.i; const offered = me.hand.splice(i, 1)[0];
    const sc = ui.scout; resetUi();
    makeOffer(G, 0, sc.lane, sc.card, offered); render(); return scheduleBot();
  }
  if (act === "accept" && G.phase === "offer") { ui.mode = "placeReceived"; return render(); }
  if (act === "reject" && G.phase === "offer") { resolveOffer(G, false); render(); return scheduleBot(); }
}

if (root) {
  root.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (t) onAct(t); });
  root.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.key; if (k) ui.open[k] = e.target.open; }, true);
  root.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-act]:not(button)")) { e.preventDefault(); onAct(e.target); } });
  const start = data => {
    if (data && data.G && data.G.players && data.G.players[0].title !== undefined) { G = data.G; ui.setupN = data.setupN || 3; CAP = ROUND_CAPS[G.round]; }
    render(); scheduleBot();
    // carve the fossil faces after first paint, then redraw with them
    setTimeout(() => { buildFaces(); render(); }, 30);
  };
  window.claude?.hot?.snapshot?.(() => ({ G, setupN: ui.setupN }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}
if (typeof module !== "undefined") module.exports = { newGame, botTurn, nextRound, standings, meldInfo, cmp, describe, V, SP, cardName };
</script>
