<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/css/fonts.css"><style>
html,body{margin:0;background:#000}
/* first player card ("Expedition Leader"), 2.5 x 3.5 in at 200 dpi, same frame as the field guide */
#c{width:500px;height:700px;position:relative;overflow:hidden;background:#f3ead3;color:#24180e;font-family:Spectral,serif}

.in{position:absolute;inset:44px 44px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

p{margin:0;font-size:18px;line-height:1.35;max-width:340px}
.foot{margin-top:auto;font-family:"IM Fell English";font-style:italic;font-size:16px;color:#4a3826}
