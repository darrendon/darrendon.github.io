<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/css/fonts.css"><style>
html,body{margin:0;background:#000}
/* tuck-box long side: 92 x 32 mm, at 1200 x 417 */
#s{width:1200px;height:417px;background:#24180e;position:relative;overflow:hidden;color:#f6efdc}
#s .in{position:absolute;inset:22px;border:3px solid #f6efdc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#s .in::after{content:"";position:absolute;inset:8px;border:1.5px solid rgba(246,239,220,.55)}
#s h1{margin:0;font-family:Rye;font-weight:400;font-size:150px;letter-spacing:5px;line-height:1}
#s .ln{display:flex;align-items:center;gap:26px;font-family:"IM Fell English SC";font-size:34px;letter-spacing:4px;color:#e9c99a;white-space:nowrap}
#s .sy{display:flex;gap:10px}#s .sy svg{width:40px;height:40px;stroke:#f6efdc;stroke-width:1}
</style></head><body><div id="s"><div class="in"><h1>DIGGERS</h1><div class="ln"><span>2–4 diggers · 15–20 min</span><span class="sy" id="sy"></span><span>by Darren Don</span></div></div></div>
<script src="fossil-art.js"></script><script>document.getElementById('sy').innerHTML=SPECIES.map(sp=>`<svg viewBox="0 0 24 24"><path d="${sp.sym}" fill="${sp.suit}" fill-rule="evenodd"/></svg>`).join('');document.fonts.ready.then(()=>window.__done=true)</script></body></html>
