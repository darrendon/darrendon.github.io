<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
html,body{margin:0;background:#000}
/* 4.5 x 6 in lid at 200 dpi */
#box{width:900px;height:1200px;position:relative;overflow:hidden;color:#24180e}
#box canvas{position:absolute;left:0;top:-30px}
.vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0) 55%,rgba(20,8,2,.45))}
.frame{position:absolute;inset:26px;border:4px solid #f8f1de;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.frame::after{content:"";position:absolute;inset:9px;border:1.5px solid rgba(248,241,222,.7)}
.plate{position:absolute;left:76px;right:76px;bottom:70px;background:#f6efdc;border:4px solid #24180e;padding:26px 30px 24px;text-align:center;
  box-shadow:0 14px 30px rgba(0,0,0,.45)}
.plate::before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(36,24,14,.55);pointer-events:none}
.kick{font-family:"IM Fell English SC";font-size:30px;letter-spacing:6px;color:#8a3a26}
h1{margin:6px 0 2px;font-family:Rye;font-weight:400;font-size:132px;line-height:1;letter-spacing:3px}
.tag{font-family:"IM Fell English";font-style:italic;font-size:36px;color:#4a3826}
.by{margin-top:8px;font-family:"IM Fell English SC";font-size:27px;letter-spacing:4px;color:#8a3a26}
.row{display:flex;justify-content:space-around;margin-top:16px;padding-top:12px;border-top:2px solid #24180e;font-family:"IM Fell English SC";font-size:28px;letter-spacing:3px}
.syms{position:absolute;top:58px;left:0;right:0;display:flex;justify-content:center;gap:18px}
.syms svg{width:46px;height:46px;stroke:#24180e;stroke-width:.9;filter:drop-shadow(0 0 1.4px #f8f1de) drop-shadow(0 0 1.4px #f8f1de) drop-shadow(0 3px 4px rgba(0,0,0,.4))}
</style></head><body>
<div id="box"><div class="vig"></div><div class="frame"></div><div class="syms" id="syms"></div>
  <div class="plate">
    <div class="kick">The great bone rush of 1877</div>
    <h1>DIGGERS</h1>
    <div class="tag">Rival excavations in three field seasons</div>
    <div class="by">A game by Darren Don</div>
    <div class="row"><span>2–4 diggers</span><span>15–20 minutes</span></div>
  </div>
</div>
<script src="fossil-art.js"></script>
<script>
document.fonts.ready.then(() => {
  const s = 1230 / 420, cv = FossilArt.slab(0, s, 6);
  cv.style.left = ((900 - cv.width) / 2) + 'px';
  document.getElementById('box').prepend(cv);
  document.getElementById('syms').innerHTML = SPECIES.map(sp => `<svg viewBox="0 0 24 24"><path d="${sp.sym}" fill="${sp.suit}" fill-rule="evenodd"/></svg>`).join('');
  window.__done = true;
});
</script>
</body></html>
