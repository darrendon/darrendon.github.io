<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/css/fonts.css"><style>
html,body{margin:0;background:#000}
/* dig-site marker: a thin surveyor's strip, 4 x 0.4 in at 200 dpi */
#m{width:800px;height:80px;position:relative;overflow:hidden;background:linear-gradient(#ead9b2,#dcc697);color:#24180e}
#m .t{position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,#24180e 0 2px,transparent 2px 20px)}
#m .t2{position:absolute;left:0;right:0;top:0;height:36px;background:repeating-linear-gradient(90deg,#24180e 0 3px,transparent 3px 100px)}
#m span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:Rye;font-size:34px;letter-spacing:10px;line-height:1}
#m::after{content:"";position:absolute;inset:0;border:3px solid #24180e}
</style></head><body><div id="m"><div class="t"></div><div class="t2"></div><span>DIG SITE</span></div><script>document.fonts.ready.then(()=>window.__done=true)</script></body></html>
