    const len = 3.0, rmax = 0.82;

  function fish() {

      let s = 9; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280; for (let i = 0; i < 150; i++) { const x = r() * w, y = r() * h; g.beginPath(); g.moveTo(x - 6, y - 4); g.lineTo(x, y + 3); g.lineTo(x + 6, y - 4); g.stroke(); } });

  // butterfly: felt wings cut from the card art's own outline, lying flat
  function parsePath(d, sx = 1) {

  function butterfly() {

    const head = sph(.22, bm); head.position.set(0, .34, -.86); grp.add(head);

  const BW = 8, BH = 3, BD = 8;

    for (const [n, x, z, yaw] of [['cat', 5.6, -4.6, -0.35], ['bird', 1.6, -4.4, -0.5], ['fly', 9.7, -3.4, 0.25], ['ball', 1.4, 0.9, 0], ['fish', 5.4, 0.9, 0.25], ['mouse', 9.7, 1.4, 2.75]]) onBlanket(toy(n, x, z, yaw));

  let vignette = null;

    const vc = document.createElement('canvas'); vc.width = 800; vc.height = 500; const vg = vc.getContext('2d');
