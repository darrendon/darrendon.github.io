<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Down for the Count — play in your browser</title>
<meta name="description" content="Down for the Count — a wrestling climbing card game. Play 2 to 5 players against bots in your browser.">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
/* Layout: a ring seen from the cheap seats. Opponents sit along the top, the move on the table sits on the canvas
   inside the ropes, and your hand and stamina run along the bottom. Colours come from the cards and the box. */
:root {
  --night: #101a3d; --night-2: #17234f; --star: rgba(255, 214, 48, .55);
  --ink: #1c1530; --paper: #fffcf4; --canvas: #f6f1e4; --muted: #b9c0dc;
  --crimson: #cc162c; --crimson-d: #800816; --gold: #ffd630; --blue: #2f7bff;
  --line: rgba(255, 255, 255, .14);
  --display: "Archivo", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", "Archivo", system-ui, sans-serif;
  --hard: 4px 4px 0 var(--ink);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  background-color: var(--night);
  background-image: radial-gradient(var(--star) 1.2px, transparent 1.6px), radial-gradient(var(--star) 1.2px, transparent 1.6px),
    radial-gradient(120% 80% at 50% 0%, var(--night-2), var(--night) 70%);
  background-size: 44px 44px, 44px 44px, 100% 100%; background-position: 0 0, 22px 22px, 0 0;
  color: var(--paper); font-family: var(--body); font-size: 15px; line-height: 1.4;
}
.wrap { max-width: 1000px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { font-family: var(--display); font-weight: 900; font-stretch: 112%; font-style: italic; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
button { font: 800 14px/1 var(--display); font-stretch: 108%; letter-spacing: .02em; text-transform: uppercase; border-radius: 10px; border: 3px solid var(--ink);
  background: var(--paper); color: var(--ink); padding: 11px 14px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
button:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.go { background: var(--crimson); color: var(--paper); }
button.gold { background: var(--gold); }
button.ghost { background: transparent; color: var(--paper); border-color: var(--line); box-shadow: none; text-transform: none; font-weight: 700; }
button:focus-visible, .card:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 900; font-style: italic; font-stretch: 112%; font-size: 26px; line-height: .95; color: var(--paper); text-shadow: 2px 2px 0 var(--crimson), 4px 4px 0 var(--ink); }
.logo small { display: block; font-size: 12px; font-style: normal; font-weight: 700; letter-spacing: .14em; color: var(--gold); text-shadow: none; margin-top: 4px; }
.top .right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font: 800 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; background: var(--gold); color: var(--ink); border: 3px solid var(--ink); border-radius: 999px; padding: 7px 12px; }

/* seats */
.seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.seat { position: relative; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 9px 11px 10px; box-shadow: var(--hard); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.seat .nm { display: flex; align-items: center; gap: 7px; font: 900 16px/1.1 var(--display); font-stretch: 106%; min-width: 0; }
.seat .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); border: 2px solid var(--ink); flex: none; }
.seat .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 13px; font-weight: 600; }
.seat .pts { font: 900 18px/1 var(--display); font-variant-numeric: tabular-nums; }
.seat.turn { outline: 4px solid var(--gold); outline-offset: 2px; }
.seat.owner::after { content: "ON THE TABLE"; position: absolute; top: -11px; right: 10px; font: 900 10.5px/1 var(--display); letter-spacing: .06em; background: var(--crimson); color: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 3px 6px; }
.seat.out { opacity: .55; }
.badge { font: 900 11px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; border: 2px solid var(--ink); border-radius: 6px; padding: 3px 6px; background: var(--ink); color: var(--gold); }
.counts { display: flex; gap: 4px; align-items: center; min-height: 30px; }
.counts img { width: 21px; height: 30px; border-radius: 3px; border: 1.5px solid var(--ink); display: block; }
.counts .none { font-size: 12px; font-weight: 700; color: var(--crimson); }
.lbl { font: 800 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: #6b6488; }

/* comic callout above a seat */
.pop { position: absolute; left: 50%; top: -18px; transform: translate(-50%, -50%) rotate(-4deg); z-index: 5; pointer-events: none;
  font: 900 15px/1 var(--display); font-style: italic; font-stretch: 110%; color: var(--ink); background: var(--gold); border: 3px solid var(--ink); border-radius: 10px;
  padding: 6px 10px; white-space: nowrap; box-shadow: 3px 3px 0 var(--ink); animation: pop .9s ease-out forwards; }
.you.tutmode { position: relative; }
.you.tutmode .pop { top: 6px; }
@keyframes pop { 0% { transform: translate(-50%, -30%) scale(.4) rotate(-12deg); opacity: 0; } 18% { transform: translate(-50%, -50%) scale(1.15) rotate(-4deg); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -80%) scale(1) rotate(-4deg); opacity: 0; } }

/* the ring */
.ring { position: relative; border-radius: 18px; padding: 14px; background: #c41a2f; border: 3px solid var(--ink); box-shadow: var(--hard); }
.ring .mat { position: relative; background: var(--canvas); border-radius: 8px; border: 3px solid var(--ink); min-height: 230px; padding: 14px 14px 12px;
  box-shadow: inset 0 0 0 6px var(--paper), inset 0 0 0 9px var(--blue), inset 0 0 0 12px var(--paper), inset 0 0 0 15px var(--crimson);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--ink); text-align: center; }
.ring .post { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); border: 3px solid var(--ink); }
.post.tl { left: 2px; top: 2px; } .post.tr { right: 2px; top: 2px; } .post.bl { left: 2px; bottom: 2px; } .post.br { right: 2px; bottom: 2px; }
.status { font: 900 20px/1.15 var(--display); font-stretch: 108%; max-width: 40ch; padding-inline: 18px; }
.hint { font-size: 13.5px; font-weight: 600; color: #4d4668; max-width: 56ch; padding-inline: 18px; min-height: 19px; }
.tablecards { display: flex; gap: 8px; justify-content: center; min-height: 128px; align-items: center; flex-wrap: wrap; }
.tablecards .empty { font: 800 14px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: #8d86a8; border: 3px dashed #c9c2b0; border-radius: 10px; padding: 46px 22px; }
.aside { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #6b6488; }
.aside img { width: 24px; height: 34px; border-radius: 3px; border: 1.5px solid var(--ink); }

/* cards */
.card { width: 88px; aspect-ratio: 5 / 7; border-radius: 9px; display: block; position: relative; flex: none; background: none; padding: 0; border: 0; cursor: default; }
.card img { width: 100%; height: 100%; display: block; border-radius: 9px; box-shadow: 0 2px 0 var(--ink), 0 8px 14px -8px rgba(0, 0, 0, .6); user-select: none; -webkit-user-drag: none; }
.tablecards .card { width: 92px; animation: slam .32s cubic-bezier(.2, 1.6, .4, 1) both; }
.tablecards .card:nth-child(2) { animation-delay: .04s; } .tablecards .card:nth-child(3) { animation-delay: .08s; } .tablecards .card:nth-child(4) { animation-delay: .12s; }
@keyframes slam { from { transform: translateY(-26px) scale(1.25) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
.card.pick { cursor: pointer; }
.card.pick img { box-shadow: 0 0 0 4px var(--gold), 0 0 0 7px var(--ink), 0 8px 14px -8px rgba(0, 0, 0, .6); }
.card.pick:hover { transform: translateY(-4px); }

/* you */
.you { background: var(--night-2); border: 3px solid var(--ink); border-radius: 18px; box-shadow: var(--hard); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.you.turn { outline: 4px solid var(--gold); outline-offset: 2px; }
.you .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.you .head .nm { font: 900 19px/1 var(--display); font-style: italic; font-stretch: 110%; display: flex; gap: 10px; align-items: center; }
.you .head .meta { display: flex; gap: 14px; align-items: center; font-size: 13px; font-weight: 600; color: var(--muted); }
.you .counts img { width: 26px; height: 37px; border-color: var(--paper); }
.you .counts .none { color: var(--gold); }
.hand { display: flex; justify-content: center; padding: 18px 6px 4px; min-height: 140px; }
.hand .card { flex: 0 1 88px; min-width: 0; width: auto; cursor: pointer; transition: transform .12s; }
.hand .card img { width: 88px; height: auto; aspect-ratio: 5 / 7; max-width: none; }
.hand .card:hover img { transform: translateY(-6px); }
.hand .card.sel img { transform: translateY(-18px); box-shadow: 0 0 0 4px var(--gold), 0 0 0 7px var(--ink), 0 12px 16px -8px rgba(0, 0, 0, .7); }
.hand.locked .card { cursor: default; }
.hand.locked .card:hover img { transform: none; }
.hand .last { flex: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; min-height: 30px; }
.chips .lbl { color: var(--muted); margin-right: 2px; }
.chip { font: 800 13px/1 var(--display); padding: 7px 10px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--paper); box-shadow: none; text-transform: none; letter-spacing: 0; }
.chip:hover:not(:disabled) { border-color: var(--gold); transform: none; box-shadow: none; }

/* log + rules */
.lower { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.lower.two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.panel { background: rgba(10, 16, 40, .7); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.panel h3 { font-size: 16px; color: var(--gold); margin-bottom: 8px; }
.log { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 4px; font-size: 13.5px; }
.log li { padding: 3px 0 3px 10px; border-left: 3px solid var(--pc, var(--line)); color: #dfe3f4; }
.log li.round, .log li.win { border-left-color: var(--gold); color: var(--gold); font-weight: 700; }
.log li.out { color: #ff9aa5; font-weight: 700; }
.rules { font-size: 13.5px; color: #dfe3f4; display: flex; flex-direction: column; gap: 6px; }
.rules p { margin: 0; }
.rules b { color: var(--paper); }
@media (max-width: 760px) { .lower.two { grid-template-columns: 1fr; } }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(8, 12, 30, .72); display: grid; place-items: center; padding: 16px; z-index: 40; }
.overlay[hidden] { display: none; }
.modal { width: min(560px, 100%); background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 var(--ink); padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 32px); overflow-y: auto; }
.modal h2 { font-size: 30px; line-height: 1; color: var(--crimson); }
.modal p { margin: 0; }
.standings { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.standings th { font: 800 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: #6b6488; text-align: left; padding: 6px 4px; border-bottom: 2px solid var(--ink); }
.standings td { padding: 7px 4px; border-bottom: 1px solid #e3dccb; font-variant-numeric: tabular-nums; }
.standings td.num, .standings th.num { text-align: right; }
.standings tr.me td { font-weight: 800; }
.standings tr.lead td:first-child::after { content: " ★"; color: var(--crimson); }
.pick-n { display: flex; gap: 8px; flex-wrap: wrap; }
.pick-n button { min-width: 54px; font-size: 18px; }
.pick-n button[aria-pressed="true"] { background: var(--gold); }
.setup-note { font-size: 14px; color: #4d4668; }

/* setup screen */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; padding: 10px 0 4px; }
.hero h1 { font-size: clamp(40px, 7vw, 72px); line-height: .9; color: var(--paper); text-shadow: 3px 3px 0 var(--crimson), 6px 6px 0 var(--ink); }
.hero p.tag { font-size: 17px; color: #dfe3f4; margin: 14px 0 0; max-width: 40ch; }
.fan { display: flex; justify-content: center; }
.fan img { width: min(26%, 120px); aspect-ratio: 5 / 7; border-radius: 10px; box-shadow: 4px 4px 0 var(--ink); }
.fan img + img { margin-left: 8px; }
.fan img:nth-child(1) { transform: rotate(-8deg) translateY(10px); } .fan img:nth-child(3) { transform: rotate(7deg) translateY(8px); }
.startbox { background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 18px; box-shadow: var(--hard); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.startbox h2 { font-size: 22px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .card, .hand .card img { width: 64px; } .tablecards .card { width: 70px; } .hand .card { flex-basis: 64px; } .status { font-size: 17px; } }
/* tutorial: entry on the setup screen, the coach, and what it points at */
.learn { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; background: #fff1b8; border: 3px solid var(--ink); border-radius: 12px; padding: 12px 14px; }
.learn h2 { font-size: 20px; color: var(--crimson); }
.learn p { margin: 3px 0 0; font-size: 14px; color: #4d4668; max-width: 52ch; }
.coach { position: relative; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-left-width: 10px; border-left-color: var(--crimson); border-radius: 14px; box-shadow: var(--hard); padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 7px; margin-bottom: 8px; }
.coach .ctop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.coach .who { white-space: nowrap; font: 900 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--gold); border-radius: 6px; padding: 4px 7px; }
.coach .prog { flex: 0 1 140px; min-width: 36px; height: 8px; border-radius: 99px; background: #e3dccb; border: 2px solid var(--ink); overflow: hidden; }
.coach .prog i { display: block; height: 100%; background: var(--crimson); }
.coach h3 { font-size: 20px; line-height: 1.05; color: var(--crimson); }
.coach p { margin: 0; font-size: 15px; line-height: 1.45; max-width: 68ch; }
.coach p b { font-weight: 800; }
.coach .cact { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-top: 2px; }
.coach .cue { font: 800 12px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--crimson); }
.coach .cue.wait { color: #6b6488; }
.coach .exit { background: none; border: 0; box-shadow: none; padding: 6px 2px; color: #6b6488; font: 600 13px/1 var(--body); text-transform: none; letter-spacing: 0; text-decoration: underline; text-underline-offset: 3px; margin-left: auto; }
.coach .exit:hover:not(:disabled) { color: var(--ink); transform: none; box-shadow: none; }
.tut-spot { outline: 4px solid var(--gold) !important; outline-offset: 3px; animation: tutring 1.3s ease-in-out infinite; }
@keyframes tutring { 50% { outline-offset: 7px; outline-color: rgba(255, 214, 48, .45); } }
.hand .card.tut img { box-shadow: 0 0 0 4px var(--gold), 0 0 0 7px var(--ink), 0 8px 14px -8px rgba(0, 0, 0, .6); animation: tutbob 1.1s ease-in-out infinite; }
@keyframes tutbob { 50% { transform: translateY(-9px); } }
.tablecards .card.pick.tut img { animation: tutbob 1.1s ease-in-out infinite; }
.finish p { font-size: 15px; }
.finish .actions { justify-content: flex-start; }
.finish button.plain { background: transparent; box-shadow: none; border-color: transparent; text-decoration: underline; text-underline-offset: 3px; text-transform: none; font-weight: 700; padding-inline: 6px; }
@media (max-width: 760px) { .coach h3 { font-size: 18px; } .coach p { font-size: 14.5px; } .learn h2 { font-size: 18px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* online tables: the menu box, the lobby, and the strip of table notices above the seats */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field input, .codein, .linkrow input { font: 700 16px/1.2 var(--body); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.field input:focus-visible, .codein:focus-visible, .linkrow input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.field input { max-width: 320px; }
.codein { font: 900 19px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; width: 7.4em; }
.codein::placeholder { color: #b3abc4; letter-spacing: .08em; }
.online-row { display: flex; gap: 12px 22px; flex-wrap: wrap; align-items: center; }
.joinrow { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.online h2 small { display: block; font: 600 14px/1.4 var(--body); font-style: normal; color: #4d4668; margin-top: 4px; letter-spacing: 0; }
.netmsg { font-size: 14px; font-weight: 700; color: var(--crimson-d); min-height: 1px; margin: 0; }
.netmsg:empty { display: none; }
.tablehead { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; background: #fff1b8; border: 3px solid var(--ink); border-radius: 12px; padding: 12px 14px; }
.tcode { font: 900 46px/1 var(--display); font-style: italic; font-stretch: 112%; letter-spacing: .1em; color: var(--crimson); margin-top: 4px; }
.linkrow { display: flex; gap: 8px; min-width: 0; }
.linkrow input { flex: 1 1 auto; font-size: 14px; font-weight: 600; }
.corners { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.corner { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; border: 3px solid var(--ink); border-radius: 12px; padding: 8px 10px; background: #fff; }
.corner .dot { background: var(--pc); }
.corner .who { font: 900 16px/1.15 var(--display); font-stretch: 106%; flex: 1 1 8em; min-width: 0; overflow-wrap: anywhere; }
.corner .state { font-size: 13px; font-weight: 600; color: #4d4668; }
.corner button, .netbar button { padding: 7px 10px; font-size: 12px; box-shadow: 2px 2px 0 var(--ink); }
.corner.empty { border-style: dashed; background: transparent; }
.startrow { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.startrow .setup-note { flex: 1 1 16em; }
i.tag { font: 900 10px/1 var(--display); font-style: normal; letter-spacing: .06em; text-transform: uppercase; border: 2px solid var(--ink); border-radius: 6px; padding: 2px 5px; background: var(--canvas); color: #4d4668; flex: none; white-space: nowrap; }
i.tag.away { background: var(--crimson); color: var(--paper); }
.netbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: rgba(10, 16, 40, .78); border: 2px solid var(--gold); border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.netbar span { flex: 1 1 14em; }
.pill.code { background: var(--paper); cursor: pointer; box-shadow: none; text-transform: uppercase; }
@media (max-width: 760px) { .tcode { font-size: 38px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="overlay" id="ov" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ov-h" id="ov-body"></div></div>
<div class="sr" aria-live="polite" id="live"></div>

<script src="engine.js"></script>
<script>
/* ============================================================ NET (same relay pattern as Dim Sum Rush and Too Many Crooks)
   Host (you + friends through a public MQTT relay + bots) and Guest (thin client). The host's browser runs the engine and
   the bots; each guest only ever receives their own player view: their hand, everyone's hand sizes and stamina counts,
   and what's on the table. Other hands, every stamina card (your own too) and the set-aside cards stay on the host. */
(function (root) {
  'use strict';
  const E = root.DFTC;
  const BOT_NAMES = ['Hacksaw Hal', 'The Duchess', 'Rocket Ruiz', 'Big Moe'];

  // ---------------- Relay transport (MQTT over WebSockets, public brokers) ----------------
  // Every message goes through a broker, so no peer-to-peer connection is needed and NAT/firewalls don't matter.
  // ?relay=local swaps in a BroadcastChannel relay with the same client API, so pages in one browser can play each other.
  const LOCAL = /[?&]relay=local\b/.test(location.search);
  const BROKERS = LOCAL ? [{ key: 'L', url: 'local', name: 'Local test relay' }] : [
    { key: 'E', url: 'wss://broker.emqx.io:8084/mqtt', name: 'EMQX' },
    { key: 'H', url: 'wss://broker.hivemq.com:8884/mqtt', name: 'HiveMQ' },
    { key: 'M', url: 'wss://test.mosquitto.org:8081', name: 'Mosquitto' },
  ];

    else if (pending && g.turn === me) { status = 'Sending your move…'; hint = cur ? E.beatHint(cur, g.top) : ''; }

      if (g.phase === 'takeback') { status = 'Nobody touched your move. Take one card back.'; hint = 'Click a highlighted card on the table.'; }

    else if (net && g.seats && g.seats[g.turn].away && !g.seats[g.turn].cover) { status = g.names[g.turn] + ' is away. Waiting for them…'; hint = cur ? E.beatHint(cur, g.top) : ''; }
    else { status = g.names[g.turn] + (g.phase === 'open' ? ' is opening…' : ' is thinking…'); hint = cur ? E.beatHint(cur, g.top) : ''; }

    const td = tut ? tutDo() : null; // in the tutorial only the taught move is allowed
    const picks = mine && (!tut || (td && (td.type === 'takeback' || td.type === 'reverse'))) ? (g.phase === 'takeback' ? o.takeback : mode === 'reverse' ? o.reverse : []) : [];
    const used = {};
    const tcards = cur ? cur.cards.map((r, i) => {
      const end = cur.type === 'run' ? (i === 0 || i === cur.cards.length - 1) : true;
      const can = picks.includes(r) && end && !used[r];
      if (can && cur.type === 'set') used[r] = true;
      return cardImg(r, can ? 'pick' : '', can ? 'role="button" tabindex="0" data-take="' + r + '" aria-label="Take the ' + r + '"' : '');
    }).join('') : '<span class="empty">Open mat</span>';
    const ownerName = cur ? (g.owner === -1 ? 'left by a wrestler who’s out' : g.owner === me ? 'your move' : g.names[g.owner] + '’s move') : '';

    const handLocked = !mine || g.phase === 'takeback' || mode === 'reverse' || (tut && !(td && td.type === 'play'));
    const hand = g.hands[me].map((r, i, h) => '<button type="button" class="card' + (i === h.length - 1 ? ' last' : '') + (sel.includes(i) ? ' sel' : '') + '" data-i="' + i + '" aria-pressed="' + sel.includes(i) + '" aria-label="' + r + '"' + (handLocked ? ' tabindex="-1"' : '') + '><img src="' + IMG + 'card-' + r + '.webp" alt="" width="240" height="336"></button>').join('');

    let actions = '', chips = '';
    if (mine && g.phase !== 'takeback') {

      else {
        const m = E.classify(sel.map((i) => g.hands[me][i]));

        if (tut && legal && !(td && td.type === 'play' && sameCards(td.cards, m.cards))) legal = false;
        const label = !sel.length || (tut && !legal) ? 'Play' : !m ? 'Not a set or run' : !legal ? 'Doesn’t beat it' : 'Play ' + E.describe(m) + (m.size === g.hands[me].length ? ' (taps you out)' : '');
        actions = '<button type="button" class="go" id="play"' + (legal ? '' : ' disabled') + '>' + esc(label) + '</button>';

        if (g.phase === 'answer') chips = plays.length ? '<span class="lbl">Beats it:</span>' + plays.slice(0, 10).map((m, k) => '<button type="button" class="chip" data-chip="' + k + '"' + (tut && !(td && td.type === 'play' && sameCards(td.cards, m.cards)) ? ' disabled' : '') + '>' + esc(E.describe(m)) + '</button>').join('') + (plays.length > 10 ? '<span class="lbl">+' + (plays.length - 10) + ' more</span>' : '')
          : '<span class="lbl">' + (g.counts[me].length ? 'Nothing in your hand beats it. Reverse or kick out.' : 'Nothing beats it and no stamina left.') + '</span>';
        app._plays = plays;
      }
    }

    const youOut = g.status[me] !== 'in';
    app.innerHTML =
      '<div class="top"><div class="logo">Down for the Count<small>BY DARREN DON</small></div><div class="right">' +
      (net ? '<button type="button" class="pill code" id="codepill" title="Copy the link to this table">Table ' + esc(net.code) + '</button>' : '') +
      '<span class="pill">' + (tut ? 'Tutorial' : 'Round ' + g.round + ' of ' + g.rounds) + '</span>' +
      '<button type="button" class="ghost" id="rulesbtn">' + (showRules ? 'Hide rules' : 'Rules') + '</button>' +
      (net ? '<button type="button" class="ghost" id="leave">Leave table</button>' : '<button type="button" class="ghost" id="new">' + (tut ? 'Exit tutorial' : 'New match') + '</button>') + '</div></div>' +
      (net ? netBar() : '') +
      '<div class="seats">' + seats.join('') + '</div>' +
      '<div class="ring"><span class="post tl"></span><span class="post tr"></span><span class="post bl"></span><span class="post br"></span><div class="mat">' +
      '<div class="status" id="status">' + esc(status) + '</div>' +
      '<div class="tablecards">' + tcards + '</div>' +
      '<div class="hint">' + esc(cur ? E.describe(cur).replace(/^./, (c) => c.toUpperCase()) + ', ' + ownerName + (g.touched && g.owner !== -1 ? ' (reversed)' : '') + '. ' : '') + esc(hint) + '</div>' +
      (g.aside ? '<div class="aside"><img src="' + IMG + 'back.webp" alt="" width="240" height="336">' + g.aside + ' set aside</div>' : '') +
      '</div></div>' + (tut ? coachHtml() : '') +
      '<div class="you' + (mine ? ' turn' : '') + (tut ? ' tutmode' : '') + '" style="--pc:' + COLORS[me] + '">' +
      '<div class="head"><div class="nm"><span class="dot" style="--pc:' + COLORS[me] + '"></span>You' + (net ? ' <i class="tag">' + esc(g.names[me]) + '</i>' : '') + (youOut ? ' <span class="badge">' + (g.status[me] === 'pinned' ? 'Pinned' : 'Tapped out') + '</span>' : '') + '</div>' +
      '<div class="meta"><span>Your stamina</span><div class="counts">' + backs(g.counts[me].length) + '</div><span>' + g.hands[me].length + (g.hands[me].length === 1 ? ' card' : ' cards') + '</span><span>' + g.scores[me] + ' pts</span></div></div>' +
      '<div class="hand' + (handLocked ? ' locked' : '') + '">' + (hand || '<span class="lbl" style="align-self:center">No cards</span>') + '</div>' +
      (actions ? '<div class="actions">' + actions + '</div>' : '') + (chips ? '<div class="chips">' + chips + '</div>' : '') +
      '</div>' +
      '<div class="lower' + (showRules ? ' two' : '') + '"><div class="panel"><h3>Ringside log</h3><ul class="log">' + logHtml() + '</ul></div>' + rulesPanel(showRules) + '</div>';

    // pops
    pops.forEach((x) => {
      const el = x.p === me ? app.querySelector('.you') : app.querySelector('.seat[data-p="' + x.p + '"]');
      if (el && x.word) { const s = document.createElement('span'); s.className = 'pop'; s.textContent = x.word; el.appendChild(s); }
    });
    pops = [];
    let said = '';
    if (g.logN != null) { // online views carry the last 60 lines and the full count
      if (g.logN < lastLog) lastLog = 0;
      if (g.logN > lastLog) { said = g.log.slice(-Math.min(g.log.length, g.logN - lastLog)).map((l) => l.text).join(' '); live.textContent = said; lastLog = g.logN; }
    } else if (g.log.length > lastLog) { said = g.log.slice(lastLog).map((l) => l.text).join(' '); live.textContent = said; lastLog = g.log.length; }
    wire();
    if (tut) tutDecorate(said);
  }
  function seatHtml(p) {
    const st = g.status[p], cls = ['seat'];
    if (g.turn === p && !g.roundOver && st === 'in') cls.push('turn');

    if (st !== 'in') cls.push('out');
    let tag = '';

  }
  function rulesPanel(open) {
    if (!open) return '';

      '<p><b>Moves</b> are 1–4 cards: a <b>set</b> (same rank) or a <b>run</b> (2–4 in a row).</p>' +
      '<p><b>To beat a move</b>: more cards wins; at equal size a set beats a run; then the higher rank (runs by their top card).</p>' +

  function wire() {
    const on = (id, f) => { const el = document.getElementById(id); if (el) el.addEventListener('click', f); };

    on('tnext', tutNext);

    on('play', () => { const cards = sel.map((i) => g.hands[me][i]); human({ type: 'play', cards }); });
    on('kick', () => human({ type: 'kickout' }));
    on('rev', () => { const o = E.options(g); if (o.reverse.length === 1) human({ type: 'reverse', rank: o.reverse[0] }); else { mode = 'reverse'; sel = []; render(); } });

  }

  // ---------------------------------------------------------------- end of round / match
  function roundModal() {
    const h = g.history[g.history.length - 1];
    const order = h.order.slice().reverse();
    const lead = Math.max.apply(null, g.scores);
    const rows = order.map((p, i) => '<tr class="' + (p === me ? 'me ' : '') + (g.over && g.scores[p] === lead ? 'lead' : '') + '"><td>' + (i + 1) + '. ' + esc(g.names[p]) + (net && p === me ? ' (you)' : '') + '</td><td>' +

      title = ch.length > 1 ? 'Shared win!' : ch[0] === me ? 'You win the match!' : g.names[ch[0]] + ' wins the match';
      line = ch.length > 1 ? ch.map((p) => g.names[p]).join(' & ') + ' tie on ' + lead + ' points and share the belt.' : 'Final score after three rounds: ' + lead + ' points.';
    } else {
      title = (g.winner === me ? 'You win' : g.names[g.winner] + ' wins') + ' round ' + g.round;
      line = (g.winner === me ? 'You open' : g.names[g.winner] + ' opens') + ' round ' + (g.round + 1) + '.';
    }
    let buttons;
    if (!net) buttons = g.over ? '<button type="button" class="go" id="again">Rematch</button><button type="button" id="setup">Change players</button>' : '<button type="button" class="go" id="next">Next round</button>';
    else if (net.kind === 'host') buttons = g.over ? '<button type="button" class="go" id="again">Rematch</button><button type="button" id="tolobby">Back to the lobby</button>' : '<button type="button" class="go" id="next">Next round</button>';
    else {
      line += ' ' + (g.over ? 'Waiting for ' + g.hostName + ' to call a rematch or head back to the lobby.' : 'Waiting for ' + g.hostName + ' to start it.');
      buttons = '<button type="button" id="netleave">Leave table</button>';
    }

    ovBody.innerHTML = '<h2 id="ov-h">' + esc(title) + '</h2><p>' + esc(line) + '</p>' +

      '<div class="actions" style="justify-content:flex-start">' + buttons + '</div>';

      on('tolobby', () => { ov.hidden = true; net.toLobby(); });
      on('netleave', askLeave);
      return;
    }
    on('next', () => { ov.hidden = true; E.nextRound(g); sel = []; mode = null; render(); schedule(); });
    on('again', () => { ov.hidden = true; start(); });
    on('setup', () => { ov.hidden = true; setup(); });
  }

  // ---------------------------------------------------------------- online tables
  const shareLink = (code) => location.origin + location.pathname + '?table=' + encodeURIComponent(code) + (NET.LOCAL ? '&relay=local' : '');
  function readName() {
    const el = document.getElementById('nm');
    const n = (el ? el.value : myName).replace(/\s+/g, ' ').trim().slice(0, 16);
    if (n) { myName = n; try { localStorage.setItem('dftc-name', n); } catch (e) {} }
    return n;
  }
  function setMsg(t) { const el = document.getElementById('netmsg'); if (el) el.textContent = t || ''; }
  function busy(on) { app.querySelectorAll('#host, #join, #jgo').forEach((b) => { b.disabled = on; }); }
  function setUrl(code) {
    try {
      const u = new URL(location.href);

      history.replaceState(null, '', u.pathname + u.search + u.hash);

  // stop talking to the table and forget it (a refresh after this does not rejoin)
  function dropNet() {
    clearTimeout(pendT); pending = false; netStatus = ''; lastKey = ''; lastActN = null; modalFor = '';
    if (!net) return;
    const n = net; net = null;
    n.viewCb = n.lobbyCb = n.statusCb = n.errCb = n.endCb = null;
    n.leave();
    if (n.kind === 'guest') { NET.store.del('dftc-seat'); setUrl(null); }
  }
  function flash(t) { netNote = t || ''; clearTimeout(noteT); noteT = setTimeout(() => { netNote = ''; if (net && g) render(); }, 4000); if (net && g) render(); }
  function copyText(text, btn, okLabel) {
    const done = (ok) => {
      if (!btn) return; const was = btn.dataset.label || btn.textContent; btn.dataset.label = was;
      btn.textContent = ok ? okLabel || 'Copied' : 'Select it and copy'; setTimeout(() => { if (btn.isConnected) btn.textContent = was; }, 1600);
    };
    const fallback = () => {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); done(ok);
    };

  }
  function ask(title, text, yes, fn) {

  function askLeave() {

    else ask('Leave the table?', 'The match carries on without you: your corner waits, and the host can have a bot stand in. To come back, join again with code ' + net.code + ' and the same name.', 'Leave', () => setup());
  }
  function wireNet(n) {
    n.onView((v, quiet) => { if (net === n) onView(v, quiet); });

  async function hostTable() {

    catch (e) { if (net === n) { net = null; setMsg(e.message); busy(false); } }
  }
  async function joinTable(code, saved) {
    code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
    if (code.length !== 5) { setMsg('Type the five-letter table code from your host.'); const c = document.getElementById('code'); if (c) c.focus(); return; }
    const name = saved ? saved.name : readName();
    if (!name) { setMsg('Pick a ring name first, so the table knows who you are.'); const el = document.getElementById('nm'); if (el) el.focus(); return; }
    busy(true); setMsg(saved ? 'Getting back to table ' + code + '…' : 'Looking for table ' + code + '…');
    const n = new NET.GuestSession(code, name, saved && saved.token);
    net = n; wireNet(n);
    try {
      await n.connect();
      if (net !== n) return;
      NET.store.set('dftc-seat', { code: n.code, token: n.token, name: n.name });
      setUrl(n.code);
      if (n.view()) onView(n.view()); else if (n.lobby) lobbyScreen(n.lobby); else { setMsg('Seated. Waiting for the table…'); }
    } catch (e) {
      if (net !== n) return;
      net = null; try { n.leave(); } catch (e2) {}
      if (saved) { NET.store.del('dftc-seat'); setUrl(null); }
      busy(false); setMsg(e.message);
    }
  }
  async function resumeHost(s) {

    catch (e) { if (net === n) { net = null; NET.store.del('dftc-host'); setMsg('Couldn’t reopen table ' + s.code + ': ' + e.message); } }
  }
  // a shared link (?table=CODE) opens straight into joining
  function joinScreen(code) {
    app.innerHTML =
      '<div class="top"><div class="logo">Down for the Count<small>BY DARREN DON</small></div><div class="right"><button type="button" class="ghost" id="back">Back to the menu</button></div></div>' +

  }
  function lobbyScreen(st) {
    clearTimeout(timer); g = null; ov.hidden = true; lastKey = ''; lastActN = null; modalFor = ''; lastLog = 0;
    const host = net.kind === 'host', mine = host ? net.hostSeat() : net.seat;
    const people = st.seats.filter((s) => s.kind === 'host' || s.kind === 'guest').length;
    const corners = st.seats.map((s, i) => {
      let who, state, btn = '';
      if (s.kind === 'host' || s.kind === 'guest') {
        who = esc(s.name) + (i === mine ? ' <i class="tag">You</i>' : '') + (s.kind === 'host' ? ' <i class="tag">Host</i>' : '') + (s.connected ? '' : ' <i class="tag away">Away</i>');
        state = s.kind === 'host' ? '' : s.connected ? 'Ready' : 'Lost connection';
        if (host && s.kind === 'guest') btn = '<button type="button" data-seat="' + i + '" data-kind="bot">Give to a bot</button>';
      } else if (s.kind === 'open') {
        who = 'Open corner'; state = 'Waiting for a friend. A bot takes it if nobody does.';
        if (host) btn = '<button type="button" data-seat="' + i + '" data-kind="bot">Make it a bot</button>';
      } else {
        who = 'Bot'; state = 'Saved for a bot';
        if (host) btn = '<button type="button" data-seat="' + i + '" data-kind="open">Open it for a friend</button>';
      }
      return '<li class="corner' + (s.kind === 'open' ? ' empty' : '') + '" style="--pc:' + COLORS[i] + '"><span class="dot"></span><span class="who">' + who + '</span><span class="state">' + esc(state) + '</span>' + btn + '</li>';
    }).join('');
    const bots = st.N - people;
    app.innerHTML =
      '<div class="top"><div class="logo">Down for the Count<small>BY DARREN DON</small></div><div class="right"><button type="button" class="ghost" id="leave">' + (host ? 'Close the table' : 'Leave table') + '</button></div></div>' +
      (netStatus ? '<div class="netbar" role="status"><span>' + esc(netStatus) + '</span></div>' : '') +
      '<div class="startbox online lobby">' +
      '<div class="tablehead"><div><span class="lbl">Table code</span><div class="tcode" id="tcode">' + esc(st.code) + '</div></div><button type="button" class="gold" id="copycode">Copy code</button></div>' +
      '<div class="field"><span class="lbl">Link to this table</span><div class="linkrow"><input id="tlink" readonly value="' + esc(shareLink(st.code)) + '" aria-label="Link to join this table"><button type="button" id="copylink">Copy link</button></div></div>' +
      '<p class="setup-note">' + (host ? 'Send your friends the code or the link. The link opens straight into joining; with the code, they choose Join a table on the menu.'
        : 'You’re in. Waiting for ' + esc(st.hostName) + ' to ring the bell.') + ' Relay: ' + esc(st.relay || '') + '.</p>' +
      (host ? '<h2>How many wrestlers?</h2><div class="pick-n" role="group" aria-label="Number of players">' + [2, 3, 4, 5].map((n) => '<button type="button" data-ln="' + n + '" aria-pressed="' + (n === st.N) + '"' + (n < people ? ' disabled' : '') + '>' + n + '</button>').join('') + '</div>' +
        '<h2>Bots</h2><div class="pick-n" role="group" aria-label="Bot strength"><button type="button" data-lb="tough" aria-pressed="' + st.tough + '">Tough</button><button type="button" data-lb="casual" aria-pressed="' + !st.tough + '">Casual</button></div>'
        : '<p class="setup-note">' + st.N + ' wrestlers, ' + (st.tough ? 'tough' : 'casual') + ' bots.</p>') +
      '<h2>Corners<small>Turns go down this list, then back to the top.</small></h2><ol class="corners">' + corners + '</ol>' +
      (host ? '<div class="startrow"><button type="button" class="go" id="bell">Ring the bell</button><span class="setup-note">' + people + (people === 1 ? ' person' : ' people') + ' and ' + bots + ' bot' + (bots === 1 ? '' : 's') + '. ' + (st.seats.some((s) => s.kind === 'open') ? 'Open corners nobody has taken get bots.' : '') + '</span></div>' : '') +
      '<p class="netmsg" id="netmsg" role="status"></p></div>';
    const on = (id, f) => { const el = document.getElementById(id); if (el) el.addEventListener('click', f); };
    on('leave', () => { if (host && people > 1) ask('Close the table?', 'Everyone who has joined goes back to the menu.', 'Close the table', () => setup()); else setup(); });
    on('copycode', (e) => copyText(st.code, e.currentTarget, 'Code copied'));
    on('copylink', (e) => copyText(shareLink(st.code), e.currentTarget, 'Link copied'));
    const link = document.getElementById('tlink'); link.addEventListener('focus', () => link.select());
    if (!host) return;
    on('bell', () => net.startGame());
    app.querySelectorAll('[data-ln]').forEach((b) => b.addEventListener('click', () => { chosenN = +b.dataset.ln; net.setN(chosenN); }));
    app.querySelectorAll('[data-lb]').forEach((b) => b.addEventListener('click', () => { tough = b.dataset.lb === 'tough'; try { localStorage.setItem('dftc-bots', tough ? 'tough' : 'casual'); } catch (e) {} net.setTough(tough); }));
    app.querySelectorAll('[data-seat]').forEach((b) => b.addEventListener('click', () => net.setSeat(+b.dataset.seat, b.dataset.kind)));
  }
  function netBar() {
    const bits = [];
    if (netStatus) bits.push('<span>' + esc(netStatus) + '</span>');
    if (netNote) bits.push('<span>' + esc(netNote) + '</span>');
    if (g.seats) g.seats.forEach((s, p) => {
      if (!s.away && !s.cover) return;
      const host = net.kind === 'host', nm = esc(g.names[p]);
      if (s.cover) bits.push('<span>A bot is standing in for ' + nm + ' until they’re back.</span>' + (host ? '<button type="button" data-cover="' + p + '" data-on="0">Wait for ' + nm + ' instead</button>' : ''));
      else bits.push('<span>' + nm + ' lost connection. Their corner waits for them to rejoin.</span>' + (host && !g.over ? '<button type="button" data-cover="' + p + '" data-on="1">Let a bot stand in</button>' : ''));
    });
    return bits.length ? '<div class="netbar" role="status">' + bits.join('') + '</div>' : '';
  }
  // a new view from the host (or, on the host page, from its own session)
  function onView(v, quiet) {
    if (!ov.hidden && ov.dataset.kind === 'ask') { g = v; me = v.me; return; } // don't redraw under a question
    const fresh = g == null || g.matchId !== v.matchId;
    g = v; me = v.me; tut = null;
    if (fresh) { lastLog = v.logN; lastActN = v.actN; modalFor = ''; window.scrollTo(0, 0); }
    pending = false; clearTimeout(pendT);
    const key = [v.matchId, v.round, v.turn, v.phase, v.hands[me].join(','), v.cur ? v.cur.cards.join(',') : '-'].join('|');
    if (key !== lastKey) { sel = []; mode = null; lastKey = key; }
    if (v.actN !== lastActN && !quiet) {
      lastActN = v.actN;
      const a = v.lastAction;
      if (a && a.a) {
        let word = null;
        if (a.a.type === 'play') word = WORD[Math.max.apply(null, a.a.cards)];
        else if (a.a.type === 'kickout') word = 'KICK OUT!';
        else if (a.a.type === 'reverse') word = 'REVERSAL!';
        else if (a.a.type === 'takeback') word = 'TAKEBACK!';
        if (v.status[a.p] === 'pinned') word = '1, 2, 3!';
        if (v.status[a.p] === 'tapped') word = 'TAPPED OUT!';
        pops = [{ p: a.p, word }];
        const newLines = v.log.slice(-Math.max(0, Math.min(v.log.length, v.logN - lastLog + 1)));
        newLines.forEach((l) => { if (l.kind === 'out' && l.who != null && l.who !== a.p && v.status[l.who] === 'pinned' && !pops.some((x) => x.p === l.who)) pops.push({ p: l.who, word: '1, 2, 3!' }); });
      }
    }
    render();
    if (v.roundOver) {
      const k = v.matchId + '/' + v.round + (v.over ? '/over' : '');
      if (modalFor !== k) { modalFor = k; ov.hidden = true; clearTimeout(modalT); modalT = setTimeout(() => { if (net && g && g.roundOver && ov.hidden) roundModal(); }, 900); }
    } else { clearTimeout(modalT); if (!ov.hidden && ov.dataset.kind === 'round') ov.hidden = true; }
  }

  document.addEventListener('keydown', (e) => {
    if (!g || g.turn !== me || g.roundOver || !ov.hidden) return;
    if (e.key === 'Escape' && (mode || sel.length)) { mode = null; sel = []; render(); }
  });
  window.__dftcState = () => g; // for automated checks (online, this is the page's own player view)
  window.__dftcNet = () => (net ? { kind: net.kind, code: net.code, seat: net.kind === 'host' ? net.hostSeat() : net.seat } : null);
  setup();
  if (/[?&#]tutorial\b/.test(location.search + location.hash)) startTutorial();
  else {
    const qs = new URLSearchParams(location.search), code = (qs.get('table') || '').toUpperCase().replace(/[^A-Z]/g, '');
    const host = NET.HostSession.saved(), seat = NET.savedSeat();
    if (host && !code) resumeHost(host);
    else if (seat && (!code || seat.code === code)) joinTable(seat.code, seat);
    else if (code) joinScreen(code);
  }
})();
</script>
</body>
</html>
