<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="/assets/vendor/three.r128.min.js"></script>
</head><body>
<script>
/* Down for the Count — still renders. Units are inches. ?scene=hero|table|kit|home  &w=1600&h=1000
   Nothing in any scene touches anything else: every card, pile and box has clear mat around it. */
(async function () {
  const q = new URLSearchParams(location.search);
  const SCENE = q.get('scene') || 'hero', W = +q.get('w') || 1600, H = +q.get('h') || 1000;
  const TEX = '/games/down-for-the-count/img/src/tex/';
  const C = (h) => new THREE.Color(h).convertSRGBToLinear();
  const loader = new THREE.TextureLoader();
  const cache = {};
  const tex = (n) => cache[n] || (cache[n] = new Promise((res, rej) => loader.load(TEX + n, (t) => { t.anisotropy = 16; t.encoding = THREE.sRGBEncoding; res(t); }, undefined, rej)));

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = C('#D9DEE8');
  scene.fog = new THREE.Fog(C('#D9DEE8'), 40, 80);
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 300);

  scene.add(new THREE.HemisphereLight(0xfff3e2, 0x8a7458, 0.5));
  const key = new THREE.DirectionalLight(0xfff1dc, 0.88); key.position.set(8, 14, 9); key.castShadow = true;
  key.shadow.mapSize.set(4096, 4096); Object.assign(key.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 70 });
  key.shadow.radius = 5; key.shadow.bias = -0.0004; scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd9a8, 0.36); rim.position.set(-10, 7, -9); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xdfe8ff, 0.16); fill.position.set(-6, 5, 10); scene.add(fill);

  // table: a ring canvas, pale grey with a faint weave
  function matTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
    g.fillStyle = '#E9ECF2'; g.fillRect(0, 0, 1024, 1024);
    let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 1024; i += 4) { g.fillStyle = 'rgba(255,255,255,' + (0.015 + r() * 0.02) + ')'; g.fillRect(0, i, 1024, 1); g.fillStyle = 'rgba(0,0,20,' + (0.02 + r() * 0.03) + ')'; g.fillRect(i, 0, 1, 1024); }
    for (let i = 0; i < 900; i++) { g.fillStyle = 'rgba(' + (r() < .5 ? '255,255,255' : '0,0,30') + ',' + (0.02 + r() * 0.04) + ')'; g.fillRect(r() * 1024, r() * 1024, 2 + r() * 10, 1 + r() * 2); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 6); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
  }
  const table = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshStandardMaterial({ map: matTexture(), roughness: 0.95, metalness: 0, color: C('#C8CCD6') }));
  table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);

  // ---- cards: poker size with rounded corners
  const CW = 2.5, CH = 3.5, CT = 0.014, CR = 0.13;
  function rr(w, h, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
  }
  function capGeo(w, h, r) {
    const g = new THREE.ShapeGeometry(rr(w, h, r), 8); const p = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + w / 2) / w, (p.getY(i) + h / 2) / h);
    return g;
  }
  const cardCap = capGeo(CW, CH, CR);
  const cardEdge = new THREE.ExtrudeGeometry(rr(CW, CH, CR), { depth: CT, bevelEnabled: false, curveSegments: 8 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: C('#F4F0E6'), roughness: 0.8 });
  const matCache = {};
  async function faceMat(name) { if (!matCache[name]) matCache[name] = new THREE.MeshStandardMaterial({ map: await tex(name), roughness: 0.74, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }); return matCache[name]; }
  async function makeCard(texName, x, z, yaw = 0) {
    const g = new THREE.Group();
    const e = new THREE.Mesh(cardEdge, edgeMat); e.rotation.x = -Math.PI / 2; e.castShadow = true; e.receiveShadow = true; g.add(e);
    const f = new THREE.Mesh(cardCap, await faceMat(texName)); f.rotation.x = -Math.PI / 2; f.position.y = CT + 0.002; f.receiveShadow = true; g.add(f);
    g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g); return track(g, texName.replace('.jpg', '') + ' @' + x.toFixed(1) + ',' + z.toFixed(1));
  }
  const card = (r, x, z, yaw) => makeCard('face-' + r + '.jpg', x, z, yaw);
  const back = (x, z, yaw) => makeCard('back.jpg', x, z, yaw);
  async function deck(x, z, n, yaw = 0) {
    const g = new THREE.Group(); const h = n * CT;
    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(CW, CH, CR), { depth: h, bevelEnabled: false, curveSegments: 8 }), new THREE.MeshStandardMaterial({ color: C('#EDE8DC'), roughness: 0.85 }));
    body.rotation.x = -Math.PI / 2; body.castShadow = true; body.receiveShadow = true; g.add(body);
    const f = new THREE.Mesh(cardCap, await faceMat('back.jpg')); f.rotation.x = -Math.PI / 2; f.position.y = h + 0.002; g.add(f);
    g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g); return track(g, 'deck @' + x.toFixed(1));
  }
  // a face-up pile: n cards of one rank stacked square, its top card showing
  async function pile(texName, x, z, n, yaw = 0) {
    const g = new THREE.Group(); const h = n * CT;
    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(CW, CH, CR), { depth: h, bevelEnabled: false, curveSegments: 8 }), new THREE.MeshStandardMaterial({ color: C('#EDE8DC'), roughness: 0.85 }));
    body.rotation.x = -Math.PI / 2; body.castShadow = true; body.receiveShadow = true; g.add(body);
    const f = new THREE.Mesh(cardCap, await faceMat(texName)); f.rotation.x = -Math.PI / 2; f.position.y = h + 0.002; g.add(f);
    g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g); return track(g, texName.replace('.jpg', '') + ' pile');
  }
  const GAP = 0.12;

  // ---- the box: 4 x 5 x 1.25, two-piece, lid on, standing upright on its bottom edge with the cover facing +z
  const BW = 4, BH = 1.25, BD = 5, BOX_TOP = BD;
  async function box(x, z, yaw = 0) {
    const tTop = await tex('box-top.jpg'), tSide = await tex('box-side.jpg'), tEnd = await tex('box-end.jpg');
    const M = (t) => new THREE.MeshStandardMaterial({ map: t, roughness: 0.45 });
    const sideL = tSide.clone(), sideR = tSide.clone(); sideL.needsUpdate = sideR.needsUpdate = true;
    sideL.center.set(0.5, 0.5); sideR.center.set(0.5, 0.5);
    const endUp = tEnd.clone(); endUp.center.set(0.5, 0.5); endUp.rotation = Math.PI; endUp.needsUpdate = true; // the end that faces up, read from the front
    const mats = [M(sideR), M(sideL), M(tTop), new THREE.MeshStandardMaterial({ color: C('#1C1530'), roughness: 0.8 }), M(tEnd), M(endUp)];
    const inner = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BD), mats); body.castShadow = true; body.receiveShadow = true; inner.add(body);
    const seam = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.012, 0.018, BD + 0.012), new THREE.MeshStandardMaterial({ color: C('#1C1530'), roughness: 0.9 })); seam.position.y = BH * 0.12; inner.add(seam);
    // tip the lying box up onto its bottom edge: the cover (+y) turns to face +z, its top edge goes up
    inner.rotation.x = Math.PI / 2; inner.position.y = BD / 2;
    const g = new THREE.Group(); g.add(inner);
    g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g); track(g, 'box'); return g;
  }
  // every component the silhouette check looks at
  window.__objs = [];
  let nObj = 0;
  function track(o, n, env) { o.name = n || ('piece ' + (++nObj)); window.__objs.push({ o, env: !!env }); return o; }

  function frame(min, max, elevDeg, azimDeg, margin) {
    const c = new THREE.Vector3((min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2);
    const el = elevDeg * Math.PI / 180, az = azimDeg * Math.PI / 180;
    const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    // fit the real pieces: the corners of each tracked object's own bounds (the standing box is the only tall one)
    const corners = [];
    for (const it of (window.__objs || [])) { const bb = new THREE.Box3().setFromObject(it.o);
      for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) corners.push(new THREE.Vector3(x, y, z)); }
    if (!corners.length) for (const x of [min[0], max[0]]) for (const y of [min[1], max[1]]) for (const z of [min[2], max[2]]) corners.push(new THREE.Vector3(x, y, z));
    let dist = 5;
    for (let it = 0; it < 80; it++) {
      camera.position.copy(c).addScaledVector(dir, dist); camera.lookAt(c); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
      let ok = true;
      for (const p of corners) { const v = p.clone().project(camera); if (Math.abs(v.x) > margin || Math.abs(v.y) > margin) { ok = false; break; } }
      if (ok) break; dist *= 1.05;
    }
    // the standing box makes the bounds tall, so pan until the projected bounds sit centred in the frame
    const right = new THREE.Vector3(), up = new THREE.Vector3();
    for (let it = 0; it < 8; it++) {
      let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
      for (const p of corners) { const v = p.clone().project(camera); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
      const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, span = Math.max((x1 - x0) / 2, (y1 - y0) / 2);
      const hh = Math.tan(camera.fov * Math.PI / 360) * camera.position.distanceTo(c);
      right.setFromMatrixColumn(camera.matrixWorld, 0); up.setFromMatrixColumn(camera.matrixWorld, 1);
      const shift = right.multiplyScalar(mx * hh * camera.aspect).add(up.multiplyScalar(my * hh));
      c.add(shift); camera.position.add(shift);
      if (span > margin) camera.position.addScaledVector(dir, camera.position.distanceTo(c) * (span / margin - 1));
      else if (span < margin * 0.97) camera.position.addScaledVector(dir, -camera.position.distanceTo(c) * (1 - span / margin) * 0.9);
      camera.lookAt(c); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    }
  }

  // ================================================================ scenes
  const P = CW + GAP;
  if (SCENE === 'hero') {
    // the box beside a 4-card run on the mat, and a wrestler's three face-down count cards in front
    await box(-5.0, -1.4, 0.12);
    for (let k = 0; k < 4; k++) await card(4 + k, 0.4 + k * P, -1.6, 0);
    for (let k = 0; k < 3; k++) await back(1.7 + k * P, 2.7, 0);
    frame([-7.3, 0, -3.6], [9.0, BOX_TOP, 4.6], 40, 2, 0.88);
  }

  if (SCENE === 'home') {
    // the home page card crops the middle of the frame, so the box and run sit close together, centred
    await box(-3.5, -1.2, 0.12);
    for (let k = 0; k < 4; k++) await card(4 + k, 0.4 + (k % 2) * P, -2.2 + Math.floor(k / 2) * (CH + GAP), 0);
    frame([-5.8, 0, -4.2], [5.4, BOX_TOP, 3.6], 40, 2, 0.74);
  }

  if (SCENE === 'table') {
    // four wrestlers mid-round: three 8s on the table, the count cards spent on reversals face down beside it,
    // and each wrestler's count in a face-down row: three, two, one, and none left at all
    for (let k = 0; k < 3; k++) await card(8, (k - 1) * P, -0.2, 0);
    await deck(6.2, -0.2, 3, 0.05);
    const seats = [[0, 7.2, 0, 3], [-10.4, -0.2, Math.PI / 2, 2], [0, -7.6, Math.PI, 1], [10.4, -0.2, -Math.PI / 2, 0]];
    for (const [x, z, yaw, cnt] of seats) {
      const ax = Math.cos(yaw), az = -Math.sin(yaw);
      for (let k = 0; k < cnt; k++) { const o = (k - (cnt - 1) / 2) * P; await back(x + ax * o, z + az * o, yaw); }
    }
    await box(10.8, -9.0, -0.18);
    frame([-13.0, 0, -11.2], [13.6, BOX_TOP, 9.4], 52, 0, 0.9);
  }

  if (SCENE === 'kit') {
    // everything in the box: sixty cards as ten piles of six, one per rank, and the box
    for (let r = 1; r <= 10; r++) await pile('face-' + r + '.jpg', -3.9 + ((r - 1) % 5) * (CW + 0.5), -2.0 + Math.floor((r - 1) / 5) * (CH + 0.6), 6, 0);
    await back(-3.9 + 5 * (CW + 0.5), -2.0, 0);
    await box(-9.4, -1.2, 0.08);
    frame([-11.8, 0, -4.2], [13.0, BOX_TOP, 4.4], 50, 0, 0.88);
  }

  if (SCENE === 'themed') await themed();

  renderer.render(scene, camera);
  await new Promise((r) => setTimeout(r, 60)); renderer.render(scene, camera);
  if (q.get('check')) window.__check = doCheck();
  window.__done = true;

  // ================================================================ ?scene=themed
  // Quiet version: the box and a run of move cards on a plain royal-blue cloth (lightened from night blue
  // so the navy box stands out), lit by one soft overhead pool with a gentle vignette. No ring, no props.
  // (Everything here is only built for this preset; the other scenes are untouched.)
  async function themed() {
    const named = (o, n) => { o.name = n; return o; };
    // what the silhouette check looks at: everything that sits on the cloth

    // ---- the cloth: deep royal blue with a fine, even weave
    function clothTexture() {
      const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
      g.fillStyle = '#D4D8E6'; g.fillRect(0, 0, 1024, 1024);
      let s = 5; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
      for (let i = 0; i < 1024; i += 2) {
        g.fillStyle = 'rgba(255,255,255,' + (0.02 + r() * 0.03) + ')'; g.fillRect(0, i, 1024, 1);
        g.fillStyle = 'rgba(0,0,30,' + (0.025 + r() * 0.035) + ')'; g.fillRect(i, 0, 1, 1024);
      }
      for (let i = 0; i < 1600; i++) { g.fillStyle = 'rgba(' + (r() < .5 ? '255,255,255' : '0,0,30') + ',' + (0.015 + r() * 0.03) + ')'; g.fillRect(r() * 1024, r() * 1024, 2 + r() * 9, 1); }
      // very soft mottling so the cloth isn't flat paint
      for (let i = 0; i < 40; i++) { const x = r() * 1024, y = r() * 1024, rad = 60 + r() * 160; const rg = g.createRadialGradient(x, y, 0, x, y, rad); const d = r() < .5; rg.addColorStop(0, d ? 'rgba(0,0,30,0.05)' : 'rgba(255,255,255,0.035)'); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg;
        for (const ox of [-1024, 0, 1024]) for (const oy of [-1024, 0, 1024]) { g.save(); g.translate(ox, oy); g.fillRect(x - rad, y - rad, rad * 2, rad * 2); g.restore(); } } // drawn wrapped so the tiles meet without seams
      const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 10); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
    }
    table.material = new THREE.MeshStandardMaterial({ map: clothTexture(), roughness: 1.0, metalness: 0, color: C(q.get('cloth') || '#4A6FD8') });
    const bgc = C(q.get('bg') || '#33489E');
    scene.background = bgc; scene.fog = new THREE.Fog(bgc, +(q.get('f0') || 15), +(q.get('f1') || 40));

    // ---- light: low ambient, one soft pool from high over the front right (its shadows fall back-left), faint key
    key.intensity = +(q.get('key') || 0.45); rim.intensity = 0.10; fill.intensity = 0.05;
    scene.children.filter((o) => o.isHemisphereLight).forEach((h) => { h.intensity = +(q.get('hemi') || 0.5); h.color = C('#F2F0FF'); h.groundColor = C('#2A2A48'); });
    const spot = new THREE.SpotLight(0xfff3e4, +(q.get('spot') || 1.3), 0, 0.36, 0.95, 1.0);
    spot.position.set(+(q.get('sx') || 9), 30, +(q.get('sz') || 12)); spot.target.position.set(0.2, 0, 0.6);
    spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.radius = +(q.get('sr') || 12); spot.shadow.bias = -0.0004; spot.shadow.camera.near = 10; spot.shadow.camera.far = 50;
    scene.add(spot); scene.add(spot.target);

    // ---- the components, with clear cloth between them
    await box(-3.9, -1.0, 0.14);
    for (let k = 0; k < 4; k++) await card(4 + k, 1.25 + (k % 2) * (P + 0.2), -1.75 + Math.floor(k / 2) * (CH + GAP + 0.2), 0);

    { // camera
      const el = +(q.get('el') || 34) * Math.PI / 180, az = +(q.get('az') || -2) * Math.PI / 180, dist = +(q.get('d') || 22.5);
      const tgt = new THREE.Vector3(+(q.get('tx') || -0.4), +(q.get('ty') || 0.9), +(q.get('tz') || -1.1));
      camera.position.set(tgt.x + Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist, tgt.z + Math.cos(az) * Math.cos(el) * dist);
      camera.lookAt(tgt); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    }
    // a gentle vignette
    {
      const c = document.createElement('canvas'); c.width = 512; c.height = 320; const g = c.getContext('2d');
      const rg = g.createRadialGradient(256, 175, 70, 256, 175, 320); rg.addColorStop(0, 'rgba(4,6,20,0)'); rg.addColorStop(0.55, 'rgba(4,6,20,0.08)'); rg.addColorStop(1, 'rgba(4,6,20,' + (q.get('vig') || 0.22) + ')');
      g.fillStyle = rg; g.fillRect(0, 0, 512, 320);
      const vt = new THREE.CanvasTexture(c); vt.encoding = THREE.sRGBEncoding;
      const hh = 2 * Math.tan(camera.fov * Math.PI / 360);
      const vig = new THREE.Mesh(new THREE.PlaneGeometry(hh * camera.aspect, hh), new THREE.MeshBasicMaterial({ map: vt, transparent: true, depthTest: false, depthWrite: false, fog: false }));
      vig.position.z = -1; vig.renderOrder = 999; vig.name = 'vignette'; camera.add(vig); scene.add(camera);
    }
  }

  // per-object silhouette check: each tracked object rendered alone as a white mask; pairs compared for
  // overlap and for coming within 3 px; anything touching the frame edge reported as cut
  function doCheck() {
    const gl = renderer.getContext(), W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
    const list = window.__objs || [], all = scene.children.slice(), vis = all.map((o) => o.visible);
    const bg = scene.background; scene.background = null; scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const buf = new Uint8Array(W * H * 4), masks = [];
    for (const it of list) {
      all.forEach((o) => { o.visible = o === it.o; }); // unlit white masks: no lights, no shadow pass
      renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(scene, camera);
      gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      const m = new Uint8Array(W * H); let n = 0;
      for (let k = 0; k < W * H; k++) if (buf[k * 4] > 20) { m[k] = 1; n++; } // the canvas has no alpha: white object on black
      masks.push({ name: it.o.name, env: it.env, m, n });
    }
    all.forEach((o, j) => o.visible = vis[j]); scene.overrideMaterial = null; scene.background = bg;
    const R = 3;
    function dilate(m) {
      const a = new Uint8Array(W * H), b = new Uint8Array(W * H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let v = 0; for (let dx = -R; dx <= R && !v; dx++) { const xx = x + dx; if (xx >= 0 && xx < W && m[y * W + xx]) v = 1; } a[y * W + x] = v; }
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let v = 0; for (let dy = -R; dy <= R && !v; dy++) { const yy = y + dy; if (yy >= 0 && yy < H && a[yy * W + x]) v = 1; } b[y * W + x] = v; }
      return b;
    }
    const res = { objects: masks.length, overlap: [], near: [], cut: [], empty: [], env: [] };
    masks.forEach((o) => { if (!o.n) res.empty.push(o.name); });
    const dil = masks.map((o) => dilate(o.m));
    for (let i = 0; i < masks.length; i++) for (let j = i + 1; j < masks.length; j++) {
      let ov = 0, nr = 0; const A = masks[i].m, B = masks[j].m, DA = dil[i];
      for (let k = 0; k < W * H; k++) { if (B[k]) { if (A[k]) ov++; else if (DA[k]) nr++; } }
      if (ov) res.overlap.push([masks[i].name, masks[j].name, ov]); else if (nr) res.near.push([masks[i].name, masks[j].name, nr]);
    }
    masks.forEach((o) => { const m = o.m; let c = 0;
      for (let x = 0; x < W; x++) { if (m[x]) c++; if (m[(H - 1) * W + x]) c++; }
      for (let y = 0; y < H; y++) { if (m[y * W]) c++; if (m[y * W + W - 1]) c++; }
      if (c) (o.env ? res.env : res.cut).push(o.name + ' (' + c + ' px)'); });
    renderer.render(scene, camera);
    return res;
  }
})();
</script>
</body></html>
