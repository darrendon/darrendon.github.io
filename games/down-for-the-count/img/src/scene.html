<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="/assets/vendor/three.r128.min.js"></script>
</head><body>
<script>
/* Down for the Count — still renders. Units are inches. ?scene=hero|table|kit|home  &w=1600&h=1000
   Nothing in any scene touches anything else: every card, pile and box has clear mat around it. */
(async function () {
  const q = new URLSearchParams(location.search);
  const SCENE = q.get('scene') || 'hero', W = +q.get('w') || 1600, H = +q.get('h') || 1000;
  const TEX = '/games/down-for-the-count/img/src/tex/';
  const C = (h) => new THREE.Color(h).convertSRGBToLinear();
  const loader = new THREE.TextureLoader();
  const cache = {};
  const tex = (n) => cache[n] || (cache[n] = new Promise((res, rej) => loader.load(TEX + n, (t) => { t.anisotropy = 16; t.encoding = THREE.sRGBEncoding; res(t); }, undefined, rej)));

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = C('#0F1838');
  scene.fog = new THREE.Fog(C('#0F1838'), 40, 80);
  const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 300);

  scene.add(new THREE.HemisphereLight(0xfff3e2, 0x8a7458, 0.5));
  const key = new THREE.DirectionalLight(0xfff1dc, 0.88); key.position.set(8, 14, 9); key.castShadow = true;
  key.shadow.mapSize.set(4096, 4096); Object.assign(key.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 70 });
  key.shadow.radius = 5; key.shadow.bias = -0.0004; scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd9a8, 0.36); rim.position.set(-10, 7, -9); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xdfe8ff, 0.16); fill.position.set(-6, 5, 10); scene.add(fill);

  // table: a ring canvas, deep blue with a faint weave
  function matTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
    g.fillStyle = '#1B3A86'; g.fillRect(0, 0, 1024, 1024);
    let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 1024; i += 4) { g.fillStyle = 'rgba(255,255,255,' + (0.015 + r() * 0.02) + ')'; g.fillRect(0, i, 1024, 1); g.fillStyle = 'rgba(0,0,20,' + (0.02 + r() * 0.03) + ')'; g.fillRect(i, 0, 1, 1024); }
    for (let i = 0; i < 900; i++) { g.fillStyle = 'rgba(' + (r() < .5 ? '255,255,255' : '0,0,30') + ',' + (0.02 + r() * 0.04) + ')'; g.fillRect(r() * 1024, r() * 1024, 2 + r() * 10, 1 + r() * 2); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 6); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
  }
  const table = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshStandardMaterial({ map: matTexture(), roughness: 0.92, metalness: 0 }));
  table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);

  // ---- cards: poker size with rounded corners
  const CW = 2.5, CH = 3.5, CT = 0.014, CR = 0.13;
  function rr(w, h, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
  }
  function capGeo(w, h, r) {
    const g = new THREE.ShapeGeometry(rr(w, h, r), 8); const p = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + w / 2) / w, (p.getY(i) + h / 2) / h);
    return g;
  }
  const cardCap = capGeo(CW, CH, CR);
  const cardEdge = new THREE.ExtrudeGeometry(rr(CW, CH, CR), { depth: CT, bevelEnabled: false, curveSegments: 8 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: C('#F4F0E6'), roughness: 0.8 });
  const matCache = {};
  async function faceMat(name) { if (!matCache[name]) matCache[name] = new THREE.MeshStandardMaterial({ map: await tex(name), roughness: 0.74, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }); return matCache[name]; }
  async function makeCard(texName, x, z, yaw = 0) {
    const g = new THREE.Group();
    const e = new THREE.Mesh(cardEdge, edgeMat); e.rotation.x = -Math.PI / 2; e.castShadow = true; e.receiveShadow = true; g.add(e);
    const f = new THREE.Mesh(cardCap, await faceMat(texName)); f.rotation.x = -Math.PI / 2; f.position.y = CT + 0.002; f.receiveShadow = true; g.add(f);
    g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g); return g;
  }
  const card = (r, x, z, yaw) => makeCard('face-' + r + '.jpg', x, z, yaw);
  const back = (x, z, yaw) => makeCard('back.jpg', x, z, yaw);
  async function deck(x, z, n, yaw = 0) {
    const g = new THREE.Group(); const h = n * CT;
    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(CW, CH, CR), { depth: h, bevelEnabled: false, curveSegments: 8 }), new THREE.MeshStandardMaterial({ color: C('#EDE8DC'), roughness: 0.85 }));
    body.rotation.x = -Math.PI / 2; body.castShadow = true; body.receiveShadow = true; g.add(body);
    const f = new THREE.Mesh(cardCap, await faceMat('back.jpg')); f.rotation.x = -Math.PI / 2; f.position.y = h + 0.002; g.add(f);
    g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g); return g;
  }
  // a face-up pile: n cards of one rank stacked square, its top card showing
  async function pile(texName, x, z, n, yaw = 0) {
    const g = new THREE.Group(); const h = n * CT;
    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(CW, CH, CR), { depth: h, bevelEnabled: false, curveSegments: 8 }), new THREE.MeshStandardMaterial({ color: C('#EDE8DC'), roughness: 0.85 }));
    body.rotation.x = -Math.PI / 2; body.castShadow = true; body.receiveShadow = true; g.add(body);
    const f = new THREE.Mesh(cardCap, await faceMat(texName)); f.rotation.x = -Math.PI / 2; f.position.y = h + 0.002; g.add(f);
    g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g); return g;
  }
  const GAP = 0.12;

  // ---- the box: 4 x 5 x 1.25, two-piece, lid on
  const BW = 4, BH = 1.25, BD = 5;
  async function box(x, z, yaw = 0) {
    const tTop = await tex('box-top.jpg'), tSide = await tex('box-side.jpg'), tEnd = await tex('box-end.jpg');
    const M = (t) => new THREE.MeshStandardMaterial({ map: t, roughness: 0.45 });
    const sideL = tSide.clone(), sideR = tSide.clone(); sideL.needsUpdate = sideR.needsUpdate = true;
    sideL.center.set(0.5, 0.5); sideR.center.set(0.5, 0.5);
    const mats = [M(sideR), M(sideL), M(tTop), new THREE.MeshStandardMaterial({ color: C('#1C1530'), roughness: 0.8 }), M(tEnd), M(tEnd)];
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BD), mats); body.castShadow = true; body.receiveShadow = true; body.position.y = BH / 2; g.add(body);
    const seam = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.012, 0.018, BD + 0.012), new THREE.MeshStandardMaterial({ color: C('#1C1530'), roughness: 0.9 })); seam.position.y = BH * 0.62; g.add(seam);
    g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g); return g;
  }

  function frame(min, max, elevDeg, azimDeg, margin) {
    const c = new THREE.Vector3((min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2);
    const el = elevDeg * Math.PI / 180, az = azimDeg * Math.PI / 180;
    const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
    const corners = [];
    for (const x of [min[0], max[0]]) for (const y of [min[1], max[1]]) for (const z of [min[2], max[2]]) corners.push(new THREE.Vector3(x, y, z));
    let dist = 5;
    for (let it = 0; it < 80; it++) {
      camera.position.copy(c).addScaledVector(dir, dist); camera.lookAt(c); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
      let ok = true;
      for (const p of corners) { const v = p.clone().project(camera); if (Math.abs(v.x) > margin || Math.abs(v.y) > margin) { ok = false; break; } }
      if (ok) break; dist *= 1.05;
    }
  }

  // ================================================================ scenes
  const P = CW + GAP;
  if (SCENE === 'hero') {
    // the box beside a 4-card run on the mat, and a wrestler's three face-down count cards in front
    await box(-5.2, -0.6, 0.2);
    for (let k = 0; k < 4; k++) await card(4 + k, 0.4 + k * P, -1.6, 0);
    for (let k = 0; k < 3; k++) await back(1.7 + k * P, 2.7, 0);
    frame([-7.5, 0, -3.6], [9.0, 1.25, 4.6], 48, 2, 0.99);
  }

  if (SCENE === 'home') {
    // the home page card crops the middle of the frame, so the box and run sit close together, centred
    await box(-3.6, -0.4, 0.2);
    for (let k = 0; k < 4; k++) await card(4 + k, 0.4 + (k % 2) * P, -2.2 + Math.floor(k / 2) * (CH + GAP), 0);
    frame([-5.9, 0, -4.2], [5.4, 1.25, 3.6], 50, 2, 0.74);
  }

  if (SCENE === 'table') {
    // four wrestlers mid-round: three 8s on the table, the count cards spent on reversals face down beside it,
    // and each wrestler's count in a face-down row: three, two, one, and none left at all
    for (let k = 0; k < 3; k++) await card(8, (k - 1) * P, -0.2, 0);
    await deck(6.2, -0.2, 3, 0.05);
    const seats = [[0, 7.2, 0, 3], [-10.4, -0.2, Math.PI / 2, 2], [0, -7.6, Math.PI, 1], [10.4, -0.2, -Math.PI / 2, 0]];
    for (const [x, z, yaw, cnt] of seats) {
      const ax = Math.cos(yaw), az = -Math.sin(yaw);
      for (let k = 0; k < cnt; k++) { const o = (k - (cnt - 1) / 2) * P; await back(x + ax * o, z + az * o, yaw); }
    }
    await box(11.2, -8.4, -0.22);
    frame([-13.0, 0, -11.2], [13.6, 1.25, 9.4], 58, 0, 0.99);
  }

  if (SCENE === 'kit') {
    // everything in the box: sixty cards as ten piles of six, one per rank, and the box
    for (let r = 1; r <= 10; r++) await pile('face-' + r + '.jpg', -3.9 + ((r - 1) % 5) * (CW + 0.5), -2.0 + Math.floor((r - 1) / 5) * (CH + 0.6), 6, 0);
    await back(-3.9 + 5 * (CW + 0.5), -2.0, 0);
    await box(-9.6, -0.2, 0);
    frame([-12.0, 0, -4.2], [13.0, 1.25, 4.4], 64, 0, 0.97);
  }

  renderer.render(scene, camera);
  await new Promise((r) => setTimeout(r, 60)); renderer.render(scene, camera);
  window.__done = true;
})();
</script>
</body></html>
