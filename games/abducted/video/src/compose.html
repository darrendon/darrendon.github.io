<!doctype html>
<html><head><meta charset="utf-8"><title>Abducted pitch video</title>
<!-- The pitch video, one frame at a time: render.py calls window.frame(scene, t) and screenshots 1920x1080.
     Scene timings live in timing.json (cut to the voiceover); everything drawn here is deterministic in t. -->
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/abducted-fonts.css">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#141B3F;font-family:"M PLUS Rounded 1c",Jost,sans-serif}
  .layer{position:absolute;inset:0;overflow:hidden}
  .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:50% 50%;will-change:transform}
  .call{position:absolute;left:96px;top:96px;max-width:640px;background:#FFF4DE;border-radius:14px;padding:26px 34px 26px 40px;box-shadow:0 26px 50px -24px rgba(10,12,30,.65);overflow:hidden}
  .call::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--bar,#F6B92B)}
  .call b{display:block;font:900 50px/1.04 "Dela Gothic One",sans-serif;font-stretch:112%;font-synthesis:none;color:#1B2350}
  .call span{display:block;margin-top:10px;font:500 30px/1.3 "M PLUS Rounded 1c",Jost;color:#3A3A55}
  .call.right{left:auto;right:96px}
  .call.bottom{top:auto;bottom:96px}
  .title{position:absolute;right:110px;top:290px;width:860px;color:#fff}
  .title h1{margin:0;font:900 132px/1 "Dela Gothic One",sans-serif;font-stretch:112%;font-synthesis:none;color:#FFF4DE;text-shadow:8px 10px 0 #E8553A}
  .title p{margin:30px 0 0;font:500 42px/1.25 "M PLUS Rounded 1c",Jost;color:#FFF4DE}
  .title p i{display:block;margin-top:18px;font-style:normal;font-weight:700;color:#6EE7B7}
  .end{position:absolute;inset:0;background:radial-gradient(110% 90% at 30% 40%,#26316D,#141B3F 70%);display:flex;align-items:center;gap:110px;padding:0 170px}
  .end img{height:760px;border-radius:10px;box-shadow:0 40px 70px -30px rgba(0,0,0,.8)}
  .end h2{margin:0;font:900 116px/1 "Dela Gothic One",sans-serif;font-stretch:112%;font-synthesis:none;color:#FFF4DE;text-shadow:7px 9px 0 #E8553A}
  .end p{margin:30px 0 0;font:500 44px/1.3 "M PLUS Rounded 1c",Jost;color:#FFF4DE}
  .end .url{margin-top:64px;font:700 46px/1.3 "M PLUS Rounded 1c",Jost;color:#6EE7B7}
  .end .mail{font:500 40px/1.3 "M PLUS Rounded 1c",Jost;color:#A9B0D6}
</style></head><body>
<div class="layer" id="prev"></div><div class="layer" id="cur"></div>
<script>
const SHOTS = 'captures/', IMG = '/games/abducted/img/';
// each scene: what fills the frame, how the camera drifts (scale and pan, start to end) and the callout
const SCENES = [
  { id: 'title', bg: 'vtitle.jpg', from: [1.1, 0, 54], to: [1.15, -40, 74], title: true },
  { id: 'faceout', bg: IMG + 'render-table.webp', from: [1.04, 0, 30], to: [1.13, 0, -10], call: ['Face out', 'You can read every card but your own'], bar: '#F6B92B' },
  { id: 'split', bg: SHOTS + 'split.jpg', from: [1.02, 20, 20], to: [1.1, 60, 30], call: ['Split and vote', 'The Town Leader splits the town. Everyone else votes 1 or 2'], bar: '#2E4BD8', pos: 'right bottom' },
  { id: 'signal', bg: SHOTS + 'signal.jpg', from: [1.0, 0, 0], to: [1.14, 200, -60], call: ['Transmit or Jam', 'The search party plays in secret. The majority scores'], bar: '#4FD1A5', pos: 'right bottom' },
  { id: 'lookout', bg: SHOTS + 'abduct.jpg', from: [1.02, -40, 0], to: [1.14, -120, -40], call: ['Check out that light', 'Mix your card with the deck’s top card. Keep one, blind'], bar: '#E8553A', pos: 'right bottom' },
  { id: 'lying', bg: SHOTS + 'note.jpg', from: [1.4, 420, 80], to: [1.5, 430, 90], call: ['Friend or enemy?', 'Everyone’s telling you what you are'], bar: '#F6B92B', pos: 'right bottom' },
  { id: 'win', bg: SHOTS + 'over.jpg', from: [1.0, 0, 0], to: [1.1, 120, 0], call: ['First team to 5', 'You win if your card is on that team'], bar: '#6EE7B7', pos: 'right bottom' },
  { id: 'kit', bg: 'vkit.jpg', from: [1.0, 0, 0], to: [1.06, 20, 10], call: ['Cards and stands', '50 cards and 12 stands in a tuck box · 5–12 players · 15–25 minutes'], bar: '#F6B92B', pos: '' },
  { id: 'end', end: true },
];
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
let D = SCENES.map(() => 6);   // durations, replaced from timing.json
function draw(el, k, t, alpha) {
  const s = SCENES[k], d = D[k], u = ease(t / d);
  if (!s) { el.innerHTML = ''; return; }
  el.style.opacity = alpha;
  if (s.end) {
    const a = ease((t - 0.2) / 0.6);
    el.innerHTML = `<div class="end"><img src="${IMG}box-front.webp" alt=""><div style="opacity:${a};transform:translateY(${(1 - a) * 20}px)"><h2>ABDUCTED</h2><p>5–12 players · 15–25 minutes<br>50 cards and 12 stands</p><div class="url">darrendon.com/games/abducted</div><div class="mail">darren@darrendon.com</div></div></div>`;
    return;
  }
  const sc = s.from[0] + (s.to[0] - s.from[0]) * u;
  // the pan never shows past the picture's edge
  const mx = (sc - 1) * 960, my = (sc - 1) * 540, cl = (v, m) => Math.max(-m, Math.min(m, v));
  const x = cl(s.from[1] + (s.to[1] - s.from[1]) * u, mx), y = cl(s.from[2] + (s.to[2] - s.from[2]) * u, my);
  let h = `<div class="bg" style="background-image:url('${s.bg}');transform:translate(${-x}px,${-y}px) scale(${sc})"></div>`;
  if (s.title) { const a = ease((t - 0.3) / 0.7); h += `<div class="title" style="opacity:${a};transform:translateY(${(1 - a) * 24}px)"><h1>ABDUCTED</h1><p>A social deduction game where everyone knows your team except you<i>Some of you came back… different.</i></p></div>`; }
  if (s.call) { const a = ease((t - 0.45) / 0.45); h += `<div class="call ${s.pos || ''}" style="--bar:${s.bar};opacity:${a};transform:translateY(${(1 - a) * 18}px)"><b>${s.call[0]}</b><span>${s.call[1]}</span></div>`; }
  el.innerHTML = h;
}
const FADE = 0.4;
window.frame = (k, t) => {
  draw(document.getElementById('cur'), k, t, 1);
  // crossfade: the previous scene's last moment shows through for the first FADE seconds
  const prev = document.getElementById('prev');
  if (k > 0 && t < FADE) { draw(prev, k - 1, D[k - 1], 1); document.getElementById('cur').style.opacity = ease(t / FADE); }
  else prev.innerHTML = '';
};
window.setDurations = (arr) => { D = arr; };
window.SCENES = SCENES;
// preload every picture, then say we're ready
Promise.all(SCENES.filter((s) => s.bg).map((s) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = s.bg; })).concat([new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = IMG + 'box-front.webp'; })]))
  .then(() => document.fonts.ready).then(() => { window.__ready = true; });
</script></body></html>
