<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="box-base.css"><style>
/* Short end of the Tichu-size card box (70 x 27 mm below the base lip) */
body{width:840px;height:329px}
.line{position:absolute;left:0;right:0;height:9px;background:#F3C46B}
.col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.t{position:relative;font-size:100px;line-height:1}
.t .title{display:block;white-space:nowrap}
.t .title.out{position:absolute;inset:0;-webkit-text-stroke:13px #6E120D}
.caps{font-size:27px;letter-spacing:.24em}
</style></head><body>
<div class="line" style="top:22px"></div><div class="line" style="top:300px"></div>
<div class="col"><div class="t"><span class="title out" aria-hidden="true">Dim Sum Rush</span><span class="title">Dim Sum Rush</span></div>
<div class="caps">84 cards · 2–6 players</div></div>
</body></html>
