<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="box-base.css"><style>
/* Lid of the Tichu-size card box (95 x 70 mm): box-top.html narrowed to the lid proportions */
body{width:1356px;height:1000px}
.frame{position:absolute;inset:30px;border:8px solid #F3C46B}
.frame::after{content:"";position:absolute;inset:13px;border:2px solid rgba(243,196,107,.75)}
.dot{position:absolute;width:26px;height:26px;border-radius:50%;background:#F3C46B}
.brand{position:absolute;top:92px;left:0;right:0;text-align:center;font-size:31px;letter-spacing:.27em}
.title{position:absolute;top:150px;left:0;right:0;text-align:center;font-size:214px;line-height:.86;
  -webkit-text-stroke:22px #6E120D}
.title span{display:block}
.title.fill{-webkit-text-stroke:0}
.by{position:absolute;top:582px;left:0;right:0;text-align:center;font-size:29px;letter-spacing:.3em}
.medals{position:absolute;top:629px;left:0;right:0;display:flex;justify-content:center;gap:22px}
.medals img{width:250px;height:250px}
.tag{position:absolute;top:896px;left:0;right:0;text-align:center;font-size:34px;letter-spacing:.17em;color:#FCF1DE}
</style></head><body>
<div class="frame"></div>
<div class="dot" style="left:21px;top:21px"></div><div class="dot" style="right:21px;top:21px"></div>
<div class="dot" style="left:21px;bottom:21px"></div><div class="dot" style="right:21px;bottom:21px"></div>
<div class="brand caps">What's Good Board Games</div>
<div class="title" aria-hidden="true"><span>Dim Sum</span><span>Rush</span></div>
<div class="title fill"><span>Dim Sum</span><span>Rush</span></div>
<div class="by caps">By Darren Don</div>
<div class="medals"><img src="box-medal-1.png"><img src="box-medal-2.png"><img src="box-medal-3.png"><img src="box-medal-4.png"></div>
<div class="tag caps">A partnership climbing game &nbsp;·&nbsp; 2–6 players</div>
</body></html>
