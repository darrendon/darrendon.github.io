<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:transparent}#st{position:relative}</style></head><body><div id="st"></div>
<script src="/assets/vendor/three.r128.min.js"></script><script src="/assets/js/dsr-scene.js"></script>
<script>
function doCheck(ctl) {
  const d = ctl._debug, r = d.renderer, gl = r.getContext();
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
  const objs = d.stage.children.slice(), vis = objs.map(o => o.visible);
  const env = d.env, bg = d.scene.background; if (env) env.visible = false; d.scene.background = null; // the cloth scene's tablecloth and lights
  d.ground.visible = false; d.scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const buf = new Uint8Array(W * H * 4), masks = [];
  for (let i = 0; i < objs.length; i++) {
    objs.forEach((o, j) => o.visible = j === i);
    r.setClearColor(0x000000, 0); r.clear(); r.render(d.scene, d.camera);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    const m = new Uint8Array(W * H); let n = 0;
    for (let k = 0; k < W * H; k++) if (buf[k * 4 + 3] > 20) { m[k] = 1; n++; }
    masks.push({ name: objs[i].name || ('obj' + i), m, n });
  }
  objs.forEach((o, j) => o.visible = vis[j]); d.ground.visible = true; d.scene.overrideMaterial = null;
  if (env) env.visible = true; d.scene.background = bg;
  r.render(d.scene, d.camera);
  const R = 3;
  function dilate(m) {
    const a = new Uint8Array(W * H), b = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let v = 0; for (let dx = -R; dx <= R && !v; dx++) { const xx = x + dx; if (xx >= 0 && xx < W && m[y * W + xx]) v = 1; } a[y * W + x] = v; }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let v = 0; for (let dy = -R; dy <= R && !v; dy++) { const yy = y + dy; if (yy >= 0 && yy < H && a[yy * W + x]) v = 1; } b[y * W + x] = v; }
    return b;
  }
  const res = { objects: masks.length, overlap: [], near: [], cut: [], empty: [] };
  masks.forEach(o => { if (!o.n) res.empty.push(o.name); });
  const dil = masks.map(o => dilate(o.m));
  for (let i = 0; i < masks.length; i++) for (let j = i + 1; j < masks.length; j++) {
    let ov = 0, nr = 0; const A = masks[i].m, B = masks[j].m, DA = dil[i];
    for (let k = 0; k < W * H; k++) { if (B[k]) { if (A[k]) ov++; else if (DA[k]) nr++; } }
    if (ov) res.overlap.push([masks[i].name, masks[j].name, ov]); else if (nr) res.near.push([masks[i].name, masks[j].name, nr]);
  }
  masks.forEach(o => { const m = o.m; let c = 0;
    for (let x = 0; x < W; x++) { if (m[x]) c++; if (m[(H - 1) * W + x]) c++; }
    for (let y = 0; y < H; y++) { if (m[y * W]) c++; if (m[y * W + W - 1]) c++; }
    if (c) res.cut.push(o.name + ' (' + c + ' px)'); });
  return res;
}
window.run = function (view, w, h, pr, check) {
  const el = document.getElementById('st'); el.innerHTML = ''; el.style.width = w + 'px'; el.style.height = h + 'px';
  return new Promise((res) => {
    const ctl = DSRScene.mount(el, { view, still: true, interactive: false, pixelRatio: pr, onReady: () => {
      const out = { png: check ? null : ctl.canvas.toDataURL('image/png') };
      if (check) out.check = doCheck(ctl);
      res(out);
    } });
  });
};
</script></body></html>
