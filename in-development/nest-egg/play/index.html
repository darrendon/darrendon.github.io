<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nest Egg · Play online</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/dev-table.css?v=79371b01">
<style>
  body{--t-bg:#F7EEDD;--t-card:#FFFAF0;--t-ink:#3E2A1E;--t-muted:#7A5E48;--t-line:#E6D3B5;--t-accent:#B5612C;--t-accent-ink:#fff;--t-mast:#4A2E1E;--t-mast-ink:#F7EBD0}
  .dt-mast h1{font-family:Fraunces,Georgia,serif;font-weight:900;letter-spacing:-.01em;color:#F7D9A6}
  .mast-crit{display:flex;gap:6px;margin-top:10px}.mast-crit svg{width:38px;height:38px}
  .ne{display:grid;gap:14px;max-width:1180px;margin:0 auto}
  .ne>*,.cols>*{min-width:0}
  .cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
  @media (max-width:880px){.cols{grid-template-columns:1fr}}
  .cols.solo{grid-template-columns:1fr}
  .panel{background:var(--t-card);border:1px solid var(--t-line);border-radius:14px;padding:14px}
  .panel h3{margin:0 0 10px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t-muted);font-weight:600}
  .ico{display:inline-block;vertical-align:middle}

  /* the magpie's stage */
  .stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:linear-gradient(180deg,#FBEBCB,#F1CF9C);border:1px solid #E6C38E;border-radius:16px;padding:14px 16px}
  @media (max-width:560px){.stage{grid-template-columns:1fr}}
  .tcard{width:150px;border-radius:14px;background:#FFFAF0;border:2px solid #E3C79D;padding:10px 10px 12px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.08),0 12px 18px -10px rgba(74,46,30,.45);position:relative}
  .tcard.frost{border-color:#9FCBE0;background:linear-gradient(180deg,#F4FBFF,#FFFAF0)}
  .tcard svg{width:96px;height:96px}
  .tcard .nm{font-weight:600;font-size:15px;line-height:1.15;min-height:2.3em;display:flex;align-items:center;justify-content:center}
  .tcard .vp{position:absolute;top:-10px;right:-10px;width:42px;height:42px;border-radius:50%;background:#4A2E1E;color:#F7D9A6;display:grid;place-items:center;font:900 20px/1 Fraunces,serif;box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .tcard .fr{position:absolute;top:8px;left:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#4B86A3;font-weight:700}
  .tcard.empty{display:grid;place-items:center;min-height:180px;color:var(--t-muted);font-size:14px}
  .stage-r h2{margin:0 0 4px;font:900 24px/1.1 Fraunces,serif}
  .stage-r p{margin:0 0 8px;color:#6B4B33;font-size:14.5px}
  .clock{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:#6B4B33}
  .clock span{background:rgba(255,255,255,.55);border-radius:999px;padding:3px 10px}
  .offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:10px}
  .off{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;background:rgba(255,255,255,.7);border-radius:10px;padding:5px 8px;font-size:13.5px;border:2px solid transparent}
  .off.turn{border-color:var(--t-accent);background:#fff}
  .off.out{opacity:.55}
  .off.high .amt{color:var(--t-accent)}
  .off .amt{font:900 18px/1 Fraunces,serif}
  .off .cards{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:3px}
  .chip{font-size:11px;font-weight:700;border-radius:5px;padding:1px 5px;background:#F3E3C6;color:#6B4B33}
  .tok{width:30px;height:30px;flex:none}.tok svg{width:100%;height:100%;display:block}

  /* baubles */
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bauble{all:unset;box-sizing:border-box;width:66px;height:78px;border-radius:12px;background:#fff;border:2px solid var(--t-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 10px -7px rgba(74,46,30,.5)}
  button.bauble{cursor:pointer}button.bauble:hover{border-color:var(--t-accent);transform:translateY(-2px)}
  .bauble.sel{border-color:var(--t-accent);box-shadow:0 0 0 3px rgba(181,97,44,.28);transform:translateY(-5px)}
  .bauble svg{width:42px;height:42px}
  .bauble small{font-size:10.5px;font-weight:600;color:var(--t-muted);letter-spacing:.02em}
  .bag{font-size:12.5px;color:var(--t-muted);margin-left:6px}
  .key{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;margin-top:10px;font-size:12.5px;color:var(--t-muted)}
  .key div{display:flex;align-items:center;gap:6px}.key svg{width:20px;height:20px}

  /* your acorns */
  .hand{display:flex;flex-wrap:wrap;gap:5px;min-height:84px;align-items:flex-end}
  .acard{all:unset;box-sizing:border-box;width:46px;height:70px;border-radius:10px;background:#FFF6E6;border:2px solid #E3C79D;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 0 4px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 10px -7px rgba(74,46,30,.5);position:relative}
  button.acard{cursor:pointer}button.acard:hover{border-color:var(--t-accent)}
  .acard b{font:900 24px/1 Fraunces,serif;color:#5A3A24}
  .acard svg{width:26px;height:26px}
  .acard.mini{width:30px;height:42px;padding:2px 0;border-radius:7px}.acard.mini b{font-size:15px}.acard.mini svg{width:14px;height:14px}
  .tray{display:flex;flex-wrap:wrap;gap:7px;min-height:92px;padding:8px;border:2.5px dashed var(--t-line);border-radius:14px;align-items:center;margin-top:10px;background:rgba(255,255,255,.4)}
  .tray .drophere{margin:auto;color:var(--t-muted);font-size:14px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
  .prompt{font-size:15.5px;margin:0 0 10px}.prompt b{font-weight:700}
  .sum{font:900 22px/1 Fraunces,serif;margin-left:auto}

  /* critters */
  .crits{display:flex;flex-direction:column;gap:8px}
  .crit{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:7px 8px;border-radius:10px}
  .crit.turn{background:rgba(181,97,44,.12)}
  .crit .nm{font-weight:600;font-size:15px}
  .crit .money{text-align:right;font-size:12.5px;color:var(--t-muted);white-space:nowrap}
  .crit .money b{font:900 18px/1 Fraunces,serif;color:var(--t-ink)}
  .crit .have{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .have .h{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--t-line);border-radius:999px;padding:1px 7px 1px 3px}
  .have .h svg{width:18px;height:18px}
  .have .pts{margin-left:auto;font-size:12.5px;color:var(--t-muted)}
  .log{margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--t-line);font-size:13.5px;color:var(--t-muted);max-height:190px;overflow:auto}
  .log p{margin:0 0 3px}

  .banner{border-radius:14px;padding:14px 16px;background:#4A2E1E;color:#F7EBD0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
  .banner b{font:900 22px/1.15 Fraunces,serif;color:#F7D9A6}
  .banner p{margin:4px 0 0;font-size:14.5px}
  .final{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  .final th,.final td{padding:6px 6px;border-bottom:1px solid var(--t-line);text-align:right}
  .final th:first-child,.final td:first-child{text-align:left}
  .final th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t-muted);font-weight:600}
  .final tr.win td{background:rgba(148,144,21,.12);font-weight:600}
  .final tr.out td{color:#B3412C}
  .final td.tt{font:900 18px/1 Fraunces,serif}
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/js/tabletop.js?v=bbd86e78"></script>
<script src="/assets/js/dev-table.js?v=8204bfed"></script>
<script src="art.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  const E = window.NestEgg, A = window.NestArt, esc = DevTable.esc, B = E.BAUBLE;
  const DEFS = '<svg width="0" height="0" style="position:absolute" aria-hidden="true">' + A.defs() + '</svg>';
  const svg = (inner, vb) => '<svg viewBox="' + (vb || '-10 -10 20 20') + '" aria-hidden="true">' + inner + '</svg>';
  const tok = (k) => '<span class="tok">' + svg('<circle cx="0" cy="-2" r="15.5" fill="' + A.mix(A.SEAT[k], '#ffffff', .72) + '"/><g transform="translate(0 ' + (k === 'rabbit' ? 2.5 : 0) + ') scale(' + (k === 'rabbit' ? .78 : .95) + ')">' + A.head(k) + '</g>', '-16 -18 32 32') + '</span>';
  const baubleIcon = (b) => svg(A.bauble(b), '-10 -10 20 20');
  const bKind = (b) => (b.startsWith('acorn') ? 'acorn' : b);
  const acardHTML = (v, opts) => {
    opts = opts || {};
    const tag = opts.button ? 'button type="button"' : 'div';
    return '<' + tag + ' class="acard' + (opts.mini ? ' mini' : '') + '"' + (opts.i != null ? ' data-i="' + opts.i + '"' : '') + (opts.k ? ' data-k="' + opts.k + '"' : '') + ' aria-label="' + v + ' acorns"><b>' + v + '</b>' + svg(A.acorn(6), '-8 -8 16 16') + '</' + (opts.button ? 'button' : 'div') + '>';
  };
  const tcardHTML = (t) => t ? '<div class="tcard' + (t.frost ? ' frost' : '') + '" data-k="t-' + esc(t.name) + '">' + (t.frost ? '<span class="fr">Frost</span>' : '') + '<span class="vp">' + t.vp + '</span>' + svg(A.treasure(t.name), '-15 -15 30 30') + '<div class="nm">' + esc(t.name) + '</div></div>' : '<div class="tcard empty">—</div>';

  let sel = [], selSig = '', bsel = [], bselSig = '';
  // the log names you "You": "You offers" reads "You offer"
  const youLine = (l) => l.replace(/\bYou (offers|drops out and takes|drops|wins|runs|starts)\b/g, (m, v) => 'You ' + ({ 'drops out and takes': 'drop out and take' }[v] || v.slice(0, -1)));

  function render(el, v, api) {
    const me = v.seat, P = v.players, L = v.lot;
    // the staged offer only lasts while it's the same decision
    const sig = [v.phase, v.lotNo, L ? L.turn : '', v.hand.join(',')].join('|');
    if (sig !== selSig) { sel = []; selSig = sig; }
    const bsig = [v.phase, v.lotNo, v.picking ? v.picking.seat + ':' + v.picking.n : '', v.row.join(',')].join('|');
    if (bsig !== bselSig) { bsel = []; bselSig = bsig; }
    const name = (i) => esc(P[i].name) + (i === me && P[i].name !== 'You' ? ' (you)' : '');
    const myTurn = v.phase === 'bid' && L && L.turn === me;
    const myFrost = v.phase === 'frost' && L && !L.offered[me] && P[me].cards > 0;
    const myPick = v.phase === 'pick' && v.picking && v.picking.seat === me;

    const status = {
      bid: myTurn ? 'Your turn: offer acorns or pass' : L && L.turn >= 0 ? P[L.turn].name + ' is thinking' : '',
      frost: myFrost ? 'A frost: make a secret offer' : 'Waiting for secret offers',
      pick: myPick ? 'Take ' + v.picking.n + ' bauble' + (v.picking.n > 1 ? 's' : '') : v.picking ? P[v.picking.seat].name + ' is choosing baubles' : '',
      lotEnd: v.result && v.result.kind === 'win' ? P[v.result.seat].name + ' wins the ' + v.result.t.name : 'The magpie flies off',
      over: 'Winter is here',
    }[v.phase] || '';
    api.status('Treasure ' + v.lotNo + ' · ' + status);

    // ---- the stage: the magpie, the treasure and every offer
    let stage = '';
    if (v.phase !== 'over') {
      const t = v.treasure;
      const frost = L && L.frost;
      let head = frost ? 'A frost! Secret offers' : 'The magpie shows off a treasure';
      let sub = frost ? 'Everyone offers acorn cards in secret at once. Most acorns wins; everyone else who offered takes one bauble per card.' :
        'Beat the top offer by adding acorn cards, or pass. The last critter in wins it. Every acorn offered goes to the magpie, win or lose.';
      if (v.phase === 'lotEnd' && v.result) {
        head = v.result.kind === 'win' ? name(v.result.seat) + ' wins the ' + esc(v.result.t.name) + '!' : 'The magpie flies off with the ' + esc(v.result.t.name);
        sub = v.result.kind === 'win' ? 'For ' + v.result.bid + ' acorns' + (v.result.solo ? ', and nobody else made an offer.' : '.') + ' Next treasure coming…' : 'Nobody made an offer. Next treasure coming…';
      }
      const offers = L ? '<div class="offers">' + L.order.map((s) => {
        const spent = L.spent[s] || [], out = L.out.includes(s), turn = L.turn === s && v.phase === 'bid';
        let right = '';
        if (frost) right = v.phase === 'frost' ? (L.offered[s] ? '<span class="chip">offered</span>' : '<span class="chip">thinking…</span>') : '<span class="amt">' + (L.bids[s] || 0) + '</span>';
        else right = out ? '<span class="chip">' + (spent.length ? 'out · took ' + spent.length : 'passed') + '</span>' : '<span class="amt">' + (L.bids[s] || 0) + '</span>';
        return '<div class="off' + (turn ? ' turn' : '') + (out ? ' out' : '') + (!frost && L.highSeat === s && L.high > 0 ? ' high' : '') + '">' + tok(P[s].critter) + '<span>' + name(s) + '</span>' + right +
          (spent.length && (!frost || v.phase !== 'frost' || s === me) ? '<span class="cards">' + spent.map((c, j) => acardHTML(c, { mini: true, k: 'sp' + s + '-' + j + '-' + v.lotNo })).join('') + '</span>' : '') + '</div>';
      }).join('') + '</div>' : '';
      stage = '<div class="stage">' + tcardHTML(t) + '<div class="stage-r"><h2>' + head + '</h2><p>' + sub + '</p>' +
        '<div class="clock"><span>' + v.deckLeft + ' treasure cards left</span><span>' + v.frostsLeft + ' frost card' + (v.frostsLeft === 1 ? '' : 's') + ' left · the last one brings the snow</span></div>' + offers + '</div></div>';
    }

    // ---- final scores
    let banner = '';
    if (v.phase === 'over' && v.final) {
      const f = v.final, w = f.winners;
      banner = '<div class="banner"><div><b>' + (v.snow ? 'The first snow falls on the ' + esc(v.snow.name) + '.' : 'Winter is here.') + ' ' + (w.length ? w.map(name).join(' and ') + (w.length > 1 ? ' share the win!' : (w[0] === me && P[me].name === 'You' ? ' win!' : ' wins!')) : 'Nobody makes it through!') + '</b>' +
        '<p>' + f.out.map(name).join(' and ') + ' ran lowest on acorns and ' + (f.out.length > 1 || (f.out[0] === me && P[me].name === 'You') ? 'don’t' : 'doesn’t') + ' make it through winter.</p></div></div>';
      const order = P.map((_, i) => i).sort((a, b) => (f.out.includes(a) - f.out.includes(b)) || f.scores[b].total - f.scores[a].total);
      banner += '<div class="panel"><h3>Final count</h3><div style="overflow-x:auto"><table class="final"><tr><th>Critter</th><th>Acorns left</th><th>Treasures</th><th>Earrings</th><th>Berries</th><th>Buttons</th><th>Feathers</th><th>Total</th></tr>' +
        order.map((i) => { const s = f.scores[i]; return '<tr class="' + (w.includes(i) ? 'win' : f.out.includes(i) ? 'out' : '') + '"><td>' + name(i) + (f.out.includes(i) ? ' · out' : '') + '</td><td>' + f.money[i] + '</td><td>' + s.treasures + '</td><td>' + s.earring + '</td><td>' + s.berry + '</td><td>' + s.button + '</td><td>' + s.feather + '</td><td class="tt">' + s.total + '</td></tr>'; }).join('') + '</table></div></div>';
    }

    // ---- the bauble row
    const want = myPick ? Math.min(v.picking.n, v.row.length) : 0;
    let row = '';
    if (v.phase !== 'over') {
      row = '<div class="panel"><h3>The magpie’s baubles' + (myPick ? ' · take ' + v.picking.n : '') + '</h3>' +
        (myPick ? '<p class="prompt">You dropped out, so the magpie gives you <b>' + v.picking.n + ' bauble' + (v.picking.n > 1 ? 's' : '') + '</b>, one for each acorn card you offered. Tap ' + (want > 1 ? want + ' of them' : 'one') + ', then Take.</p>' : '') +
        '<div class="row">' + v.row.map((b, i) => '<' + (myPick ? 'button type="button"' : 'div') + ' class="bauble' + (myPick && bsel.includes(i) ? ' sel' : '') + '" data-i="' + i + '" data-k="b' + i + '-' + b + '" title="' + esc(B[bKind(b)].name + ': ' + B[bKind(b)].rule) + '">' + baubleIcon(b) + '<small>' + (b.startsWith('acorn') ? b.slice(5) + ' acorns' : esc(B[b].name)) + '</small></' + (myPick ? 'button' : 'div') + '>').join('') +
        (v.row.length ? '' : '<span class="bag">The row is empty: baubles come from the bag.</span>') + '<span class="bag">' + v.bagLeft + ' in the bag</span></div>' +
        (myPick ? '<div class="acts"><button class="dt-btn go" data-do="take"' + (bsel.length === want ? '' : ' disabled') + '>Take ' + (want > 1 ? 'these ' + want : 'it') + '</button></div>' : '') +
        '<div class="key">' + ['earring', 'berry', 'button', 'feather', 'acorn'].map((k) => '<div>' + baubleIcon(k === 'acorn' ? 'acorn4' : k) + '<span><b>' + esc(B[k].plural) + '</b> · ' + esc(B[k].rule) + '</span></div>').join('') + '</div></div>';
    }

    // ---- your acorns
    let mine = '';
    if (v.phase !== 'over') {
      const tot = sel.reduce((t, i) => t + v.hand[i], 0), myBid = L && !L.frost ? L.bids[me] || 0 : 0;
      let prompt = '', acts = '';
      if (myTurn) {
        const need = L.high + 1 - myBid;
        prompt = L.high === 0 ? 'Nobody has offered yet. Open with any acorn cards, or pass.' : 'The top offer is <b>' + L.high + '</b>' + (L.highSeat >= 0 ? ' (' + name(L.highSeat) + ')' : '') + '. ' + (myBid ? 'You have ' + myBid + ' in, so add at least ' + need + '.' : 'Add at least ' + need + ' to beat it.');
        const nb = (L.spent[me] || []).length;
        acts = '<button class="dt-btn go" data-do="raise"' + (sel.length && myBid + tot > L.high ? '' : ' disabled') + '>Offer ' + (myBid + tot) + '</button>' +
          '<button class="dt-btn" data-do="pass">' + (nb ? 'Drop out and take ' + nb + ' bauble' + (nb > 1 ? 's' : '') : 'Pass') + '</button>';
      } else if (myFrost) {
        prompt = 'Put acorn cards in your secret offer, then lock it in. You can offer nothing.';
        acts = '<button class="dt-btn go" data-do="offer">' + (sel.length ? 'Offer ' + tot + ' in secret' : 'Offer nothing') + '</button>';
      } else if (v.phase === 'frost' && L && L.offered[me]) {
        prompt = 'You offered ' + (v.myOffer ? v.myOffer.reduce((t, x) => t + x, 0) : 0) + '. Waiting for the others…';
      } else if (v.phase === 'lotEnd') {
        acts = '<button class="dt-btn" data-do="next">Next treasure</button>';
      }
      const staging = myTurn || myFrost;
      mine = '<div class="panel"><h3>Your acorns · ' + P[me].money + ' left</h3>' + (prompt ? '<p class="prompt">' + prompt + '</p>' : '') +
        '<div class="hand" data-zone="hand">' + v.hand.map((c, i) => sel.includes(i) ? '' : acardHTML(c, { button: staging, i, k: 'h' + i + '-' + c })).join('') + (v.hand.length ? '' : '<span class="bag">No acorn cards left.</span>') + '</div>' +
        (staging ? '<div class="tray" data-zone="tray">' + (sel.length ? sel.map((i) => acardHTML(v.hand[i], { button: true, i, k: 'h' + i + '-' + v.hand[i] })).join('') + '<span class="sum">+' + tot + '</span>' : '<span class="drophere">Tap acorn cards to put them in your offer</span>') + '</div>' : '') +
        (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>';
    }

    // ---- critters
    const turn = v.phase === 'bid' && L ? L.turn : v.phase === 'pick' && v.picking ? v.picking.seat : -1;
    const crits = '<div class="crits">' + P.map((p, i) => {
      const have = p.treasures.map((t) => '<span class="h" title="' + esc(t.name) + '">' + svg(A.treasure(t.name), '-15 -15 30 30') + t.vp + '</span>').join('') +
        ['earring', 'berry', 'button', 'feather'].filter((b) => p.baubles[b]).map((b) => '<span class="h" title="' + esc(B[b].plural) + '">' + baubleIcon(b) + p.baubles[b] + '</span>').join('');
      return '<div class="crit' + (i === turn ? ' turn' : '') + '">' + tok(p.critter) + '<span class="nm">' + name(i) + '</span><span class="money"><b>' + p.money + '</b> acorns · ' + p.cards + ' card' + (p.cards === 1 ? '' : 's') + '</span>' +
        '<span class="have">' + (have || '<span class="pts">nothing yet</span>') + '<span class="pts">' + p.score.total + ' pts</span></span></div>';
    }).join('') + '</div>';

    DevTable.flip(el, () => {
      el.innerHTML = DEFS + '<div class="ne">' + (banner || stage) + '<div class="cols' + (v.phase === 'over' ? ' solo' : '') + '">' + (v.phase === 'over' ? '' : '<div style="display:grid;gap:14px">' + mine + row + '</div>') + '<div class="panel"><h3>Critters</h3>' + crits +
        '<p class="dt-muted" style="font-size:12.5px">Lowest on acorns at the first snow is out. Most points among the rest wins.</p><div class="log">' + v.log.slice().reverse().map((l) => '<p>' + esc(youLine(l)) + '</p>').join('') + '</div></div></div></div>';
    });

    // pick cards up and put them down: acorns move between your hand and your offer, baubles come to you
    const toggle = (i) => { sel = sel.includes(i) ? sel.filter((x) => x !== i) : sel.concat(i); render(el, v, api); };
    Tabletop.drag(el, {
      pieces: 'button.acard, button.bauble', zones: '[data-zone]', key: (n) => n.dataset.k,
      canLift: (n) => (n.classList.contains('acard') ? myTurn || myFrost : myPick),
      tap: (p) => {
        if (p.el.classList.contains('bauble')) {
          const i = +p.data.i;
          if (bsel.includes(i)) bsel = bsel.filter((x) => x !== i);
          else if (bsel.length >= want) { api.nope('You take ' + want + '. Tap one you chose to put it back first.', p.el); return true; }
          else bsel = bsel.concat(i);
          render(el, v, api); return true;
        }
        toggle(+p.data.i); return true;
      },
      drop: (p, z) => {
        if (p.el.classList.contains('bauble')) return { ok: false, quiet: true };
        const i = +p.data.i, zone = z.dataset.zone;
        if (zone === 'tray' && !sel.includes(i)) { toggle(i); return true; }
        if (zone === 'hand' && sel.includes(i)) { toggle(i); return true; }
        return { ok: false, quiet: true };
      },
    });
    el.querySelectorAll('[data-do]').forEach((b) => b.addEventListener('click', () => {
      const d = b.dataset.do;
      if (d === 'raise') api.act({ type: 'raise', cards: sel }, b);
      if (d === 'pass') api.act({ type: 'pass' }, b);
      if (d === 'offer') api.act({ type: 'offer', cards: sel }, b);
      if (d === 'next') api.act({ type: 'next' }, b);
      if (d === 'take') api.act({ type: 'takeMany', idx: bsel }, b);
    }));
  }

  const mast = '<h1>Nest Egg</h1><div class="mast-crit">' + E.CRITTERS.map((k) => svg('<circle cx="0" cy="-2" r="15.5" fill="' + A.mix(A.SEAT[k], '#ffffff', .72) + '"/><g transform="translate(0 ' + (k === 'rabbit' ? 2.5 : 0) + ') scale(' + (k === 'rabbit' ? .78 : .95) + ')">' + A.head(k) + '</g>', '-16 -18 32 32')).join('') + '</div>';
  document.body.insertAdjacentHTML('afterbegin', DEFS);
  DevTable.mount(document.getElementById('app'), {
    id: 'nest-egg', title: 'Nest Egg', blurb: '3–5 players · 20–30 minutes', mast,
    minPlayers: 3, maxPlayers: 5, defaultPlayers: 4, botNames: E.BOT_NAMES,
    botNote: 'Each bot has its own appetite: some chase treasures, some hoard acorns, some can’t resist a shiny bauble.',
    create: (players, opts) => new E.Game(players, opts),
    render,
    rules:
      '<p><b>Trade before the first snow.</b> Every critter starts with the same 13 acorn cards. The magpie shows one treasure at a time, and you can’t make change.</p>' +
      '<p><b>Offer or pass.</b> In turn, beat the top offer by adding acorn cards, or pass. Passing is for good. The last critter in wins the treasure, even if nobody else offered. If everyone passes, the magpie flies off with it.</p>' +
      '<p><b>Win or lose, the acorns are gone.</b> Every acorn offered goes to the magpie. When you drop out after offering, take one bauble from the row for each acorn card you offered. Whoever drops out first picks first.</p>' +
      '<p><b>Frosts.</b> Four treasures are frosts: everyone offers in secret at once. Most acorns wins; everyone else who offered takes baubles, biggest offer first. The fourth frost brings the first snow and ends the game at once.</p>' +
      '<p><b>Baubles.</b> Earrings: one alone is −3, each pair +5. Berries: a few are lovely, too many spoil. Buttons: the bigger the collection, the better. Feathers: 1 each, most +6, second +3. Lost acorns go into your hand.</p>' +
      '<p><b>Winter.</b> The critter with the fewest acorns left doesn’t make it through. Most points among the rest wins.</p>',
  });
})();
</script>
</body>
</html>
