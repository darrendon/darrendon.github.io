<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day One · Play online</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/dev-table.css?v=79371b01">
<style>
  /* Day One: a game laid out on a wooden table. The board is a printed sea, pieces are wooden discs,
     panels are the paper player aids. Board on the left and aids on the right; one column on phones. */
  body{
    --table:#6d4a2f; --table-2:#5e3f27; --table-ink:#f6eedd; --table-dim:#e3cfae;
    --paper:#f7f2e7; --paper-2:#ede5d3; --rule:#d9ccb2; --shadow:rgba(38,22,8,.35);
    --ink:#22313a; --ink-dim:#56636b; --ink-faint:#7c817e;
    --accent:#1d6c86; --gold:#f2c14e;
    --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
    --t-bg:#ede5d3; --t-card:#f7f2e7; --t-ink:#22313a; --t-muted:#56636b; --t-line:#d9ccb2; --t-accent:#1d6c86; --t-accent-ink:#fff;
    --t-mast:#16384a; --t-mast-ink:#f6eedd; --t-font:var(--f-body);
    background:
      repeating-linear-gradient(92deg, rgba(0,0,0,.06) 0 2px, transparent 2px 9px, rgba(255,255,255,.035) 9px 10px, transparent 10px 23px),
      repeating-linear-gradient(88deg, rgba(0,0,0,.05) 0 1px, transparent 1px 41px),
      linear-gradient(180deg, var(--table) 0%, var(--table-2) 100%) fixed;
    background-color:var(--table);
  }
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* lobby */
  .dt-mast{background:#16384a;box-shadow:0 18px 30px rgba(25,12,2,.4), inset 0 0 0 3px #0f2a39, inset 0 0 0 5px #d8c08a}
  .dt-mast h1{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;color:var(--table-ink);text-shadow:0 2px 0 rgba(0,0,0,.3)}
  .dt-mast .tag{margin:8px 0 0;max-width:52ch;color:#cfe3e8;font-size:15px}
  .dt-mast .discs{position:absolute;right:18px;top:16px;opacity:.95}
  @media (max-width:560px){.dt-mast .discs{display:none}}
  .dt-sub b{color:var(--gold)}
  .dt-card{box-shadow:0 8px 18px var(--shadow)}
  .dt-rules h2{font-family:var(--f-display);font-weight:400;font-size:21px}
  .dt-rules p{max-width:68ch}
  .dt-credit{color:var(--table-dim)}
  .dt-top{border-bottom-color:#c9b382}
  .dt-title{font-family:var(--f-display);font-weight:400;font-size:19px}
  #dt-board{container-type:inline-size}

  /* table layout */
  .d1{display:flex;flex-direction:column;gap:12px;color:var(--ink);font-size:15px;line-height:1.45;max-width:1260px;margin:0 auto}
  .d1-main,.d1-side{display:contents}
  .d1 .final{order:0}.d1 .turncard{order:1}.d1 .board-card{order:2}.d1 .preview{order:3}.d1 .tray{order:4}.d1 .mats{order:5}
  .d1 .booklet.logb{order:6}.d1 .booklet.rules{order:7}.d1 .refcard{order:8}.d1 .d1-bar{order:20}
  @container (min-width:760px){
    .d1{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:16px 20px;align-items:start}
    .d1 .final{grid-column:1/-1}
    .d1-main{display:flex;flex-direction:column;gap:12px;grid-column:1;min-width:0}
    .d1-side{display:flex;flex-direction:column;gap:14px;grid-column:2;min-width:0}
    .d1 .d1-bar{grid-column:1/-1}
  }
  @container (min-width:1000px){.d1{grid-template-columns:minmax(0,1fr) 380px}}

  /* the board */
  .board-card{background:#16384a;border-radius:6px;padding:12px;box-shadow:0 22px 34px rgba(25,12,2,.45), 0 3px 0 #0b1f2a, 0 5px 0 #c9b382, 0 7px 0 #9c875a, inset 0 0 0 3px #0f2a39, inset 0 0 0 5px #d8c08a;
    width:100%;max-width:calc((100vh - 170px) * 1.02);min-width:min(100%,420px);margin:0 auto}
  @container (max-width:520px){.board-card{padding:6px}}
  #board{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;border-radius:4px}
  #board .cell{cursor:default}
  #board.live .cell.hit{cursor:pointer}
  .refcard{background:var(--paper);border-radius:8px;padding:4px 8px 10px;box-shadow:0 8px 16px var(--shadow)}
  .hexinfo{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;min-height:30px;padding:8px 6px 2px;font-size:13px;color:var(--ink-dim)}
  .hexinfo .coord{font-weight:700;color:var(--ink)}
  .dots{display:inline-flex;gap:3px;align-items:center}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.25);vertical-align:-1px}
  .dot.core{background:radial-gradient(circle at 40% 35%, #ffffff 0 30%, #e9e4f2 70%, #b9b0c9 100%);border-radius:0;box-shadow:none;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);width:14px;height:14px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:6px 6px 0;font-size:12.5px;color:var(--ink-dim)}
  .legend b{color:var(--ink);font-weight:700}
  .el{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .legend .el{white-space:normal;align-items:flex-start}
  .legend .el>svg,.legend .el>.dot{flex-shrink:0;margin-top:2px}

  /* the turn card: a reference card lying on the table */
  .turncard{position:relative;background:linear-gradient(180deg,#fbf6ea,#f1e8d4);border-radius:12px;padding:14px 16px 15px;box-shadow:0 10px 20px var(--shadow), 0 1px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
  .turncard::before{content:"";position:absolute;inset:5px;border:1px solid #d8c8a4;border-radius:8px;pointer-events:none}
  .turncard h2{font-family:var(--f-display);font-size:19px;font-weight:400;margin:0;color:var(--ink)}
  .turncard .round{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .turncard .who{font-family:var(--f-display);font-size:23px;display:flex;align-items:flex-end;gap:10px;line-height:1}
  .turncard .who small{font-family:var(--f-body);font-size:13px;color:var(--ink-faint)}
  .turncard .hint{color:var(--ink-dim);font-size:14px}
  .turncard .steps{display:flex;gap:16px;font-size:14px;color:var(--ink-dim)}
  .turncard .steps b{color:var(--ink);font-size:17px;font-family:var(--f-display);font-weight:400;margin-left:3px}
  .preview dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13.5px}
  .preview dt{color:var(--ink-dim)}
  .preview dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .preview .delta{font-size:13px;color:var(--ink-dim)}
  .preview .delta b{color:var(--ink)}
  .preview .ph{display:none;border-top:1px dashed var(--rule);padding-top:8px}
  @container (max-width:759px){.turncard .hint.walk{display:none}.preview .ph{display:block}}

  /* the supply: piles of wooden discs on the table */
  .tray{background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.08));border-radius:12px;padding:8px 10px 10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.08)}
  .traylab{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--table-dim);padding:0 2px 2px}
  .tray.live .traylab::after{content:" · tap a pile to take earth";letter-spacing:.04em;text-transform:none;font-weight:600}
  .supply{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .pile{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;border-radius:10px;padding:4px 2px 5px;color:var(--table-ink);font-size:12px;min-height:44px}
  .pile svg{display:block;transition:transform .12s}
  .pile .pl{font-weight:600;color:var(--table-dim)}
  .pile b{font-family:var(--f-display);font-weight:400;font-size:15px;line-height:1}
  .pile:disabled{cursor:default}
  .tray.live .pile:not(:disabled){cursor:pointer}
  .tray.live .pile:not(:disabled):hover svg{transform:translateY(-3px)}
  .tray.live .pile:disabled{opacity:.45}
  .pile.on{background:rgba(255,246,222,.16);box-shadow:inset 0 0 0 2px var(--gold)}
  .pile.on svg{transform:translateY(-4px)}

  /* player mats: cardboard boards with an edge in the player's colour */
  .mats{display:flex;flex-direction:column;gap:12px}
  @container (min-width:560px) and (max-width:759px){.mats{display:grid;grid-template-columns:1fr 1fr}}
  .mat{position:relative;background:linear-gradient(180deg,#efe3c7,#e4d4b1);border-radius:10px;padding:10px 12px;box-shadow:0 8px 16px var(--shadow), 0 2px 0 #b9a174, inset 0 5px 0 var(--pc), inset 0 6px 0 var(--pe);display:flex;flex-direction:column;gap:7px;transition:transform .15s, box-shadow .15s}
  .mat.active{transform:translateY(-3px);box-shadow:0 14px 24px var(--shadow), 0 2px 0 #b9a174, inset 0 5px 0 var(--pc), inset 0 6px 0 var(--pe), 0 0 0 3px var(--gold)}
  .mathead{display:flex;align-items:flex-end;gap:8px;padding-top:4px}
  .mathead .pname{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .mathead .pname small{font-weight:500;color:var(--ink-faint)}
  .turnflag{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--gold);color:#3b2a08;border-radius:4px;padding:2px 6px;box-shadow:0 1px 0 #9c7a1c}
  .ptotal{font-family:var(--f-display);font-size:22px;line-height:1;min-width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:#f8f1e1;box-shadow:inset 0 0 0 2px var(--pc), 0 2px 0 rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
  .pboard{background:#f6eedb;border:1px solid #cdb98c;border-radius:6px;padding:4px 6px 3px}
  .pboard svg{display:block;max-width:330px}
  .tableau{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--ink-dim)}
  .tok{display:inline-flex;align-items:center;gap:4px}
  .tok b{color:var(--ink);font-weight:800}
  .tok svg{display:block}
  .tok .none{color:var(--ink-faint);font-style:italic}

  /* rule booklets */
  .booklet{background:linear-gradient(90deg,#e8dcc2 0 10px,var(--paper) 10px);border-radius:6px 10px 10px 6px;padding:12px 16px 12px 24px;box-shadow:0 8px 16px var(--shadow)}
  .booklet summary{cursor:pointer;font-family:var(--f-display);font-size:17px;color:var(--ink);list-style:none;min-height:24px}
  .booklet summary::-webkit-details-marker{display:none}
  .booklet summary::after{content:" +";color:var(--ink-faint)}
  .booklet[open] summary::after{content:" –"}
  .booklet.rules{font-size:14px;color:var(--ink-dim)}
  .booklet.rules p{max-width:65ch;margin:8px 0}
  .booklet.rules b{color:var(--ink)}
  .log{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;font-size:13px;color:var(--ink-dim)}
  .log li{display:flex;gap:8px;align-items:baseline}
  .log li .t{font-size:11px;font-weight:700;color:var(--ink-faint);min-width:28px;font-variant-numeric:tabular-nums}

  /* nightfall */
  .final{background:var(--paper);border-radius:10px;padding:18px 20px;box-shadow:0 14px 28px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px}
  .final h3{font-family:var(--f-display);font-size:clamp(22px,4vw,28px);margin:0;font-weight:400}
  .final p{margin:0;color:var(--ink-dim)}
  .tablewrap{overflow-x:auto}
  .final table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
  .final th,.final td{padding:7px 6px;border-bottom:1px solid var(--rule);text-align:right}
  .final th:first-child,.final td:first-child{text-align:left}
  .final th{color:var(--ink-dim);font-weight:600;font-size:12px}
  .final tr.win td{color:var(--accent);font-weight:800}
  .final td:first-child .el{white-space:normal}
  @container (max-width:520px){.final{padding:16px 14px}.final th,.final td{padding:6px 3px;font-size:12.5px}.final th{font-size:10.5px}}
  .pchip{width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.45);display:inline-block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}

  /* the action bar: always in reach at the bottom of the screen */
  .d1-bar{position:sticky;bottom:0;z-index:15;margin:0 calc(-1 * clamp(10px,2vw,20px)) calc(-1 * clamp(10px,2vw,20px));padding:10px clamp(10px,2vw,20px) calc(10px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb,var(--paper) 95%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:2px solid #c9b382;box-shadow:0 -10px 24px -14px rgba(0,0,0,.5);display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
  .d1-bar[hidden]{display:none!important}
  .d1-bar .say{flex:1 1 220px;font-size:14px;color:var(--ink-dim);min-width:0}
  .d1-bar .say b{color:var(--ink)}
  .d1-bar .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .bbtn{min-height:44px;min-width:44px;background:linear-gradient(180deg,#fbf6ea,#efe5cf);border:1.5px solid #5b4528;border-radius:9px;padding:9px 15px;font-weight:700;font-size:14.5px;color:var(--ink);box-shadow:0 3px 0 #5b4528;cursor:pointer}
  .bbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #5b4528}
  .bbtn.go{background:linear-gradient(180deg,#2a7f9a,#1d6c86);color:#fff;border-color:#123f50;box-shadow:0 3px 0 #123f50;min-width:88px}
  .bbtn:disabled{opacity:.45;cursor:default}
  .lands{display:flex;gap:6px;flex-wrap:wrap}
  .land{min-height:48px;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid var(--rule);background:#fffdf7;border-radius:10px;padding:4px 7px;font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1.1}
  .land .row{display:flex;align-items:center;gap:4px;font-size:13px}
  .land[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--ink)}
  .land:disabled{opacity:.4;cursor:default}
  @container (max-width:420px){.land{min-width:0;flex:1 1 0;padding:4px 2px}.lands{flex:1 1 100%;gap:4px}}
</style>
</head>

<div id="app"></div>
<script src="/assets/js/tabletop.js?v=bbd86e78"></script>
<script src="/assets/js/dev-table.js?v=8204bfed"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  const D1 = window.DayOne, esc = DevTable.esc;
  const { cells, nbl, R, S3, TM, VBW, VBH, W } = D1.geo;
  const ELEM = D1.ELEM, PCOL = D1.PCOL, CORE = D1.CORE, NEU = D1.NEU, MTN_VAL = D1.MTN_VAL, TIGHT = D1.TIGHT, coord = D1.coord;
  const INK = '#10242e', CHALK = '#fff7e3';
  const SPEED = 170;                       // ms per space walked (the original's "Normal")
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- state of this screen ---------------- */
  let ROOT = null, API = null, V = null, gameKey = null, shownSeq = null;
  const U = { key: null, mode: 'idle', origin: null, c: 0, clicks: [], pull: undefined, submitted: false, subT: null, F: null, legal: [] };
  const A = { running: false, pending: null, tail: 0, ov: null, disp: null, p: -1, timer: null, gen: 0 };
  let lastHeld = null, hoverI = null;
  const origBusy = window.__ddBusy || (() => false);
  window.__ddBusy = () => A.running || Date.now() < A.tail || origBusy();   // bots wait for a move to finish walking

  const clean = (n) => String(n).replace(/\s*\(bot\)$/, '');
  const me = () => V.seat;
  const isBot = (q) => V.players[q].bot;
  const nameOf = (q) => esc(clean(V.players[q].name)) + (q === me() && !isBot(q) && clean(V.players[q].name) !== 'You' ? ' (you)' : '');
  const discDot = (d) => (d.c === CORE ? '<span class="dot core"></span>' : '<span class="dot" style="background:' + ELEM[d.c].col + '"></span>');
  const myTurn = () => V && !V.s.over && V.s.cur === me() && !isBot(me());

  /* ---------------- drawing: pieces ---------------- */
  const f1 = (n) => n.toFixed(1);
  function hexPoints(x, y, r) { const pts = []; for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 30); pts.push(f1(x + r * Math.cos(a)) + ',' + f1(y + r * Math.sin(a))); } return pts.join(' '); }
  function discSVG(x, y, rx, ry, h, top, side, line) {   // a wooden disc: side band then top face (y = top face centre)
    return '<path d="M' + f1(x - rx) + ' ' + f1(y) + ' v' + h + ' a' + rx + ' ' + ry + ' 0 0 0 ' + 2 * rx + ' 0 v' + -h + ' Z" fill="' + side + '" stroke="' + line + '" stroke-width=".7"/>' +
      '<ellipse cx="' + f1(x) + '" cy="' + f1(y) + '" rx="' + rx + '" ry="' + ry + '" fill="' + top + '" stroke="' + line + '" stroke-width=".7"/>';
  }
  function hexPlateSVG(x, y, r, h, top, side, line) {     // a flat hexagonal wooden tile seen from above at an angle
    const k = 0.5, pts = []; for (let j = 0; j < 6; j++) { const a = Math.PI / 3 * j; pts.push([x + r * Math.cos(a), y + r * k * Math.sin(a)]); }
    const P = (p) => f1(p[0]) + ',' + f1(p[1]);
    const sideP = [pts[0], pts[1], pts[2], pts[3], [pts[3][0], pts[3][1] + h], [pts[2][0], pts[2][1] + h], [pts[1][0], pts[1][1] + h], [pts[0][0], pts[0][1] + h]];
    return '<polygon points="' + sideP.map(P).join(' ') + '" fill="' + side + '" stroke="' + line + '" stroke-width=".8" stroke-linejoin="round"/><polygon points="' + pts.map(P).join(' ') + '" fill="' + top + '" stroke="' + line + '" stroke-width=".8" stroke-linejoin="round"/>';
  }
  const DISC_H = 3.4, STACK_BASE = 11.5;
  function stackLayout(s, i) { const n = s.st[i].length, claimed = s.owner[i] >= 0; const items = n + (claimed ? 1 : 0); return { n, claimed, step: Math.min(DISC_H, 15 / Math.max(1, items)) }; }
  function stackTop(s, i) { const L = stackLayout(s, i), c = cells[i]; return c.y + STACK_BASE - L.step * L.n - (L.claimed ? 4.4 : 0); }
  function starSVG(x, y, r, fill, squash) {   // a five-pointed star, flattened to sit on a disc face
    squash = squash || 1; let d = ''; for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r; d += (k ? 'L' : 'M') + f1(x + rr * Math.cos(a)) + ' ' + f1(y + rr * Math.sin(a) * squash); }
    return '<path d="' + d + 'Z" fill="' + fill + '" pointer-events="none"/>';
  }
  // free spots on a space for the little printed/counter badges, clear of any peak tile on its corners
  function badgeSpot(i, s, prefer) {
    const c = cells[i], tiles = [];
    TIGHT.mountains.forEach((t, j) => { const k = 100 + j; if (!t.includes(i) || !V.board.mtn[k] || (k in s.sealed)) return; tiles.push([t.reduce((a, x) => a + cells[x].x, 0) / 3 - c.x, t.reduce((a, x) => a + cells[x].y, 0) / 3 - c.y]); });
    const clear = (x, y, r) => tiles.every(([tx, ty]) => Math.abs(tx - x) > 8 + r || Math.abs(ty - y) > 8 + r);
    for (const [x, y] of prefer) if (clear(x, y, 8)) return [x, y];
    return prefer[0];
  }
  function stackSVG(c, s, i, quiet) {
    const st = s.st[i]; const L = stackLayout(s, i), n = L.n; if (!n && !L.claimed) return '';
    const step = L.step, atk = L.claimed ? s.cat[i] : -1; let y = c.y + STACK_BASE, out = '', coreVal = 0;
    out += '<ellipse cx="' + c.x + '" cy="' + f1(c.y + STACK_BASE + DISC_H + 1.5) + '" rx="' + (L.claimed ? 15 : 12) + '" ry="4.6" fill="#0a2633" opacity=".28"/>';
    for (let k = 0; k <= n; k++) {

      if (F.next.includes(i)) { if (F.phase === 'pull') U.pull = i; else U.clicks.push(i); if (window.Tabletop) Tabletop.sound('place'); draw(); }
      else if (!U.clicks.length && U.legal.includes(i) && i !== U.origin) { enterAim(i); lastHeld = null; draw(); }
      else if (i !== U.origin || U.clicks.length) refuse(stepWhy(F, i), h);
    }
  }
  // the referee: why that space can't be the next step
  function refuse(why, at) { if (window.Tabletop) Tabletop.nope(why, { at: at && at.getBoundingClientRect ? at : null }); }
  function stepWhy(F, i) {
    if (V.board.out[i]) return 'That’s the shallows: out of play with this many gods.';
    if (F.phase === 'done') return 'Your walk is finished. Press Go, or undo a step.';
    if (F.phase === 'pull') return 'You’re out of shrines: pick one of your own shrines to move under your god.';
    if (F.phase === 'target') return 'Raise your shrine on an open stack next to where your god came to rest.';
    const head = F.path.length ? F.path[F.path.length - 1] : F.from, left = F.cnt - F.path.length - 1;
    if (!D1.geo.nbl[head].includes(i)) return 'Your god walks one space at a time: step to a space next to it.';
    if (F.visited.has(i)) return 'You can’t enter the same space twice in a turn.';
    if (left === 0 && F.D.owner[i] >= 0) return 'Your god comes to rest on its last step, and it can’t rest on a space that already has a shrine.';
    if (left === 0) return 'Your god can’t come to rest there.';
    return 'Your god can’t walk there: from that space it couldn’t finish its walk.';
  }
  function submit() {
    const F = U.F; if (!F || F.phase !== 'done') return;
    U.submitted = true; clearTimeout(U.subT);
    const r = API.act({ type: 'move', o: U.origin, c: U.c, clicks: U.clicks.slice(), pull: U.pull === undefined ? null : U.pull });
    if (r && !r.ok) { U.submitted = false; draw(); return; }
    if (U.submitted) { draw(); U.subT = setTimeout(() => { if (U.submitted && myTurn()) { U.submitted = false; draw(); } }, 6000); }   // an online move that never arrived: let the player try again
  }
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !V || !myTurn() || U.submitted || A.running || U.mode !== 'aim') return;
    if (U.pull !== undefined) U.pull = undefined; else if (U.clicks.length) U.clicks.pop(); else if (U.legal.length > 1) U.mode = 'pick'; else return;
    U.noAuto = walkKey();
    lastHeld = null; draw();
  });

  /* ---------------- moves arriving: every seat replays the last move step by step ---------------- */
  function applyStep(Dst, st, p) {
    if (st.t === 'add') { for (let j = 0; j < st.k; j++) Dst.st[st.i].push({ c: st.c }); Dst.supply[st.c] -= st.k; }
    else if (st.t === 'lift') { Dst.st[st.i] = []; if (Dst.owner[st.i] >= 0) Dst.cat[st.i] = 0; }
    else if (st.t === 'drop') Dst.st[st.i].push(st.d);
    else if (st.t === 'gift') { D1.offerDisc(Dst, st.i, st.d, st.to); if (V.cfg.giftPts) Dst.giftPts[p]++; }
    else if (st.t === 'capture') { const d = Dst.st[st.i].pop(); if (d) D1.collect(Dst, p, d); Dst.caps[p]++; }
    else if (st.t === 'pull') { Dst.owner[st.i] = -1; Dst.outs[p] = Dst.outs[p].filter((x) => x !== st.i); }
    else if (st.t === 'claim') { Dst.owner[st.i] = st.p; Dst.cat[st.i] = Dst.st[st.i].length; Dst.ship[st.p] = st.i; Dst.outs[st.p] = Dst.outs[st.p].concat([st.i]); }
    else if (st.t === 'seal') Dst.sealed[st.i] = st.w;
  }
  function startAnim(v) {
    const L = v.last, p = L.p, steps = L.steps, Dst = D1.clone(L.before);
    let k = 0, hand = [], lifted = false; const path = [steps[0].i];
    const advance = (st) => {
      if (st.t === 'lift') { hand = Dst.st[st.i].slice(); lifted = true; }
      applyStep(Dst, st, p);
      if (st.t === 'drop' || st.t === 'gift') hand.shift();
      if (st.t === 'move') { hand = []; lifted = false; }
      if (st.t === 'lift' && st.i !== path[path.length - 1]) path.push(st.i);
      if (st.t === 'drop' || st.t === 'gift' || st.t === 'move') path.push(st.i);
    };
    if (p === v.seat && U.submitted) {   // you already walked this move yourself: only show what happens where your god rests
      let j = -1; steps.forEach((st, x) => { if (st.t === 'move') j = x; });
      for (; k <= j; k++) advance(steps[k]);
    }
    const gen = ++A.gen;
    A.running = true; A.p = p; A.disp = Dst; lastHeld = null;
    const tick = () => {
      if (gen !== A.gen) return;
      if (k >= steps.length) { endAnim(); return; }
      const st = steps[k++];
      advance(st);
      A.ov = { hide: p, legal: [], hits: [], anim: { trail: path.slice(), held: { i: path[path.length - 1], hand: hand.slice(), q: p, lifted: lifted && hand.length > 0 }, flash: st.t === 'gift' ? st.i : null } };
      draw();
      A.timer = setTimeout(tick, st.t === 'drop' || st.t === 'gift' || st.t === 'move' ? SPEED : SPEED * 2);
    };
    tick();
  }
  function endAnim() {
    A.running = false; A.ov = null; A.disp = null; A.tail = Date.now() + 350; lastHeld = null;
    const nv = A.pending; A.pending = null;
    if (nv) take(nv); else { syncTurn(); draw(); }
  }
  function syncTurn() {
    const key = V.seq + ':' + V.s.cur + ':' + V.s.over;
    if (key !== U.key) { U.key = key; U.submitted = false; clearTimeout(U.subT); resetTurn(); }
  }
  function take(v) {
    const gk = v.board.seed + ':' + v.P + ':' + v.players.map((p) => p.name).join('|');
    if (gk !== gameKey) {   // a new game in this tab
      gameKey = gk; A.gen++; clearTimeout(A.timer); A.running = false; A.pending = null; A.ov = null;
      shownSeq = v.last ? v.last.seq : null; U.key = null; U.submitted = false; lastHeld = null; hoverI = null;
      V = v; ROOT.innerHTML = ''; syncTurn(); draw(); return;
    }
    V = v; D1.bindView(V);
    if (v.last && v.last.seq !== shownSeq) { shownSeq = v.last.seq; startAnim(v); return; }
    syncTurn(); draw();
  }
  function render(el, v, api) {
    ROOT = el; API = api;
    if (A.running) { A.pending = v; return; }   // let the move being shown finish first
    take(v);
  }

  /* ---------------- rules text (the original rulebook) ---------------- */
  const RULES_HTML =
    '<p><em>Before the first dawn there was only sea. Then the young gods woke, and the sky gave them one day to make a world. Each god carries earth across the water, raises islands where it walks, and builds shrines to claim them. The sky watches: it favours gods who are generous with each other, and when night falls it crowns the masters of each land.</em></p>' +
    '<p><b>Setup.</b> The board is a 6 × 7 sea. Ten peak tiles sit on the printed marks where three spaces meet, and fallen stars (worth 1–3) are shuffled onto the star spots. With 2 or 3 players, play only inside the dashed line and leave the shallows outside it empty (no tiles or stars there).</p>' +
    '<p>Each player takes a god, a favour cube and their shrines (7 / 6 / 5 / 4 with 2 / 3 / 4 / 5 players). The board has 5 numbered start spaces: the first player starts on 1, the second on 2, and so on, with one shrine on the space and their god standing on it. Put an elder altar (grey) on every numbered space nobody is using inside the play area (2 players: spaces 3 and 5; 3 or 4 players: space 5; 5 players: none).</p>' +
    '<p>The earth of creation: 7 / 8 / 10 / 10 discs of each of the five lands (Fire, Forest, Shore, Reef, Stone) for 2 / 3 / 4 / 5 players. Each player takes a mastery board and puts a marker at 0 on each land’s track.</p>' +
    '<p><b>1. Gather earth.</b> Top up the stack under your god to 2 discs of one land from the earth of creation (if it already holds 2 or more, add 1). Your god stands on top. If your god can’t travel from there, start from one of your other shrines instead.</p>' +
    '<p><b>2. Walk the sea.</b> Lift the whole stack and carry it one space at a time, in any direction, dropping the bottom disc on each space you enter. You can’t enter the same space twice in a turn. Peaks stand on corners, so they never block the way. Your god comes to rest last, on a space with no shrine.</p>' +
    '<p><b>3. Offerings.</b> A disc that would drop onto a rival’s shrine is an offering. It lands on top of their shrine (their island grows) and they move that land’s marker up 1 on their mastery board. The sky rewards you: move your favour cube 1 step along the sun’s path. A fallen star offered goes straight to them. Give rivals what they don’t need. A disc dropped on an elder altar is an offering too: you gain 1 favour, nobody’s mastery moves, and a star dropped there returns to the sky (the box).</p>' +
    '<p><b>4. Surge (once per turn).</b> If your god comes to rest on a stack of 2 or more discs with no shrine, and the stack holds the land you gathered this turn, that land surges under you. Collect its top disc, add 1 disc of your land, and walk again.</p>' +
    '<p><b>5. Raise a shrine.</b> Collect the top disc where your god comes to rest (an empty space gives nothing), then slip a shrine under your god. If all your shrines are already on the sea, move one of them here instead; the stack it stood on stays behind.</p>' +
    '<p><b>6. Name a peak.</b> Each peak touches exactly 3 spaces. The moment all 3 hold shrines, the god with the most shrines there names it and takes the peak tile off the board (3 points). If gods tie, nobody can agree on a name and the tile returns to the box. After that, those shrines are free to move on to the next peak.</p>' +
    '<p><b>Collecting.</b> Whenever you collect an earth disc (the top disc where your god comes to rest, or the top disc in a surge), move that land’s marker up 1 on your mastery board (tracks stop at 25) and return the disc to the earth of creation. Stars you keep.</p>' +
    '<p><b>Nightfall.</b> Earth only leaves the earth of creation for the sea, and only comes back when someone collects it, so it slowly runs out as the islands grow. Night falls the moment a god cannot gather earth, because no land has enough discs left. Then the sky crowns the masters.</p>' +
    '<p><b>Mastery:</b> for each land, the god furthest along its track scores 10 and the clear second scores 5. If gods tie for the most, each of them scores 5 and there is no second place. <b>Fallen stars</b> score their printed value. <b>Favour:</b> 1 point for every offering you made (your cube on the sun’s path). <b>Peaks:</b> 3 points for each peak you named. A peak still unnamed at nightfall goes to the god with the most shrines around it (a tie scores nothing). <b>Tiebreak:</b> most earth collected.</p>';

  const mastDiscs = (() => {   // five wooden discs in a row, one per land, spaced so none touch
    let g = ''; ELEM.forEach((e, k) => { g += discSVG(16 + k * 30, 20, 11, 4.6, 5, e.col, e.edge, e.edge); });
    return '<svg class="discs" width="152" height="34" viewBox="0 0 152 34" aria-hidden="true">' + g + '</svg>';
  })();

  // read-only peek for automated checks
  window.DayOneUI = { get state() { return { mode: U.mode, phase: U.F && U.F.phase, next: U.F ? U.F.next.slice() : [], legal: U.legal.slice(), clicks: U.clicks.length, running: A.running, mine: !!V && myTurn() && !U.submitted, over: !!V && V.s.over, seq: V && V.seq, ships: V ? V.s.ship.slice() : [], me: V ? V.seat : 0 }; } };

  DevTable.mount(document.getElementById('app'), {
    id: 'day-one', title: 'Day One', blurb: '2–5 players · 30–45 minutes',
    mast: '<h1>Day One</h1><p class="tag">The world’s first day. Young gods carry earth across an empty sea, raise the first islands, and win the favour of the sky before nightfall.</p>' + mastDiscs,
    minPlayers: 2, maxPlayers: 5, defaultPlayers: 3, botNames: D1.BOT_NAMES,
    botNote: 'Each bot weighs every walk it can make and how the next god could answer it.',
    create: (players, opts) => new D1.Game(players, opts),
    render,
    rules: RULES_HTML,
  });
})();
</script>
</body>
