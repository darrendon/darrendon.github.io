<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Magpie · Play online</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/dev-table.css?v=79371b01">
<style>
  body{--t-bg:#F7EEDD;--t-card:#FFFAF0;--t-ink:#3E2A1E;--t-muted:#7A5E48;--t-line:#E6D3B5;--t-accent:#B5612C;--t-accent-ink:#fff;--t-mast:#4A2E1E;--t-mast-ink:#F7EBD0}
  .dt-mast h1{font-family:Fraunces,Georgia,serif;font-weight:900;letter-spacing:-.01em;color:#F7D9A6}
  .mast-crit{display:flex;gap:6px;margin-top:10px}.mast-crit svg{width:38px;height:38px}
  .ne{display:grid;gap:14px;max-width:1180px;margin:0 auto}
  .ne>*,.felt>*,.mid>*,.mat-cols>*{min-width:0}
  .panel{background:var(--t-card);border:1px solid var(--t-line);border-radius:14px;padding:14px}
  .panel h3,.zl{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .panel h3{color:var(--t-muted)}

  /* the table: a wooden rim around green felt */
  .table{background:linear-gradient(180deg,#8A5A34,#5E3A20);border-radius:30px;padding:12px;box-shadow:0 20px 30px -20px rgba(40,22,10,.7),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.25)}
  .felt{background:radial-gradient(130% 90% at 50% 0%,#52845C,#345F3F 72%);border-radius:20px;padding:16px;color:#F4EBD3;display:grid;gap:18px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),inset 0 10px 26px rgba(0,0,0,.25)}
  .zl{color:#D5E4C4}
  @media (max-width:560px){.table{border-radius:22px;padding:8px}.felt{border-radius:15px;padding:12px 10px}}

  /* cards */
  .tok{width:30px;height:30px;flex:none}.tok svg{width:100%;height:100%;display:block}
  .acard,.bauble,.tcard,.back,.mc{box-shadow:0 1px 0 rgba(0,0,0,.28),0 9px 12px -8px rgba(0,0,0,.6)}
  .acard{all:unset;box-sizing:border-box;width:56px;height:84px;border-radius:9px;background:#FFF8EA;border:3px solid #fff;outline:1px solid #D9BE93;outline-offset:-4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0 5px;color:#5A3A24;box-shadow:0 1px 0 rgba(0,0,0,.28),0 9px 12px -8px rgba(0,0,0,.6)}
  button.acard{cursor:pointer}button.acard:hover{outline-color:var(--t-accent);transform:translateY(-3px)}
  .acard b{font:900 25px/1 Fraunces,serif}
  .acard svg{width:26px;height:26px}
  .acard i{font:900 11px/1 Fraunces,serif;font-style:normal;transform:rotate(180deg);align-self:flex-end;margin-right:7px;opacity:.7}
  .acard.mini{width:34px;height:48px;border-width:2px;outline-offset:-3px;padding:3px 0;border-radius:6px}.acard.mini b{font-size:15px}.acard.mini svg{width:14px;height:14px}.acard.mini i{display:none}
  .back{box-sizing:border-box;display:grid;place-items:center;border-radius:9px;border:3px solid #FBF1DA;width:56px;height:84px;background:repeating-linear-gradient(45deg,#8A5A32 0 7px,#7A4D29 7px 14px)}
  .back svg{width:60%;height:auto;background:#FBF1DA;border-radius:50%;padding:3px;box-sizing:border-box}
  .back.t{width:84px;height:118px;background:repeating-linear-gradient(45deg,#2B3A47 0 8px,#22303B 8px 16px)}
  .back.b{width:72px;height:102px;background:repeating-linear-gradient(45deg,#7B4A6B 0 8px,#6C3F5E 8px 16px)}
  .back.mini{width:34px;height:48px;border-width:2px;border-radius:6px}
  .pile{display:grid;gap:6px;justify-items:center;text-align:center;font-size:12.5px;line-height:1.25;color:#E6EED8}
  .pile b{font:900 17px/1 Fraunces,serif;color:#fff}

  /* Mr. Magpie and his treasure */
  .mid{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:18px;align-items:center}
  @media (max-width:760px){.mid{grid-template-columns:auto minmax(0,1fr)}.mid .say{grid-column:1/-1}}
  .tcards{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .tcard{box-sizing:border-box;width:158px;border-radius:12px;background:#FFFBF2;border:4px solid #fff;outline:1px solid #D9BE93;outline-offset:-5px;padding:10px 10px 12px;text-align:center;color:#3E2A1E;display:flex;flex-direction:column;align-items:center;gap:4px}
  .tcard .tb{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#A17A3C}
  .tcard svg{width:92px;height:92px}
  .tcard .nm{font:900 17px/1.1 Fraunces,serif}
  .tcard .tv{display:flex;align-items:baseline;gap:5px;background:#4A2E1E;color:#F7D9A6;border-radius:999px;padding:4px 12px;margin-top:2px}
  .tcard .tv b{font:900 20px/1 Fraunces,serif}.tcard .tv i{font-style:normal;font-size:11.5px;letter-spacing:.06em}
  .tcard.frost{background:linear-gradient(180deg,#EAF6FC,#FFFBF2 60%);outline-color:#9FCBE0}.tcard.frost .tb{color:#3F7E9C}.tcard.frost .tv{background:#2F5F7A;color:#E6F5FC}
  .tcard.sm{width:112px;padding:7px 6px 9px;border-width:3px;outline-offset:-4px}.tcard.sm svg{width:54px;height:54px}.tcard.sm .nm{font-size:13px}.tcard.sm .tv{padding:3px 9px}.tcard.sm .tv b{font-size:15px}
  @media (max-width:560px){.tcard{width:136px}.tcard svg{width:76px;height:76px}.back.t{width:66px;height:92px}}
  .say{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
  .say .bird{width:92px;height:auto;flex:none}
  .bubble{background:#FFFBF2;color:#3E2A1E;border-radius:16px;padding:12px 14px;box-shadow:0 9px 12px -8px rgba(0,0,0,.5)}
  .bubble h2{margin:0 0 4px;font:900 22px/1.12 Fraunces,serif}
  .bubble p{margin:0;font-size:14.5px;color:#5E4532}
  .frosts{display:flex;gap:4px;justify-content:center}
  .frosts span{width:16px;height:16px;border-radius:50%;background:#DDF1FA;border:2px solid #fff;box-sizing:border-box}
  .frosts span.gone{background:transparent;border-color:rgba(255,255,255,.35)}
  @media (max-width:560px){.say .bird{width:64px}.bubble h2{font-size:19px}}

  /* the other critters around the table */
  .seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .seat{background:rgba(0,0,0,.17);border:2px solid transparent;border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start}
  .seat.turn{border-color:#F2C66B;background:rgba(0,0,0,.26)}
  .seat.out{opacity:.72}
  .sh{display:flex;align-items:center;gap:8px}
  .sh .nm{font-weight:600;font-size:15.5px;flex:1;min-width:0;overflow-wrap:anywhere}
  .sh .pts{font-size:12.5px;color:#D5E4C4;white-space:nowrap}
  .holds{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#E6EED8}
  .holds b{font:900 17px/1 Fraunces,serif;color:#fff}
  .tabl{display:flex;flex-wrap:wrap;gap:5px}
  .mc{box-sizing:border-box;width:46px;border-radius:7px;background:#FFFBF2;border:2px solid #fff;color:#3E2A1E;display:flex;flex-direction:column;align-items:center;padding:3px 2px 4px;font-size:11px;line-height:1.1;text-align:center}
  .mc svg{width:26px;height:26px}.mc b{font:900 13px/1 Fraunces,serif}.mc i{font-style:normal;font-size:10px;color:#7A5E48}
  .put{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:48px;border:2px dashed rgba(255,255,255,.3);border-radius:10px;padding:5px 7px}
  .put .lbl,.seat .lbl{font-size:12px;color:#D5E4C4}
  .put .amt{margin-left:auto;font:900 21px/1 Fraunces,serif;color:#fff}
  .put.high{border-color:#F2C66B;border-style:solid}.put.high .amt{color:#F9D98A}
  .chip{font-size:11.5px;font-weight:700;border-radius:5px;padding:2px 6px;background:rgba(255,255,255,.85);color:#4A3424;margin-left:auto}

  /* Mr. Magpie's baubles */
  .market{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
  @media (max-width:560px){.market{grid-template-columns:1fr}.market .pile{grid-template-columns:auto auto;justify-content:start;align-items:center;text-align:left}.market .back.b{width:44px;height:62px}}
  .row{display:flex;flex-wrap:wrap;gap:9px;align-items:stretch}
  .bauble{all:unset;box-sizing:border-box;width:114px;border-radius:10px;background:#FFFBF2;border:3px solid #fff;outline:1px solid #D9BE93;outline-offset:-4px;display:flex;flex-direction:column;align-items:center;color:#3E2A1E;padding:0 0 7px;box-shadow:0 1px 0 rgba(0,0,0,.28),0 9px 12px -8px rgba(0,0,0,.6);overflow:hidden}
  button.bauble{cursor:pointer}button.bauble:hover{outline-color:var(--t-accent);transform:translateY(-3px)}
  .bauble.sel{outline:3px solid #F2C66B;outline-offset:0;transform:translateY(-7px)}
  .bauble .bn{align-self:stretch;text-align:center;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;padding:6px 2px 5px;background:var(--bb);color:var(--bc)}
  .bauble .art{flex:1;display:grid;place-items:center;padding:6px 0 4px}
  .bauble .art svg{width:50px;height:50px}
  .bauble .an{display:flex;align-items:center;gap:3px}.bauble .an b{font:900 32px/1 Fraunces,serif;color:#5A3A24}.bauble .an svg{width:30px;height:30px}
  .bauble .bs{align-self:stretch;margin:0 6px;padding-top:5px;border-top:1.5px dashed #DCC7A2;display:grid;gap:2px;font-size:10.5px;line-height:1.15}
  .bs .l{display:flex;justify-content:space-between;gap:4px}.bs .l.c{justify-content:center;text-align:center}
  .bs i{font-style:normal;color:#7A5E48}.bs b{font-weight:700}
  .bs .cap{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#9A8468;text-align:center}
  .bs .g{display:grid;grid-template-columns:repeat(var(--n),1fr);text-align:center;row-gap:1px}
  .bs .g i{font-size:9.5px}.bs .g b{font-size:10.5px;letter-spacing:-.02em}
  .k-earring{--bb:#EEE6F6;--bc:#6E4E92}.k-berry{--bb:#F9E2E0;--bc:#A0392F}.k-button{--bb:#DCEFEA;--bc:#2C6C63}.k-feather{--bb:#DEEBF4;--bc:#2D5E80}.k-acorn{--bb:#F5E6C8;--bc:#7A4E24}
  @media (max-width:560px){.bauble{width:106px}.row{gap:7px}.seats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.seat{padding:8px 7px}.sh .nm{font-size:14px}}
  .mk-note{font-size:14.5px;margin:0 0 10px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}

  /* your place at the table */
  .mat{background:#FBF3E0;color:var(--t-ink);border-radius:16px;padding:14px;box-shadow:0 9px 14px -9px rgba(0,0,0,.55);border:2px solid transparent}
  .mat.turn{border-color:#F2C66B}
  .mat .sh .pts{color:var(--t-muted)}
  .mat-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:10px}
  @media (max-width:820px){.mat-cols{grid-template-columns:1fr}}
  .mat .zl{color:var(--t-muted);margin-top:10px}
  .mat .zl:first-child{margin-top:0}
  .hand{display:flex;flex-wrap:wrap;gap:6px;min-height:84px;align-items:flex-end}
  .tray{display:flex;flex-wrap:wrap;gap:7px;min-height:98px;padding:7px;border:2.5px dashed #D8C19A;border-radius:12px;align-items:center;background:rgba(255,255,255,.5)}
  .tray .drophere{margin:auto;color:var(--t-muted);font-size:14px;text-align:center}
  .prompt{font-size:15.5px;margin:8px 0 0}.prompt b{font-weight:700}
  .sum{font:900 22px/1 Fraunces,serif;margin-left:auto}
  .onTable{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .onTable .amt{font:900 20px/1 Fraunces,serif;margin-left:6px}
  .none{font-size:13px;color:var(--t-muted)}

  .log{font-size:13.5px;color:var(--t-muted);max-height:170px;overflow:auto}
  .log p{margin:0 0 3px}

  .banner{border-radius:14px;padding:14px 16px;background:#4A2E1E;color:#F7EBD0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
  .banner b{font:900 22px/1.15 Fraunces,serif;color:#F7D9A6}
  .banner p{margin:4px 0 0;font-size:14.5px}
  .final{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  .final th,.final td{padding:6px 6px;border-bottom:1px solid var(--t-line);text-align:right}
  .final th:first-child,.final td:first-child{text-align:left}
  .final th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t-muted);font-weight:600}
  .final tr.win td{background:rgba(148,144,21,.12);font-weight:600}
  .final tr.out td{color:#B3412C}
  .final td.tt{font:900 18px/1 Fraunces,serif}
</style>

<body>
<div id="app"></div>
<script src="/assets/js/tabletop.js?v=bbd86e78"></script>
<script src="/assets/js/dev-table.js?v=8204bfed"></script>
<script src="art.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  const E = window.MrMagpie, A = window.MagpieArt, esc = DevTable.esc, B = E.BAUBLE;
  const DEFS = '<svg width="0" height="0" style="position:absolute" aria-hidden="true">' + A.defs() + '</svg>';
  const svg = (inner, vb) => '<svg viewBox="' + (vb || '-10 -10 20 20') + '" aria-hidden="true">' + inner + '</svg>';
  const tok = (k) => '<span class="tok">' + svg('<circle cx="0" cy="-2" r="15.5" fill="' + A.mix(A.SEAT[k], '#ffffff', .72) + '"/><g transform="translate(0 ' + (k === 'rabbit' ? 2.5 : 0) + ') scale(' + (k === 'rabbit' ? .78 : .95) + ')">' + A.head(k) + '</g>', '-16 -18 32 32') + '</span>';
  const baubleIcon = (b) => svg(A.bauble(b), '-10 -10 20 20');
  const bKind = (b) => (b.startsWith('acorn') ? 'acorn' : b);
  const acardHTML = (v, opts) => {
    opts = opts || {};
    const tag = opts.button ? 'button type="button"' : 'div';
    return '<' + tag + ' class="acard' + (opts.mini ? ' mini' : '') + '"' + (opts.i != null ? ' data-i="' + opts.i + '"' : '') + (opts.k ? ' data-k="' + opts.k + '"' : '') + ' aria-label="' + v + ' acorns"><b>' + v + '</b>' + svg(A.acorn(6), '-8 -8 16 16') + '<i>' + v + '</i></' + (opts.button ? 'button' : 'div') + '>';
  };
  // a real card for each treasure: what it is, its picture, its points
  const tcardHTML = (t, sm) => '<div class="tcard' + (t.frost ? ' frost' : '') + (sm ? ' sm' : '') + '" data-k="t-' + esc(t.name) + '"><span class="tb">' + (sm ? 'Still here' : t.frost ? 'Frost' : 'Treasure') + '</span>' + svg(A.treasure(t.name), '-15 -15 30 30') + '<div class="nm">' + esc(t.name) + '</div><div class="tv"><b>' + t.vp + '</b><i>points</i></div></div>';
  // card backs: acorn cards, the treasure deck, the bauble bag
  const backHTML = (kind, mini) => '<div class="back' + (kind ? ' ' + kind : '') + (mini ? ' mini' : '') + '">' + (kind === 't' ? svg(A.treasure('Locket'), '-15 -15 30 30') : kind === 'b' ? baubleIcon('feather') : svg(A.acorn(6), '-8 -8 16 16')) + '</div>';
  // every bauble card prints how it scores along the bottom
  const R = E.RULES, signed = (n) => (n < 0 ? '−' + (-n) : '+' + n);
  const ladder = (tab) => { const pts = tab.slice(1); return '<span class="cap">have · score</span><span class="g" style="--n:' + pts.length + '">' + pts.map((_, i) => '<i>' + (i + 1) + (i === pts.length - 1 ? '+' : '') + '</i>').join('') + pts.map((x) => '<b>' + x + '</b>').join('') + '</span>'; };
  const line = (a, b) => '<span class="l"><i>' + a + '</i><b>' + b + '</b></span>';
  const SCORING = {
    earring: line('One alone', signed(R.earring.single)) + line('Each pair', signed(R.earring.pair)),
    berry: ladder(R.berry),
    button: ladder(R.button),
    feather: line('Each', signed(R.feather.each)) + line('Most', signed(R.feather.most)) + line('2nd most', signed(R.feather.second)),
    acorn: '<span class="l c"><i>Goes into your hand</i></span>',
  };
  const baubleHTML = (b, i, pick, chosen) => {
    const k = bKind(b), tag = pick ? 'button type="button"' : 'div';
    return '<' + tag + ' class="bauble k-' + k + (chosen ? ' sel' : '') + '" data-i="' + i + '" data-k="b' + i + '-' + b + '" aria-label="' + esc(B[k].name + (k === 'acorn' ? ' ' + b.slice(5) : '') + ': ' + B[k].rule) + '"><span class="bn">' + esc(k === 'acorn' ? 'Lost acorns' : B[k].name) + '</span>' +
      '<span class="art">' + (k === 'acorn' ? '<span class="an"><b>' + b.slice(5) + '</b>' + svg(A.acorn(6), '-8 -8 16 16') + '</span>' : baubleIcon(b)) + '</span><span class="bs">' + SCORING[k] + '</span></' + (pick ? 'button' : 'div') + '>';
  };
  const KINDS = ['earring', 'berry', 'button', 'feather'];
  // what a critter has collected, as little cards in front of them
  const tableau = (p) => p.treasures.map((t) => '<span class="mc" title="' + esc(t.name) + '">' + svg(A.treasure(t.name), '-15 -15 30 30') + '<b>' + t.vp + '</b></span>').join('') +
    KINDS.filter((b) => p.baubles[b]).map((b) => '<span class="mc" title="' + esc(B[b].plural + ': ' + B[b].rule) + '">' + baubleIcon(b) + '<b>×' + p.baubles[b] + '</b><i>' + signed(p.score[b]).replace('+', '') + ' pts</i></span>').join('');

  let sel = [], selSig = '', bsel = [], bselSig = '';
  // the log names you "You": "You brings" reads "You bring"
  const youLine = (l) => l.replace(/\bYou (brings|drops out and takes|drops|wins|runs|starts)\b/g, (m, v) => 'You ' + ({ 'drops out and takes': 'drop out and take' }[v] || v.slice(0, -1)));

  function render(el, v, api) {
    const me = v.seat, P = v.players, L = v.lot;
    // the staged offer only lasts while it's the same decision
    const sig = [v.phase, v.lotNo, L ? L.turn : '', v.hand.join(',')].join('|');
    if (sig !== selSig) { sel = []; selSig = sig; }
    const bsig = [v.phase, v.lotNo, v.picking ? v.picking.seat + ':' + v.picking.n : '', v.row.join(',')].join('|');
    if (bsig !== bselSig) { bsel = []; bselSig = bsig; }
    const name = (i) => esc(P[i].name) + (i === me && P[i].name !== 'You' ? ' (you)' : '');
    const myTurn = v.phase === 'bid' && L && L.turn === me;
    const myFrost = v.phase === 'frost' && L && !L.offered[me] && P[me].cards > 0;
    const myPick = v.phase === 'pick' && v.picking && v.picking.seat === me;

    const status = {
      bid: myTurn ? 'Your turn: offer acorns or pass' : L && L.turn >= 0 ? P[L.turn].name + ' is thinking' : '',
      frost: myFrost ? 'A frost: bring a secret offering' : 'Waiting for secret offerings',
      pick: myPick ? 'Take ' + v.picking.n + ' bauble' + (v.picking.n > 1 ? 's' : '') : v.picking ? P[v.picking.seat].name + ' is choosing baubles' : '',
      lotEnd: v.result && v.result.kind === 'win' ? P[v.result.seat].name + ' wins the ' + v.result.t.name + (v.result.extra && v.result.extra.length ? ' and more' : '') : 'It stays out for the next treasure',
      over: 'Winter is here',
    }[v.phase] || '';
    api.status('Treasure ' + v.lotNo + ' · ' + status);

    const frost = !!(L && L.frost);
    const turn = v.phase === 'bid' && L ? L.turn : v.phase === 'pick' && v.picking ? v.picking.seat : -1;
    const want = myPick ? Math.min(v.picking.n, v.row.length) : 0;

    // ---- Mr. Magpie, the treasure deck and what's up for grabs
    let mid = '';
    if (v.phase !== 'over') {
      const t = v.treasure, ex = v.extra || [], exNames = ex.map((x) => 'the ' + esc(x.name)).join(' and ');
      let head = frost ? 'A frost! Secret offerings' : 'Mr. Magpie shows off a treasure';
      let sub = frost ? 'Everyone brings a secret offering of acorn cards at once. The biggest wins; everyone else who brought one takes a bauble per card.' :
        'Beat the top offering by adding acorn cards, or pass. The last critter in wins it. Mr. Magpie keeps every acorn, win or lose.';
      if (ex.length && v.phase !== 'lotEnd') sub = 'Nobody claimed ' + exNames + ', so ' + (ex.length > 1 ? 'they go' : 'it goes') + ' with this one: <b>' + v.lotVp + ' points in all</b>. ' + sub;
      if (v.phase === 'lotEnd' && v.result) {
        const all = [v.result.t].concat(v.result.extra || []).map((x) => 'the ' + esc(x.name)).join(' and ');
        head = v.result.kind === 'win' ? name(v.result.seat) + ' wins ' + all + '!' : 'Nobody wanted ' + all;
        sub = v.result.kind === 'win' ? 'For ' + v.result.bid + ' acorns' + (v.result.solo ? ', and nobody else made an offer.' : '.') + ' Next treasure coming…' : 'Nobody brought an offering, so ' + ((v.result.extra || []).length ? 'they stay' : 'it stays') + ' out and goes with the next treasure.';
      }
      const pips = [0, 1, 2, 3].map((i) => '<span' + (i < v.frostsLeft ? '' : ' class="gone"') + '></span>').join('');
      mid = '<div class="mid"><div class="pile">' + backHTML('t') + '<span><b>' + v.deckLeft + '</b> cards left</span><div class="frosts" title="Frost cards still in the deck">' + pips + '</div><span>' + v.frostsLeft + ' frost' + (v.frostsLeft === 1 ? '' : 's') + ' left<br>the last brings the snow</span></div>' +
        '<div class="tcards">' + (t ? tcardHTML(t) : '') + (v.phase !== 'lotEnd' ? ex.map((x) => tcardHTML(x, true)).join('') : '') + '</div>' +
        '<div class="say"><svg class="bird" viewBox="-13 -25 42 33" aria-hidden="true">' + A.magpie() + '</svg><div class="bubble"><h2>' + head + '</h2><p>' + sub + '</p></div></div></div>';
    }

    // ---- what a critter has put on the table for this treasure
    const putHTML = (s) => {
      if (!L) return '';
      const spent = L.spent[s] || [], out = L.out.includes(s);
      const cards = spent.map((c, j) => acardHTML(c, { mini: true, k: 'sp' + s + '-' + j + '-' + v.lotNo })).join('');
      let inner;
      if (frost && v.phase === 'frost') inner = L.offered[s] ? backHTML('', true) + '<span class="chip">offered in secret</span>' : '<span class="lbl">Choosing a secret offering…</span>';
      else if (frost) inner = cards + (spent.length ? '' : '<span class="lbl">Brought nothing</span>') + '<span class="amt">' + (L.bids[s] || 0) + '</span>';
      else if (out) inner = cards + '<span class="chip">' + (spent.length ? 'out · took ' + spent.length : 'passed') + '</span>';
      else inner = cards + (spent.length ? '' : '<span class="lbl">No offering yet</span>') + '<span class="amt">' + (L.bids[s] || 0) + '</span>';
      return '<div class="put' + (!frost && L.highSeat === s && L.high > 0 && !out ? ' high' : '') + '">' + inner + '</div>';
    };

    // ---- the other critters, clockwise from you
    const others = P.map((_, k) => (me + 1 + k) % P.length).filter((s) => s !== me);
    const seats = '<div class="seats">' + others.map((s) => {
      const p = P[s], out = L && L.out.includes(s) && !frost;
      return '<div class="seat' + (s === turn ? ' turn' : '') + (out ? ' out' : '') + '"><div class="sh">' + tok(p.critter) + '<span class="nm">' + name(s) + '</span><span class="pts">' + p.score.total + ' pts</span></div>' +
        '<div class="holds">' + backHTML('', true) + '<span><b>' + p.cards + '</b> acorn card' + (p.cards === 1 ? '' : 's') + (v.phase === 'over' && p.money != null ? ' · ' + p.money + ' acorns' : '') + '</span></div>' +
        (v.phase !== 'over' ? putHTML(s) : '') +
        '<div class="tabl">' + (tableau(p) || '<span class="lbl">Nothing collected yet</span>') + '</div></div>';
    }).join('') + '</div>';

    // ---- final scores
    let banner = '';
    if (v.phase === 'over' && v.final) {
      const f = v.final, w = f.winners;
      banner = '<div class="banner"><div><b>' + (v.snow ? 'The first snow falls on the ' + esc(v.snow.name) + '.' : 'Winter is here.') + ' ' + (w.length ? w.map(name).join(' and ') + (w.length > 1 ? ' share the win!' : (w[0] === me && P[me].name === 'You' ? ' win!' : ' wins!')) : 'Nobody makes it through!') + '</b>' +
        '<p>' + f.out.map(name).join(' and ') + ' ran lowest on acorns and ' + (f.out.length > 1 || (f.out[0] === me && P[me].name === 'You') ? 'don’t' : 'doesn’t') + ' make it through winter.</p></div></div>';
      const order = P.map((_, i) => i).sort((a, b) => (f.out.includes(a) - f.out.includes(b)) || f.scores[b].total - f.scores[a].total);
      banner += '<div class="panel"><h3>Final count</h3><div style="overflow-x:auto"><table class="final"><tr><th>Critter</th><th>Acorns left</th><th>Treasures</th><th>Earrings</th><th>Berries</th><th>Buttons</th><th>Feathers</th><th>Total</th></tr>' +
        order.map((i) => { const s = f.scores[i]; return '<tr class="' + (w.includes(i) ? 'win' : f.out.includes(i) ? 'out' : '') + '"><td>' + name(i) + (f.out.includes(i) ? ' · out' : '') + '</td><td>' + f.money[i] + '</td><td>' + s.treasures + '</td><td>' + s.earring + '</td><td>' + s.berry + '</td><td>' + s.button + '</td><td>' + s.feather + '</td><td class="tt">' + s.total + '</td></tr>'; }).join('') + '</table></div></div>';
    }

    // ---- Mr. Magpie's baubles: the bag and the face-up row
    let market = '';
    if (v.phase !== 'over') {
      market = '<div><p class="zl">Mr. Magpie’s baubles' + (myPick ? ' · take ' + v.picking.n : '') + '</p>' +
        (myPick ? '<p class="mk-note">You dropped out, so Mr. Magpie thanks you with <b>' + v.picking.n + ' bauble' + (v.picking.n > 1 ? 's' : '') + '</b>, one for each acorn card you offered. Tap ' + (want > 1 ? want + ' of them' : 'one') + ', then Take.</p>' : '') +
        '<div class="market"><div class="pile">' + backHTML('b') + '<span><b>' + v.bagLeft + '</b> in the bag</span></div><div><div class="row">' + v.row.map((b, i) => baubleHTML(b, i, myPick, myPick && bsel.includes(i))).join('') + '</div>' +
        (myPick ? '<div class="acts"><button class="dt-btn go" data-do="take"' + (bsel.length === want ? '' : ' disabled') + '>Take ' + (want > 1 ? 'these ' + want : 'it') + '</button></div>' : '') + '</div></div></div>';
    }

    // ---- your place at the table
    let mine = '';
    {
      const tot = sel.reduce((t, i) => t + v.hand[i], 0), myBid = L && !frost ? L.bids[me] || 0 : 0;
      let prompt = '', acts = '';
      if (myTurn) {
        const need = L.high + 1 - myBid;
        prompt = L.high === 0 ? 'Nobody has brought an offering yet. Open with any acorn cards, or pass.' : 'The top offering is <b>' + L.high + '</b>' + (L.highSeat >= 0 ? ' (' + name(L.highSeat) + ')' : '') + '. ' + (myBid ? 'You have ' + myBid + ' in, so add at least ' + need + '.' : 'Add at least ' + need + ' to beat it.');
        const nb = (L.spent[me] || []).length;
        acts = '<button class="dt-btn go" data-do="raise"' + (sel.length && myBid + tot > L.high ? '' : ' disabled') + '>Offer ' + (myBid + tot) + '</button>' +
          '<button class="dt-btn" data-do="pass">' + (nb ? 'Drop out and take ' + nb + ' bauble' + (nb > 1 ? 's' : '') : 'Pass') + '</button>';
      } else if (myFrost) {
        prompt = 'Put acorn cards in your secret offering, then lock it in. You can bring nothing.';
        acts = '<button class="dt-btn go" data-do="offer">' + (sel.length ? 'Offer ' + tot + ' in secret' : 'Bring nothing') + '</button>';
      } else if (v.phase === 'frost' && L && L.offered[me]) {
        prompt = 'You brought ' + (v.myOffer ? v.myOffer.reduce((t, x) => t + x, 0) : 0) + '. Waiting for the others…';
      } else if (v.phase === 'lotEnd') {
        acts = '<button class="dt-btn" data-do="next">Next treasure</button>';
      }
      const staging = myTurn || myFrost, mySpent = L ? (v.phase === 'frost' ? v.myOffer || [] : L.spent[me] || []) : [], iOut = L && !frost && L.out.includes(me);
      const onTable = mySpent.length ? '<div class="onTable">' + mySpent.map((c, j) => acardHTML(c, { mini: true, k: 'sp' + me + '-' + j + '-' + v.lotNo })).join('') + '<span class="amt">' + mySpent.reduce((a, c) => a + c, 0) + '</span>' + (iOut ? '<span class="none">· you dropped out</span>' : '') + '</div>' : '<span class="none">' + (iOut ? 'You passed.' : 'Nothing yet.') + '</span>';
      mine = '<div class="mat' + (turn === me ? ' turn' : '') + '"><div class="sh">' + tok(P[me].critter) + '<span class="nm">' + name(me) + '</span><span class="pts"><b>' + P[me].money + '</b> acorns in hand · ' + P[me].score.total + ' pts</span></div>' +
        (prompt ? '<p class="prompt">' + prompt + '</p>' : '') +
        (v.phase === 'over' ? '<div class="mat-cols"><div><p class="zl">Your acorn cards</p><div class="hand">' + v.hand.map((c, i) => acardHTML(c, { k: 'h' + i + '-' + c })).join('') + (v.hand.length ? '' : '<span class="none">No acorn cards left.</span>') + '</div></div><div><p class="zl">What you collected</p><div class="tabl">' + (tableau(P[me]) || '<span class="none">Nothing.</span>') + '</div></div></div>' :
        '<div class="mat-cols"><div>' +
        (staging ? '<p class="zl">' + (myFrost ? 'Your secret offering' : 'Add to your offering') + '</p><div class="tray" data-zone="tray">' + (sel.length ? sel.map((i) => acardHTML(v.hand[i], { button: true, i, k: 'h' + i + '-' + v.hand[i] })).join('') + '<span class="sum">+' + tot + '</span>' : '<span class="drophere">Tap acorn cards to put them in your offering</span>') + '</div>' : '') +
        '<p class="zl">Your acorn cards</p><div class="hand" data-zone="hand">' + v.hand.map((c, i) => sel.includes(i) ? '' : acardHTML(c, { button: staging, i, k: 'h' + i + '-' + c })).join('') + (v.hand.length ? '' : '<span class="none">No acorn cards left.</span>') + '</div>' +
        (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>' +
        '<div><p class="zl">Your offering on the table</p>' + onTable + '<p class="zl">What you’ve collected</p><div class="tabl">' + (tableau(P[me]) || '<span class="none">Nothing yet.</span>') + '</div></div></div>') + '</div>';
    }

    DevTable.flip(el, () => {
      el.innerHTML = DEFS + '<div class="ne">' + banner + '<div class="table"><div class="felt">' + seats + mid + market + mine + '</div></div>' +
        '<div class="panel"><h3>Table talk</h3><div class="log">' + v.log.slice().reverse().map((l) => '<p>' + esc(youLine(l)) + '</p>').join('') + '</div>' +
        '<p class="dt-muted" style="font-size:12.5px;margin:10px 0 0">Lowest on acorns at the first snow is out. Most points among the rest wins.</p></div></div>';
    });

    // pick cards up and put them down: acorns move between your hand and your offer, baubles come to you
    const toggle = (i) => { sel = sel.includes(i) ? sel.filter((x) => x !== i) : sel.concat(i); render(el, v, api); };
    Tabletop.drag(el, {
      pieces: 'button.acard, button.bauble', zones: '[data-zone]', key: (n) => n.dataset.k,
      canLift: (n) => (n.classList.contains('acard') ? myTurn || myFrost : myPick),
      tap: (p) => {
        if (p.el.classList.contains('bauble')) {
          const i = +p.data.i;
          if (bsel.includes(i)) bsel = bsel.filter((x) => x !== i);
          else if (bsel.length >= want) { api.nope('You take ' + want + '. Tap one you chose to put it back first.', p.el); return true; }
          else bsel = bsel.concat(i);
          render(el, v, api); return true;
        }
        toggle(+p.data.i); return true;
      },
      drop: (p, z) => {
        if (p.el.classList.contains('bauble')) return { ok: false, quiet: true };
        const i = +p.data.i, zone = z.dataset.zone;
        if (zone === 'tray' && !sel.includes(i)) { toggle(i); return true; }
        if (zone === 'hand' && sel.includes(i)) { toggle(i); return true; }
        return { ok: false, quiet: true };
      },
    });
    el.querySelectorAll('[data-do]').forEach((b) => b.addEventListener('click', () => {
      const d = b.dataset.do;
      if (d === 'raise') api.act({ type: 'raise', cards: sel }, b);
      if (d === 'pass') api.act({ type: 'pass' }, b);
      if (d === 'offer') api.act({ type: 'offer', cards: sel }, b);
      if (d === 'next') api.act({ type: 'next' }, b);
      if (d === 'take') api.act({ type: 'takeMany', idx: bsel }, b);
    }));
  }

  const mast = '<h1>Mr. Magpie</h1><div class="mast-crit">' + E.CRITTERS.map((k) => svg('<circle cx="0" cy="-2" r="15.5" fill="' + A.mix(A.SEAT[k], '#ffffff', .72) + '"/><g transform="translate(0 ' + (k === 'rabbit' ? 2.5 : 0) + ') scale(' + (k === 'rabbit' ? .78 : .95) + ')">' + A.head(k) + '</g>', '-16 -18 32 32')).join('') + '</div>';
  document.body.insertAdjacentHTML('afterbegin', DEFS);
  DevTable.mount(document.getElementById('app'), {
    id: 'mr-magpie', title: 'Mr. Magpie', blurb: '3–5 players · 20–30 minutes', mast,
    minPlayers: 3, maxPlayers: 5, defaultPlayers: 4, botNames: E.BOT_NAMES,
    botNote: 'Each bot has its own appetite: some chase treasures, some hoard acorns, some can’t resist a shiny bauble.',
    create: (players, opts) => new E.Game(players, opts),
    render,
    rules:
      '<p><b>Bring your offerings before the first snow.</b> Mr. Magpie has a nest full of shiny things and a larder to fill before winter, and the woodland critters can’t resist a sparkle. Every autumn they trade him their winter acorns for his treasures. Every critter starts with the same 10 acorn cards, from 1 up to 16. Keep them hidden in your hand. You can’t make change, so pick your cards carefully.</p>' +
      '<p><b>Offer or pass.</b> Mr. Magpie shows off one treasure at a time. Whoever won the last treasure starts (if nobody did, the start moves left). In turn, beat the top offering by adding acorn cards, or pass. Passing is for good. The last critter in wins the treasure, even if nobody else brought anything. If everyone passes, the treasure stays out and goes with the next one, so whoever wins next takes both. Treasures still waiting at the first snow stay with Mr. Magpie.</p>' +
      '<p><b>He keeps every acorn.</b> Win or lose, your offering goes face down into his larder. But Mr. Magpie never sends a guest home empty-handed: when you drop out after offering, take one bauble from the row for each acorn card you brought. Whoever drops out first picks first, and if the row runs out, it’s refilled face up.</p>' +
      '<p><b>Frosts.</b> Four treasures are frosts: everyone brings a secret offering at once. The biggest wins; everyone else who brought one takes baubles, biggest offering first. The fourth frost brings the first snow and ends the game at once.</p>' +
      '<p><b>Baubles.</b> Earrings: one alone is −2, each pair +7. Berries: a few are lovely, too many spoil. Buttons: the bigger the collection, the better. Feathers: 2 each, most +8, second +4. Nearly a third of the bag is lost acorns, from 1 up to 20: take one instead of a bauble and it goes into your hand.</p>' +
      '<p><b>Winter.</b> The critter with the fewest acorns left doesn’t make it through. Most points among the rest wins.</p>',
  });
})();
</script>
</body>
</html>
