<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doodle Relay · Play online</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/dev-table.css?v=79371b01">
<style>
  body{--t-bg:#EEF3F1;--t-card:#FFFFFF;--t-ink:#1E2433;--t-muted:#566072;--t-line:#D3DDDA;--t-accent:#E2553A;--t-accent-ink:#fff;--t-mast:#1E2433;--t-mast-ink:#F4F1E8;--ink:#1E2433}
  .dt-mast h1{font-family:"Bagel Fat One",Jost,sans-serif;font-weight:400;letter-spacing:.01em;color:#FFE2A8}
  .mast-doodle{display:block;width:min(260px,70%);height:auto;margin-top:12px}
  .c0{--c:#2F6EB5}.c1{--c:#E2553A}.c2{--c:#2E9A62}.c3{--c:#8A55C2}.c4{--c:#D9971A}.c5{--c:#1C9AA5}.c6{--c:#D2477E}.c7{--c:#6B5A4E}

  .dr{display:flex;flex-direction:column;gap:14px;max-width:980px;margin:0 auto}
  .dr-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
  .dr-head h2{margin:0;font-size:19px;line-height:1.25}
  .dr-score{font-size:14px;color:var(--t-muted)}
  .dr-score b{color:var(--t-ink);font-size:16px}
  .pip{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
  .who{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .panel{background:var(--t-card);border:1px solid var(--t-line);border-radius:14px;padding:clamp(12px,2.5vw,18px)}
  .muted{color:var(--t-muted);font-size:14.5px;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--t-line);background:var(--t-card);font-size:13.5px}
  .chip.on{border-color:var(--c,var(--t-accent));background:color-mix(in srgb,var(--c,var(--t-accent)) 12%,#fff)}
  .chip .tick{font-weight:700;color:#2E9A62}

  /* the card and the row number */
  .deal{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
  .wcard{width:min(330px,100%);background:#FFFDF6;border-radius:16px;border:2px solid var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.18),0 18px 26px -18px rgba(0,0,0,.5);overflow:hidden}
  .wcard header{background:var(--ink);color:#FFE2A8;font:400 18px/1 "Bagel Fat One",Jost,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:11px 14px;display:flex;justify-content:space-between;align-items:center}
  .wcard header small{font:600 11px/1 Jost,sans-serif;letter-spacing:.16em;color:#F4F1E8;opacity:.8}
  .wcard ol{list-style:none;margin:0;padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
  .wcard li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;font-size:16.5px;line-height:1.2}
  .wcard li .n{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--ink);display:grid;place-items:center;font:700 13px/1 Jost;flex:none}
  .wcard li.hit{background:#FFE2A8;font-weight:700}
  .wcard li.hit .n{background:var(--ink);color:#FFE2A8}
  .rowtag{width:96px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;color:var(--t-muted);line-height:1.25}
  .rowtag b{width:76px;height:76px;border-radius:50%;background:#FFE2A8;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;font:400 40px/1 "Bagel Fat One",Jost,sans-serif;color:var(--ink);animation:pop .45s cubic-bezier(.3,.7,.3,1)}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:none}}
  .nums{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;max-width:520px}
  @media (max-width:480px){.nums{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .nums button{aspect-ratio:1;border-radius:16px;border:2px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);font:400 34px/1 "Bagel Fat One",Jost,sans-serif;color:var(--ink);cursor:pointer;transition:transform .1s}
  .nums button:hover{transform:translateY(-2px);background:#FFE2A8}
  .nums button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
  .cardback{width:min(240px,70%);aspect-ratio:5/7;border-radius:16px;border:2px solid var(--ink);background:repeating-linear-gradient(45deg,#2C3245 0 12px,#343B52 12px 24px);display:grid;place-items:center;color:#FFE2A8;font:400 22px/1 "Bagel Fat One",Jost,sans-serif;box-shadow:0 18px 26px -18px rgba(0,0,0,.5)}
  .secret{font-size:17px;margin:0}
  .secret b{font:400 26px/1.1 "Bagel Fat One",Jost,sans-serif;letter-spacing:.02em;color:var(--t-accent);display:block;margin-top:4px}
  .write{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .write label{display:flex;flex-direction:column;gap:5px;font-size:14.5px;color:var(--t-muted);flex:1 1 220px}
  .write input{border:1.5px solid var(--t-line);border-radius:10px;padding:11px 12px;font-size:17px;background:#fff;color:var(--t-ink)}
  .write input:focus{outline:2px solid var(--t-accent);outline-offset:1px}

  /* the board */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,300px);gap:16px;align-items:start}
  @media (max-width:820px){.stage{grid-template-columns:1fr}}
  .bwrap{position:relative;width:min(100%,600px,max(250px,calc(100vh - 230px)));aspect-ratio:1;margin:0 auto;border-radius:18px;background:#fff;border:10px solid #2C3245;box-shadow:0 3px 0 rgba(0,0,0,.25),0 22px 34px -20px rgba(0,0,0,.55)}
  .bwrap::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);pointer-events:none}
  .bwrap canvas,.bwrap svg{position:absolute;inset:0;width:100%;height:100%;border-radius:8px;display:block}
  .bwrap canvas{touch-action:none;cursor:crosshair}
  .bwrap.off canvas{cursor:default}
  .over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;border-radius:8px;background:rgba(255,255,255,.72);backdrop-filter:blur(1px);font-size:17px;pointer-events:none;transition:opacity .2s}
  .over[hidden]{display:none}
  .over b{display:block;font:400 clamp(30px,7vw,52px)/1 "Bagel Fat One",Jost,sans-serif;color:var(--t-accent);margin-bottom:8px}
  .over.peek{background:rgba(255,255,255,.25);align-items:start}
  .over.peek .tag{background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
  .timer{position:relative;height:16px;border-radius:999px;background:#DCE5E2;overflow:hidden;width:min(100%,600px,max(250px,calc(100vh - 230px)));margin:0 auto}
  .timer i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--t-accent);border-radius:999px}
  .timer.look i{background:#9AA7B5}
  .timer span{position:absolute;inset:0;display:grid;place-items:center;font:700 11.5px/1 Jost;letter-spacing:.08em;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
  .side{display:flex;flex-direction:column;gap:12px}
  .side h3{margin:0;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t-muted)}
  .prompt{font-size:16px;margin:0;line-height:1.4}
  .prompt .big{display:block;font:400 30px/1.1 "Bagel Fat One",Jost,sans-serif;color:var(--t-accent);margin:4px 0 2px;letter-spacing:.02em}
  .passes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .passes .p{width:30px;height:30px;border-radius:50%;border:2px solid var(--t-line);display:grid;place-items:center;font:700 13px/1 Jost;color:var(--t-muted)}
  .passes .p.done{background:var(--t-line)}
  .passes .p.now{border-color:var(--t-accent);color:var(--t-accent)}

  /* guessing */
  .ans{display:flex;flex-direction:column;gap:10px}
  .ans .cur{font-size:14px;color:var(--t-muted)}
  .ans .cur b{display:block;font:400 28px/1.15 "Bagel Fat One",Jost,sans-serif;color:var(--t-ink);letter-spacing:.01em;word-break:break-word}
  .ans .none{font-size:15.5px;color:var(--t-muted)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .quiet{border-radius:12px;padding:14px;background:#FFF4DC;border:1px solid #EFD9A6;font-size:15.5px}
  .quiet b{font-weight:700}
  .legend{display:flex;flex-direction:column;gap:6px}
  .legend .l{display:flex;align-items:center;gap:8px;font-size:14.5px}
  .legend .sw{width:22px;height:6px;border-radius:3px;background:var(--c);flex:none}
  .reveal-word{font-size:14.5px;color:var(--t-muted);margin:0}
  .reveal-word b{display:block;font:400 34px/1.05 "Bagel Fat One",Jost,sans-serif;color:var(--t-ink);letter-spacing:.01em;word-break:break-word;margin-top:3px}
  .verdict{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;border-radius:12px;padding:10px 12px}
  .verdict.ok{background:#E3F4EA;color:#1F6B42}.verdict.no{background:#FBE7E2;color:#9A2F1C}
  .verdict .mark{font:400 26px/1 "Bagel Fat One",Jost}

  /* the end */
  .final{text-align:center;padding:clamp(18px,4vw,30px) 14px}
  .final .num{font:400 clamp(54px,12vw,84px)/1 "Bagel Fat One",Jost,sans-serif;color:var(--t-accent)}
  .final .num small{font-size:.45em;color:var(--t-muted)}
  .final p{margin:8px 0 0;font-size:18px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .gal{background:var(--t-card);border:1px solid var(--t-line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
  .gal .th{aspect-ratio:1;border-radius:8px;background:#fff;border:1px solid var(--t-line);position:relative;overflow:hidden}
  .gal .th svg{position:absolute;inset:0;width:100%;height:100%}
  .gal .w{font-weight:700;font-size:15px;line-height:1.2}
  .gal .a{color:var(--t-muted);line-height:1.3}
  .gal .a.ok::before{content:"✓ ";color:#1F6B42;font-weight:700}.gal .a.no::before{content:"✗ ";color:#9A2F1C;font-weight:700}
  .log{font-size:13.5px;color:var(--t-muted);margin:0}
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/js/tabletop.js?v=bbd86e78"></script>
<script src="/assets/js/dev-table.js?v=7761d226"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  const D = window.DoodleRelay, esc = DevTable.esc, T = window.Tabletop;
  const snd = (n) => { try { T && T.sound(n); } catch (e) {} };
  const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const INK = '#1E2433', SEAT = ['#2F6EB5', '#E2553A', '#2E9A62', '#8A55C2', '#D9971A', '#1C9AA5', '#D2477E', '#6B5A4E'];
  const W = 9;   // line width on the 1000-unit board
  const gallery = {};   // boards seen at their reveal, for the end screen: round:idx → legs

  const name = (v, s) => (v.players[s] ? v.players[s].name : 'Seat ' + (s + 1)).replace(/\s*\(bot\)$/, '');
  const who = (v, s, you) => '<span class="who c' + s + '"><span class="pip"></span>' + esc(name(v, s)) + (you && s === v.seat ? ' (you)' : '') + '</span>';
  const poss = (v, s) => (s === v.seat ? 'your' : esc(name(v, s)) + '’s');
  const secs = (ms) => Math.max(0, Math.ceil(ms / 1000));
  const nth = (k) => ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth'][k] || (k + 1) + 'th';

  /* ---------------------------------------------------------------- strokes */
  function pathD(p) {
    if (p.length === 2) return 'M' + p[0] + ' ' + p[1] + 'h.1';
    let d = 'M' + p[0] + ' ' + p[1];
    for (let i = 2; i < p.length; i += 2) d += 'L' + p[i] + ' ' + p[i + 1];
    return d;
  }
  function svgBoard(strokes, color, cls) {
    return '<svg viewBox="0 0 1000 1000" class="' + (cls || '') + '" aria-hidden="true"><g fill="none" stroke="' + (color || INK) + '" stroke-width="' + W + '" stroke-linecap="round" stroke-linejoin="round">' +
      strokes.map((p) => '<path d="' + pathD(p) + '"/>').join('') + '</g></svg>';
  }
  function svgLegs(legs, colored) {
    return '<svg viewBox="0 0 1000 1000" aria-hidden="true">' + legs.map((l, k) => '<g data-leg="' + k + '" fill="none" stroke="' + (colored ? SEAT[l.seat % 8] : INK) + '" stroke-width="' + W + '" stroke-linecap="round" stroke-linejoin="round">' + l.strokes.map((p) => '<path d="' + pathD(p) + '"/>').join('') + '</g>').join('') + '</svg>';
  }
  // Ramer–Douglas–Peucker, so a stroke is a handful of points instead of hundreds
  function simplify(pts, eps) {
    if (pts.length <= 4) return pts;
    const n = pts.length / 2, keep = new Uint8Array(n); keep[0] = keep[n - 1] = 1;
    const stack = [[0, n - 1]];
    while (stack.length) {
      const [a, b] = stack.pop(); let best = -1, bi = -1;
      const ax = pts[2 * a], ay = pts[2 * a + 1], bx = pts[2 * b], by = pts[2 * b + 1], dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
      for (let i = a + 1; i < b; i++) { const d = Math.abs(dy * pts[2 * i] - dx * pts[2 * i + 1] + bx * ay - by * ax) / L; if (d > best) { best = d; bi = i; } }
      if (best > eps) { keep[bi] = 1; stack.push([a, bi], [bi, b]); }
    }
    const out = []; for (let i = 0; i < n; i++) if (keep[i]) out.push(pts[2 * i], pts[2 * i + 1]);
    return out;
  }

  /* ---------------------------------------------------------------- the drawing board */
  class Pad {
    constructor(wrap, base, onStroke) {
      this.wrap = wrap; this.base = base; this.mine = []; this.cur = null; this.on = false; this.onStroke = onStroke;
      this.cv = wrap.querySelector('canvas'); this.ctx = this.cv.getContext('2d');
      this.ro = new ResizeObserver(() => this.size()); this.ro.observe(this.cv); this.size();
      const pt = (e) => { const r = this.cv.getBoundingClientRect(); return [Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 1000), Math.round(Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) * 1000)]; };
      this.cv.addEventListener('pointerdown', (e) => {
        if (!this.on || this.cur || (e.pointerType === 'mouse' && e.button !== 0)) return;
        e.preventDefault(); try { this.cv.setPointerCapture(e.pointerId); } catch (x) {}
        this.pid = e.pointerId; const [x, y] = pt(e); this.cur = [x, y]; this.dot(x, y);
      });
      this.cv.addEventListener('pointermove', (e) => {
        if (!this.cur || e.pointerId !== this.pid) return;
        const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of (evs.length ? evs : [e])) {
          const [x, y] = pt(ev), n = this.cur.length, px = this.cur[n - 2], py = this.cur[n - 1];
          if (Math.hypot(x - px, y - py) < 3) continue;
          this.seg(px, py, x, y); this.cur.push(x, y);
        }
      });
      const up = (e) => { if (this.cur && e.pointerId === this.pid) this.finish(); };
      this.cv.addEventListener('pointerup', up); this.cv.addEventListener('pointercancel', up); this.cv.addEventListener('lostpointercapture', up);
    }
    size() {
      const r = this.cv.getBoundingClientRect(), dpr = Math.min(3, window.devicePixelRatio || 1);
      if (!r.width) return;
      this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.height * dpr);
      this.k = this.cv.width / 1000; this.redraw();
    }
    style() { const c = this.ctx; c.strokeStyle = INK; c.fillStyle = INK; c.lineWidth = W * this.k; c.lineCap = 'round'; c.lineJoin = 'round'; }
    redraw() {
      const c = this.ctx; c.clearRect(0, 0, this.cv.width, this.cv.height); this.style();
      for (const p of this.base.concat(this.mine, this.cur ? [this.cur] : [])) this.stroke(p);
    }
    stroke(p) {
      const c = this.ctx, k = this.k;
      if (p.length === 2) { this.dot(p[0], p[1]); return; }
      c.beginPath(); c.moveTo(p[0] * k, p[1] * k); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i] * k, p[i + 1] * k); c.stroke();
    }
    dot(x, y) { this.style(); const c = this.ctx; c.beginPath(); c.arc(x * this.k, y * this.k, W * this.k / 2, 0, Math.PI * 2); c.fill(); }
    seg(a, b, x, y) { this.style(); const c = this.ctx, k = this.k; c.beginPath(); c.moveTo(a * k, b * k); c.lineTo(x * k, y * k); c.stroke(); }
    finish() {
      const p = simplify(this.cur, 2.5); this.cur = null;
      if (p.length > 2000) p.length = 2000;
      this.mine.push(p); this.onStroke(p);
    }
    enable(on) { if (!on && this.cur) this.finish(); this.on = on; this.wrap.classList.toggle('off', !on); }
    destroy() { this.enable(false); this.ro.disconnect(); }
  }

  /* ---------------------------------------------------------------- screens
     Each screen mounts once and then only updates, so a new view (someone else got ready, table talk…)
     never wipes the board you're drawing on or the word you're typing. */
  let S = null;   // the mounted screen: {key, root, update(v), destroy()}
  let raf = 0;
  const loop = (fn) => { cancelAnimationFrame(raf); const tick = () => { if (fn() !== false) raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); };

  function render(el, v, api) {
    const key = keyOf(v);
    if (!S || S.key !== key || !el.contains(S.root)) {
      if (S && S.destroy) S.destroy();
      cancelAnimationFrame(raf);
      const make = { pick: pickScreen, card: cardScreen, draw: drawScreen, guess: guessScreen, reveal: revealScreen, end: endScreen }[v.phase];
      el.innerHTML = '<div class="dr" data-key="' + esc(key) + '"></div>';
      S = make(el.firstChild, v, api); S.key = key; S.root = el.firstChild;
    }
    S.update(v);
    api.status(statusOf(v));
  }
  function keyOf(v) {
    if (v.phase === 'pick') return 'pick:' + v.round + ':' + v.history.length;
    if (v.phase === 'card') return 'card:' + v.round + ':' + v.history.length;
    if (v.phase === 'draw') return 'draw:' + v.round + ':' + v.draw.leg;
    if (v.phase === 'guess' || v.phase === 'reveal') return v.phase + ':' + v.round + ':' + v.board.idx;
    return 'end:' + v.history.length;
  }
  function statusOf(v) {
    const r = 'Round ' + v.round + ' of ' + v.rounds;
    if (v.phase === 'pick') return r + ' · ' + (v.chooser === v.seat ? 'Pick a number' : name(v, v.chooser) + ' is picking a number');
    if (v.phase === 'card') return r + ' · ' + (v.ready[v.seat] ? 'Waiting for everyone…' : v.mode === 'words' ? 'Your secret word' : 'Pick your secret word');
    if (v.phase === 'draw') return r + ' · Pass ' + (v.draw.leg + 1) + ' of ' + v.L;
    if (v.phase === 'guess') return r + ' · Guess board ' + (v.board.idx + 1) + ' of ' + v.board.of;
    if (v.phase === 'reveal') return r + ' · Board ' + (v.board.idx + 1) + ' of ' + v.board.of;
    return 'Game over · ' + v.score + ' of ' + v.maxScore;
  }
  const head = (v, title) => '<div class="dr-head"><h2>' + title + '</h2><span class="dr-score">Team score <b>' + v.score + '</b>' + (v.played ? ' of ' + v.played + ' boards' : '') + '</span></div>';
  const rowHTML = (v) => '<div class="rowtag"><b aria-label="Row ' + v.roll + '">' + v.roll + '</b>' + (v.chooser === v.seat ? 'Your pick' : esc(name(v, v.chooser)) + '’s pick') + '</div>';

  /* ---- picking the round's number (before anyone sees their card) */
  function pickScreen(root, v, api) {
    const me = v.chooser === v.seat;
    root.innerHTML = head(v, 'Round ' + v.round + ': ' + (me ? 'pick a number' : esc(name(v, v.chooser)) + ' picks a number')) +
      '<div class="deal"><div class="cardback">' + (v.mode === 'words' ? 'Words' : 'Categories') + '</div></div>' +
      '<div class="panel"><div class="side">' +
        (me ? '<p class="prompt">Pick a number from 1 to 6. Everyone draws that row of their own card, and nobody has seen their card yet.</p><div class="nums">' + [1, 2, 3, 4, 5, 6].map((n) => '<button type="button" data-n="' + n + '">' + n + '</button>').join('') + '</div>'
            : '<p class="prompt">' + who(v, v.chooser) + ' is picking a number from 1 to 6. Everyone will draw that row of their own card.</p>') +
        '<p class="muted" data-left></p>' +
      '</div></div>';
    root.querySelectorAll('[data-n]').forEach((b) => b.addEventListener('click', () => api.act({ t: 'pick', n: +b.dataset.n }, b)));
    let ends = 0;
    return {
      update(nv) {
        ends = ends ? Math.min(ends, performance.now() + nv.msLeft) : performance.now() + nv.msLeft;
        const left = root.querySelector('[data-left]');
        loop(() => { const ms = ends - performance.now(); left.textContent = (me ? 'If you don’t pick in ' : 'If they don’t pick in ') + secs(ms) + ' s, a number is picked at random.'; return ms > 0; });
      },
    };
  }

  /* ---- the card: your secret word */
  function cardScreen(root, v, api) {
    const words = v.mode === 'words', hit = v.roll - 1;
    const rows = v.card.map((it, i) => '<li' + (i === hit ? ' class="hit"' : '') + '><span class="n">' + (i + 1) + '</span>' + esc(words ? it.word : it) + '</li>').join('');
    root.innerHTML = head(v, 'Round ' + v.round + ': ' + (words ? 'your secret word' : 'pick your secret word')) +
      '<div class="deal">' + rowHTML(v) +
        '<div class="wcard"><header>' + (words ? 'Words' : 'Categories') + '<small>Doodle Relay</small></header><ol>' + rows + '</ol></div>' +
      '</div>' +
      '<div class="panel"><div class="side">' +
        (words
          ? '<p class="secret">Row ' + v.roll + ', so you’ll draw<b>' + esc(v.card[hit].word) + '</b></p><p class="muted">Keep it to yourself. Everyone has a different card.</p><div class="row"><button class="dt-btn go" data-ready>Got it</button></div>'
          : '<div class="write"><label>Row ' + v.roll + '. Think of something in <b style="color:var(--t-ink)">' + esc(v.card[hit]) + '</b> you could draw in a few seconds, and keep it to yourself.<input data-word maxlength="' + D.RULES.maxWord + '" placeholder="Your secret word" autocomplete="off" autocapitalize="none" spellcheck="false"></label><button class="dt-btn go" data-ready>Lock it in</button></div><p class="muted" data-mine hidden></p>') +
        '<div class="chips" data-ready-list></div><p class="muted" data-left></p>' +
      '</div></div>';
    snd('flip');
    const btn = root.querySelector('[data-ready]'), input = root.querySelector('[data-word]');
    const go = () => {
      if (S.v.ready[S.v.seat]) { api.act({ t: 'unready' }, btn); return; }
      api.act(words ? { t: 'ready' } : { t: 'ready', word: input.value }, btn);
    };
    btn.addEventListener('click', go);
    if (input) { input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); }); setTimeout(() => input.focus({ preventScroll: true }), 50); }
    let ends = 0;
    return {
      update(nv) {
        S.v = nv;
        const me = nv.ready[nv.seat];
        ends = ends ? Math.min(ends, performance.now() + nv.msLeft) : performance.now() + nv.msLeft;
        root.querySelector('[data-ready-list]').innerHTML = nv.players.map((p, s) => '<span class="chip c' + s + (nv.ready[s] ? ' on' : '') + '"><span class="pip"></span>' + esc(name(nv, s)) + (s === nv.seat ? ' (you)' : '') + (nv.ready[s] ? ' <span class="tick">✓</span>' : '') + '</span>').join('');
        btn.textContent = me ? 'Change my mind' : words ? 'Got it' : 'Lock it in';
        btn.classList.toggle('go', !me); btn.classList.toggle('ghost', me);
        if (input) { input.disabled = me; const m = root.querySelector('[data-mine]'); m.hidden = !me; if (me) m.innerHTML = 'You’ll draw <b style="color:var(--t-ink)">' + esc(nv.secret) + '</b>.'; }
        const left = root.querySelector('[data-left]');
        loop(() => { const ms = ends - performance.now(); left.textContent = 'Drawing starts when everyone’s ready, or in ' + secs(ms) + ' s' + (words ? '.' : ' (anyone without a word gets one picked for them).'); return ms > 0; });
      },
    };
  }

  /* ---- drawing a pass */
  function drawScreen(root, v, api) {
    const d = v.draw, leg = d.leg, last = leg === v.L - 1;
    const prompt = d.mine
      ? '<p class="prompt">Start your board. Draw<span class="big">' + esc(d.word) + '</span></p><p class="muted">Nobody else knows it. When time’s up your board goes to ' + who(v, d.next) + '.</p>'
      : '<p class="prompt">You’re holding ' + who(v, d.starter) + '’s board. You don’t know the word, so <b>keep drawing whatever you think it is.</b></p><p class="muted">' + (last ? 'You’re the last drawer on this board. Then everyone guesses.' : 'When time’s up it goes to ' + who(v, d.next) + '.') + '</p>';
    root.innerHTML = head(v, 'Pass ' + (leg + 1) + ' of ' + v.L) +
      '<div class="stage"><div><div class="bwrap off"><canvas aria-label="Drawing board"></canvas><div class="over" data-over></div></div><div style="height:10px"></div><div class="timer look" data-timer><i></i><span></span></div></div>' +
      '<aside class="side panel">' + prompt +
        '<div><h3>Passes</h3><div class="passes" style="margin-top:6px">' + Array.from({ length: v.L }, (_, k) => '<span class="p' + (k < leg ? ' done' : k === leg ? ' now' : '') + '">' + (k + 1) + '</span>').join('') + '</div></div>' +
        '<p class="muted">One marker, no eraser. ' + (v.drawMs / 1000) + ' seconds a pass.</p>' +
      '</aside></div>';
    const wrap = root.querySelector('.bwrap'), over = root.querySelector('[data-over]'), timer = root.querySelector('[data-timer]'), bar = timer.querySelector('i'), lbl = timer.querySelector('span');
    const pad = new Pad(wrap, d.strokes, (p) => api.act({ t: 'stroke', leg, p }));
    let start = 0, end = 0, state = 'look', ticked = -1;
    if (leg > 0) snd('slide');
    const sync = (nv) => {
      const now = performance.now(), s = now + nv.draw.msToDraw, e = now + nv.draw.msLeft;
      start = start ? Math.min(start, s) : s; end = end ? Math.min(end, e) : e;   // never give a pass more time than the host's clock
    };
    sync(v);
    loop(() => {
      const now = performance.now();
      if (state === 'look') {
        const ms = start - now;
        if (ms > 0) {
          over.hidden = false; over.className = 'over' + (leg ? ' peek' : '');
          over.innerHTML = leg ? '<span class="tag">Have a look… ' + secs(ms) + '</span>' : '<div><b>' + secs(ms) + '</b>Get ready to draw ' + esc(d.word) + '</div>';
          bar.style.width = '100%'; lbl.textContent = 'GET READY';
          return true;
        }
        state = 'draw'; over.hidden = true; pad.enable(true); timer.classList.remove('look'); snd('deal');
      }
      if (state === 'draw') {
        const ms = end - now, f = Math.max(0, ms / v.drawMs);
        bar.style.width = (f * 100) + '%'; lbl.textContent = secs(ms) + ' S';
        const s = secs(ms); if (s <= 3 && s !== ticked && s > 0) { ticked = s; snd('chip'); }
        if (ms > 0) return true;
        state = 'done'; pad.enable(false); bar.style.width = '0%'; lbl.textContent = 'TIME';
        over.hidden = false; over.className = 'over';
        over.innerHTML = '<div><b>Markers down!</b>' + (last ? 'Time to guess.' : 'Passing to ' + esc(name(v, d.next)) + '…') + '</div>';
        snd('place');
      }
      return false;
    });
    return { update(nv) { sync(nv); }, destroy() { pad.destroy(); } };
  }

  /* ---- guessing a board together */
  function guessScreen(root, v, api) {
    const b = v.board;
    root.innerHTML = head(v, 'Board ' + (b.idx + 1) + ' of ' + b.of + ': ' + poss(v, b.starter) + ' board') +
      '<div class="stage"><div><div class="bwrap off">' + svgBoard(b.strokes) + '</div></div>' +
      '<aside class="side panel" data-side></aside></div>';
    const side = root.querySelector('[data-side]');
    if (b.mine) {
      side.innerHTML = '<div class="quiet">This is <b>your</b> board. Your word was <b>' + esc(b.word) + '</b>.<br>Stay quiet and let everyone else work it out.</div><div class="ans"><div data-cur></div><div class="chips" data-agree></div></div>';
    } else {
      side.innerHTML = '<p class="prompt">What was ' + who(v, b.starter) + ' drawing? Talk it over, then agree on <b>one answer</b> for the team.</p>' +
        '<div class="ans"><div data-cur></div><div class="chips" data-agree></div><div class="row"><button class="dt-btn go" data-agree-btn hidden>Agree</button></div></div>' +
        '<div class="write"><label>Suggest an answer<input data-guess maxlength="' + D.RULES.maxAnswer + '" placeholder="Type a guess" autocomplete="off" autocapitalize="none" spellcheck="false"></label><button class="dt-btn" data-suggest>Suggest</button></div>' +
        '<p class="muted">' + esc(name(v, b.starter)) + ' stays quiet. Use table talk or your call.</p>';
      const input = side.querySelector('[data-guess]'), sug = side.querySelector('[data-suggest]');
      const send = () => { const t = input.value.trim(); if (!t) { api.nope('Type a guess first.', sug); return; } const r = api.act({ t: 'answer', text: t }, sug); if (r && r.ok) input.value = ''; };
      sug.addEventListener('click', send);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
      side.querySelector('[data-agree-btn]').addEventListener('click', (e) => api.act({ t: 'agree', text: S.v && S.v.board.answer ? S.v.board.answer.text : '' }, e.currentTarget));
    }
    return {
      update(nv) {
        S.v = nv;
        const nb = nv.board, cur = side.querySelector('[data-cur]');
        cur.innerHTML = nb.answer
          ? '<div class="cur">Team answer, suggested by ' + who(nv, nb.answer.by, true) + '<b>' + esc(nb.answer.text) + '</b></div>'
          : '<div class="none">' + (nb.mine ? 'No answer suggested yet.' : 'No answer yet. Suggest one below.') + '</div>';
        side.querySelector('[data-agree]').innerHTML = nb.answer
          ? nv.players.map((p, s) => s === nb.starter ? '' : '<span class="chip c' + s + (nb.agrees.includes(s) ? ' on' : '') + '"><span class="pip"></span>' + esc(name(nv, s)) + (s === nv.seat ? ' (you)' : '') + (nb.agrees.includes(s) ? ' <span class="tick">✓</span>' : '') + '</span>').join('') + '<span class="chip" style="border-style:dashed">' + nb.agrees.length + ' of ' + nb.need + ' needed</span>'
          : '';
        const ab = side.querySelector('[data-agree-btn]');
        if (ab) { const mine = nb.answer && nb.agrees.includes(nv.seat); ab.hidden = !nb.answer; ab.textContent = mine ? 'Take back my agree' : 'Agree'; ab.classList.toggle('go', !mine); ab.classList.toggle('ghost', !!mine); }
      },
    };
  }

  /* ---- the reveal: the word, the answer, and who drew what */
  function revealScreen(root, v, api) {
    const b = v.board;
    gallery[v.round + ':' + b.idx] = b.legs;
    const lastBoard = b.idx + 1 === b.of, nextLabel = !lastBoard ? 'Next board' : v.round < v.rounds ? 'Next round' : 'See the score';
    root.innerHTML = head(v, 'Board ' + (b.idx + 1) + ' of ' + b.of + ': ' + poss(v, b.starter) + ' board') +
      '<div class="stage"><div><div class="bwrap off" data-art>' + svgLegs(b.legs, true) + '</div></div>' +
      '<aside class="side panel">' +
        '<p class="reveal-word">The word was<b>' + esc(b.word) + '</b></p>' + (b.cat ? '<p class="muted" style="margin-top:-6px">Category: ' + esc(b.cat) + '</p>' : '') +
        '<p class="muted">The team said <b style="color:var(--t-ink)">' + esc(b.answer.text) + '</b></p>' +
        '<div data-verdict></div><div class="row" data-judge></div>' +
        '<div><h3>Who drew what</h3><div class="legend" style="margin-top:8px">' + b.legs.map((l, k) => '<span class="l c' + l.seat + '"><span class="sw"></span>' + esc(name(v, l.seat)) + (l.seat === v.seat ? ' (you)' : '') + ' <span class="muted" style="font-size:13px">' + (k ? nth(k) : 'started it') + '</span></span>').join('') + '</div></div>' +
        '<div class="row"><button class="dt-btn go" data-next>' + nextLabel + '</button><button class="dt-btn ghost sm" data-replay>Replay</button></div>' +
      '</aside></div>';
    const art = root.querySelector('[data-art]');
    const replay = () => {
      if (reduce()) return;
      const paths = [...art.querySelectorAll('path')]; let at = 0;
      const per = Math.max(60, Math.min(260, 3600 / Math.max(1, paths.length)));
      paths.forEach((p) => { const L = p.getTotalLength() + 1; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: per, delay: at, fill: 'forwards', easing: 'ease-out' }); at += per * 0.7; });
    };
    replay();
    root.querySelector('[data-replay]').addEventListener('click', () => { art.innerHTML = svgLegs(b.legs, true); replay(); });
    let nextAt = 0;
    const nb = root.querySelector('[data-next]');
    nb.addEventListener('click', () => api.act({ t: 'next' }, nb));
    let said = false;
    return {
      update(nv) {
        const x = nv.board;
        nextAt = nextAt ? Math.min(nextAt, performance.now() + x.msToNext) : performance.now() + x.msToNext;
        root.querySelector('[data-verdict]').innerHTML = '<div class="verdict ' + (x.verdict ? 'ok' : 'no') + '"><span class="mark">' + (x.verdict ? '✓' : '✗') + '</span>' + (x.verdict ? 'Got it! One point for the team.' : 'Not this time.') + (x.judged ? ' <span style="font-weight:400;font-size:14px">(' + esc(name(nv, x.starter)) + '’s call)</span>' : '') + '</div>';
        if (!said) { said = true; snd(x.verdict ? 'win' : 'flip'); }
        const j = root.querySelector('[data-judge]');
        j.innerHTML = x.mine ? '<span class="muted">Your board, your call:</span><button class="dt-btn ghost sm" data-j="' + (x.verdict ? 0 : 1) + '">' + (x.verdict ? 'Doesn’t count' : 'Close enough, count it') + '</button>' : '';
        const jb = j.querySelector('[data-j]'); if (jb) jb.addEventListener('click', () => api.act({ t: 'judge', ok: jb.dataset.j === '1' }, jb));
        nb.disabled = true;
        loop(() => { if (performance.now() >= nextAt) { nb.disabled = false; return false; } return true; });
      },
    };
  }

  /* ---- the end */
  function endScreen(root, v, api) {
    const f = v.maxScore ? v.score / v.maxScore : 0;
    const line = f === 1 ? 'A perfect relay. Every single board!' : f >= 0.8 ? 'Brilliant. You read each other’s minds.' : f >= 0.6 ? 'Great teamwork.' : f >= 0.4 ? 'Not bad at all.' : f >= 0.2 ? 'Some of those were very abstract.' : 'A gallery of modern art.';
    root.innerHTML = '<div class="panel final"><div class="num">' + v.score + '<small> of ' + v.maxScore + '</small></div><p>' + line + '</p><div class="row" style="justify-content:center;margin-top:16px"><button class="dt-btn go" data-again>Play again</button></div><p class="muted" style="margin-top:10px">Same table, fresh cards.</p></div>' +
      '<div class="dr-head"><h2>The boards</h2></div>' +
      '<div class="gallery">' + v.history.map((h, i) => {
        const r = h.round, idx = v.history.filter((x, k) => k < i && x.round === r).length, legs = gallery[r + ':' + idx];
        return '<div class="gal"><div class="th">' + (legs ? svgLegs(legs, true) : '') + '</div><span class="w">' + esc(h.word) + '</span><span class="a ' + (h.ok ? 'ok' : 'no') + '">' + esc(h.answer) + '</span><span class="muted" style="font-size:12.5px">' + who(v, h.starter, true) + ' · round ' + r + '</span></div>';
      }).join('') + '</div>';
    snd(f >= 0.6 ? 'win' : 'shuffle');
    const again = root.querySelector('[data-again]');
    again.addEventListener('click', () => api.act({ t: 'again' }, again));
    return { update() {} };
  }

  const mast = '<h1>Doodle Relay</h1><svg class="mast-doodle" viewBox="0 0 260 44" aria-hidden="true"><g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 30 C20 8 34 8 44 24 S70 38 80 20" stroke="#7FB0E8"/><path d="M96 22 C108 6 124 6 132 22 S156 36 168 16" stroke="#F08A6E"/><path d="M184 26 C196 10 210 12 218 26 S240 34 252 14" stroke="#7FD1A3"/></g><g fill="#FFE2A8"><path d="M84 18 l8 4 -8 4z"/><path d="M172 15 l8 4 -8 4z"/></g></svg>';

  DevTable.mount(document.getElementById('app'), {
    id: 'doodle-relay', title: 'Doodle Relay', blurb: '3–8 players · 15–25 minutes · online tables', mast,
    minPlayers: D.RULES.minPlayers, maxPlayers: D.RULES.maxPlayers, defaultPlayers: 8,
    bots: false, chat: true,
    options: [
      { key: 'mode', label: 'Cards', values: [['words', 'Words'], ['categories', 'Categories']], def: 'words' },
      { key: 'drawSecs', label: 'Draw time', values: [[5, '5 seconds'], [10, '10 seconds'], [15, '15 seconds']], def: 10 },
      { key: 'drawers', label: 'Drawers per board', values: [[3, '3 players'], ['all', 'Everyone']], def: 3 },
      { key: 'rounds', label: 'Rounds', values: [[1, '1'], [2, '2'], [3, '3']], def: 2 },
    ],
    create: (players, opts) => new D.Game(players, opts),
    render,
    rules:
      '<p><b>Your secret word.</b> Each round a different player picks a number from 1 to 6. Then everyone gets a fresh card of six words and draws that row of their own card. On the Categories side, the number picks a category and you think of your own word in it.</p>' +
      '<p><b>Draw, then pass.</b> Everyone starts drawing their word at once. When time runs out, every board passes left. Now you’re holding someone else’s drawing and you <b>don’t know the word</b>: keep drawing whatever you think it is. Each board gets three drawers (or goes all the way round, if you choose). One marker, no eraser.</p>' +
      '<p><b>Guess together.</b> Then the whole table looks at each board in turn and agrees on one answer. The player who started it stays quiet. Suggest answers, and once more than half the guessers agree, it’s locked in.</p>' +
      '<p><b>The reveal.</b> The word is shown and the drawing replays in each drawer’s colour, so you see who drew what. Every board you get scores the team a point. The starter can count a close answer.</p>' +
      '<p><b>Online only for now.</b> Host a table, share the code, and play with everyone on a call. Doodle Relay needs at least three people.</p>',
  });
})();
</script>
</body>
</html>
